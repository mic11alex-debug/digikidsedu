G.arr=(ar,T)=>{const W=8,H=5,LV=[[4,0],[6,5],[8,9]],key=(x,y)=>x+','+y;let L=0,bump=0,p,S,Rk;

 if(!document.getElementById('mk-css')){const st=document.createElement('style');st.id='mk-css';st.textContent=`
 .mk-char{animation:mkb 2.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes mkb{50%{transform:translateY(-5px)}}
 .mk-tail{transform-box:fill-box;transform-origin:0% 100%;animation:mkt .7s ease-in-out infinite alternate}@keyframes mkt{to{transform:rotate(14deg)}}
 .mk-eye{transform-box:fill-box;transform-origin:center;animation:mkbl 4.2s infinite}@keyframes mkbl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
 .mk-gift.open .lid{animation:mklid .8s ease-in forwards;transform-box:fill-box;transform-origin:center}.mk-gift.open .bx{animation:mkbx .7s .25s ease-in forwards;transform-box:fill-box;transform-origin:50% 100%}.mk-gift:not(.open){animation:mksh .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes mklid{to{transform:translateY(-260px) rotate(35deg);opacity:0}}@keyframes mkbx{to{transform:scale(1.15,0);opacity:0}}@keyframes mksh{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}.mk-pop{transform-box:fill-box;transform-origin:center;animation:mkp .35s cubic-bezier(.3,1.6,.5,1)}@keyframes mkp{from{transform:scale(.5);opacity:0}}
 .mk-jump{animation:mkj .5s ease-out}@keyframes mkj{30%{transform:translateY(-26px) scale(1.03,.97)}60%{transform:translateY(0) scale(.98,1.03)}}
 .mk-wrap{display:flex;gap:12px;height:100%;padding:10px;font-family:Commissioner,system-ui,sans-serif}
 .mk-left{flex:0 0 44%;display:flex;flex-direction:column;gap:8px;min-width:0}
 .mk-stage{flex:1;position:relative;border-radius:22px;border:4px solid #fff;box-shadow:0 0 0 3px #10304f,0 6px 14px #0003;overflow:hidden;background:linear-gradient(#ffe3f1 0%,#dff1ff 58%,#ffe9b0 58%,#ffd776 100%)}
 .mk-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 22%,#fff9 0 40px,#0000 42px),radial-gradient(circle at 80% 16%,#fff8 0 28px,#0000 30px),radial-gradient(circle at 70% 34%,#fff7 0 22px,#0000 24px)}
 .mk-stage svg{position:absolute;inset:0;width:100%;height:100%}
 .mk-bub{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#fff;border:3px solid #10304f;border-radius:18px;padding:6px 14px;font-weight:900;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
 .mk-bub.on{opacity:1}
 .mk-mis{background:#fff;border:3px solid #10304f;border-radius:16px;padding:5px 10px;font-size:15px;min-height:84px;line-height:1.25}
 .mk-mis b{font-size:18px}.mk-chk{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
 .mk-chk span{display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;border:2px solid #cbd5e1;border-radius:12px;padding:0 6px 0 2px;font-size:14px}
 .mk-chk span.ok{background:#dcfce7;border-color:#22c55e}
 .mk-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
 .mk-b{font:900 13px Commissioner,system-ui,sans-serif;background:#ffd84d;color:#10304f;border:3px solid #10304f;border-radius:999px;padding:4px 10px;box-shadow:0 3px 0 #10304f;cursor:pointer}
 .mk-b:active{transform:translateY(2px);box-shadow:0 1px 0 #10304f}.mk-b.on{background:#7dd3fc}
 .mk-right{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}.mk-left{min-height:0}.mk-grid{min-height:0}
 .mk-tabs{display:flex;gap:6px;flex-wrap:wrap}
 .mk-tab{width:52px;height:52px;border-radius:16px;border:3px solid #10304f;background:#fff;font-size:26px;cursor:pointer;box-shadow:0 3px 0 #10304f;display:grid;place-items:center;position:relative}
 .mk-tab.on{background:#ffd84d;transform:translateY(-2px)}.mk-tab small{position:absolute;bottom:-3px;font-size:9px;font-weight:900;background:#10304f;color:#fff;border-radius:6px;padding:0 3px;display:none}.mk-tab.on small{display:block}
 .mk-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;align-content:start;background:#ffffffaa;border:3px solid #10304f;border-radius:18px;padding:8px}
 .mk-tile{background:#fff;border:3px solid #10304f;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;cursor:grab;touch-action:none;font-size:13px;font-weight:900;text-align:center;box-shadow:0 3px 0 #10304f55;transition:transform .15s}
 .mk-tile:hover{transform:translateY(-3px) rotate(-1deg)}.mk-tile.on{background:#dcfce7;border-color:#16a34a}
 .mk-tile svg{width:64px;height:64px;pointer-events:none}
 .mk-ghost{position:fixed;z-index:60;pointer-events:none;width:90px;height:90px;transform:translate(-50%,-50%) rotate(-6deg);filter:drop-shadow(0 6px 6px #0004)}
 @media(max-width:640px){.mk-wrap{flex-direction:column}.mk-left{flex:0 0 300px}.mk-grid{min-height:200px}}

.m2 .row{display:flex;gap:10px;flex:1;min-height:0}
.m2-card{background:#fff;border:4px solid #10304f;border-radius:20px;box-shadow:0 4px 0 #10304f55;position:relative;overflow:hidden}
.m2-slot{flex:1;min-width:0;background:linear-gradient(#fff7d6,#ffe9a8);display:grid;place-items:center;padding:4px}
.m2-slot svg,.m2-cd svg{width:100%;height:100%}
.m2-slot.sil svg,.m2-slot.sil img{filter:brightness(0);opacity:.8}.m2-slot.sil svg *{animation:none!important}
.m2-slot.hit{background:linear-gradient(#dcfce7,#bbf7d0)}.m2-slot.pick{outline:5px dashed #2563eb}
.m2-cd{flex:1;min-width:0;background:#e0f2fe;display:grid;place-items:center;padding:4px;cursor:grab;touch-action:none}.m2-cd.pick{background:#bfdbfe;outline:5px solid #2563eb}.m2-cd.gone{visibility:hidden}
.m2-cd svg *{animation:none!important}
.m2-hud{display:flex;justify-content:space-between;font-weight:900;font-size:18px;color:#10304f;align-items:center}
.m2-btn{font:900 22px Commissioner,system-ui,sans-serif;background:#ffd84d;color:#10304f;border:4px solid #10304f;border-radius:16px;padding:10px 6px;box-shadow:0 4px 0 #10304f;cursor:pointer;flex:1}
.m2-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #10304f}.m2-btn[disabled]{background:#fecaca;opacity:.7}
.m2-say{position:relative;background:#fff;border:4px solid #10304f;border-radius:22px;padding:10px 16px;font-weight:900;font-size:20px;color:#10304f;text-align:center}
.m2-say::after{content:"";position:absolute;bottom:-16px;left:34px;border:10px solid transparent;border-top:12px solid #10304f}
.m2-co{width:62px;height:62px;border-radius:50%;border:4px solid #10304f;display:grid;place-items:center;font:900 17px Commissioner,sans-serif;color:#10304f;cursor:grab;box-shadow:0 3px 0 #0005,inset 0 -5px 0 #0002;touch-action:none;user-select:none}
.m2-no{width:112px;height:54px;border-radius:8px;border:4px solid #10304f;display:grid;place-items:center;font:900 20px Commissioner,sans-serif;color:#10304f;cursor:grab;box-shadow:0 3px 0 #0005;touch-action:none;user-select:none}
.m2-let{width:34px;height:40px;font:900 20px Commissioner,sans-serif;background:#fff;color:#10304f;border:3px solid #10304f;border-radius:9px;cursor:pointer;box-shadow:0 3px 0 #10304f}.m2-let[disabled]{opacity:.35;cursor:default}.m2-let.good{background:#86efac}.m2-let.bad{background:#fca5a5}
@media(max-width:640px){.m2 .row{flex-direction:column}}`;document.head.appendChild(st)})();
const M2={face:(who,worn)=>{if(!worn||!Object.keys(worn).length)return`<img src="${KIDS[who]}" alt="" draggable="false" style="width:100%;height:100%;object-fit:contain">`;
  const W=KIDS[who==='dog'?'dw':'cw'],T=who==='dog'?'translate(118 96) scale(1.02) translate(-150 -122)':'translate(106 100) scale(.98) translate(-150 -122)',H=who==='dog'?[W-22,262]:[W-18,250];
  const L=(k,tr)=>{const id=worn[k];if(!id)return'';const it=MK.byId[id];return it&&it.d?`<g transform="${tr}">${it.d}</g>`:''};
  return`<svg viewBox="-12 -34 ${W+64} 460" style="width:100%;height:100%">${MK.FILT}<image href="${KIDS[who]}" width="${W}" height="420"/><g filter="url(#mkbev)">${['neck','face','hat'].map(k=>L(k,T)).join('')}${L('hand',`translate(${H[0]} ${H[1]}) scale(.8) translate(-216 -292)`)}</g></svg>`},
 stars:m=>m<=2?3:m<=5?2:1,
 drag(el,sel,onTap,onDrop,mk){el.onpointerdown=e=>{const t=e.target.closest(sel);if(!t)return;e.preventDefault();let moved=false,g=null;const x0=e.clientX,y0=e.clientY;
  const mm=ev=>{if(!moved&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>8){moved=true;g=document.createElement('div');g.className='mk-ghost';g.innerHTML=mk(t);document.body.appendChild(g)}if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}};
  const up=ev=>{removeEventListener('pointermove',mm);removeEventListener('pointerup',up);if(g)g.remove();if(!moved)onTap(t);else onDrop(t,document.elementsFromPoint(ev.clientX,ev.clientY))};
  addEventListener('pointermove',mm);addEventListener('pointerup',up)}}};

G.shd=(ar,T)=>{const HATS=['hat_party','hat_crown','hat_beanie','hat_sun','hat_chef','hat_cap'],HANDS=['hand_umb','hand_balloon','hand_ice','hand_flower'],NS=[3,4,5,6];
 const all=[];['dog','cat'].forEach(w=>{HATS.forEach(h=>all.push({w,worn:{hat:h}}));HANDS.forEach(h=>all.push({w,worn:{hand:h}}));all.push({w,worn:{}})});
 let R=0,mist=0,sel=null,left=0,dead=false;
 const round=()=>{const ch=shuf(all).slice(0,NS[R]).map((c,i)=>({...c,id:i}));left=ch.length;sel=null;

G.stg=(ar,T)=>{const Q=[['Ένας άγνωστος στο παιχνίδι γράφει στη Νάσα: «Γεια! Πες μου πού μένεις!»',['Του λέει τη διεύθυνσή της',0],['Δεν απαντά και το λέει σε έναν μεγάλο που εμπιστεύεται',1],['Του στέλνει μια φωτογραφία της',0]],['Ένα παιχνίδι ζητά: «Δώσε τον κωδικό σου και κέρδισε δώρο!»',['Δίνει τον κωδικό για το δώρο',0],['Ρωτά τον φίλο του να δώσει κι αυτός',0],['Δεν δίνει τον κωδικό του σε κανέναν και ρωτά έναν μεγάλο',1]],['Ένα παιδί στο διαδίκτυο λέει άσχημα λόγια στον Μίλη.',['Το μπλοκάρει και το λέει στον δάσκαλο ή στους γονείς',1],['Του λέει κι αυτός άσχημα λόγια',0],['Κρύβει το πρόβλημα και δεν το λέει σε κανέναν',0]],['Η Νάσα θέλει να ανεβάσει μια φωτογραφία της με το όνομα του σχολείου της.',['Την ανεβάζει αμέσως',0],['Ρωτά πρώτα τους γονείς της',1],['Τη στέλνει σε αγνώστους να τη δουν',0]],['Ο Μίλης βλέπει στο διαδίκτυο κάτι που τον φοβίζει.',['Κλείνει την οθόνη και το λέει αμέσως σε έναν μεγάλο',1],['Συνεχίζει να κοιτάζει',0],['Το στέλνει σε όλους τους φίλους του',0]],['Email: «Κέρδισες ένα τηλέφωνο! Πάτα εδώ τώρα!»',['Πατά τον σύνδεσμο να πάρει το τηλέφωνο',0],['Δεν πατά τον σύνδεσμο και το δείχνει σε έναν μεγάλο',1],['Απαντά με τα στοιχεία του',0]]];
 const qs=shuf(Q);let i=0,mist=0,dead=false;
 const show=()=>{const q=qs[i];const who=i%2?'dog':'cat';T('Τι πρέπει να κάνουμε για να είμαστε ασφαλείς στο διαδίκτυο; Διάλεξε την καλύτερη απάντηση.');
  ar.innerHTML=`<div class="m2"><div class="m2-hud"><span>🛡️ Ο Μίλης και η Νάσα ασφαλείς στο διαδίκτυο</span><span>${i+1}/${qs.length} · ❌ ${mist}</span></div><div class="row"><div class="m2-card" style="flex:0 0 28%;background:linear-gradient(#e0f2fe,#fef9c3);padding:8px">${M2.face(who)}</div><div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px"><div class="m2-say" style="font-size:21px">${q[0]}</div><div id="sgo">${shuf(q.slice(1)).map((o,k)=>`<button class="sg-o" data-g="${o[1]}">${['🅰️','🅱️','🅲'][k]||''} ${o[0]}</button>`).join('')}</div><div id="sgf" style="font-weight:900;font-size:19px;color:#10304f;min-height:26px"></div></div></div></div>`;
  $('#sgo').onclick=e=>{const b=e.target.closest('.sg-o');if(!b||b.dataset.d)return;if(b.dataset.g==='1'){ok();b.classList.add('ok');ar.querySelectorAll('.sg-o').forEach(x=>x.dataset.d=1);$('#sgf').textContent='Μπράβο! Αυτό είναι το σωστό! 🎉';burst(innerWidth/2,innerHeight*.5,['⭐','🛡️']);setTimeout(()=>{if(dead)return;i++;if(i>=qs.length)win('stg',mist<=1?3:mist<=4?2:1,()=>play('stg'));else show()},1700)}else{no();mist++;b.classList.add('bad');b.dataset.d=1;$('#sgf').textContent='Όχι αυτό… δοκίμασε άλλη απάντηση 🤔';$('.m2-hud span:last-child').textContent=`${i+1}/${qs.length} · ❌ ${mist}`}}};
 show();return()=>{dead=true}};

  ar.innerHTML=`<div class=tnl>${rects.map(r=>`<i style='left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px'></i>`).join('')}<span class=tp style='left:${e0[0]}px;top:${e0[1]}px'>🐙</span><span class=tp style='left:${e1[0]}px;top:${e1[1]}px'>⭐</span><b class=cur id=cu></b></div>`;
  ar.onpointermove=e=>{const b=ar.getBoundingClientRect(),x=e.clientX-b.left-ar.clientLeft,y=e.clientY-b.top-ar.clientTop,cu=$('#cu');if(cu){cu.style.display='block';cu.style.left=x+'px';cu.style.top=y+'px'}
   if(!st){if(Math.hypot(x-e0[0],y-e0[1])<w/2){st=true;if(cu)cu.className='cur on';T('Πάμε! Μην ακουμπήσεις τα τοιχώματα.')}return}
   if(Math.hypot(x-e1[0],y-e1[1])<w/2){ar.onpointermove=null;ok();burst(e.clientX,e.clientY);L++;setTimeout(()=>{if(L<3)build();else{L=0;win('tunnel',miss<=2?3:miss<=6?2:1,()=>{miss=0;play('tunnel')})}},700);return}
   if(!([[0,0],[9,0],[-9,0],[0,9],[0,-9]].every(([da,db])=>rects.some(r=>x+da>=r.x&&x+da<=r.x+r.w&&y+db>=r.y&&y+db<=r.y+r.h)))){st=false;if(cu){cu.className='cur hit';setTimeout(()=>{cu.className='cur'},350)}miss++;no();T('Ωχ! Ακούμπησες το τοίχωμα. Γύρνα στο 🐙 και ξανά!')}}};
 build()};

G.arw=(ar,T)=>{const A=[['ArrowUp','⬆️'],['ArrowDown','⬇️'],['ArrowLeft','⬅️'],['ArrowRight','➡️']],B=[...A,['Enter','↵ ENTER'],['Space','␣ ΚΕΝΟ']],LV=[[8,A],[10,B]];let L=0,n=0,mist=0,cr=A[0];

 const next=()=>{cr=LV[L][1][Math.random()*LV[L][1].length|0];$('#tg').textContent=cr[1];T(`Επίπεδο ${L+1} από 2: πάτα το πλήκτρο που βλέπεις! ${n}/${LV[L][0]}`)};
 const kd=e=>{if(e.repeat||['Shift','Control','Alt','Meta','Tab','CapsLock'].includes(e.key))return;e.preventDefault();
  if(e.code===cr[0]){ok();n++;$('#net').textContent+='🐟';
   if(n>=LV[L][0]){L++;n=0;$('#net').textContent='';if(L>=LV.length){removeEventListener('keydown',kd);setTimeout(()=>win('arw',mist<=3?3:mist<=8?2:1,()=>play('arw')),500);return}next();T('Μπράβο! Τώρα έρχονται και τα ENTER και ΚΕΝΟ!');return}
   next()}
  else{mist++;no();const t=$('#tg');t.classList.remove('bad');void t.offsetWidth;t.classList.add('bad')}};
 addEventListener('keydown',kd);next();return()=>removeEventListener('keydown',kd)};

G.num=(ar,T)=>{const R=q=>Math.random()*q|0,LV=[['Ψηφία 0–9',()=>Array.from({length:8},()=>{const v=R(10);return{q:''+v,a:''+v}})],['Αριθμοί 10–99',()=>Array.from({length:6},()=>{const v=10+R(90);return{q:''+v,a:''+v}})],['Προσθέσεις',()=>Array.from({length:6},()=>{const a=1+R(9),b=1+R(9);return{q:`${a} + ${b} = ❓`,a:''+(a+b)}})]];
 let L=0,items,i,buf='',mist=0,lk=false;
 ar.innerHTML='<div class=col><div class=tg id=tg></div><div class=tx id=bf style="text-align:center;font-size:48px;width:220px"></div><div class=net id=net></div></div>';
 const show=()=>{$('#tg').textContent=items[i].q;$('#bf').textContent=buf||'…'};
 const start=()=>{items=LV[L][1]();i=0;buf='';lk=false;$('#net').textContent='';T(`Επίπεδο ${L+1} από 3: ${LV[L][0]}. Πληκτρολόγησε τον αριθμό!`);show()};
 const kd=e=>{if(lk||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){e.preventDefault();buf=buf.slice(0,-1);show();return}

  if(buf.length>=a.length){if(buf===a){ok();$('#net').textContent+='🐟';i++;buf='';
    if(i>=items.length){lk=true;L++;if(L<LV.length)setTimeout(start,700);else{removeEventListener('keydown',kd);setTimeout(()=>win('num',mist<=3?3:mist<=8?2:1,()=>play('num')),600)}return}}
   else{mist++;no();buf='';const t=$('#tg');t.classList.remove('bad');void t.offsetWidth;t.classList.add('bad')}}
  show()};
 addEventListener('keydown',kd);start();return()=>removeEventListener('keydown',kd)};

G.pic=(ar,T)=>{const W=[['🐟','ΨΑΡΙ'],['🐢','ΧΕΛΩΝΑ'],['🦀','ΚΑΒΟΥΡΙ'],['⭐','ΑΣΤΕΡΙ'],['⛵','ΒΑΡΚΑ'],['☀️','ΗΛΙΟΣ'],['🏠','ΣΠΙΤΙ'],['🐱','ΓΑΤΑ'],['🐶','ΣΚΥΛΟΣ'],['🍎','ΜΗΛΟ']],items=sh(W).slice(0,6);let ii=0,ci=0,mist=0;

 const show=()=>{const [e,w]=items[ii];$('#wp').textContent=e;T(`Γράψε τη λέξη που δείχνει η εικόνα! ${ii+1}/${items.length}`);$('#tg').innerHTML=[...w].map((c,i)=>`<span class="${i<ci?'d':i==ci?'c':''}">${c}</span>`).join('');

 const kd=e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1||e.key===' ')return;e.preventDefault();const w=items[ii][1];
  if(e.code!==CD[w[ci]]){mist++;no();const t=$('#tg');t.classList.remove('bad');void t.offsetWidth;t.classList.add('bad');return}
  beep(500+ci*50,.07);ci++;

   if(ii>=items.length){removeEventListener('keydown',kd);setTimeout(()=>win('pic',mist<=4?3:mist<=10?2:1,()=>play('pic')),600);return}}
  show()};
 addEventListener('keydown',kd);show();return()=>removeEventListener('keydown',kd)};

const fix=n=>{if(n.nodeType===3){if(!R.test(n.nodeValue))return;const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA|TITLE|OPTION)$/.test(p.nodeName)||p.namespaceURI!=='http://www.w3.org/1999/xhtml')return;const f=document.createDocumentFragment();n.nodeValue.split(/([\u{1F436}\u{1F431}])/u).forEach(t=>{if(!t)return;f.appendChild(/^[\u{1F436}\u{1F431}]$/u.test(t)?im(t):document.createTextNode(t))});p.replaceChild(f,n)}else if(n.nodeType===1&&!/^(SCRIPT|STYLE|TEXTAREA|CANVAS|svg)$/i.test(n.nodeName)){[...n.childNodes].forEach(fix)}};
let busy=0;new MutationObserver(ms=>{if(busy)return;busy=1;ms.forEach(m=>{m.addedNodes.forEach(fix);if(m.type==='characterData')fix(m.target)});busy=0}).observe(document.body,{childList:true,subtree:true,characterData:true});fix(document.body)})()</script>
