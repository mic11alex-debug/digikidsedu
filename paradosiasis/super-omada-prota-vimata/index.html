<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Η Σούπερ Ομάδα του Υπολογιστή – DigiKidsEdu</title>
<meta name="description" content="Τεύχος #1: Πρώτα Βήματα με τον Μπιπ">
<meta name="theme-color" content="#130e35">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anek+Greek:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#ffd23f;--bg:#130e35;--panel:#241b5e;--ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Anek Greek",system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-weight:500;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:3px solid var(--accent)}
header a.back{color:var(--ink);text-decoration:none;font-weight:700;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:10px;white-space:nowrap}
header h1{font-weight:800;font-size:1rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--ink);cursor:pointer;border:0}
.ib{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:1rem}
.ib:hover{background:rgba(255,255,255,.22)}
main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#slide{max-width:100%;max-height:100%;aspect-ratio:16/9;object-fit:contain;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);background:#000;user-select:none;-webkit-user-drag:none;transition:opacity .15s}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);font-size:1.6rem;z-index:2}
.nav:hover{background:var(--accent);color:#000}
.nav[disabled]{opacity:.25;cursor:default}
#prev{left:12px}#next{right:12px}
footer{background:var(--panel);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:8px}
#fill{height:100%;width:0;background:var(--accent);transition:width .2s}
#thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
#thumbs button{flex:0 0 auto;padding:0;border-radius:6px;overflow:hidden;border:2px solid transparent;background:#000;opacity:.7}
#thumbs button img{display:block;width:88px;height:50px;object-fit:cover}
#thumbs button.on{border-color:var(--accent);opacity:1}
#count{font-weight:700;min-width:64px;text-align:center}
.row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
@media(max-width:640px){.nav{width:44px;height:44px}#prev{left:4px}#next{right:4px}header h1{font-size:.9rem}#thumbs{display:none}}
body.fs header,body.fs footer{display:none}
body.fs main{padding:0}
body.fs #slide{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<header>
  <a class="back" href="/epoptiko.html" title="Πίσω στο Εποπτικό υλικό">← Πίσω</a>
  <h1>Η Σούπερ Ομάδα του Υπολογιστή <small style="opacity:.7;font-weight:400">· Τεύχος #1: Πρώτα Βήματα με τον Μπιπ</small></h1>
  <button class="ib" id="fs" title="Πλήρης οθόνη" aria-label="Πλήρης οθόνη">⛶</button>
</header>
<main>
  <div id="stage">
    <button class="nav" id="prev" aria-label="Προηγούμενη">‹</button>
    <img id="slide" alt="" draggable="false">
    <button class="nav" id="next" aria-label="Επόμενη">›</button>
  </div>
</main>
<footer>
  <div id="bar"><div id="fill"></div></div>
  <div class="row">
    <button class="ib" id="p2" aria-label="Προηγούμενη">◀</button>
    <span id="count"></span>
    <button class="ib" id="n2" aria-label="Επόμενη">▶</button>
  </div>
  <div id="thumbs"></div>
</footer>
<script>
(function(){
  var N=12, i=0;
  var $=function(id){return document.getElementById(id)};
  var img=$('slide'), th=$('thumbs');
  function pad(n){return (n<10?'0':'')+n}
  for(var k=1;k<=N;k++){
    (function(k){
      var b=document.createElement('button');
      b.innerHTML='<img src="slides/t'+pad(k)+'.webp" alt="Διαφάνεια '+k+'" loading="lazy">';
      b.onclick=function(){go(k-1)};
      th.appendChild(b);
    })(k);
  }
  function go(n){
    if(n<0||n>=N)return;
    i=n;
    img.src='slides/'+pad(i+1)+'.webp';
    img.alt='Διαφάνεια '+(i+1)+' από '+N;
    $('count').textContent=(i+1)+' / '+N;
    $('fill').style.width=((i+1)/N*100)+'%';
    $('prev').disabled=$('p2').disabled=(i===0);
    $('next').disabled=$('n2').disabled=(i===N-1);
    var bs=th.children;
    for(var j=0;j<bs.length;j++)bs[j].className=(j===i?'on':'');
    if(bs[i]&&bs[i].scrollIntoView)bs[i].scrollIntoView({block:'nearest',inline:'center'});
    if(i+1<N){var pre=new Image();pre.src='slides/'+pad(i+2)+'.webp'}
    try{location.hash='#'+(i+1)}catch(e){}
  }
  $('prev').onclick=$('p2').onclick=function(){go(i-1)};
  $('next').onclick=$('n2').onclick=function(){go(i+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home')go(0);
    else if(e.key==='End')go(N-1);
    else if(e.key==='f'||e.key==='F')toggleFs();
    else if(e.key==='Escape'&&document.body.classList.contains('fs')&&!document.fullscreenElement)document.body.classList.remove('fs');
  });
  // swipe
  var sx=null;
  var st=$('stage');
  st.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',function(e){
    if(sx===null)return;
    var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>40)go(dx<0?i+1:i-1);
  });
  // click on slide: right half next, left half previous
  img.addEventListener('click',function(e){
    var r=img.getBoundingClientRect();
    go((e.clientX-r.left)>r.width/2?i+1:i-1);
  });
  function toggleFs(){
    var el=document.documentElement;
    if(document.fullscreenElement){document.exitFullscreen();return}
    if(el.requestFullscreen){el.requestFullscreen().catch(function(){document.body.classList.toggle('fs')})}
    else document.body.classList.toggle('fs');
  }
  document.addEventListener('fullscreenchange',function(){
    document.body.classList.toggle('fs',!!document.fullscreenElement);
  });
  $('fs').onclick=toggleFs;
  var h=parseInt((location.hash||'').slice(1),10);
  go(h>=1&&h<=N?h-1:0);
})();
</script>
</body>
</html>
