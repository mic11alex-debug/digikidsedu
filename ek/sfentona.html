 <p>Τράβα το πουλάκι πίσω, σημάδεψε και άφησέ το! Γκρέμισε τους πύργους και πιάσε όλα τα πράσινα ζελεδάκια.</p>

<script>
// ================= PHYSICS (impulse solver, boxes + circles) =================
const V={add:(a,b)=>({x:a.x+b.x,y:a.y+b.y}),sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y}),mul:(a,s)=>({x:a.x*s,y:a.y*s}),dot:(a,b)=>a.x*b.x+a.y*b.y,cr:(a,b)=>a.x*b.y-a.y*b.x,len:a=>Math.hypot(a.x,a.y)};
let BID=0;
class Body{constructor(o){Object.assign(this,{x:0,y:0,a:0,vx:0,vy:0,w:0,hx:.5,hy:.5,r:0,density:1,fric:.6,rest:.05,static:false,kind:'block',mat:'wood',hp:10,maxhp:10,id:++BID,dead:false},o);
 this.circle=this.r>0;const area=this.circle?Math.PI*this.r*this.r:4*this.hx*this.hy;
 if(this.static){this.m=this.im=this.I=this.iI=0}else{this.m=area*this.density;this.im=1/this.m;this.I=this.circle?.5*this.m*this.r*this.r:this.m*(4*this.hx*this.hx+4*this.hy*this.hy)/12;this.iI=1/this.I}
 this.br=this.circle?this.r:Math.hypot(this.hx,this.hy);this.maxhp=this.hp}
 verts(){const c=Math.cos(this.a),s=Math.sin(this.a),h=[[-this.hx,-this.hy],[this.hx,-this.hy],[this.hx,this.hy],[-this.hx,this.hy]];return h.map(([u,v])=>({x:this.x+c*u-s*v,y:this.y+s*u+c*v}))}
 norms(){const c=Math.cos(this.a),s=Math.sin(this.a);return [{x:s,y:-c},{x:c,y:s},{x:-s,y:c},{x:-c,y:-s}]}}
function maxSep(A,B){const va=A.verts(),na=A.norms(),vb=B.verts();let best=-1e9,bi=0;for(let i=0;i<4;i++){let mn=1e9;for(const p of vb){const d=(p.x-va[i].x)*na[i].x+(p.y-va[i].y)*na[i].y;if(d<mn)mn=d}if(mn>best){best=mn;bi=i}}return [best,bi]}
function clip(p1,p2,n,o){const d1=V.dot(n,p1)-o,d2=V.dot(n,p2)-o,out=[];if(d1<=0)out.push(p1);if(d2<=0)out.push(p2);if(d1*d2<0){const t=d1/(d1-d2);out.push({x:p1.x+(p2.x-p1.x)*t,y:p1.y+(p2.y-p1.y)*t,c:1})}return out}
function polyPoly(A,B){const [sa,ea]=maxSep(A,B);if(sa>0)return [];const [sb,eb]=maxSep(B,A);if(sb>0)return [];let ref,inc,e,flip;if(sb>sa+.002){ref=B;inc=A;e=eb;flip=1}else{ref=A;inc=B;e=ea;flip=0}
 const rn=ref.norms()[e],rv=ref.verts(),v1=rv[e],v2=rv[(e+1)%4];const inN=inc.norms(),iv=inc.verts();let ii=0,mn=1e9;for(let i=0;i<4;i++){const d=V.dot(rn,inN[i]);if(d<mn){mn=d;ii=i}}
 const t0=V.sub(v2,v1),tl=V.len(t0),t={x:t0.x/tl,y:t0.y/tl};let pts=clip(iv[ii],iv[(ii+1)%4],{x:-t.x,y:-t.y},-V.dot(t,v1));if(pts.length<2)return [];pts=clip(pts[0],pts[1],t,V.dot(t,v2));if(pts.length<2)return [];
 const out=[];pts.forEach((p,k)=>{const sep=V.dot(rn,V.sub(p,v1));if(sep<=0)out.push({p:{x:p.x,y:p.y},n:flip?{x:-rn.x,y:-rn.y}:rn,sep,id:flip*64+e*16+ii*4+k})});return out}
function circPoly(C,P){const vs=P.verts(),ns=P.norms(),c={x:C.x,y:C.y};let s=-1e9,e=0;for(let i=0;i<4;i++){const d=V.dot(ns[i],V.sub(c,vs[i]));if(d>C.r)return [];if(d>s){s=d;e=i}}
 const v1=vs[e],v2=vs[(e+1)%4];if(s<1e-4)return [{n:ns[e],p:V.sub(c,V.mul(ns[e],C.r)),sep:s-C.r,id:e}];
 const u1=V.dot(V.sub(c,v1),V.sub(v2,v1)),u2=V.dot(V.sub(c,v2),V.sub(v1,v2));let n,sep;
 if(u1<=0){const d=V.sub(c,v1),l=V.len(d);if(l>C.r)return [];n=V.mul(d,1/l);sep=l-C.r}else if(u2<=0){const d=V.sub(c,v2),l=V.len(d);if(l>C.r)return [];n=V.mul(d,1/l);sep=l-C.r}else{n=ns[e];sep=s-C.r}
 return [{n,p:V.sub(c,V.mul(n,C.r)),sep,id:8+e}]}
function collide(a,b){if(a.circle&&b.circle){const d={x:b.x-a.x,y:b.y-a.y},l=V.len(d);if(l>a.r+b.r||l<1e-9)return [];const n=V.mul(d,1/l);return [{n,p:V.add(a,V.mul(n,a.r)),sep:l-a.r-b.r,id:0}]}
 if(a.circle){return circPoly(a,b).map(c=>({...c,n:{x:-c.n.x,y:-c.n.y}}))}if(b.circle)return circPoly(b,a);return polyPoly(a,b)}
const world={bodies:[],arb:new Map(),g:-10,onImpact:null};
function step(dt,it){const B=world.bodies,inv=1/dt;const seen=new Set();
 for(let i=0;i<B.length;i++){const a=B[i];for(let j=i+1;j<B.length;j++){const b=B[j];if((a.static||a.asleep)&&(b.static||b.asleep))continue;const k=a.id<b.id?a.id+'_'+b.id:b.id+'_'+a.id;const dx=a.x-b.x,dy=a.y-b.y,rr=a.br+b.br+.05;if(dx*dx+dy*dy>rr*rr){continue}
  const [b1,b2]=a.id<b.id?[a,b]:[b,a];const cs=collide(b1,b2);if(!cs.length)continue;seen.add(k);const old=world.arb.get(k);if(old){for(const c of cs){const o=old.c.find(q=>q.id==c.id);if(o){c.Pn=o.Pn;c.Pt=o.Pt}else{c.Pn=0;c.Pt=0}}old.c=cs;old.fresh=0}else world.arb.set(k,{b1,b2,c:cs.map(c=>({...c,Pn:0,Pt:0})),fresh:1})}}
 for(const k of [...world.arb.keys()])if(!seen.has(k))world.arb.delete(k);
 for(const A of world.arb.values()){const {b1,b2}=A;for(const [s,o] of [[b1,b2],[b2,b1]])if(s.asleep&&!o.static&&!o.asleep&&(Math.abs(o.vx)+Math.abs(o.vy)+Math.abs(o.w)*.3)>.6)wake(s)}
 for(const b of B){b.em=b.asleep?0:b.im;b.eI=b.asleep?0:b.iI}
 for(const b of B)if(!b.static&&!b.asleep){b.vy+=world.g*dt;b.vx*=.9995;b.w*=.995}
 for(const A of world.arb.values()){const {b1,b2}=A;const fr=Math.sqrt(b1.fric*b2.fric),e=Math.max(b1.rest,b2.rest);A.fr=fr;
  for(const c of A.c){const r1=V.sub(c.p,b1),r2=V.sub(c.p,b2);c.r1=r1;c.r2=r2;const n=c.n,t={x:n.y,y:-n.x};c.t=t;
   const rn1=V.dot(r1,n),rn2=V.dot(r2,n);const K=b1.em+b2.em+b1.eI*(V.dot(r1,r1)-rn1*rn1)+b2.eI*(V.dot(r2,r2)-rn2*rn2);c.mn=K>0?1/K:0;
   const rt1=V.dot(r1,t),rt2=V.dot(r2,t);const Kt=b1.em+b2.em+b1.eI*(V.dot(r1,r1)-rt1*rt1)+b2.eI*(V.dot(r2,r2)-rt2*rt2);c.mt=Kt>0?1/Kt:0;
   c.bias=-.2*inv*Math.min(0,c.sep+.01);
   const dvx=b2.vx-b2.w*r2.y-b1.vx+b1.w*r1.y,dvy=b2.vy+b2.w*r2.x-b1.vy-b1.w*r1.x,vn=dvx*n.x+dvy*n.y;c.rb=vn<-1.2?-e*vn:0;
   if(vn<-1.5&&world.onImpact){const mu=1/((b1.im+b2.im)||1);world.onImpact(b1,b2,.5*mu*vn*vn,c.p)}
   const P={x:c.Pn*n.x+c.Pt*t.x,y:c.Pn*n.y+c.Pt*t.y};imp(b1,b2,r1,r2,P)}}
 for(let k=0;k<it;k++)for(const A of world.arb.values()){const {b1,b2}=A;for(const c of A.c){const {r1,r2,n,t}=c;
   let dvx=b2.vx-b2.w*r2.y-b1.vx+b1.w*r1.y,dvy=b2.vy+b2.w*r2.x-b1.vy-b1.w*r1.x;const vn=dvx*n.x+dvy*n.y;let dPn=c.mn*(-vn+Math.max(c.bias,c.rb));const P0=c.Pn;c.Pn=Math.max(P0+dPn,0);dPn=c.Pn-P0;imp(b1,b2,r1,r2,{x:dPn*n.x,y:dPn*n.y});
   dvx=b2.vx-b2.w*r2.y-b1.vx+b1.w*r1.y;dvy=b2.vy+b2.w*r2.x-b1.vy-b1.w*r1.x;const vt=dvx*t.x+dvy*t.y;let dPt=c.mt*(-vt);const mx=A.fr*c.Pn,T0=c.Pt;c.Pt=Math.max(-mx,Math.min(mx,T0+dPt));dPt=c.Pt-T0;imp(b1,b2,r1,r2,{x:dPt*t.x,y:dPt*t.y})}}
 for(const b of B)if(!b.static&&!b.asleep){b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;if(b.kind!='bird'&&Math.abs(b.vx)+Math.abs(b.vy)<.12&&Math.abs(b.w)<.15){b.sleepT=(b.sleepT||0)+dt;if(b.sleepT>.6){b.asleep=true;b.vx=b.vy=b.w=0}}else b.sleepT=0}}
function wake(b){if(b.asleep){b.asleep=false;b.sleepT=0}}
function wakeNear(x,y,R){for(const b of world.bodies)if(!b.static&&Math.hypot(b.x-x,b.y-y)<R+b.br)wake(b)}
function imp(b1,b2,r1,r2,P){b1.vx-=b1.em*P.x;b1.vy-=b1.em*P.y;b1.w-=b1.eI*V.cr(r1,P);b2.vx+=b2.em*P.x;b2.vy+=b2.em*P.y;b2.w+=b2.eI*V.cr(r2,P)}
function removeBody(b){b.dead=true;if(!b.static)wakeNear(b.x,b.y,b.br+.8);world.bodies=world.bodies.filter(x=>x!==b);for(const [k,A] of world.arb)if(A.b1===b||A.b2===b)world.arb.delete(k)}
// ================= GAME =================
const cv=document.getElementById('c'),$=id=>document.getElementById(id);let cx=cv.getContext('2d'),W,H,DPR;
const MAT={wood:{d:1,hp:9,fr:.7,c1:'#e0a35a',c2:'#a8662a',ln:'#6b3a12',pts:100,snd:300},glass:{d:1.2,hp:3.5,fr:.3,c1:'#c8f4ff',c2:'#6fc9ec',ln:'#2f7fa8',pts:60,snd:1400},stone:{d:2.6,hp:40,fr:.8,c1:'#b9bccb',c2:'#6d7186',ln:'#3d4052',pts:150,snd:120},ground:{}};
const BIRDS={red:{c1:'#ff9a52',c2:'#e5552b',belly:'#fff0d6',r:.34,name:'Κοραλλένιο',tip:'Δυνατό χτύπημα'},yellow:{c1:'#ffe45c',c2:'#f0a500',belly:'#fff6c9',r:.32,name:'Κίτρινο',tip:'Πάτα στον αέρα: σούπερ ταχύτητα!'},blue:{c1:'#8fd8ff',c2:'#2f8fe0',belly:'#e6f7ff',r:.26,name:'Γαλάζιο',tip:'Πάτα στον αέρα: γίνεται 3!'},black:{c1:'#5d5f78',c2:'#22232f',belly:'#9a9cb8',r:.38,name:'Κάρβουνο',tip:'Πάτα στον αέρα: ΜΠΟΥΜ!'}};
let LV=0,birds=[],cur=null,flying=[],state='menu',drag=null,parts=[],texts=[],score=0,targets=0,trail=[],oldTrail=[],settleT=0,flyT=0,armT=0,camX=0,camS=40,baseY=0,levelW=24,shake=0,abilityUsed=false,winT=0,SL={x:0,y:2.15},prog=[];
try{prog=JSON.parse(localStorage.getItem('sf.prog')||'[]')}catch(e){}
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);fitCam();clouds=null}
addEventListener('resize',rs);
function fitCam(){baseY=H*.86;const nb=(LEVELS[LV]&&LEVELS[LV].b.length)||3,L=Math.min(-3.2,-(1.1+Math.max(0,nb-2)*.7+.6)),Rr=levelW+1.2;camS=Math.min(W/(Rr-L),(baseY-46)/8);camX=L-(W/camS-(Rr-L))/2}
const sx=x=>(x-camX)*camS,sy=y=>baseY-y*camS,wx=X=>X/camS+camX,wy=Y=>(baseY-Y)/camS;
// ---------- levels ----------
function blk(x,y,w,h,mat,a=0){world.bodies.push(new Body({x,y,hx:w/2,hy:h/2,a,density:MAT[mat].d,fric:MAT[mat].fr,hp:MAT[mat].hp,mat}))}
function tgt(x,y,r=.32,hat=0){world.bodies.push(new Body({x,y,r,density:.9,fric:.6,hp:2.2*(1+hat),kind:'tgt',mat:'tgt',hat,blink:Math.random()*3}));targets++}
function hill(x,y,w,h){world.bodies.push(new Body({x,y,hx:w/2,hy:h/2,static:true,mat:'ground',fric:.9}))}
function frame(x,y,w,h,mat,lin=mat){const p=.22;blk(x-w/2+p/2,y+h/2,p,h,mat);blk(x+w/2-p/2,y+h/2,p,h,mat);blk(x,y+h+p/2,w+.3,p,lin);return y+h+p}
const LEVELS=[
 {b:['red','red','red'],f(){const t=frame(15,0,1.8,1.3,'wood');tgt(15,.33);tgt(15,t+.33)}},
 {b:['red','yellow','red'],f(){const t=frame(13.5,0,1.8,1.2,'glass');const t2=frame(16.5,0,1.8,1.2,'wood');tgt(13.5,.33);tgt(16.5,.33);tgt(15,.33);frame(15,t,4.6,1.1,'wood');tgt(15,t+.33)}},
 {b:['blue','red','yellow'],f(){const s=.62;for(let r=0;r<4;r++)for(let i=0;i<4-r;i++)blk(14+i*s+r*s/2,s/2+r*s,s-.02,s-.02,r%2?'glass':'wood');tgt(13.2,.33);tgt(17.4,.33);tgt(14.93+.31,4*s+.33)}},
 {b:['yellow','red','blue','red'],f(){let y=0;for(let k=0;k<3;k++){y=frame(15,y,1.9,1.15,k==1?'glass':'wood');tgt(15,y-1.15-.22+.33+0)}tgt(15,y+.33,.34,1)}},
 {b:['black','red','yellow'],f(){hill(16,.6,6,1.2);let y=frame(14.6,1.2,1.7,1.2,'stone','wood');tgt(14.6,1.53);y=frame(17.4,1.2,1.7,1.2,'stone','wood');tgt(17.4,1.53);frame(16,y,4.3,1,'glass');tgt(16,y+.33,.34,1);tgt(16,1.53)}},
 {b:['blue','yellow','black','red'],f(){for(let i=0;i<3;i++){const x=12.5+i*2.3;const y=frame(x,0,1.6,1.4,i==1?'stone':'wood');tgt(x,.33);if(i!=1)blk(x,y+.6,.22,1.2,'glass');else tgt(x,y+.33,.34,1)}blk(14.8,3.3,5.2,.22,'wood');tgt(13.3,3.75);tgt(16.3,3.75)}},
 {b:['red','black','yellow','blue'],f(){hill(14,1.5,2.4,3);hill(18.5,.75,3,1.5);let y=frame(14,3,1.6,1.1,'wood');tgt(14,3.33);tgt(14,y+.33);y=frame(18.5,1.5,2.2,1.4,'stone','glass');tgt(18.1,1.83);tgt(18.9,1.83);y=frame(18.5,y,1.4,1,'glass');tgt(18.5,y+.33,.34,1)}},
