<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Βρες τις διαφορές</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#f59e0b;--g2:#ef4444}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
.sc{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:linear-gradient(#bae6fd,#dcfce7);border-radius:12px;padding:6px}.sc i{font-style:normal;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7.5vw,42px);border-radius:50%;cursor:pointer;position:relative}
.sc i.ok{outline:4px solid #22c55e;background:rgba(34,197,94,.25)}.sc i.bad{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}</style></head><body>
<header><h1>🔍 Βρες τις διαφορές</h1><p>Οι δύο εικόνες μοιάζουν, αλλά δεν είναι ίδιες!</p></header>
<main><div class="row"><div class="lab">Επίπεδο</div><button class="ch on" data-d="3">😊 3 διαφορές</button><button class="ch" data-d="5">🙂 5 διαφορές</button><button class="ch" data-d="7">😎 7 διαφορές</button></div>
<div class="row"><div class="pill"><small>Βρέθηκαν</small><b id="fd">0</b></div><div class="pill"><small>Λάθη</small><b id="er">0</b></div></div><div id="msg">Βρες τις διαφορές ανάμεσα στις δύο εικόνες!</div>
<div class="card"><div class="sc" id="A"></div></div><div style="text-align:center;font-size:26px">⬇️⬆️</div><div class="card"><div class="sc" id="B"></div></div><div class="row"><button class="btn" id="again">🔄 Νέο παιχνίδι</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const POOL=['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🦁','🐸','🐵','🍎','🍌','🍇','🍓','🌳','🌸','⭐','🌙','☀️','🚗','🚲','⚽','🎈','🏠','🦋','🐞','🐟','🐢'];
let nd=3,A,Bb,diff,found,errs,over;
function newG(){const n=24;A=Array.from({length:n},()=>POOL[Math.random()*POOL.length|0]);Bb=A.slice();diff=sh([...Array(n).keys()]).slice(0,nd);diff.forEach(i=>{let e;do e=POOL[Math.random()*POOL.length|0];while(e===A[i]);Bb[i]=e});found=new Set;errs=0;over=false;$('fd').textContent='0/'+nd;$('er').textContent=0;$('msg').textContent='Βρες τις διαφορές ανάμεσα στις δύο εικόνες!';
 for(const [id,arr] of [['A',A],['B',Bb]]){const el=$(id);el.innerHTML='';arr.forEach((e,i)=>{const c=document.createElement('i');c.textContent=e;c.onclick=()=>pick(i);el.appendChild(c)})}}
function mark(i){[$('A'),$('B')].forEach(el=>el.children[i].classList.add('ok'))}
function pick(i){if(over)return;if(found.has(i))return;if(diff.includes(i)){found.add(i);mark(i);beep(784,.15);$('fd').textContent=found.size+'/'+nd;if(found.size===nd){over=true;$('msg').textContent='🎉 Τις βρήκες όλες! Λάθη: '+errs;fanfare()}}else{errs++;$('er').textContent=errs;beep(160,.2,'sawtooth');[$('A'),$('B')].forEach(el=>{const c=el.children[i];c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad')})}}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{nd=+b.dataset.d;sel('data-d',nd);newG()});$('again').onclick=newG;newG();
</script></body></html>
