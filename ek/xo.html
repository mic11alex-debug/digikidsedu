<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Τρίλιζα (Χ Ο)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--x:#ef4444;--o:#3b82f6;--soft:#f1f5f9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,#ef4444,#3b82f6);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
main{max-width:560px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.score{display:flex;gap:10px;justify-content:center;margin:12px 0}
.sc{flex:1;max-width:160px;background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 4px;transition:.2s}
.sc b{display:block;font-size:30px;line-height:1.1}.sc small{color:var(--mu);font-size:14px;font-weight:600}
.sc.act{transform:scale(1.06);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.sc.X.act{border-color:var(--x)}.sc.O.act{border-color:var(--o)}.sc.X b{color:var(--x)}.sc.O b{color:var(--o)}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:6px 0}
#bw{position:relative;width:min(100%,420px);aspect-ratio:1;margin:6px auto}
#bd{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;width:100%;height:100%;background:#1e3a8a;border-radius:22px;padding:8px}
.cl{background:#fff;border:0;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font:700 clamp(54px,18vw,96px) Fredoka;line-height:1;padding:0;transition:background .15s,transform .1s}
.cl:hover:not(:disabled){background:#e0f2fe}.cl:active:not(:disabled){transform:scale(.95)}
.cl:disabled{cursor:default}
.cl.X{color:var(--x)}.cl.O{color:var(--o)}
.cl span{display:block}.cl.nw span{animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.cl.win{background:#fef08a;animation:flash .5s 3}
@keyframes flash{50%{background:#fde047;transform:scale(1.05)}}
#ln{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.big{display:flex;justify-content:center;gap:10px;margin-top:14px}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
</style></head><body>
<header><h1>❌ Τρίλιζα ⭕</h1><p>Βάλε 3 ίδια σύμβολα στη σειρά – οριζόντια, κάθετα ή διαγώνια!</p></header>
<main>
<div class="row"><div class="lab">Με ποιον παίζεις;</div>
<button class="ch on" data-p="cpu">🤖 Με τον υπολογιστή</button><button class="ch" data-p="two">👫 Δύο παίκτες</button></div>
<div class="row" id="rl"><div class="lab">Πόσο δύσκολος να είναι;</div>
<button class="ch" data-l="1">😊 Εύκολος</button><button class="ch on" data-l="2">🙂 Μέτριος</button><button class="ch" data-l="3">😎 Δύσκολος</button></div>
<div class="row" id="rs"><div class="lab">Εσύ παίζεις με:</div>
<button class="ch on" data-s="X">❌ Χ (ξεκινάς)</button><button class="ch" data-s="O">⭕ Ο</button></div>
<div class="score"><div class="sc X" id="sX"><small id="nX">Εσύ ❌</small><b id="vX">0</b></div><div class="sc" style="max-width:90px"><small>Ισοπαλίες</small><b id="vD" style="color:var(--mu)">0</b></div><div class="sc O" id="sO"><small id="nO">Υπολογιστής ⭕</small><b id="vO">0</b></div></div>
<div id="msg"></div>
<div id="bw"><div id="bd"></div><svg id="ln" viewBox="0 0 300 300"></svg></div>
<div class="big"><button class="btn" id="again">🔄 Νέο παιχνίδι</button><button class="btn g" id="rst">0️⃣ Μηδένισε το σκορ</button></div>
</main>
<script>
const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let LAST=-1,B,turn,over,mode='cpu',lvl=2,me='X',sc={X:0,O:0,D:0},first='X',lock=false;
const $=id=>document.getElementById(id);
let AC;function beep(f,d=.12,t='sine'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function win(b){for(const w of W)if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[0]]===b[w[2]])return w;return null}
function mm(b,pl,cp){const w=win(b);if(w)return b[w[0]]===cp?10:-10;if(b.every(Boolean))return 0;let best=pl===cp?-99:99;
 for(let i=0;i<9;i++)if(!b[i]){b[i]=pl;const v=mm(b,pl==='X'?'O':'X',cp);b[i]=null;best=pl===cp?Math.max(best,v):Math.min(best,v)}return best}
function cpuMove(){const cp=turn,op=cp==='X'?'O':'X',em=[];B.forEach((v,i)=>{if(!v)em.push(i)});
 const rnd=()=>em[Math.random()*em.length|0];
 const find=p=>{for(const w of W){const c=w.filter(i=>B[i]===p).length,e=w.filter(i=>!B[i]);if(c===2&&e.length===1)return e[0]}return -1};
 if(lvl===1){return Math.random()<.7?rnd():(find(cp)>=0?find(cp):rnd())}
 if(lvl===2){let m=find(cp);if(m>=0)return m;if(Math.random()<.75){m=find(op);if(m>=0)return m}
   if(!B[4]&&Math.random()<.6)return 4;return rnd()}
 let best=-99,mv=[];for(const i of em){B[i]=cp;const v=mm(B,op,cp);B[i]=null;if(v>best){best=v;mv=[i]}else if(v===best)mv.push(i)}return mv[Math.random()*mv.length|0]}
function names(){if(mode==='cpu'){$('nX').textContent=me==='X'?'Εσύ ❌':'Υπολογιστής ❌';$('nO').textContent=me==='O'?'Εσύ ⭕':'Υπολογιστής ⭕'}else{$('nX').textContent='Παίκτης 1 ❌';$('nO').textContent='Παίκτης 2 ⭕'}}
function draw(w){const bd=$('bd');bd.innerHTML='';B.forEach((v,i)=>{const b=document.createElement('button');b.className='cl'+(v?' '+v:'')+(i===LAST?' nw':'')+(w&&w.includes(i)?' win':'');b.disabled=!!v||over;if(v)b.innerHTML='<span>'+v+'</span>';b.onclick=()=>play(i);bd.appendChild(b)});
 $('sX').classList.toggle('act',!over&&turn==='X');$('sO').classList.toggle('act',!over&&turn==='O')}
function say(){if(over)return;const who=mode==='cpu'?(turn===me?'Σειρά σου!':'Σκέφτεται ο υπολογιστής… 🤔'):'Σειρά του παίκτη '+(turn==='X'?'1 ❌':'2 ⭕');$('msg').textContent=who}
function newG(){B=Array(9).fill(null);LAST=-1;over=false;lock=false;turn=first;$('ln').innerHTML='';draw();say();first=first==='X'?'O':'X';if(mode==='cpu')first='X';
 if(mode==='cpu'&&turn!==me){lock=true;setTimeout(cpu,600)}}
function cpu(){if(over)return;const m=cpuMove();lock=false;play(m,true)}
function play(i,fromCpu){if(over||B[i]||(lock&&!fromCpu))return;if(mode==='cpu'&&turn!==me&&!fromCpu)return;
 B[i]=turn;LAST=i;beep(turn==='X'?520:380,.12);const w=win(B);
 if(w){over=true;sc[turn]++;draw(w);line(w);const mine=mode==='cpu'?turn===me:null;
  $('msg').textContent=mode==='cpu'?(mine?'🎉 Μπράβο, κέρδισες!':'😅 Κέρδισε ο υπολογιστής! Δοκίμασε ξανά.'):'🎉 Κέρδισε ο παίκτης '+(turn==='X'?'1 ❌':'2 ⭕')+'!';
  [523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));upd();return}
 if(B.every(Boolean)){over=true;sc.D++;draw();$('msg').textContent='🤝 Ισοπαλία!';beep(260,.3);upd();return}
 turn=turn==='X'?'O':'X';draw();say();
 if(mode==='cpu'&&turn!==me){lock=true;setTimeout(cpu,550)}}
function line(w){const c=i=>[(i%3)*100+50,(i/3|0)*100+50];const a=c(w[0]),b=c(w[2]);$('ln').innerHTML=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" opacity=".9"/>`}
function upd(){$('vX').textContent=sc.X;$('vO').textContent=sc.O;$('vD').textContent=sc.D}
function sel(attr,val,fn){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{mode=b.dataset.p;sel('data-p',mode);$('rl').style.display=$('rs').style.display=mode==='cpu'?'':'none';sc={X:0,O:0,D:0};upd();names();first='X';newG()});
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lvl=+b.dataset.l;sel('data-l',lvl);sc={X:0,O:0,D:0};upd();first='X';newG()});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{me=b.dataset.s;sel('data-s',me);sc={X:0,O:0,D:0};upd();names();first='X';newG()});
$('again').onclick=newG;$('rst').onclick=()=>{sc={X:0,O:0,D:0};upd();first='X';newG()};
names();newG();
</script></body></html>
