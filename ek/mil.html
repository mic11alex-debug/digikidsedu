<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,#b45309,#be185d);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka;border-radius:99px;padding:8px 16px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}

.btn{border:0;cursor:pointer;font:700 19px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}

.mp{width:100%;height:auto;display:block;border-radius:18px;background:#bfe6ff;border:4px solid var(--bd);touch-action:none;user-select:none;-webkit-user-select:none}.isl{fill:#f6e7b0;stroke:#6b5a1a;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}.pin circle{fill:#94a3b8;stroke:#fff;stroke-width:4}.pin text{font:700 24px Fredoka,sans-serif;fill:#1e293b;paint-order:stroke;stroke:#fff;stroke-width:6px;display:none}.pin.f text{display:block}.pin.f circle{fill:#10b981}.pin.f.o circle{fill:#ef4444}
.zb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.zb button{font:700 24px Fredoka;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;width:52px;height:48px;cursor:pointer}.zb button.btn{width:auto;padding:0 16px;font-size:16px;white-space:nowrap}
.sit{font-size:clamp(19px,4vw,25px);font-weight:600;text-align:center;padding:12px;background:var(--hl);border-radius:20px;margin:10px 0}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:10px 0}.cd2{border:4px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);cursor:pointer;overflow:hidden;text-align:left;font:600 16px Fredoka;padding:0}.cd2 img{width:100%;height:130px;object-fit:cover;display:block}.cd2 .em{font-size:56px;text-align:center;padding:14px;background:var(--soft)}.cd2 b{display:block;padding:8px 10px 2px;font-size:18px}.cd2 span{display:none;padding:0 10px 10px;font-weight:400;font-size:15px;line-height:1.35}.cd2.open{border-color:var(--green)}.cd2.open span{display:block}
.qe{font-size:clamp(20px,4.2vw,26px);font-weight:600;text-align:center;margin:8px 0 12px}.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;padding:10px;background:var(--soft);border-radius:16px;min-height:70px}.chip{border:3px solid var(--bd);border-radius:14px;padding:8px 12px;background:var(--card);color:var(--tx);font:600 16px Fredoka;cursor:grab}.chip.sel{border-color:var(--amber);background:var(--hl);transform:scale(1.05)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.bin{border:3px dashed var(--bd);border-radius:16px;padding:8px;text-align:center;background:var(--soft);min-height:120px;cursor:pointer}.bin.hot{border-color:var(--amber);background:var(--hl)}.bin b{display:block;font-size:17px}.bin .ic{font-size:36px}.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;font-size:13px}.bin .in span{background:var(--card);border-radius:8px;padding:2px 6px}
.ol{list-style:none;padding:0;margin:8px 0}.ol li{padding:8px 12px;border-radius:12px;margin:5px 0;background:var(--soft)}.ol li.y{background:#bbf7d0;color:#14532d;font-weight:600}
.slide{aspect-ratio:16/9;background:#fff;color:#1e293b;border:4px solid var(--bd);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:8px;padding:10px;max-width:640px;margin:10px auto}.slide .ti{grid-column:1/3;font:700 clamp(16px,3.4vw,26px) Fredoka;text-align:center;background:#dbeafe;border-radius:8px;padding:4px;min-height:1.6em}.slide .bx{border:2px dashed #cbd5e1;border-radius:8px;display:grid;place-items:center;font-size:14px;color:#94a3b8;overflow:hidden;text-align:center;padding:4px}.slide .bx.f{border:0;color:#1e293b}.slide .bx img{width:100%;height:100%;object-fit:cover;border-radius:8px}

.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:10px 0}.mt button{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px;font:600 17px Fredoka;cursor:pointer}.mt button.sel{border-color:var(--amber);background:var(--hl)}.mt button.done{background:#bbf7d0;border-color:var(--green);color:#14532d;cursor:default}
.rib{display:flex;gap:6px;flex-wrap:wrap;background:#2563eb;padding:8px;border-radius:12px 12px 0 0}.rib button{font:700 16px Fredoka;border:0;border-radius:8px;padding:6px 14px;background:#dbeafe;color:#1e3a8a;cursor:pointer}.rib button:disabled{opacity:.4;cursor:default}.rib button.hl2{background:#fde047;animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.07)}}

.xl{display:grid;grid-template-columns:1fr;gap:12px}.xt{border-collapse:collapse}.xt th,.xt td{border:1px solid #94a3b8;padding:4px 10px;background:#fff;color:#1e293b}.xt th{background:#e2e8f0}.xt button{border:0;background:#dbeafe;border-radius:6px;width:26px;height:26px;font-weight:700;cursor:pointer}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--bd);cursor:pointer;padding:0}.sw.on{box-shadow:0 0 0 4px var(--amber)}
.ds{aspect-ratio:16/9;max-width:620px;margin:10px auto;border-radius:14px;border:4px solid var(--bd);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px;text-align:center;position:relative;overflow:hidden}.ds .t1{font-size:clamp(20px,5vw,34px);font-weight:700}.ds .t2{font-size:clamp(14px,3vw,20px);margin-top:6px}.ds .ft2{position:absolute;bottom:6px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:13px}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.tools label{font-weight:600;font-size:16px}.tools select,.tools input[type=text]{font:600 16px Fredoka;border:3px solid var(--bd);border-radius:10px;padding:6px;background:var(--card);color:var(--tx)}

.pwi{width:100%;font:700 24px Fredoka,monospace;text-align:center;border:4px solid var(--bd);border-radius:16px;padding:12px;background:var(--card);color:var(--tx);letter-spacing:2px}.pwm{height:18px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0}.pwm i{display:block;height:100%;width:0;background:var(--red);transition:width .3s,background .3s}
.spm{border:3px solid var(--bd);border-radius:16px;background:#fff;color:#1e293b;overflow:hidden;margin:10px 0}.spm .h{background:#e2e8f0;padding:8px 12px;font-size:15px}.spm .b2{padding:12px;font-size:19px;line-height:1.9}.spm .sg{cursor:pointer;border-radius:6px;padding:1px 3px}.spm .sg:hover{background:#fef9c3}.spm .sg.fl{background:#fecaca;outline:2px solid #ef4444}.spm .sg.nf{background:#e2e8f0;text-decoration:line-through}.spm .sg.ms{background:#fde68a;outline:2px dashed #f59e0b}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}.mc{aspect-ratio:1/1.1;border:4px solid var(--bd);border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font:700 40px Fredoka;cursor:pointer;display:grid;place-items:center;padding:6px;text-align:center}.mc.up{background:var(--card);color:var(--tx);font-size:15px;font-weight:600;line-height:1.2}.mc.up.big{font-size:42px}.mc.ok{background:#bbf7d0;border-color:var(--green);color:#14532d}
.arena{position:relative;height:340px;border:4px solid var(--bd);border-radius:18px;overflow:hidden;background:linear-gradient(#bfdbfe,#e0f2fe);touch-action:manipulation;user-select:none}.fall{position:absolute;border:3px solid #fff;border-radius:14px;background:#fff;color:#1e293b;padding:4px 8px;font:700 15px Fredoka;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.2);white-space:nowrap}.fall b{font-size:26px;display:block;text-align:center;line-height:1.1}
.hud{display:flex;justify-content:space-between;font-weight:700;margin:6px 0;flex-wrap:wrap;gap:8px}
@media(max-width:560px){.ans,.mt{grid-template-columns:1fr}.hero{grid-template-columns:50px 1fr}.he{font-size:36px}.bar{grid-template-columns:100px 1fr 30px}}

 body.printing>*:not(#prn){display:none!important}
 body.printing{background:#fff!important;color:#111!important;margin:0!important;--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#cbd5e1;--soft:#f1f5f9;--hl:#fef9c3}

<header><h1><svg viewBox='0 0 64 64' width='1.1em' height='1.1em' style='vertical-align:-.12em'><path d='M22 6h20l-5 12H27z' fill='#a16207'/><path d='M26 16h12l-2 6H28z' fill='#ca8a04'/><path d='M32 20C14 24 6 40 10 52c3 8 14 8 22 8s19 0 22-8c4-12-4-28-22-32z' fill='#d97706' stroke='#78350f' stroke-width='2.5'/><circle cx='32' cy='41' r='13' fill='#fde047' stroke='#78350f' stroke-width='2'/><text x='32' y='48' text-anchor='middle' font-size='20' font-weight='800' font-family='Arial,sans-serif' fill='#78350f'>€</text></svg> Ο μικρός εκατομμυριούχος</h1><p>Απάντησε σωστά και φτάσε στο 1.000.000 €!</p></header>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>[...a].sort(()=>Math.random()-.5);
let done={};const KEY='mil_done';
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const mark=i=>{if(!done[i]){done[i]=1;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}tabs();try{parent.postMessage({sgame:KEY,n:Object.keys(done).length,t:T.length},'*')}catch(e){}}};
let cur=0;
function tabs(){const t=$('tabs');t.innerHTML='';T.forEach((x,i)=>{const b=el('button',(i==cur?'on ':'')+(done[i]?'ok':''),x[0]);b.onclick=()=>go(i);t.appendChild(b)})}
function go(i){cur=i;tabs();const v=$('v');v.innerHTML='';v.appendChild(el('h2','',T[i][1]));T[i][2](v);scrollTo(0,0)}
function stars(n,m){return '⭐'.repeat(n)+'☆'.repeat(m-n)}

const escP=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prBtn(fn,t,cls){const b=document.createElement('button');b.className=cls||'btn g';b.type='button';b.textContent=t||'🖨️ Εκτύπωση';b.onclick=fn;return b}

function drawQ(lv,t,used){let seen={};try{seen=JSON.parse(localStorage.getItem(SEENK)||'{}')}catch(e){}

   function pick(i){if(locked)return;locked=true;clearInterval(tm);btns[i].classList.add('sel');setTimeout(()=>{const ok=opts[i].ok;btns[i].classList.add(ok?'rt':'wr');if(!ok)btns[opts.findIndex(o=>o.ok)].classList.add('rt');setTimeout(()=>{p.ov=null;if(ok){p.n++;if(p.n>=15)fin(1,'🎉 ΕΙΣΑΙ ΕΚΑΤΟΜΜΥΡΙΟΥΧΟΣ!',1000000);else after()}else fin(0,'Λάθος απάντηση!',safeAmt(p))},1400)},900)}
   const lb=el('div','mll','');LL.forEach((l,k)=>{if(!avail.includes(k))return;const b=el('button','btn g',l.e+' '+l.n);b.disabled=p.used.has(k);b.onclick=()=>{if(locked||p.used.has(k))return;p.used.add(k);b.disabled=true;

     if(k==0){sh(wr).slice(0,2).forEach(i=>{hid.add(i);btns[i].disabled=true;btns[i].style.visibility='hidden'});info.innerHTML='✂️ Έμειναν 2 απαντήσεις.'}
     if(k==1){const pr=[.7,.55,.45][lv];let pc=[0,0,0,0];pc[ci]=Math.round(100*(pr+Math.random()*.15));let rest=100-pc[ci];const ot=wr.filter(i=>!hid.has(i));ot.forEach((i,j)=>{const x=j==ot.length-1?rest:Math.floor(Math.random()*rest*.7);pc[i]=x;rest-=x});info.innerHTML='👥 <b>Η τάξη ψήφισε:</b><br>'+[0,1,2,3].filter(i=>!hid.has(i)).map(i=>`<div class="bar"><span>${'ΑΒΓΔ'[i]}</span><i style="width:${pc[i]}%"></i><b>${pc[i]}%</b></div>`).join('')}
     if(k==2){const good=Math.random()<[.92,.8,.65][lv];const ch=good?ci:sh(wr.filter(i=>!hid.has(i)))[0];info.innerHTML=`🧑‍🤝‍🧑 <b>Ο φίλος που ρώτησες λέει:</b> «Νομίζω ότι είναι το <b>${'ΑΒΓΔ'[ch]}</b>… αλλά δεν είμαι απόλυτα σίγουρος!»`}};lb.appendChild(b)});
   const wb=el('button','btn g','🛑 Σταματάω και παίρνω '+fm(money(p)));wb.onclick=()=>{if(!locked)fin(1,'Αποφάσισε να σταματήσει!',money(p))};if(p.n==0)wb.disabled=true;lb.appendChild(wb);
   const info=el('div','minfo','');main.append(og,tmr,lb,info);
   if(lv==2){let t=45;tmr.textContent='⏱️ '+t;tm=setInterval(()=>{t--;tmr.textContent='⏱️ '+t;if(t<=0){clearInterval(tm);locked=true;fin(0,'Τελείωσε ο χρόνος!',safeAmt(p))}},1000)}}
  ask()}
