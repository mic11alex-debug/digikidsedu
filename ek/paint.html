<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ζωγραφίζω</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e0f2fe;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#bae6fd;--on:#fde68a;--onb:#f59e0b;--hd:#0ea5e9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1a2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#24406a;--on:#5b4410;--onb:#f59e0b;--hd:#075985}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:104px 1fr;grid-template-areas:"h h" "t m" "p p"}
header{grid-area:h;background:var(--hd);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px}
header h1{margin:0;font-size:24px;flex:1;white-space:nowrap}
.hb{border:0;background:rgba(255,255,255,.2);color:#fff;font:600 15px Fredoka;border-radius:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.hb:hover{background:rgba(255,255,255,.35)}.hb:active{transform:scale(.95)}.hb:disabled{opacity:.4}
#tools{grid-area:t;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--card);border-right:3px solid var(--bd)}
.tb{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 2px;cursor:pointer;font:600 12px Fredoka;display:flex;flex-direction:column;align-items:center;gap:0;flex:none}
.tb i{font-style:normal;font-size:28px;line-height:1.15}
.tb.on{background:var(--on);border-color:var(--onb);box-shadow:0 3px 0 var(--onb)}
.tb:active{transform:scale(.95)}
main{grid-area:m;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
#cv{background:#fff;border-radius:10px;box-shadow:0 0 0 4px var(--card),0 8px 24px rgba(0,0,0,.25);touch-action:none;cursor:crosshair}
#opts{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:var(--card);border-top:3px solid var(--bd);align-items:center;min-height:62px}
.ob{flex:none;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:4px 10px;cursor:pointer;font:600 14px Fredoka;white-space:nowrap}
.ob.on{background:var(--on);border-color:var(--onb)}
.ob.em{font-size:28px;padding:0 6px;line-height:1.3}
#opts input[type=text]{font:600 18px Fredoka;border:3px solid var(--bd);border-radius:12px;padding:4px 10px;width:220px;background:var(--card);color:var(--tx);user-select:text;-webkit-user-select:text}
.lab{flex:none;color:var(--mu);font-weight:600;font-size:14px}
#pal{grid-area:p;background:var(--card);border-top:3px solid var(--bd);display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
#sw{display:grid;grid-template-columns:repeat(12,32px);gap:4px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.sw.on{border-color:var(--tx);transform:scale(1.18);box-shadow:0 0 0 2px var(--card) inset}
#cur{width:46px;height:46px;border-radius:14px;border:4px solid var(--tx);flex:none}
#col{width:46px;height:46px;border:0;padding:0;background:none;cursor:pointer;flex:none}
#sz{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
#sz input{flex:1;accent-color:#f59e0b;height:30px}
#dot{width:44px;height:44px;display:grid;place-items:center;flex:none}
#dot b{display:block;border-radius:50%;background:var(--tx)}
@media(max-width:760px){
#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"h" "t" "m" "p"}
#tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:3px solid var(--bd);padding:6px}
.tb{min-width:68px}.tb i{font-size:24px}
header h1{font-size:19px}.hb .t{display:none}.hb{padding:6px 9px;font-size:14px}
#sw{grid-template-columns:repeat(12,26px)}.sw{width:26px;height:26px}
#stage{padding:6px}
}

#stage{position:relative}#stage.ms{padding-right:236px}
#mp{position:absolute;right:8px;top:8px;width:214px;max-height:calc(100% - 16px);overflow:auto;background:var(--card);border:3px solid var(--onb);border-radius:16px;padding:8px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:14px;user-select:text}
#mp h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;cursor:pointer;gap:6px}
#mp img{width:100%;border:2px solid var(--bd);border-radius:8px;background:#fff;cursor:zoom-in;display:block}
#mp label{display:flex;gap:6px;align-items:flex-start;margin:3px 0;cursor:pointer}#mp small{color:var(--mu);display:block;margin-top:4px}
.mb{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:4px 8px;font:600 13px Fredoka;cursor:pointer;margin:3px 3px 0 0}.mb.on{background:var(--on);border-color:var(--onb)}.mb.go{background:#10b981;color:#fff;border-color:#047857}
@media(max-width:760px){#stage.ms{padding-right:10px}#mp{width:170px;font-size:12px}}
#gh{position:absolute;pointer-events:none;opacity:.25;object-fit:contain;z-index:3}
.dlg2{position:fixed;inset:0;background:rgba(15,23,42,.7);display:grid;place-items:center;z-index:50;padding:12px}.dlg2>div{background:var(--card);color:var(--tx);border-radius:20px;padding:16px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0}.mcards button{border:3px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:6px;cursor:pointer;font:600 15px Fredoka;position:relative}.mcards img{width:100%;border-radius:8px;background:#fff;display:block}.mcards .ck{position:absolute;top:2px;right:6px;font-size:22px}
.rl{text-align:left;margin:10px auto;max-width:360px;font-size:17px}.rl div{margin:3px 0}
</style><style id="prcss">
#prn{display:none}
#prn .ph{margin:0 0 3mm;font-size:22pt;text-align:center}
#prn .pn{display:flex;gap:6mm;align-items:flex-end;font-size:12pt;margin:0 0 6mm;color:#444}
#prn .pn i{flex:1;border-bottom:1.5px solid #888;height:1em}
#prn .pf{margin-top:8mm;text-align:center;font-size:9pt;color:#777}
#prn svg{max-width:100%;height:auto}
#prn .ptb{border-collapse:collapse;margin:4mm 0;font-size:13pt}#prn .ptb th,#prn .ptb td{border:1.5px solid #94a3b8;padding:2mm 4mm;text-align:left}#prn .ptb th{background:#e2e8f0}#prn .ptb td.n{text-align:right}
#prn .ds,#prn .slide{max-width:none!important;width:75%;margin:0 auto 4mm!important;break-inside:avoid}
#prn .pdoc{font:16pt/1.5 'Times New Roman',Georgia,serif;color:#000;padding:4mm 2mm;min-height:120mm}
#prn .pslide{aspect-ratio:16/9;width:78%;margin:0 auto 7mm;border:2px solid #94a3b8;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;break-inside:avoid;padding:4mm;overflow:hidden}
#prn .pslide .pe{font-size:54pt;line-height:1.1}#prn .pslide .pt{font-size:28pt;font-weight:700}#prn .pslide .px{font-size:16pt;margin-top:2mm}#prn .pslide .pn2{position:absolute;right:8px;bottom:5px;font-size:10pt;color:#64748b}
#prn .hero{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;border:1.5px solid #cbd5e1;border-radius:12px;padding:8px;margin-bottom:8px;break-inside:avoid}
#prn .prpg{position:relative;width:680px;height:382px;overflow:hidden;margin:0 auto 8mm;border:2px solid #94a3b8;break-inside:avoid}#prn .prpg>div{transform:scale(.85);transform-origin:0 0}
#prn .pimg{display:block;width:100%;height:auto;border:2px solid #94a3b8;margin:0 auto}
#prn .dip{border:8px double #d97706;border-radius:18px;padding:16mm 10mm;text-align:center;margin:20mm auto 0;break-inside:avoid}#prn .dip .dt{font-size:34pt;font-weight:700;margin:4mm 0}#prn .dip .dn{font-size:30pt;font-weight:700;margin:8mm 0;border-bottom:2px solid #d97706;display:inline-block;min-width:60%}#prn .dip .dx{font-size:18pt}
#prn-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:14px;font:600 16px system-ui,sans-serif;z-index:99999;max-width:90vw;text-align:center}
@media print{
 body.printing>*:not(#prn){display:none!important}
 body.printing{background:#fff!important;color:#111!important;margin:0!important;--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#cbd5e1;--soft:#f1f5f9;--hl:#fef9c3}
 body.printing #prn{display:block!important;font-family:Fredoka,system-ui,sans-serif;color:#111;font-size:14pt}
 #prn,#prn *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<div id="app">
<header><h1>🎨 Ζωγραφίζω!</h1>
<button class="hb" id="bq">🎯<span class="t"> Αποστολές</span></button><button class="hb" id="bu">↶<span class="t"> Πίσω</span></button><button class="hb" id="br">↷<span class="t"> Ξανά</span></button><button class="hb" id="bc" title="Καθαρισμός όλης της κόλλας">🗑️<span class="t"> Καθαρισμός</span></button><button class="hb" id="bs">💾<span class="t"> Αποθήκευση</span></button><button class="hb" id="bp">🖨️<span class="t"> Εκτύπωση</span></button><button class="hb" id="bm" title="Ήχος">🔊</button></header>
<aside id="tools"></aside>
<main><div id="stage"><canvas id="cv" width="1000" height="640"></canvas></div><div id="opts"></div></main>
<footer id="pal"><div id="cur"></div><div id="sw"></div><input type="color" id="col" value="#e11d48" title="Δικό μου χρώμα"><div id="sz"><span class="lab">Μέγεθος</span><input type="range" id="size" min="2" max="40" value="12"><div id="dot"><b></b></div></div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const W=1000,H=640;
const TOOLS=[['brush','🖌️','Πινέλο'],['shape','⭐','Σχήματα'],['stamp','🐶','Σφραγίδες'],['magic','✨','Μαγικά'],['fill','🪣','Κουβάς'],['text','🔤','Γράμματα'],['erase','🧽','Γόμα'],['bg','🖼️','Φόντο']];
const BR=[['round','Στρογγυλό'],['pencil','Μολύβι'],['marker','Μαρκαδόρος'],['crayon','Κηρομπογιά'],['spray','Σπρέι'],['chalk','Κιμωλία']];
const SH=[['line','╱ Γραμμή'],['rect','▭ Ορθογώνιο'],['ellipse','◯ Κύκλος'],['triangle','△ Τρίγωνο'],['star','☆ Αστέρι'],['heart','♡ Καρδιά'],['rrect','▢ Στρογγυλεμένο'],['arrow','➡️ Βέλος']];
const MG=[['rainbow','🌈 Ουράνιο τόξο'],['sparkle','✨ Λαμπυρίσματα'],['glow','💡 Λάμψη'],['bubbles','🫧 Φυσαλίδες'],['mirror','🔮 Καθρέφτης'],['confetti','🎉 Κομφετί']];
const ST=['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🦁','🐸','🐵','🐧','🐢','🐙','🐠','🦋','🐞','🐝','🦄','🐘','🦒','🌳','🌸','🌻','🌈','☀️','🌙','⭐','☁️','🍎','🍌','🍓','🍕','🍦','🎂','🚗','🚌','🚀','✈️','⛵','🏠','🎈','⚽','🎁','👑','❤️','🤖','👻','🦖'];
const PAL=['#000000','#6b7280','#ffffff','#7c2d12','#e11d48','#f97316','#facc15','#84cc16','#16a34a','#14b8a6','#0ea5e9','#2563eb','#7c3aed','#d946ef','#f9a8d4','#fed7aa','#a16207','#fde68a','#bbf7d0','#a5f3fc','#bfdbfe','#ddd6fe','#fecaca','#374151'];
const BG=[['blank','⬜ Λευκό'],['house','🏠 Σπίτι'],['fish','🐟 Ψάρι'],['flower','🌼 Λουλούδι'],['rocket','🚀 Πύραυλος'],['sky','🌤️ Ουρανός'],['sea','🌊 Θάλασσα']];
let tool='brush',sub={brush:'round',shape:'rect',magic:'rainbow'},color='#e11d48',size=12,fillOn=false,stamp='🐶',txt='Γεια σου!',snd=true;
let undoS=[],redoS=[];
const ESZ=[['Μικρή',10],['Μεσαία',26],['Μεγάλη',52],['Τεράστια',100]];let eraseSize=26;

/* sound */
let AC=null;
function blip(f=520,d=.09,t='sine',v=.07){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* UI */
function mk(tag,cls,html,fn){const e=document.createElement(tag);if(cls)e.className=cls;e.innerHTML=html;if(fn)e.onclick=fn;return e}
function buildTools(){const t=$('tools');t.innerHTML='';TOOLS.forEach(([k,ic,lb])=>{const b=mk('button','tb'+(tool==k?' on':''),`<i>${k=='stamp'?stamp:ic}</i>${lb}`,()=>{tool=k;blip(600+TOOLS.findIndex(a=>a[0]==k)*60,.1,'triangle');buildTools();buildOpts()});t.appendChild(b)})}
function buildOpts(){const o=$('opts');o.innerHTML='';
 const grp=(arr,key)=>arr.forEach(([k,l])=>o.appendChild(mk('button','ob'+(sub[key]==k?' on':''),l,()=>{sub[key]=k;blip(700,.06);buildOpts()})));
 if(tool=='brush')grp(BR,'brush');
 else if(tool=='shape'){grp(SH,'shape');o.appendChild(mk('span','lab','|'));o.appendChild(mk('button','ob'+(!fillOn?' on':''),'Περίγραμμα',()=>{fillOn=false;buildOpts()}));o.appendChild(mk('button','ob'+(fillOn?' on':''),'Γεμάτο',()=>{fillOn=true;buildOpts()}))}
 else if(tool=='magic')grp(MG,'magic');
 else if(tool=='stamp')ST.forEach(s=>o.appendChild(mk('button','ob em'+(stamp==s?' on':''),s,()=>{stamp=s;blip(800,.07);buildTools();buildOpts()})));
 else if(tool=='text'){const i=document.createElement('input');i.type='text';i.value=txt;i.maxLength=40;i.oninput=()=>txt=i.value;o.appendChild(mk('span','lab','Γράψε και πάτα στο χαρτί:'));o.appendChild(i)}
 else if(tool=='bg'){o.appendChild(mk('span','lab','Διάλεξε εικόνα για χρωματισμό:'));BG.forEach(([k,l])=>o.appendChild(mk('button','ob',l,()=>{push();drawBG(k);blip(500,.15,'triangle')})))}
 else if(tool=='fill')o.appendChild(mk('span','lab','Πάτα πάνω στο σχέδιο για να το γεμίσεις με χρώμα 🎨'));
 else if(tool=='erase'){o.appendChild(mk('span','lab','🧽 Μέγεθος γόμας:'));ESZ.forEach(([l,v])=>o.appendChild(mk('button','ob'+(eraseSize==v?' on':''),`<span style="display:inline-block;vertical-align:middle;width:${Math.max(6,Math.min(26,v/3.5))}px;height:${Math.max(6,Math.min(26,v/3.5))}px;border-radius:50%;background:#94a3b8;border:2px solid #475569;margin-right:6px"></span>${l}`,()=>{eraseSize=v;blip(650,.06);buildOpts()})));o.appendChild(mk('span','lab','|'));o.appendChild(mk('button','ob','🗑️ Καθαρισμός όλης της κόλλας',clearAll))}
}
function buildPal(){const s=$('sw');s.innerHTML='';PAL.forEach(c=>{const b=mk('button','sw'+(c==color?' on':''),'',()=>setColor(c));b.style.background=c;b.setAttribute('aria-label',c);s.appendChild(b)});$('cur').style.background=color;dot()}
function setColor(c){color=c;$('col').value=c;blip(900,.05);buildPal()}
function dot(){const b=$('dot').firstChild;const d=Math.max(4,Math.min(42,size));b.style.width=b.style.height=d+'px'}
$('col').oninput=e=>{color=e.target.value;buildPal()};
$('size').oninput=e=>{size=+e.target.value;dot()};
$('bm').onclick=()=>{snd=!snd;$('bm').textContent=snd?'🔊':'🔇'};

/* fit canvas */
function fit(){const st=$('stage'),r=st.getBoundingClientRect(),pw=r.width-24-(typeof mis!='undefined'&&mis&&!mcol&&innerWidth>760?226:0),ph=r.height-24;const sc=Math.max(.2,Math.min(pw/W,ph/H));cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';if(window.placeGhost)placeGhost()}
addEventListener('resize',fit);

/* undo */
function push(){undoS.push(ctx.getImageData(0,0,W,H));if(undoS.length>25)undoS.shift();redoS=[];upd()}
function clearAll(){push();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);blip(300,.25,'triangle');if(typeof prMsg=='function')prMsg('Η κόλλα καθαρίστηκε! Το «Πίσω» τη φέρνει πίσω.')}
$('bc').onclick=clearAll;
function upd(){$('bu').disabled=!undoS.length;$('br').disabled=!redoS.length}
function undo(){if(!undoS.length)return;redoS.push(ctx.getImageData(0,0,W,H));ctx.putImageData(undoS.pop(),0,0);blip(400,.1);upd()}
function redo(){if(!redoS.length)return;undoS.push(ctx.getImageData(0,0,W,H));ctx.putImageData(redoS.pop(),0,0);blip(500,.1);upd()}
$('bu').onclick=undo;$('br').onclick=redo;
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'&&e.target.type=='text')return;if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&(e.key=='y'||(e.shiftKey&&e.key=='Z'))){e.preventDefault();redo()}});
$('bs').onclick=async()=>{const blob=await new Promise(r=>cv.toBlob(r));let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:'zografia.png',data:blob});blip(880,.2,'triangle')}catch(e){}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zografia.png';document.body.appendChild(a);a.click();a.remove();blip(880,.2,'triangle')};

/* helpers */
const rnd=(a,b)=>a+Math.random()*(b-a);
function along(a,b,step,fn){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d===0){return}const n=Math.max(1,Math.floor(d/step));for(let i=1;i<=n;i++){const t=i/n;fn(a.x+dx*t,a.y+dy*t)}}
function line(a,b,w,c,al=1,cap='round'){ctx.globalAlpha=al;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap=cap;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}
function starPath(x,y,r,n=5,inner=.45){ctx.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r*inner:r;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}
function heartPath(x,y,w,h){ctx.beginPath();ctx.moveTo(x+w/2,y+h);ctx.bezierCurveTo(x-w*.3,y+h*.45,x+w*.1,y-h*.2,x+w/2,y+h*.3);ctx.bezierCurveTo(x+w*.9,y-h*.2,x+w*1.3,y+h*.45,x+w/2,y+h);ctx.closePath()}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}

/* brushes */
function brushSeg(a,b){const t=sub.brush;
 if(t=='round')line(a,b,size,color);
 else if(t=='pencil')line(a,b,Math.max(2,size/4),color,.9);
 else if(t=='spray'){ctx.fillStyle=color;for(let i=0;i<size*1.2;i++){const r=size*1.6*Math.sqrt(Math.random()),an=rnd(0,6.283);ctx.globalAlpha=.7;ctx.fillRect(b.x+Math.cos(an)*r,b.y+Math.sin(an)*r,1.6,1.6)}ctx.globalAlpha=1}
 else if(t=='crayon'){ctx.fillStyle=color;along(a,b,2,(x,y)=>{for(let i=0;i<size*.7;i++){const r=size/2*Math.sqrt(Math.random()),an=rnd(0,6.283);ctx.globalAlpha=rnd(.35,.85);ctx.fillRect(x+Math.cos(an)*r,y+Math.sin(an)*r,2,2)}});ctx.globalAlpha=1}

function placeGhost(){if(gh.style.display=='none')return;const sr=$('stage').getBoundingClientRect(),cr=cv.getBoundingClientRect();gh.style.left=(cr.left-sr.left)+'px';gh.style.top=(cr.top-sr.top)+'px';gh.style.width=cr.width+'px';gh.style.height=cr.height+'px'}
new ResizeObserver(()=>{fit();placeGhost()}).observe($('stage'));
function dlg(html){const d=document.createElement('div');d.className='dlg2';d.innerHTML='<div>'+html+'</div>';d.onclick=e=>{if(e.target==d)d.remove()};document.body.appendChild(d);return d}
function menu(){const d=dlg(`<div style="font-size:46px">🎯</div><h2 style="margin:0">Διάλεξε αποστολή!</h2><p style="color:var(--mu);margin:4px 0">Ζωγράφισε την εικόνα που σου δίνεται, όσο πιο κοντά μπορείς.</p><div class="mcards"></div><button class="ob" id="fr">🎨 Ελεύθερη ζωγραφική</button>`);
 const g=d.querySelector('.mcards');MIS.forEach((m,i)=>{const b=mk('button','',`<img src="${MIMG[i]}" alt="">${m.e} ${m.t}${mdone[m.id]?'<span class="ck">✅</span>':''}`,()=>{d.remove();startM(i)});g.appendChild(b)});
 d.querySelector('#fr').onclick=()=>{d.remove();exitM()}}
function exitM(){mis=null;mp.style.display='none';gh.style.display='none';$('stage').classList.remove('ms');fit()}
function startM(i){const m=MIS[i];push();drawBG('blank');mis=m;mis.i=i;mis.ok=m.steps.map(()=>false);mcol=innerWidth<=760;gh.src=MIMG[i];gh.style.display='none';draw();blip(660,.15,'triangle',.08)}
function draw(){const m=mis;mp.style.display='block';$('stage').classList.toggle('ms',!mcol);
 if(mcol){mp.innerHTML=`<h3 id="mh"><span>🎯 ${m.t}</span><span>▸</span></h3>`;mp.querySelector('#mh').onclick=()=>{mcol=false;draw()};fit();placeGhost();return}
 mp.innerHTML=`<h3 id="mh"><span>🎯 ${m.t}</span><span>▾</span></h3><img src="${MIMG[m.i]}" alt="Εικόνα αποστολής" title="Πάτησε για μεγέθυνση"><small>🧰 ${m.tip}</small><div id="stp" style="margin-top:6px"></div><div><button class="mb" id="mg">👻 Αχνό ίχνος</button><button class="mb go" id="mf">✅ Τελείωσα!</button><button class="mb" id="mx">✖ Έξοδος</button></div>`;
 mp.querySelector('#mh').onclick=()=>{mcol=true;draw()};
 mp.querySelector('img').onclick=()=>{dlg(`<img src="${MIMG[m.i]}" style="width:100%;border-radius:12px;background:#fff"><p><b>${m.t}</b></p>`)};
 const st=mp.querySelector('#stp');m.steps.forEach((t,k)=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" ${m.ok[k]?'checked':''}> <span>${t}</span>`;l.querySelector('input').onchange=e=>{m.ok[k]=e.target.checked};st.appendChild(l)});
 const g=mp.querySelector('#mg');g.classList.toggle('on',gh.style.display!='none');g.onclick=()=>{gh.style.display=gh.style.display=='none'?'block':'none';g.classList.toggle('on',gh.style.display!='none');placeGhost()};
 mp.querySelector('#mx').onclick=exitM;mp.querySelector('#mf').onclick=finish;fit();placeGhost()}
function fam(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx/255,s=mx?(mx-mn)/mx:0;let h=0;if(mx!=mn){const d=mx-mn;h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
 if(v<.2)return'black';if(s<.12)return v>.9?'white':(v>.25&&v<.8?'gray':null);
 if(s>.3&&v>.2&&((h>=345||h<12)))return s>.5&&v>.4?'red':null;
 if(h>=10&&h<46&&s>.3&&v<.78)return'brown';
 if(h>=12&&h<40&&s>.5&&v>=.78)return'orange';
 if(h>=40&&h<70&&s>.4&&v>=.6)return'yellow';
 if(h>=70&&h<170&&s>.35&&v>.3)return'green';
 if(h>=185&&h<260&&s>.4&&v>.3)return'blue';
 if((h>=310||h<12)&&s>.12&&s<.75&&v>.7)return'pink';
 return null}
function count(){const d=ctx.getImageData(0,0,W,H).data,c={};for(let i=0;i<d.length;i+=4){const f=fam(d[i],d[i+1],d[i+2]);if(f)c[f]=(c[f]||0)+1}return c}

</script><script id="prpaint">$('bp').onclick=()=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,0);prnOut('Η ζωγραφιά μου','<img class="pimg" style="max-height:135mm;object-fit:contain" src="'+c.toDataURL('image/png')+'">',{land:1})};</script><script id="prjs">
const escP=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prBtn(fn,t,cls){const b=document.createElement('button');b.className=cls||'btn g';b.type='button';b.textContent=t||'🖨️ Εκτύπωση';b.onclick=fn;return b}
function prMsg(t){let m=document.getElementById('prn-toast');if(m)m.remove();m=document.createElement('div');m.id='prn-toast';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),6000)}
function prPop(title,inner){const w=window.open('','_blank');if(!w){prMsg('Η εκτύπωση δεν άνοιξε. Δοκίμασε Ctrl+P ή άνοιξε το παιχνίδι σε νέα καρτέλα.');return}
 const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 w.document.write('<!doctype html><html lang="el"><head><meta charset="utf-8"><title>'+escP(title)+'</title><style>'+css+'#prn{display:block!important;max-width:800px;margin:0 auto;padding:12px}</style></head><body class="printing"><div id="prn">'+inner+'</div></body></html>');w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},700)}
function prnOut(title,html,o){o=o||{};
 const old=document.getElementById('prn');if(old)old.remove();
 const p=document.createElement('div');p.id='prn';
 html=String(html).replace(/\sid="([^"]*)"/g,' id="p_$1"').replace(/url\(#([^)]+)\)/g,'url(#p_$1)');
 p.innerHTML='<h1 class="ph">'+escP(title)+'</h1>'+(o.noName?'':'<div class="pn">Όνομα: <i></i> Τάξη: <i></i></div>')+html+'<p class="pf">DigiKidsEdu</p>';
 document.body.appendChild(p);
 let st=document.getElementById('prs');if(!st){st=document.createElement('style');st.id='prs';document.head.appendChild(st)}
 st.textContent='@page{size:A4 '+(o.land?'landscape':'portrait')+';margin:10mm}';
 document.body.classList.add('printing');
 let started=false,ended=false;
 const end=()=>{if(ended)return;ended=true;document.body.classList.remove('printing');const q=document.getElementById('prn');if(q)q.remove();removeEventListener('afterprint',end)};
 addEventListener('beforeprint',()=>{started=true},{once:true});addEventListener('afterprint',end);
 setTimeout(()=>{try{window.print()}catch(e){}
  setTimeout(()=>{if(!started){const inner=p.innerHTML;end();prPop(title,inner)}else if(!ended){addEventListener('pointerdown',end,{once:true,capture:true});setTimeout(end,120000)}},500)},60)}

function prDip(what,name){return '<div class="dip"><div style="font-size:60pt">🎓</div><div class="dt">Δίπλωμα</div><div class="dx">Απονέμεται στον/στην</div><div class="dn">'+(name?escP(name):'&nbsp;'.repeat(24))+'</div><div class="dx">'+escP(what)+'</div></div>'}
