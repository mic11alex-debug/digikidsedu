<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Τέσσερα στη σειρά</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#ef4444;--g2:#facc15}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
#bw{width:min(100%,460px);margin:4px auto;position:relative}#bd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#1d4ed8;padding:8px;border-radius:18px;aspect-ratio:7/6}
#cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);z-index:2}#cols button{background:none;border:0;cursor:pointer}#cols button:hover{background:rgba(255,255,255,.2)}
.c{border-radius:50%;background:#eff6ff;aspect-ratio:1;transition:background .15s}.c.R{background:#ef4444;box-shadow:inset 0 -4px 0 #b91c1c}.c.Y{background:#facc15;box-shadow:inset 0 -4px 0 #ca8a04}.c.w{animation:fl .5s 4}@keyframes fl{50%{transform:scale(1.18);box-shadow:0 0 14px #fff}}</style></head><body>
<header><h1>🔴 Τέσσερα στη σειρά 🟡</h1><p>Ρίξε δίσκους και φτιάξε 4 ίδιους στη σειρά!</p></header>
<main><div class="row"><div class="lab">Με ποιον παίζεις;</div><button class="ch on" data-p="cpu">🤖 Υπολογιστής</button><button class="ch" data-p="two">👫 Δύο παίκτες</button></div>
<div class="row" id="rl"><div class="lab">Δυσκολία</div><button class="ch" data-l="1">😊 Εύκολος</button><button class="ch on" data-l="3">🙂 Μέτριος</button><button class="ch" data-l="5">😎 Δύσκολος</button></div>
<div class="row"><div class="pill"><small id="n1">Εσύ 🔴</small><b id="v1">0</b></div><div class="pill"><small>Ισοπαλίες</small><b id="vd">0</b></div><div class="pill"><small id="n2">Υπολογιστής 🟡</small><b id="v2">0</b></div></div>
<div id="msg"></div><div id="bw"><div id="cols"></div><div id="bd"></div></div>
<div class="row"><button class="btn" id="again">🔄 Νέο παιχνίδι</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const R=6,C=7;let B,turn,over,mode='cpu',lvl=3,sc={R:0,Y:0,D:0},busy=false,first='R';
function four(b){for(let r=0;r<R;r++)for(let c=0;c<C;c++){const p=b[r][c];if(!p)continue;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[[r,c]];for(let k=1;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!==p)break;cells.push([rr,cc])}if(cells.length===4)return{p,cells}}}return null}
const drop=(b,c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r][c]){b[r][c]=p;return r}return -1};
const full=b=>b[0].every(Boolean);
function score(b,me){const op=me==='R'?'Y':'R';let s=0;for(let r=0;r<R;r++)if(b[r][3]===me)s+=3;
 const win=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const L=[];for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C){L.length=0;break}L.push(b[rr][cc])}if(L.length===4){const m=L.filter(x=>x===me).length,o=L.filter(x=>x===op).length;if(!o)s+=[0,1,4,20][m]||0;if(!m)s-=[0,1,4,22][o]||0}}return s}
function nm(b,d,a,be,pl,me){const w=four(b);if(w)return w.p===me?100000+d:-100000-d;if(full(b))return 0;if(!d)return score(b,me);const op=pl==='R'?'Y':'R';const order=[3,2,4,1,5,0,6];let best=pl===me?-1e9:1e9;
 for(const c of order){if(b[0][c])continue;const r=drop(b,c,pl);const v=nm(b,d-1,a,be,op,me);b[r][c]=null;if(pl===me){best=Math.max(best,v);a=Math.max(a,v)}else{best=Math.min(best,v);be=Math.min(be,v)}if(a>=be)break}return best}
function cpuCol(){const me=turn;let bestv=-1e9,mv=[];const cols=[...Array(C).keys()].filter(c=>!B[0][c]);
 if(lvl===1&&Math.random()<.5)return cols[Math.random()*cols.length|0];
 for(const c of cols){const r=drop(B,c,me);const v=nm(B,lvl,-1e9,1e9,me==='R'?'Y':'R',me)+Math.random()*.5;B[r][c]=null;if(v>bestv){bestv=v;mv=[c]}}return mv[0]}
function draw(w){const bd=$('bd');bd.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='c'+(B[r][c]?' '+B[r][c]:'')+(w&&w.cells.some(x=>x[0]===r&&x[1]===c)?' w':'');bd.appendChild(d)}}
function names(){$('n1').textContent=mode==='cpu'?'Εσύ 🔴':'Παίκτης 1 🔴';$('n2').textContent=mode==='cpu'?'Υπολογιστής 🟡':'Παίκτης 2 🟡'}
function say(){if(over)return;$('msg').textContent=mode==='cpu'?(turn==='R'?'Σειρά σου! 🔴':'Σκέφτεται ο υπολογιστής… 🤔'):(turn==='R'?'Σειρά του παίκτη 1 🔴':'Σειρά του παίκτη 2 🟡')}
function newG(){B=Array.from({length:R},()=>Array(C).fill(null));over=false;busy=false;turn='R';$('bd').innerHTML='';draw();say()}
function play(c){if(over||busy||B[0][c])return;if(mode==='cpu'&&turn!=='R')return;move(c)}
function move(c){const r=drop(B,c,turn);beep(turn==='R'?500:400,.1);const w=four(B);draw(w);
 if(w){over=true;sc[w.p]++;$('msg').textContent=mode==='cpu'?(w.p==='R'?'🎉 Μπράβο, κέρδισες!':'😅 Κέρδισε ο υπολογιστής!'):'🎉 Κέρδισε ο παίκτης '+(w.p==='R'?'1 🔴':'2 🟡')+'!';fanfare();upd();return}
 if(full(B)){over=true;sc.D++;$('msg').textContent='🤝 Ισοπαλία!';upd();return}
 turn=turn==='R'?'Y':'R';say();if(mode==='cpu'&&turn==='Y'){busy=true;setTimeout(()=>{busy=false;if(!over)move(cpuCol())},500)}}
function upd(){$('v1').textContent=sc.R;$('v2').textContent=sc.Y;$('vd').textContent=sc.D}
const cl=$('cols');for(let c=0;c<C;c++){const b=document.createElement('button');b.onclick=()=>play(c);cl.appendChild(b)}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{mode=b.dataset.p;sel('data-p',mode);$('rl').style.display=mode==='cpu'?'':'none';sc={R:0,Y:0,D:0};upd();names();newG()});
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lvl=+b.dataset.l;sel('data-l',lvl);sc={R:0,Y:0,D:0};upd();newG()});
$('again').onclick=newG;names();newG();
</script></body></html>
