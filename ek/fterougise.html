<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Φτερούγισε!</title><link href="https://fonts.googleapis.com/css2?family=Anek+Greek:wght@600;800&display=swap" rel="stylesheet"></head><body>
<script src="arc.js"></script>
<script>
const A=ARC,cx=A.cx;let S,bird,cols=[],score=0,state,stT=0,scroll=0,gnd,clouds=[],hills=[],mode;
A.onResize=()=>{S=A.H/640;gnd=A.H-80*S;clouds=[];for(let i=0;i<6;i++)clouds.push({x:Math.random()*A.W,y:A.rnd(.05,.4)*A.H,s:A.rnd(.6,1.3)})};A.onResize();
function start(m){mode=m;bird={x:A.W*.3,y:A.H*.42,vy:0,rot:0,flap:0};cols=[];score=0;state='ready';stT=0;scroll=0}
A.setup({id:'flappy',title:'Φτερούγισε!',emoji:'🐤🏛️☁️',title2:'linear-gradient(180deg,#ffb020,#ff5a3d)',cardBg:'#fff1d6',desc:'Πάτα για να φτερουγίσει το πουλάκι και πέρνα ανάμεσα από τις αρχαίες κολόνες. Ένα πάτημα, χίλιες προσπάθειες!',
 modes:[{label:'🐤 Κανονικό',small:'για αρχάριους',fn:()=>start(0)},{label:'🔥 Δύσκολο',small:'στενά περάσματα',c:'c5',fn:()=>start(1)}],help:'<b>Space</b> ή <b>↑</b> ή κλικ / πάτημα για φτερούγισμα',bestText:()=>`🏆 Κανονικό: ${A.get('best.m0',0)} · Δύσκολο: ${A.get('best.m1',0)}`});
function flap(){if(!A.running)return;if(state=='ready'){state='play'}if(state!='play')return;bird.vy=-330*S;bird.flap=.25;A.tone(700,.07,'sine',.07,1100)}
A.cv.addEventListener('pointerdown',flap);A.onKey=k=>{if(k==' '||k=='ArrowUp'||k=='w')flap()};
function gap(){return (mode?150:185)*S}
function crash(){if(state!='play')return;state='dead';stT=0;A.noise(.25,1500,200,.3);A.tone(160,.3,'square',.1,60);bird.vy=-120*S;
 const [b,nb]=A.best('m'+mode,score);const md=score>=40?'🥇':score>=20?'🥈':score>=10?'🥉':'';A.gameOver({title:'Ωχ! 🐤',score,msg:(nb?'🏆 Νέο ρεκόρ! ':'Ρεκόρ: '+b)+(md?`<br>Μετάλλιο: <span style="font-size:32px">${md}</span>`:''),stars:score>=40?3:score>=20?2:score>=10?1:0,delay:1100});A.post(Math.min(40,score),40)}
function column(x,top,h,flip){const w=70*S;const g=cx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#d8d2c4');g.addColorStop(.35,'#fffaf0');g.addColorStop(.7,'#e8e0cc');g.addColorStop(1,'#b8ad96');cx.fillStyle=g;cx.fillRect(x+6*S,top,w-12*S,h);
 cx.strokeStyle='rgba(120,100,70,.35)';cx.lineWidth=2;for(let i=1;i<5;i++){const fx=x+6*S+i*(w-12*S)/5;cx.beginPath();cx.moveTo(fx,top);cx.lineTo(fx,top+h);cx.stroke()}
 // capital (ionic-ish)
 const cy=flip?top+h:top;const ch=24*S;cx.fillStyle='#f3ecdc';cx.strokeStyle='#8a7a5a';cx.lineWidth=2;const y0=flip?cy:cy-ch;A.rr(cx,x-4*S,y0,w+8*S,ch,6*S);cx.fill();cx.stroke();cx.fillStyle='#e0d6bf';cx.fillRect(x-4*S,flip?cy+ch*.65:cy-ch,w+8*S,ch*.35);
 for(const vx of [x+4*S,x+w-4*S]){cx.beginPath();cx.arc(vx,y0+ch/2,ch*.32,0,7);cx.fillStyle='#fffaf0';cx.fill();cx.stroke();cx.beginPath();cx.arc(vx,y0+ch/2,ch*.14,0,7);cx.stroke()}
 cx.strokeStyle='#8a7a5a';cx.strokeRect(x+6*S,top,w-12*S,h)}
function drawBird(x,y,rot,t,fl){const r=19*S;cx.save();cx.translate(x,y);cx.rotate(rot);
 const g=cx.createRadialGradient(-r*.3,-r*.4,1,0,0,r*1.1);g.addColorStop(0,'#fff8c8');g.addColorStop(.4,'#ffc93c');g.addColorStop(1,'#f08a00');cx.fillStyle=g;cx.beginPath();cx.ellipse(0,0,r*1.1,r,0,0,7);cx.fill();cx.strokeStyle='#7a3d00';cx.lineWidth=2.5;cx.stroke();
 cx.fillStyle='#fff6dc';cx.beginPath();cx.ellipse(r*.15,r*.45,r*.6,r*.38,0,0,7);cx.fill();
 const wa=fl>0?Math.sin(fl*40)*.9:Math.sin(t*8)*.3;cx.save();cx.translate(-r*.3,r*.05);cx.rotate(wa);cx.fillStyle='#ffe08a';cx.beginPath();cx.ellipse(-r*.2,0,r*.55,r*.32,0,0,7);cx.fill();cx.stroke();cx.restore();
 cx.fillStyle='#fff';cx.beginPath();cx.arc(r*.45,-r*.32,r*.36,0,7);cx.fill();cx.stroke();cx.fillStyle='#1a1446';cx.beginPath();cx.arc(r*.58,-r*.3,r*.16,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(r*.53,-r*.37,r*.06,0,7);cx.fill();
 cx.fillStyle='#ff6a3d';cx.beginPath();cx.moveTo(r*.85,-r*.05);cx.quadraticCurveTo(r*1.55,r*.08,r*.85,r*.3);cx.closePath();cx.fill();cx.stroke();
 cx.strokeStyle='#f08a00';cx.lineWidth=3;cx.lineCap='round';cx.beginPath();cx.moveTo(-r*.1,-r*.95);cx.quadraticCurveTo(r*.1,-r*1.4,r*.3,-r*1.1);cx.stroke();
 cx.fillStyle='rgba(255,110,140,.5)';cx.beginPath();cx.ellipse(r*.3,r*.1,r*.15,r*.08,0,0,7);cx.fill();cx.restore()}
A.loop((dt,t)=>{const W=A.W,H=A.H;
 if(A.running||state=='dead'){stT+=dt;
  if(state=='ready'){bird.y=H*.42+Math.sin(t*4)*8*S;scroll+=110*S*dt}
  if(state=='play'){scroll+=(mode?165:145)*S*dt;bird.vy+=1150*S*dt;bird.y+=bird.vy*dt;bird.flap-=dt;bird.rot=A.clamp(bird.vy/(600*S),-.45,1.3);
   const spacing=(mode?220:250)*S;if(!cols.length||cols[cols.length-1].x<W-spacing){const g=gap();const top=A.rnd(H*.12,gnd-g-H*.1);cols.push({x:W+40*S,top,g,passed:false,mv:mode&&Math.random()<.4?A.rnd(.5,1.5):0,ph:Math.random()*6})}
   for(const c of cols){c.x-=(mode?165:145)*S*dt;if(c.mv){c.top+=Math.sin(t*c.mv+c.ph)*30*S*dt}if(!c.passed&&c.x+70*S<bird.x){c.passed=true;score++;A.coin();A.burst(bird.x,bird.y,8,['#ffe14d','#fff'],120,.4,3,0)}
    const r=15*S;if(bird.x+r>c.x&&bird.x-r<c.x+70*S&&(bird.y-r<c.top||bird.y+r>c.top+c.g))crash()}
   cols=cols.filter(c=>c.x>-100*S);if(bird.y>gnd-15*S){bird.y=gnd-15*S;crash()}if(bird.y<-30)bird.y=-30}
  if(state=='dead'){bird.vy+=1150*S*dt;bird.y=Math.min(gnd-15*S,bird.y+bird.vy*dt);bird.rot=Math.min(1.5,bird.rot+dt*5)}}
 A.stepFX(dt);
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5ec8ff');g.addColorStop(.7,'#bfe9ff');g.addColorStop(1,'#fff2d6');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 cx.fillStyle='rgba(255,250,210,.9)';cx.beginPath();cx.arc(W*.8,H*.15,40*S,0,7);cx.fill();
 for(const c of clouds){const x=((c.x-scroll*.15)%(W+200)+W+200)%(W+200)-100;cx.fillStyle='rgba(255,255,255,.9)';const s=c.s*30*S;cx.beginPath();cx.arc(x,c.y,s,0,7);cx.arc(x+s,c.y+s*.2,s*.8,0,7);cx.arc(x-s,c.y+s*.25,s*.7,0,7);cx.fill()}
 // distant sea + island + temple
 cx.fillStyle='#3a9ee8';cx.fillRect(0,gnd-60*S,W,60*S);cx.fillStyle='rgba(255,255,255,.4)';for(let i=0;i<10;i++){const x=((i*137-scroll*.3)%W+W)%W;cx.fillRect(x,gnd-40*S+(i%3)*12*S,20*S,2)}
 for(const [k,col,hh] of [[.25,'#9fd36a',90],[.45,'#6cbf45',60]]){cx.fillStyle=col;cx.beginPath();cx.moveTo(0,gnd);for(let x=0;x<=W;x+=10){const wx=x+scroll*k;cx.lineTo(x,gnd-hh*S*(.5+.5*Math.sin(wx*.006))-20*S*Math.sin(wx*.017))}cx.lineTo(W,gnd);cx.fill()}
 for(const c of cols){column(c.x,-10,c.top+10,true);column(c.x,c.top+c.g,gnd-c.top-c.g,false)}
 // ground
 cx.fillStyle='#e8c98a';cx.fillRect(0,gnd,W,H-gnd);cx.fillStyle='#6cbf45';cx.fillRect(0,gnd,W,12*S);cx.fillStyle='#4fa82e';for(let x=-((scroll)%(28*S));x<W;x+=28*S){cx.beginPath();cx.moveTo(x,gnd+12*S);cx.lineTo(x+14*S,gnd+12*S);cx.lineTo(x+7*S,gnd+20*S);cx.fill()}
 cx.fillStyle='rgba(160,110,40,.3)';for(let x=-((scroll)%(40*S));x<W;x+=40*S)cx.fillRect(x,gnd+35*S,18*S,4*S);
 if(bird)drawBird(bird.x,bird.y,bird.rot,t,bird.flap);
 if(A.running||state=='dead'){cx.font=`800 ${64*S}px 'Anek Greek'`;cx.textAlign='center';cx.lineWidth=8*S;cx.strokeStyle='#1a1446';cx.fillStyle='#fff';cx.strokeText(score,W/2,110*S);cx.fillText(score,W/2,110*S);
  if(state=='ready'){cx.font=`800 ${26*S}px 'Anek Greek'`;cx.lineWidth=5;cx.fillStyle='#ffe14d';const s=A.touch?'Πάτα για να πετάξεις!':'Κλικ ή Space για να πετάξεις!';cx.strokeText(s,W/2,H*.62);cx.fillText(s,W/2,H*.62)}}
 A.drawFX()});
</script></body></html>
