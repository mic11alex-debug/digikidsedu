<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ηλεκτρισμός</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3;--hd1:#0d9488;--hd2:#2563eb}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350;--hl:#4a3f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 15px Fredoka;border-radius:99px;padding:7px 14px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:920px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}h3{margin:10px 0 4px}.lead{color:var(--mu);margin:0 0 14px}
.btn{border:0;cursor:pointer;font:700 19px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}.btn.s{font-size:16px;padding:8px 16px}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.win{text-align:center;padding:14px}.win .big{font-size:76px}
.opt{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:12px;font:600 20px Fredoka;cursor:pointer}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.stars{font-size:34px;letter-spacing:4px}
.hero{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;background:var(--hl);border-radius:20px;padding:12px;margin-bottom:12px}.he{font-size:52px;text-align:center}
.qe{font-size:clamp(20px,4.2vw,26px);font-weight:600;text-align:center;margin:8px 0 12px}.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sit{font-size:clamp(19px,4vw,25px);font-weight:600;text-align:center;padding:12px;background:var(--hl);border-radius:20px;margin:10px 0}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:10px 0}.cd2{border:4px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);cursor:pointer;overflow:hidden;text-align:left;font:600 16px Fredoka;padding:0}.cd2 .em{font-size:56px;text-align:center;padding:12px;background:var(--soft)}.cd2 b{display:block;padding:8px 10px 2px;font-size:18px}.cd2 span{display:none;padding:0 10px 10px;font-weight:400;font-size:15px;line-height:1.35}.cd2.open{border-color:var(--green)}.cd2.open span{display:block}
.pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;padding:10px;background:var(--soft);border-radius:16px;min-height:70px}.chip{border:3px solid var(--bd);border-radius:14px;padding:8px 12px;background:var(--card);color:var(--tx);font:600 16px Fredoka;cursor:pointer}.chip.sel{border-color:var(--amber);background:var(--hl);transform:scale(1.05)}.chip.no{animation:shk .35s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.bin{border:3px dashed var(--bd);border-radius:16px;padding:8px;text-align:center;background:var(--soft);min-height:120px;cursor:pointer}.bin.hot{border-color:var(--amber);background:var(--hl)}.bin b{display:block;font-size:17px}.bin .ic{font-size:36px}.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;font-size:13px}.bin .in span{background:var(--card);border-radius:8px;padding:2px 6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:10px 0}.mt button{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px;font:600 17px Fredoka;cursor:pointer}.mt button.sel{border-color:var(--amber);background:var(--hl)}.mt button.done{background:#bbf7d0;border-color:var(--green);color:#14532d;cursor:default}
.fig{display:block;max-width:100%;height:auto;margin:8px auto;border-radius:14px;border:3px solid var(--bd);background:#fff}.figs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:flex-start}.figs figure{margin:0;text-align:center;font-size:14px;color:var(--mu)}.figs img{max-width:100%;height:auto;border-radius:12px;border:3px solid var(--bd);background:#fff}
.emw{position:relative;max-width:760px;margin:8px auto;border:4px solid var(--bd);border-radius:18px;overflow:hidden;background:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}.emw canvas{display:block;width:100%;height:auto}.emw canvas.ov{position:absolute;left:0;top:0;pointer-events:none}.emw .tag{position:absolute;font:700 clamp(10px,2.2vw,14px) Fredoka;color:#1e293b;background:#fffd;border-radius:8px;padding:1px 6px;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}.legend span{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600}.legend i{display:inline-block;width:18px;height:18px;border-radius:5px;border:2px solid #0004}
.rg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.rg button{font:700 17px Fredoka;border:3px solid #0003;border-radius:14px;padding:10px 14px;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003}
.sel2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.sel2 button{font:700 17px Fredoka;border:3px solid var(--bd);border-radius:14px;padding:8px 14px;background:var(--card);color:var(--tx);cursor:pointer}.sel2 button.on{background:var(--blue);color:#fff;border-color:#1d4ed8}
.hud{display:flex;justify-content:space-between;font-weight:700;margin:6px 0;flex-wrap:wrap;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:16px}.bar .tr{background:var(--soft);border-radius:99px;height:24px;position:relative;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}.bar .v{position:absolute;right:8px;top:0;font-size:14px;line-height:24px;font-weight:700;color:#0f172a}
.cz{line-height:2.5;font-size:20px}.cz select{font:700 18px Fredoka;border:3px solid var(--bd);border-radius:10px;padding:3px 6px;background:var(--card);color:var(--tx);max-width:190px}.cz select.g{background:#bbf7d0;border-color:var(--green);color:#14532d}.cz select.r{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.note{background:var(--hl);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:17px}
.tipbox{display:flex;gap:10px;align-items:center}.tipbox img{height:70px;width:auto}
@media(max-width:560px){.ans,.mt{grid-template-columns:1fr}.hero{grid-template-columns:50px 1fr}.he{font-size:36px}.bar{grid-template-columns:90px 1fr}}
</style></head><body>
<header style="background:linear-gradient(135deg,#facc15,#f97316)"><h1>⚡ Ο ηλεκτρισμός στο σπίτι</h1><p>Φυσικές Επιστήμες Β΄</p></header>
<div id="tabs"></div><main><div class="card" id="v"></div></main>
<script>
const KEY='gb_elec';

const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>[...a].sort(()=>Math.random()-.5);
const pick=(a,n)=>sh(a).slice(0,n);
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const mark=i=>{if(!done[i]){done[i]=1;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}tabs();try{parent.postMessage({sgame:KEY,n:Object.keys(done).length,t:T.length},'*')}catch(e){}}};
let cur=0;
function tabs(){const t=$('tabs');t.innerHTML='';T.forEach((x,i)=>{const b=el('button',(i==cur?'on ':'')+(done[i]?'ok':''),x[0]);b.onclick=()=>go(i);t.appendChild(b)})}
function go(i){cur=i;tabs();const v=$('v');v.innerHTML='';v.appendChild(el('h2','',T[i][1]));T[i][2](v,i);scrollTo(0,0)}
const stars=(n,m)=>'⭐'.repeat(n)+'☆'.repeat(m-n);
const fin=(v,ix,sc,mx,msg)=>{mark(ix);const s=Math.max(1,Math.round(3*sc/mx));const w=el('div','win','<div class="big">'+(s>=3?'🏆':s==2?'🎉':'👍')+'</div><div class="stars">'+stars(s,3)+'</div><p><b>'+(msg||'Μπράβο!')+'</b> '+sc+' / '+mx+'</p>');const b=el('button','btn b','🔄 Ξανά');b.onclick=()=>go(ix);w.appendChild(b);const n=el('button','btn',ix<T.length-1?'Επόμενο ▶':'Αρχή ↺');n.onclick=()=>go(ix<T.length-1?ix+1:0);w.appendChild(n);v.appendChild(w);w.scrollIntoView({behavior:'smooth',block:'center'})};
const fig=(src,cap,cls)=>'<figure><img src="'+src+'" alt="'+(cap||'')+'" class="'+(cls||'')+'">'+(cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>';
/* ερωτήσεις πολλαπλής επιλογής: items=[{q,o:[σωστό,λάθος...],w:'εξήγηση',h:'html πάνω από την ερώτηση'}] */
function quiz(v,ix,items,o){o=o||{};const L=o.shuffle===false?items:sh(items);let i=0,sc=0;const box=el('div');v.appendChild(box);
 const pg=el('div','prog','<i></i>');
 const show=()=>{box.innerHTML='';box.appendChild(pg);pg.firstChild.style.width=(i/L.length*100)+'%';const it=L[i];
  if(it.h)box.appendChild(el('div','',it.h));
  box.appendChild(el('div','qe',(i+1)+'. '+it.q));const g=el('div','ans');box.appendChild(g);let lock=false;
  sh(it.o.map((t,k)=>[t,k])).forEach(([t,k])=>{const b=el('button','opt',t);b.onclick=()=>{if(lock)return;lock=true;if(k===0){b.classList.add('right');sc++}else{b.classList.add('wrong');[...g.children].forEach(x=>{if(x.textContent===it.o[0])x.classList.add('right')})}
   const m=el('p',k===0?'ok-t':'bad-t',(k===0?'✅ Σωστά! ':'❌ Όχι ακριβώς. ')+(it.w||''));box.appendChild(m);const n=el('button','btn',i<L.length-1?'Επόμενη ▶':'Τέλος');n.onclick=()=>{i++;if(i<L.length)show();else{box.innerHTML='';o.done?o.done(sc,L.length):fin(v,ix,sc,L.length)}};box.appendChild(n)};g.appendChild(b)})};
 show()}
/* ταξινόμηση: bins=[{id,t,ic}], items=[{t,b:id}] */
function bins(v,ix,cfg){let sel=null,left=cfg.items.length,err=0;const pool=el('div','pool');const bw=el('div','bins');const msg=el('p','','');
 sh(cfg.items).forEach(it=>{const c=el('button','chip',it.t);c.onclick=()=>{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');c._it=it};c._it=it;pool.appendChild(c)});
 cfg.bins.forEach(b=>{const d=el('div','bin','<div class="ic">'+(b.ic||'')+'</div><b>'+b.t+'</b><div class="in"></div>');d.onclick=()=>{if(!sel)return;const it=sel._it;if(it.b===b.id||(Array.isArray(it.b)&&it.b.includes(b.id))){d.querySelector('.in').appendChild(el('span','',it.t));sel.remove();sel=null;left--;msg.className='ok-t';msg.textContent='✅ Μπράβο!';if(!left)fin(v,ix,Math.max(0,cfg.items.length-err),cfg.items.length)}else{err++;sel.classList.add('no');const s=sel;setTimeout(()=>s.classList.remove('no'),400);msg.className='bad-t';msg.textContent='❌ Δοκίμασε ξανά!'}};bw.appendChild(d)});
 if(cfg.lead)v.appendChild(el('p','lead',cfg.lead));v.append(bw,pool,msg)}
/* συμπλήρωση με λίστα επιλογών: parts=[κείμενο, [σωστό,...επιλογές], κείμενο...] */
function cloze(v,ix,sents){const box=el('div','cz');let n=0,ok=0;const tot=sents.reduce((a,s)=>a+s.filter(p=>Array.isArray(p)).length,0);const msg=el('p','','');
 sents.forEach(s=>{const p=el('p','');s.forEach(x=>{if(Array.isArray(x)){const se=el('select','');se.appendChild(new Option('…',''));sh(x).forEach(o=>se.appendChild(new Option(o,o)));se.onchange=()=>{if(se.value===x[0]){se.className='g';se.disabled=true;ok++;if(ok==tot)fin(v,ix,tot,tot,'Τα συμπλήρωσες όλα!')}else{se.className='r';setTimeout(()=>{se.className='';se.value=''},700)}};p.appendChild(se)}else p.appendChild(document.createTextNode(x))});box.appendChild(p)});v.append(box,msg)}
function cards(v,items){const g=el('div','cg');items.forEach(it=>{const c=el('button','cd2','<div class="em">'+it.e+'</div><b>'+it.t+'</b><span>'+it.d+'</span>');c.onclick=()=>c.classList.toggle('open');g.appendChild(c)});v.appendChild(g)}
function match(v,ix,pairs){const a=sh(pairs.map((p,i)=>[p[0],i])),b=sh(pairs.map((p,i)=>[p[1],i]));let sl=null,n=0;const w=el('div','mt');const L=el('div'),R=el('div');L.style.display=R.style.display='grid';L.style.gap=R.style.gap='10px';
 a.forEach(([t,i])=>{const x=el('button','',t);x.onclick=()=>{if(x.classList.contains('done'))return;[...L.children].forEach(c=>c.classList.remove('sel'));x.classList.add('sel');sl=[x,i]};L.appendChild(x)});
 b.forEach(([t,i])=>{const x=el('button','',t);x.onclick=()=>{if(!sl||x.classList.contains('done'))return;if(sl[1]===i){sl[0].classList.add('done');x.classList.add('done');sl[0].classList.remove('sel');sl=null;n++;if(n==pairs.length)fin(v,ix,pairs.length,pairs.length)}else{x.classList.add('no');setTimeout(()=>x.classList.remove('no'),400)}};R.appendChild(x)});w.append(L,R);v.appendChild(w)}

/* σειρά: items=[σωστή σειρά] */
function order(v,ix,cfg){const L=cfg.items;let n=0,err=0;const pool=el('div','pool'),lst=el('ol','');lst.style.cssText='font-size:19px;font-weight:600;line-height:2';const msg=el('p','','');
 if(cfg.lead)v.appendChild(el('p','lead',cfg.lead));
 sh(L).forEach(t=>{const c=el('button','chip',t);c.onclick=()=>{if(t===L[n]){lst.appendChild(el('li','',t));c.remove();n++;msg.className='ok-t';msg.textContent='✅ Σωστά!';if(n==L.length)fin(v,ix,Math.max(0,L.length-err),L.length)}else{err++;c.classList.add('no');setTimeout(()=>c.classList.remove('no'),400);msg.className='bad-t';msg.textContent='❌ Όχι ακόμα… σκέψου τι έρχεται πρώτο.'}};pool.appendChild(c)});
 v.append(pool,lst,msg)}
/* ρυθμιστικά προσομοίωσης: cfg={lead,sliders:[{id,t,min,max,val,u}],out:(vals)=>{html,score01},goal:(vals)=>bool,msg} */
function simu(v,ix,cfg){if(cfg.lead)v.appendChild(el('p','lead',cfg.lead));const box=el('div');const vals={};let won=false;
 const out=el('div','note');out.style.cssText='font-size:20px;text-align:center';
 cfg.sliders.forEach(s=>{vals[s.id]=s.val;const r=el('div','',s.t+': <b id="sv_'+s.id+'">'+s.val+s.u+'</b>');const i=el('input');i.type='range';i.min=s.min;i.max=s.max;i.value=s.val;i.style.cssText='width:100%;height:32px';i.oninput=()=>{vals[s.id]=+i.value;$('sv_'+s.id).textContent=i.value+s.u;upd()};box.append(r,i)});
 const upd=()=>{out.innerHTML=cfg.out(vals);if(cfg.goal&&!won&&cfg.goal(vals)){won=true;fin(v,ix,3,3,cfg.win||'Τα κατάφερες!')}};
