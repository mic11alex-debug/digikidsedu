<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ταξίδι στον χρόνο</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350;--hl:#4a3f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka;border-radius:99px;padding:8px 16px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}.lead{color:var(--mu);margin:0 0 14px}
.btn{border:0;cursor:pointer;font:700 19px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.win{text-align:center;padding:14px}.win .big{font-size:76px}
.opt{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:12px;font:600 20px Fredoka;cursor:pointer}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.stars{font-size:34px;letter-spacing:4px}
.cert{border:6px double var(--amber);border-radius:20px;padding:18px;text-align:center;background:var(--hl);margin-top:14px}
.cert input{font:700 24px Fredoka;text-align:center;border:0;border-bottom:3px solid var(--amber);background:transparent;color:var(--tx);width:90%;outline:0}
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:var(--hl);border-radius:20px;padding:12px;margin-bottom:12px}.hero img{width:100%;border-radius:14px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:10px 0}
.dc{border:4px solid var(--bd);border-radius:18px;background:var(--card);padding:0;cursor:pointer;overflow:hidden;font:600 17px Fredoka;color:var(--tx);text-align:center}
.dc img{width:100%;height:120px;object-fit:cover;display:block}.dc span{display:block;padding:8px}
.dc.sel{border-color:var(--amber);background:var(--hl);transform:scale(1.03)}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:16px}.bar i{display:block;height:22px;background:linear-gradient(90deg,#8b5cf6,#3b82f6);border-radius:99px;min-width:4px;transition:width .4s}
.mail{border:3px solid var(--bd);border-radius:16px;overflow:hidden;background:#fff;color:#1e293b;margin:10px 0}.mail .r{display:flex;gap:8px;padding:10px 12px;border-bottom:2px solid #e2e8f0;align-items:center}.mail .r b{color:#16a34a;min-width:96px}.mail input[type=text]{flex:1;border:0;font:600 19px Fredoka;color:#1e293b;outline:0;background:transparent;min-width:0}
.mail .bd{min-height:80px;padding:12px;font-size:17px;color:#64748b}.mail .ft{padding:10px 12px;background:#f1f5f9;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hl{outline:4px solid var(--amber);outline-offset:2px;border-radius:10px;animation:pl 1s infinite}@keyframes pl{50%{outline-color:transparent}}
.att{background:#dbeafe;color:#1e3a8a;border-radius:10px;padding:4px 10px;font-weight:700;font-size:15px}
.fold{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.fd{border:3px dashed var(--bd);border-radius:16px;padding:8px;text-align:center;background:var(--soft);min-height:160px;cursor:pointer}.fd.hot{border-color:var(--amber);background:var(--hl)}.fd .ic{font-size:44px}.fd .nm{font-weight:700;font-size:16px}
.fd .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}.fd .in img{width:46px;height:34px;object-fit:cover;border-radius:6px}
.pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0;padding:10px;background:var(--soft);border-radius:16px;min-height:100px}
.pi{border:4px solid var(--bd);border-radius:12px;padding:0;background:#fff;cursor:grab;width:110px;overflow:hidden;font:600 13px Fredoka;color:#1e293b}.pi img{width:100%;height:76px;object-fit:cover;display:block;pointer-events:none}.pi.sel{border-color:var(--amber);transform:scale(1.07)}
.tb{display:flex;gap:6px;flex-wrap:wrap;background:#e2e8f0;padding:8px;border-radius:12px 12px 0 0}.tb button{font:700 18px Fredoka;border:2px solid #94a3b8;background:#fff;color:#1e293b;border-radius:8px;min-width:42px;height:40px;cursor:pointer;padding:0 8px}.tb button.on{background:#bfdbfe;border-color:#2563eb}.tb select,.tb input[type=color]{height:40px;border-radius:8px;border:2px solid #94a3b8;font:600 16px Fredoka}
.pg{background:#fff;color:#111;border:3px solid #cbd5e1;border-radius:0 0 12px 12px;padding:18px 22px;min-height:260px;box-shadow:inset 0 0 0 1px #fff}.pg .tt{text-align:center;font:700 28px Fredoka;outline:0;min-height:1.4em;border-bottom:2px dashed #e2e8f0;margin-bottom:10px}.pg .tx{outline:0;min-height:120px;font-size:18px;line-height:1.5;font-family:Arial,sans-serif}.pg .im{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.pg .im img{height:100px;border-radius:6px;border:2px solid #cbd5e1}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vs>div{border:3px solid var(--bd);border-radius:18px;padding:12px;background:var(--soft)}.vs h3{margin:0 0 6px}
.chk{list-style:none;padding:0}.chk li{padding:8px 10px;border:3px solid var(--bd);border-radius:14px;margin:6px 0;cursor:pointer;background:var(--card)}.chk li.y{background:#bbf7d0;border-color:var(--green);color:#14532d}.chk li.n{background:#fecaca;border-color:var(--red);color:#7f1d1d}
@media(max-width:560px){.hero{grid-template-columns:90px 1fr}.vs{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 30px}}
.ckp{background:linear-gradient(160deg,#1e1b4b,#312e81);color:#fff;border:4px solid #6366f1;border-radius:22px;padding:14px;position:relative}.ckp .scr{background:#0b1220;color:#4ade80;font:700 22px 'Courier New',monospace;border:3px solid #334155;border-radius:12px;padding:10px;text-align:center;margin-bottom:10px}
.chb{height:18px;border-radius:99px;background:#0b1220;overflow:hidden;margin:6px 0}.chb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width .3s}.chz{position:relative;height:120px;background:#0b122066;border-radius:14px;margin:6px 0}.cry{position:absolute;font-size:40px;background:none;border:0;cursor:pointer;animation:cb .6s infinite alternate}@keyframes cb{to{transform:scale(1.25) rotate(8deg)}}
.pass{margin-top:12px;padding:10px;background:var(--hl);border-radius:16px}.stp{display:inline-flex;flex-direction:column;align-items:center;margin:4px 6px;font-size:26px;opacity:.5}.stp.on{opacity:1}.stp small{font-size:12px}
.tun{position:relative;height:420px;border-radius:22px;overflow:hidden;background:repeating-radial-gradient(circle at 50% 50%,#1e1b4b 0 22px,#6d28d9 22px 26px,#0ea5e9 26px 28px);animation:tsh .12s infinite;display:grid;place-items:center;color:#fff}@keyframes tsh{25%{transform:translate(2px,1px)}75%{transform:translate(-2px,-1px)}}
.tun .cnt{font-size:120px;font-weight:700;text-shadow:0 0 20px #000;z-index:2}.tun .yr{position:absolute;bottom:20px;font:700 clamp(20px,5vw,32px) 'Courier New',monospace;background:#000a;padding:8px 16px;border-radius:12px;color:#4ade80;z-index:2}.fc{position:absolute;font-size:34px;animation:fly 1.2s linear infinite}@keyframes fly{from{transform:scale(.2);opacity:0}30%{opacity:1}to{transform:scale(3.5) translate(40px,-60px);opacity:0}}
.scn{position:relative;aspect-ratio:16/10;background-size:cover;background-position:center;border-radius:22px;overflow:hidden;border:4px solid var(--bd)}.sct{position:absolute;left:10px;top:10px;background:#000b;color:#fff;border-radius:12px;padding:6px 12px;font-size:16px;z-index:3}.crt{position:absolute;bottom:6%;font-size:56px;animation:wk 14s linear infinite;z-index:2}@keyframes wk{from{left:-10%}to{left:105%}}
.hsp{position:absolute;font-size:44px;background:none;border:0;cursor:pointer;transform:translate(-50%,-50%);animation:wg 1s infinite alternate;filter:drop-shadow(0 0 8px #fde047);z-index:3}.hsp.got{animation:none;filter:none;opacity:.35}@keyframes wg{from{transform:translate(-50%,-50%) rotate(-10deg) scale(1)}to{transform:translate(-50%,-50%) rotate(10deg) scale(1.2)}}.fnd{font-weight:700;margin:8px 0}
.flash{position:absolute;inset:0;background:#fff;animation:fl .4s forwards;z-index:9}@keyframes fl{to{opacity:0}}.pol{background:#fff;color:#111;padding:10px 10px 6px;border-radius:6px;box-shadow:0 8px 20px #0004;max-width:320px;margin:12px auto;transform:rotate(-3deg);text-align:center}.pol .pimg{height:200px;background-size:cover;background-position:center;display:grid;place-items:end center;font-size:70px}.pol p{margin:6px 0;font-weight:700}
.capw{text-align:center;position:relative}.cap{width:min(100%,360px);display:block;margin:0 auto;filter:drop-shadow(0 10px 14px #0003)}.capn{font-weight:700;font-size:22px;margin-top:4px}.part{cursor:pointer;transition:filter .2s}.part:hover{filter:brightness(1.25) drop-shadow(0 0 6px #fde047)}.fl{transform-box:fill-box;transform-origin:50% 0;animation:fla .25s infinite alternate}@keyframes fla{to{transform:scaleY(1.35)}}.blk{animation:bl 1s infinite alternate}.b2{animation-delay:.3s}.b3{animation-delay:.6s}@keyframes bl{to{opacity:.35}}.cap.shk{animation:csh .1s infinite}@keyframes csh{25%{transform:translate(4px,-3px) rotate(1deg)}75%{transform:translate(-4px,3px) rotate(-1deg)}}
.capcu>div{margin:8px 0}.sw{width:38px;height:38px;border-radius:50%;border:4px solid #1e293b;margin:3px;cursor:pointer}.stk{font-size:28px;background:var(--card);border:3px solid var(--bd);border-radius:12px;margin:3px;cursor:pointer;padding:2px 8px}.capcu input{font:600 19px Fredoka;border:3px solid var(--bd);border-radius:14px;padding:8px;background:var(--card);color:var(--tx)}.fpan .scr{background:#0b1220;color:#4ade80;font:700 30px 'Courier New',monospace;border:3px solid #334155;border-radius:12px;padding:10px;text-align:center;margin:8px 0}
.fpan .zb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.fpan .zb button:not(.btn){font:700 20px Fredoka;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;min-width:60px;height:48px;cursor:pointer}</style></head><body>
