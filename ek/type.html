<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Γράφω γρήγορα</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#0ea5e9;--g2:#6366f1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
#st{position:relative;height:400px;border-radius:18px;overflow:hidden;background:linear-gradient(#bae6fd,#e0f2fe 70%,#86efac 70%);border:4px solid var(--bd);margin:6px 0}#gd{position:absolute;left:0;right:0;bottom:0;height:12%;background:#22c55e}
.fw{position:absolute;background:#fff;border:3px solid #6366f1;border-radius:14px;padding:3px 12px;font:700 22px Fredoka,system-ui;color:#312e81;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.2)}.fw .ok{color:#16a34a}.fw.tg{border-color:#f59e0b;background:#fef9c3}.fw.pop{animation:pp .25s forwards}@keyframes pp{to{transform:scale(1.6);opacity:0}}</style></head><body>
<header><h1>⌨️ Γράφω γρήγορα</h1><p>Γράψε τα γράμματα και τις λέξεις που πέφτουν πριν φτάσουν κάτω!</p></header>
<main><div class="row"><div class="lab">Τι θα γράφεις;</div><button class="ch on" data-m="0">🔤 Γράμματα</button><button class="ch" data-m="1">📝 Εύκολες λέξεις</button><button class="ch" data-m="2">🚀 Δύσκολες λέξεις</button></div>
<div class="row"><div class="pill"><small>Πόντοι</small><b id="sc">0</b></div><div class="pill"><small>Ζωές</small><b id="lv">❤️❤️❤️</b></div><div class="pill"><small>Ρεκόρ</small><b id="bs">0</b></div></div>
<div id="msg">Γράψε τις λέξεις πριν φτάσουν στο έδαφος!</div><div id="st"><div id="gd"></div></div><div class="row"><button class="btn" id="go">▶ Έναρξη</button></div>
<div style="text-align:center;color:var(--mu);font-size:15px">Πάτα τα γράμματα στο πληκτρολόγιο. Δουλεύει με ελληνικό ή αγγλικό πληκτρολόγιο.</div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const LAT={a:'Α',b:'Β',c:'Ψ',d:'Δ',e:'Ε',f:'Φ',g:'Γ',h:'Η',i:'Ι',j:'Ξ',k:'Κ',l:'Λ',m:'Μ',n:'Ν',o:'Ο',p:'Π',r:'Ρ',s:'Σ',t:'Τ',u:'Θ',v:'Ω',w:'Σ',x:'Χ',y:'Υ',z:'Ζ'};const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/ς/g,'Σ');function keyGr(e){let k=e.key;if(k.length!==1)return null;const n=norm(k);if(/^[Α-Ω]$/.test(n))return n;return LAT[k.toLowerCase()]||null}
const EW=["ΜΑΜΑ", "ΜΠΑΜΠΑΣ", "ΓΑΤΑ", "ΣΠΙΤΙ", "ΗΛΙΟΣ", "ΜΗΛΟ", "ΨΑΡΙ", "ΒΡΟΧΗ", "ΠΑΙΔΙ", "ΜΠΑΛΑ", "ΛΟΥΛΟΥΔΙ", "ΣΧΟΛΕΙΟ", "ΠΟΝΤΙΚΙ", "ΟΘΟΝΗ", "ΠΙΑΝΟ", "ΣΚΥΛΟΣ", "ΔΕΝΤΡΟ", "ΘΑΛΑΣΣΑ", "ΒΙΒΛΙΟ", "ΚΟΤΑ", "ΖΕΒΡΑ", "ΤΡΕΝΟ"],HW=["ΥΠΟΛΟΓΙΣΤΗΣ", "ΠΛΗΚΤΡΟΛΟΓΙΟ", "ΕΛΕΦΑΝΤΑΣ", "ΔΙΑΔΙΚΤΥΟ", "ΕΚΤΥΠΩΤΗΣ", "ΠΡΟΓΡΑΜΜΑ", "ΑΕΡΟΠΛΑΝΟ", "ΚΑΡΠΟΥΖΙ", "ΣΟΚΟΛΑΤΑ", "ΧΑΛΛΟΥΜΙ", "ΛΕΥΚΩΣΙΑ", "ΠΟΔΗΛΑΤΟ", "ΑΣΤΕΡΙΑ", "ΚΑΜΗΛΟΠΑΡΔΑΛΗ", "ΜΠΑΝΑΝΑ", "ΦΡΑΟΥΛΑ"];let mode=0,ws=[],buf='',tgt=null,score=0,lives=3,run=false,last=0,spawnT=0,speed=45,best=+(localStorage.tbest||0),cnt=0;$('bs').textContent=best;
const AB='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
function spawn(){const w=mode===0?AB[Math.random()*AB.length|0]:(mode===1?EW:HW)[Math.random()*(mode===1?EW:HW).length|0];const el=document.createElement('div');el.className='fw';el.innerHTML='<span class="ok"></span><span>'+w+'</span>';const st=$('st');st.appendChild(el);const x=Math.random()*(st.clientWidth-el.offsetWidth-10)+5;el.style.left=x+'px';ws.push({w,el,y:-40,x});}
function loop(t){if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(1.1,(mode===0?2.0:3.2)-cnt*.04)}
 const H=$('st').clientHeight*.88;for(const o of ws){o.y+=speed*dt*(1+cnt*.02);o.el.style.top=o.y+'px';if(o.y+o.el.offsetHeight>=H){o.dead=1;lives--;beep(150,.3,'sawtooth');$('lv').textContent='❤️'.repeat(Math.max(0,lives))||'💔';if(o===tgt){tgt=null;buf=''}o.el.remove()}}
 ws=ws.filter(o=>!o.dead);if(lives<=0)return over();requestAnimationFrame(loop)}
function over(){run=false;$('msg').textContent='Τέλος! Πόντοι: '+score;if(score>best){best=score;try{localStorage.tbest=score}catch(e){}$('bs').textContent=score;$('msg').textContent='🏆 Νέο ρεκόρ: '+score+'!'}ws.forEach(o=>o.el.remove());ws=[]}
function press(ch){if(!run)return;if(tgt&&!tgt.dead){if(tgt.w[buf.length]===ch)buf+=ch;else{beep(160,.1,'sawtooth');return}}
 else{const c=ws.filter(o=>o.w[0]===ch).sort((a,b)=>b.y-a.y);if(!c.length){beep(160,.1,'sawtooth');return}tgt=c[0];buf=ch;tgt.el.classList.add('tg')}
 beep(600,.05);tgt.el.firstChild.textContent=buf;tgt.el.lastChild.textContent=tgt.w.slice(buf.length);
 if(buf===tgt.w){score+=tgt.w.length*10;cnt++;$('sc').textContent=score;tgt.el.classList.add('pop');const e=tgt.el;setTimeout(()=>e.remove(),250);tgt.dead=1;tgt=null;buf='';beep(900,.12)}}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const g=keyGr(e);if(g){e.preventDefault();press(g)}});
$('go').onclick=()=>{ws.forEach(o=>o.el.remove());ws=[];buf='';tgt=null;score=0;lives=3;cnt=0;$('sc').textContent=0;$('lv').textContent='❤️❤️❤️';speed=mode===0?38:34;run=true;spawnT=0;$('msg').textContent='Γράψε τις λέξεις!';last=performance.now();requestAnimationFrame(loop)};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;sel('data-m',mode);if(run){run=false;ws.forEach(o=>o.el.remove());ws=[]}$('msg').textContent='Πάτα «Έναρξη»'});
</script></body></html>
