async function newG(){ar=await dims();cols=n+(key==='duo'?1:0);rows=key==='duo'?n+1:Math.round(cols*1.7);if(key!=='duo'){cols=n;rows=Math.round(n*1/ar)}ord=sh([...Array(cols*rows).keys()]);while(ord.every((v,i)=>v===i))ord=sh(ord);selc=null;moves=0;over=false;$('mv').textContent=0;$('msg').textContent='Πάτα δύο κομμάτια για να αλλάξουν θέση';$('pi').src=IM[key];draw()}
