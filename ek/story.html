function avEditor(root,S,opts={}){opts=Object.assign({bg:true,name:()=>'',change:()=>{}},opts);

 const pv=root.querySelector('.avprev'),tb=root.querySelector('.avtabs'),gr=root.querySelector('.avgrid');
 function draw(){pv.className='avprev'+(S.full?' full':'');pv.innerHTML=avSVG(S,{bg:opts.bg,name:opts.name()});opts.change()}
 function grid(){const CS=cats();if(ci>=CS.length)ci=0;const [k,ic,l,t,arr,vb,fo,ft]=CS[ci];gr.innerHTML='';
  arr.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='avo'+(S[k]==i?' on':'');b.title=t=='sel'?(typeof v=='string'&&k!='pet'?v:''):'';
   if(t=='col'){b.innerHTML='<span class="avdot" style="background:'+v+'"></span>';b.classList.add('avc')}
   else if(k=='pet'){b.innerHTML=i?'<span style="font-size:34px">'+v+'</span>':'<span style="font-size:20px">🚫</span>'}
   else{b.innerHTML=avSVG(Object.assign({},S,{[k]:i},ft?{full:1}:{full:0}),{bg:false,vb:vb||undefined});if(ft)b.classList.add('avtall');if(['eyes','mouth','brow','nose','fr'].includes(k))b.innerHTML+='<small>'+v+'</small>'}

 tabs();grid();draw();return{draw:()=>{draw();grid()}}}

  else h+='<div class="tx" data-i="'+i+'" style="left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;font-size:'+o.s+'px;color:'+o.c+'">'+esc(o.txt)+'</div>'});
 return h+'</div>'}
function mountReader(root,st,onClose){
 let i=0;root.className='rd';root.innerHTML='<div class="rw" id="rw"><div id="rp"></div></div><div class="rc"><button id="rpv">⬅️</button><span id="rn"></span><button id="rnx">➡️</button><button id="rs">🔊 Άκουσε</button><button id="rx">✕ Κλείσιμο</button></div>';
 const rw=root.querySelector('#rw'),rp=root.querySelector('#rp');
 const sc=()=>{rp.style.transform='scale('+rw.clientWidth/800+')'};
 function show(){rp.innerHTML=pageHTML(st.pages[i]);sc();root.querySelector('#rn').textContent=(i==0?'Εξώφυλλο':'Σελίδα '+i)+' / '+(st.pages.length-1);root.querySelector('#rpv').disabled=i==0;root.querySelector('#rnx').disabled=i==st.pages.length-1;try{speechSynthesis.cancel()}catch(e){}}
 root.querySelector('#rpv').onclick=()=>{i--;show()};root.querySelector('#rnx').onclick=()=>{i++;show()};
 root.querySelector('#rs').onclick=()=>{try{speechSynthesis.cancel();const t=st.pages[i].items.filter(o=>o.t==='t').sort((a,b)=>a.y-b.y).map(o=>o.txt).join('. ');if(!t.trim())return;const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.9;speechSynthesis.speak(u)}catch(e){}};
 const close=()=>{try{speechSynthesis.cancel()}catch(e){}removeEventListener('resize',sc);removeEventListener('keydown',kd);if(onClose)onClose()};
 root.querySelector('#rx').onclick=close;
 const kd=e=>{if(e.key==='ArrowRight'&&i<st.pages.length-1){i++;show()}if(e.key==='ArrowLeft'&&i>0){i--;show()}if(e.key==='Escape')close()};
 addEventListener('keydown',kd);addEventListener('resize',sc);show()}

 B('⬅️',()=>{[S.pages[cur-1],S.pages[cur]]=[S.pages[cur],S.pages[cur-1]];cur--},'g',cur<2);B('➡️',()=>{[S.pages[cur+1],S.pages[cur]]=[S.pages[cur],S.pages[cur+1]];cur++},'g',cur==0||cur>=S.pages.length-1);

const TIPS=['Εξώφυλλο: γράψε τον τίτλο και το όνομά σου. Άλλαξε τη σκηνή και τον ήρωα!','Αρχή: Ποιος είναι ο ήρωας; Πού βρίσκεται; Ξεκίνα με «Μια φορά κι έναν καιρό…»','Μέση: Τι πρόβλημα συναντά ο ήρωας; Ποιος τον βοηθάει;','Τέλος: Πώς λύνεται το πρόβλημα; Πώς τελειώνει η ιστορία;'];
function tip(){const t=$('tip');if(!tipOn){t.style.display='none';return}t.style.display='block';const n=S.pages.length-1;t.innerHTML='💡 '+(cur==0?TIPS[0]:cur==1?TIPS[1]:cur==n&&n>=2?TIPS[3]:TIPS[2])}

/* αρχείο */
const fname=()=>'paramythi-'+(S.title||'mou').replace(/[^\wα-ωΑ-Ωά-ώ]+/g,'-').slice(0,40)+'.json';
async function saveFile(name,blob){let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:name,data:blob});return true}catch(e){return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
async function saveJSON(){if(await saveFile(fname(),new Blob([JSON.stringify(S)],{type:'application/json'})))say('💾 Το παραμύθι αποθηκεύτηκε! Για να το συνεχίσεις αργότερα πάτησε «Άνοιγμα».')}
async function saveBook(){const css=`body{margin:0;background:#1e1233}`+document.getElementById('rcss').textContent;
 const src=`<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.title)}</title><style>${css}</style></head><body><div id="r"></div><script>const BGS=${JSON.stringify(BGS)};const esc=${esc.toString()};${pageHTML.toString()};${mountReader.toString()};const ST=${JSON.stringify(S).replace(/</g,'\\u003c')};mountReader(document.getElementById('r'),ST,function(){document.getElementById('r').innerHTML='<p style="color:#fff;text-align:center;padding:40px;font:20px sans-serif">Τέλος! Πάτησε ανανέωση για να ξαναδιαβάσεις.</p>'});<\/script></body></html>`;
 if(await saveFile('paramythi-'+(S.title||'mou').replace(/[^\wα-ωΑ-Ωά-ώ]+/g,'-').slice(0,40)+'.html',new Blob([src],{type:'text/html'})))say('🌐 Το παραμύθι έγινε βιβλίο! Άνοιξέ το με διπλό κλικ.')}
function openFile(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.pages)||!o.pages.length)throw 0;o.pages.forEach(p=>{p.items=Array.isArray(p.items)?p.items:[];p.bg=BGS[p.bg]?p.bg:'white'});S=o;cur=0;selI=-1;auto();render();tabs();say('📂 Άνοιξε το παραμύθι «'+S.title+'»!')}catch(e){say('Αυτό το αρχείο δεν είναι παραμύθι από αυτήν την εφαρμογή.',1)}};r.readAsText(f)};i.click()}
function readMode(){const o=$('ov');o.style.display='block';mountReader(o,S,()=>{o.innerHTML='';o.className='';o.style.display='none'})}
function start(first){const d=el('div','dlg','');d.innerHTML=`<div><h2 style="margin:0 0 8px">✨ Νέο παραμύθι</h2><label>Τίτλος του παραμυθιού</label><input id="ti" maxlength="50" placeholder="π.χ. Ο δράκος που φοβόταν τη φωτιά"><label>Το όνομά σου (συγγραφέας)</label><input id="au" maxlength="30" placeholder="π.χ. Μαρία"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" id="go">Ξεκινάω!</button>${first?'<button class="b g" id="op">📂 Άνοιγμα αρχείου</button>':'<button class="b g" id="cl">Άκυρο</button>'}</div></div>`;document.body.appendChild(d);
 d.querySelector('#go').onclick=()=>{S=newStory(d.querySelector('#ti').value.trim(),d.querySelector('#au').value.trim());cur=0;selI=-1;auto();d.remove();render();tabs()};
 if(first){d.querySelector('#op').onclick=()=>{d.remove();if(!S)S=newStory();render();tabs();openFile()}}else d.querySelector('#cl').onclick=()=>d.remove()}
const bgImg=id=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900" preserveAspectRatio="none">'+(BGS[id]||BGS.white)+'</svg>')});
async function pageCanvas(pg){const c=document.createElement('canvas');c.width=1600;c.height=900;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,1600,900);
 const im=await bgImg(pg.bg);if(im)g.drawImage(im,0,0,1600,900);
 g.textBaseline='middle';g.textAlign='center';
 for(const o of pg.items){if(o.t==='p'){g.save();g.translate(o.x*2,o.y*2);g.rotate(o.r*Math.PI/180);g.scale(o.f?-1:1,1);g.font=(o.s*2)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';if(o.img){const im=await loadImg(o.img);if(im){const hh=o.s*2;g.drawImage(im,-hh*(o.ar||.833)/2,-hh/2,hh*(o.ar||.833),hh)}}else g.fillText(o.e,0,0);g.restore()}
  else{const fs=o.s*2,w=o.w*2;g.font='bold '+fs+'px "Comic Sans MS","Trebuchet MS",Arial,sans-serif';const words=String(o.txt).split(/\s+/);const lines=[];
   String(o.txt).split('\n').forEach(par=>{let ln='';par.split(/\s+/).forEach(wd=>{const t=ln?ln+' '+wd:wd;if(g.measureText(t).width>w&&ln){lines.push(ln);ln=wd}else ln=t});lines.push(ln)});
   const lh=fs*1.25;g.textAlign='left';g.fillStyle='rgba(255,255,255,.0)';
   lines.forEach((l,i)=>{g.fillStyle=o.c;g.fillText(l,o.x*2,o.y*2+i*lh+lh/2)});g.textAlign='center'}}
 return c}
function b64bytes(u){const s=atob(u.split(',')[1]);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function makePDF(jpgs){const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
 const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
 const obj=(n,body)=>{offs[n]=len;add(n+' 0 obj\n');add(body);add('\nendobj\n')};
 add('%PDF-1.4\n');const N=jpgs.length;
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');
 obj(2,'<</Type/Pages/Count '+N+'/Kids['+jpgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>');
 jpgs.forEach((j,i)=>{const p=3+i*3,c=p+1,m=p+2;
  obj(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 800 450]/Resources<</XObject<</Im0 '+m+' 0 R>>>>/Contents '+c+' 0 R>>');
  const cs='q 800 0 0 450 0 0 cm /Im0 Do Q';obj(c,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
  offs[m]=len;add(m+' 0 obj\n<</Type/XObject/Subtype/Image/Width 1600/Height 900/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.length+'>>\nstream\n');add(j);add('\nendstream\nendobj\n')});
 const total=3+N*3;const xr=len;add('xref\n0 '+total+'\n0000000000 65535 f \n');
 for(let n=1;n<total;n++)add(String(offs[n]).padStart(10,'0')+' 00000 n \n');
 add('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
 const out=new Uint8Array(len);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return new Blob([out],{type:'application/pdf'})}
async function savePDF(){say('📄 Φτιάχνω το PDF… περίμενε λίγο');try{const js=[];for(const pg of S.pages){const c=await pageCanvas(pg);js.push(b64bytes(c.toDataURL('image/jpeg',.92)))}
 const blob=makePDF(js);window._lastPDF=blob;if(await saveFile((S.title||'paramythi').replace(/[\\/:*?"<>|]+/g,'').trim()+'.pdf',blob))say('📄 Το PDF είναι έτοιμο!')}catch(e){say('Κάτι πήγε στραβά με το PDF 😕',1)}}

const tbar=$('top');[['🆕 Νέο',()=>{if(confirm('Να ξεκινήσω νέο παραμύθι; Αν δεν το έχεις αποθηκεύσει, θα χαθεί.'))start(0)},'g'],['📂 Άνοιγμα',openFile,'g'],['💾 Αποθήκευση',saveJSON,'v'],['📖 Διαβάζω',readMode,'o'],['🖨️ Εκτύπωση',()=>prnOut(S.title||'Το παραμύθι μου',S.pages.map(pg=>'<div class="prpg"><div>'+pageHTML(pg)+'</div></div>').join('')),'o'],['📄 Αποθήκευση PDF',savePDF,'b'],['🌐 Βιβλίο (HTML)',saveBook,'b'],['💡 Βοήθεια',()=>{tipOn=!tipOn;tip()},'g']].forEach(([t,f,c])=>{const b=el('button','b '+c,t);b.onclick=f;tbar.appendChild(b)});
addEventListener('resize',fit);
addEventListener('keydown',e=>{if(!S||selI<0)return;if(e.target.isContentEditable||e.target.tagName==='INPUT')return;const o=S.pages[cur].items[selI];if(!o)return;if(e.key==='Delete'||e.key==='Backspace'){S.pages[cur].items.splice(selI,1);selI=-1;auto();render()}else if(e.key.startsWith('Arrow')){e.preventDefault();const d=e.shiftKey?20:5;if(e.key==='ArrowLeft')o.x-=d;if(e.key==='ArrowRight')o.x+=d;if(e.key==='ArrowUp')o.y-=d;if(e.key==='ArrowDown')o.y+=d;auto();render()}});
try{const a=JSON.parse(localStorage.getItem('story_auto')||'null');if(a&&a.pages&&a.pages.length){S=a;render();tabs()}else start(1)}catch(e){start(1)}

</script><script id="prjs">
const escP=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prBtn(fn,t,cls){const b=document.createElement('button');b.className=cls||'btn g';b.type='button';b.textContent=t||'🖨️ Εκτύπωση';b.onclick=fn;return b}
function prMsg(t){let m=document.getElementById('prn-toast');if(m)m.remove();m=document.createElement('div');m.id='prn-toast';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),6000)}
function prPop(title,inner){const w=window.open('','_blank');if(!w){prMsg('Η εκτύπωση δεν άνοιξε. Δοκίμασε Ctrl+P ή άνοιξε το παιχνίδι σε νέα καρτέλα.');return}
 const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 w.document.write('<!doctype html><html lang="el"><head><meta charset="utf-8"><title>'+escP(title)+'</title><style>'+css+'#prn{display:block!important;max-width:800px;margin:0 auto;padding:12px}</style></head><body class="printing"><div id="prn">'+inner+'</div></body></html>');w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},700)}
function prnOut(title,html,o){o=o||{};
 const old=document.getElementById('prn');if(old)old.remove();
 const p=document.createElement('div');p.id='prn';
 html=String(html).replace(/\sid="([^"]*)"/g,' id="p_$1"').replace(/url\(#([^)]+)\)/g,'url(#p_$1)');
 p.innerHTML='<h1 class="ph">'+escP(title)+'</h1>'+(o.noName?'':'<div class="pn">Όνομα: <i></i> Τάξη: <i></i></div>')+html+'<p class="pf">DigiKidsEdu</p>';
 document.body.appendChild(p);
 let st=document.getElementById('prs');if(!st){st=document.createElement('style');st.id='prs';document.head.appendChild(st)}
 st.textContent='@page{size:A4 '+(o.land?'landscape':'portrait')+';margin:10mm}';
 document.body.classList.add('printing');
 let started=false,ended=false;
 const end=()=>{if(ended)return;ended=true;document.body.classList.remove('printing');const q=document.getElementById('prn');if(q)q.remove();removeEventListener('afterprint',end)};
 addEventListener('beforeprint',()=>{started=true},{once:true});addEventListener('afterprint',end);
 setTimeout(()=>{try{window.print()}catch(e){}
  setTimeout(()=>{if(!started){const inner=p.innerHTML;end();prPop(title,inner)}else if(!ended){addEventListener('pointerdown',end,{once:true,capture:true});setTimeout(end,120000)}},500)},60)}

function prDip(what,name){return '<div class="dip"><div style="font-size:60pt">🎓</div><div class="dt">Δίπλωμα</div><div class="dx">Απονέμεται στον/στην</div><div class="dn">'+(name?escP(name):'&nbsp;'.repeat(24))+'</div><div class="dx">'+escP(what)+'</div></div>'}
