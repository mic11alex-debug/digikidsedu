<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Αναγραμματισμός</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#8b5cf6;--g2:#ec4899}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
.t{width:clamp(38px,11vw,54px);height:clamp(46px,13vw,62px);border-radius:12px;border:3px solid #4f46e5;background:#e0e7ff;color:#312e81;font:700 clamp(22px,6vw,30px) Fredoka,system-ui;cursor:pointer;box-shadow:0 4px 0 #4f46e5}.t.u{opacity:.25;pointer-events:none}
.a{width:clamp(38px,11vw,54px);height:clamp(46px,13vw,62px);border-radius:12px;border:3px dashed var(--mu);display:flex;align-items:center;justify-content:center;font:700 clamp(22px,6vw,30px) Fredoka,system-ui;cursor:pointer;background:var(--card)}.a.ok{border:3px solid #22c55e;background:#dcfce7;color:#166534}.a.no{border-color:#ef4444;background:#fee2e2}</style></head><body>
<header><h1>🔀 Αναγραμματισμός</h1><p>Βάλε τα γράμματα στη σωστή σειρά και βρες τη λέξη!</p></header>
<main><div class="row"><div class="lab">Επίπεδο</div><button class="ch on" data-l="0">😊 Μικρές λέξεις</button><button class="ch" data-l="1">🙂 Μέτριες</button><button class="ch" data-l="2">😎 Μεγάλες</button></div>
<div class="row"><div class="pill"><small>Σωστές</small><b id="sc">0</b></div></div><div id="em" style="text-align:center;font-size:72px">❓</div><div id="msg">Φτιάξε τη λέξη από τα γράμματα!</div><div id="ans" class="row"></div><div id="tl" class="row"></div>
<div class="row"><button class="btn g" id="hint">💡 Βοήθεια</button><button class="btn g" id="clr">↩ Ξανά</button><button class="btn" id="nx">➡ Άλλη λέξη</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const WD=[["ΣΚΥΛΟΣ", "🐶"], ["ΓΑΤΑ", "🐱"], ["ΑΛΟΓΟ", "🐴"], ["ΚΟΤΑ", "🐔"], ["ΨΑΡΙ", "🐟"], ["ΠΟΝΤΙΚΙ", "🐭"], ["ΛΙΟΝΤΑΡΙ", "🦁"], ["ΕΛΕΦΑΝΤΑΣ", "🐘"], ["ΜΗΛΟ", "🍎"], ["ΜΠΑΝΑΝΑ", "🍌"], ["ΦΡΑΟΥΛΑ", "🍓"], ["ΠΟΡΤΟΚΑΛΙ", "🍊"], ["ΚΑΡΠΟΥΖΙ", "🍉"], ["ΗΛΙΟΣ", "☀️"], ["ΒΡΟΧΗ", "🌧️"], ["ΧΙΟΝΙ", "❄️"], ["ΑΣΤΡΑ", "⭐"], ["ΣΠΙΤΙ", "🏠"], ["ΑΥΤΟΚΙΝΗΤΟ", "🚗"], ["ΤΡΕΝΟ", "🚂"], ["ΑΕΡΟΠΛΑΝΟ", "✈️"], ["ΠΟΔΗΛΑΤΟ", "🚲"], ["ΒΙΒΛΙΟ", "📚"], ["ΜΟΛΥΒΙ", "✏️"], ["ΜΠΑΛΑ", "⚽"], ["ΠΙΑΝΟ", "🎹"], ["ΚΙΘΑΡΑ", "🎸"], ["ΟΘΟΝΗ", "🖥️"], ["ΠΛΗΚΤΡΟΛΟΓΙΟ", "⌨️"], ["ΥΠΟΛΟΓΙΣΤΗΣ", "💻"], ["ΤΗΛΕΦΩΝΟ", "📱"], ["ΡΟΜΠΟΤ", "🤖"], ["ΛΟΥΛΟΥΔΙ", "🌸"], ["ΔΕΝΤΡΟ", "🌳"], ["ΘΑΛΑΣΣΑ", "🌊"], ["ΦΕΓΓΑΡΙ", "🌙"], ["ΠΑΓΩΤΟ", "🍦"], ["ΠΙΤΣΑ", "🍕"], ["ΨΩΜΙ", "🍞"], ["ΓΑΛΑ", "🥛"]];let lv=0,w,tiles,ans,score=0,pool=[];
const okLen=l=>lv===0?l<=5:lv===1?(l>5&&l<=8):l>8;
let cur;function next(){if(!pool.length)pool=sh(WD.filter(x=>okLen(x[0].length)));cur=pool.pop();w=cur[0];let t;do t=sh([...w]);while(t.join('')===w&&w.length>1);tiles=t.map((ch,i)=>({ch,u:false,i}));ans=[];$('em').textContent=cur[1];$('msg').textContent='Φτιάξε τη λέξη από τα γράμματα!';draw()}
function draw(){const A=$('ans');A.innerHTML='';for(let i=0;i<w.length;i++){const d=document.createElement('div');d.className='a';if(ans[i]!==undefined){d.textContent=tiles[ans[i]].ch;d.onclick=()=>{ans.splice(i);draw()}}A.appendChild(d)}
 const T=$('tl');T.innerHTML='';tiles.forEach((t,i)=>{const b=document.createElement('button');b.className='t'+(ans.includes(i)?' u':'');b.textContent=t.ch;b.onclick=()=>add(i);T.appendChild(b)})}
function add(i){if(ans.length>=w.length)return;ans.push(i);beep(500,.05);draw();if(ans.length===w.length){const s=ans.map(k=>tiles[k].ch).join('');const els=$('ans').children;if(s===w){score++;$('sc').textContent=score;[...els].forEach(e=>e.classList.add('ok'));$('msg').textContent='🎉 Μπράβο! '+w;fanfare();setTimeout(next,1600)}else{[...els].forEach(e=>e.classList.add('no'));beep(160,.2,'sawtooth');$('msg').textContent='Σχεδόν! Δοκίμασε ξανά.';setTimeout(()=>{ans=[];draw()},900)}}}
$('hint').onclick=()=>{if(ans.length>=w.length)return;ans=ans.filter((k,i)=>tiles[k].ch===w[i]);const need=w[ans.length];const k=tiles.findIndex((t,i)=>t.ch===need&&!ans.includes(i));if(k>=0)add(k)};
$('clr').onclick=()=>{ans=[];draw()};$('nx').onclick=next;document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lv=+b.dataset.l;sel('data-l',lv);pool=[];next()});next();
</script></body></html>
