<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Κόψε το σκοινί</title><link href="https://fonts.googleapis.com/css2?family=Anek+Greek:wght@600;800&display=swap" rel="stylesheet"></head><body>
<script src="arc.js"></script>
<script>
const A=ARC,cx=A.cx;const VW=400,VH=640;let K,OX,OY,L,candy,ropes,stars,bear,bubbles,spikes,pins,got,state,stT,blade=[],LV=0,prog;
A.onResize=()=>{K=Math.min(A.W/VW,(A.H-10)/VH);OX=(A.W-VW*K)/2;OY=(A.H-VH*K)/2};A.onResize();
prog=A.get('prog',[]);
const LEVELS=[
 {hint:'Σύρε το δάχτυλο πάνω στο σκοινί για να το κόψεις!',candy:[200,230],ropes:[[200,60]],stars:[[200,330],[200,410],[200,490]],bear:[200,575]},
 {hint:'Κόψε τα σκοινιά με τη σωστή σειρά!',candy:[200,250],ropes:[[60,80],[340,80]],stars:[[265,290],[335,302],[305,450]],bear:[300,575]},
 {hint:'Κούνησε την καραμέλα σαν κούνια!',candy:[120,300],ropes:[[200,80]],stars:[[200,312],[270,300],[315,450]],bear:[320,575]},
 {hint:'Η φούσκα σηκώνει την καραμέλα. Πάτα τη φούσκα για να σκάσει!',candy:[200,520],ropes:[[200,420]],bubbles:[[200,520]],stars:[[200,380],[200,260],[200,150]],bear:[200,70]},
 {hint:'Πρόσεχε τα αγκάθια!',candy:[100,200],ropes:[[60,60],[200,60]],spikes:[[60,420,180]],stars:[[200,232],[285,205],[320,440]],bear:[320,575]},
 {hint:'Τα μπλε καρφάκια δένουν μόνα τους νέο σκοινί!',candy:[200,120],ropes:[[80,50]],pins:[[260,250,140]],stars:[[150,180],[260,340],[260,460]],bear:[260,575]},
 {hint:'Τρία σκοινιά… ποιο πρώτο;',candy:[200,300],ropes:[[60,120],[340,120],[200,40]],spikes:[[120,470,160]],stars:[[150,330],[75,348],[60,460]],bear:[60,575]},
 {hint:'Φούσκα και καρφάκια μαζί!',candy:[90,520],ropes:[[90,440]],bubbles:[[90,520]],pins:[[200,150,150]],spikes:[[150,620,250]],stars:[[90,330],[200,300],[320,420]],bear:[320,575]}];
function mkRope(ax,ay,c){const n=Math.max(4,Math.round(Math.hypot(c.x-ax,c.y-ay)/14));const pts=[];for(let i=0;i<=n;i++){const k=i/n;pts.push({x:ax+(c.x-ax)*k,y:ay+(c.y-ay)*k,px:ax+(c.x-ax)*k,py:ay+(c.y-ay)*k})}return {ax,ay,pts,seg:Math.hypot(c.x-ax,c.y-ay)/n*1.02,cut:-1}}
function load(i){LV=i;L=LEVELS[i];candy={x:L.candy[0],y:L.candy[1],px:L.candy[0],py:L.candy[1],r:15,bub:null,dead:false,eaten:0};ropes=L.ropes.map(([x,y])=>mkRope(x,y,candy));stars=L.stars.map(([x,y])=>({x,y,got:0}));bear={x:L.bear[0],y:L.bear[1],open:0,happy:0,sad:0};bubbles=(L.bubbles||[]).map(([x,y])=>({x,y,on:true}));if(bubbles.length){candy.bub=bubbles[0]}spikes=(L.spikes||[]).map(([x,y,w])=>({x,y,w}));pins=(L.pins||[]).map(([x,y,r])=>({x,y,r,used:false}));got=0;state='play';stT=0;A.tip(L.hint,3500)}
A.setup({id:'rope',title:'Κόψε το σκοινί',emoji:'✂️🍬🐻',title2:'linear-gradient(180deg,#ff9a2e,#d6247a)',cardBg:'#fff0e0',desc:'Το αρκουδάκι Μελένιο πεινάει! Κόψε τα σκοινιά τη σωστή στιγμή για να πέσει η καραμέλα στο στόμα του. Μάζεψε και τα 3 αστεράκια!',
 modes:LEVELS.map((l,i)=>({label:(i+1)+'',small:'',fn:()=>load(i)})),help:'✂️ σύρε το ποντίκι ή το δάχτυλο πάνω από ένα σκοινί για να το κόψεις · πάτα τις φούσκες για να σκάσουν',
 bestText:()=>'⭐ '+prog.reduce((a,b)=>a+(b||0),0)+' / '+LEVELS.length*3,onMenu:()=>{A.menuEl.querySelectorAll('[data-i]').forEach((b,i)=>{const lock=i>0&&!prog[i-1];b.disabled=lock;b.style.opacity=lock?.45:1;b.innerHTML=(lock?'🔒':i+1)+`<small>${prog[i]?'⭐'.repeat(prog[i]):'·'}</small>`});const g=A.menuEl.querySelector('.agrid');g.style.gridTemplateColumns='repeat(4,1fr)'}});
const toV=e=>({x:(e.clientX-OX)/K,y:(e.clientY-OY)/K});let down=false;
A.cv.addEventListener('pointerdown',e=>{if(!A.running)return;down=true;const p=toV(e);blade=[{...p,t:performance.now()}];for(const b of bubbles)if(b.on&&candy.bub===b&&Math.hypot(p.x-candy.x,p.y-candy.y)<34){b.on=false;candy.bub=null;A.tone(900,.1,'sine',.08,300);A.burst(OX+candy.x*K,OY+candy.y*K,14,['#bfe9ff','#fff'],160,.5,3,0)}});
A.cv.addEventListener('pointermove',e=>{if(!down||!A.running)return;const p=toV(e);const a=blade[blade.length-1];blade.push({...p,t:performance.now()});if(a)cutCheck(a,p)});addEventListener('pointerup',()=>down=false);
function segX(a,b,c,d){const r=(b.x-a.x)*(d.y-c.y)-(b.y-a.y)*(d.x-c.x);if(Math.abs(r)<1e-6)return false;const u=((c.x-a.x)*(d.y-c.y)-(c.y-a.y)*(d.x-c.x))/r,v=((c.x-a.x)*(b.y-a.y)-(c.y-a.y)*(b.x-a.x))/r;return u>=0&&u<=1&&v>=0&&v<=1}
function cutCheck(a,b){for(const r of ropes){if(r.cut>=0)continue;for(let i=0;i<r.pts.length-1;i++)if(segX(a,b,r.pts[i],r.pts[i+1])){r.cut=i;r.fade=1;A.noise(.12,4000,1000,.15);A.tone(1400,.05,'triangle',.05);break}}}
function update(dt){if(!A.running)return;stT+=dt;const g=900,steps=3;const h=dt/steps;
 for(let s=0;s<steps;s++){
  // candy
  if(!candy.eaten){let vx=(candy.x-candy.px)*.995,vy=(candy.y-candy.py)*.995;candy.px=candy.x;candy.py=candy.y;if(candy.bub){vy=vy*.9-300*h*h;vx*=.9}else vy+=g*h*h;candy.x+=vx;candy.y+=vy}
  for(const r of ropes){const pts=r.pts;for(let i=1;i<pts.length;i++){const p=pts[i];const vx=(p.x-p.px)*.99,vy=(p.y-p.py)*.99;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+g*h*h}
   for(let it=0;it<12;it++){pts[0].x=r.ax;pts[0].y=r.ay;if(r.cut<0){pts[pts.length-1].x=candy.x;pts[pts.length-1].y=candy.y}
    for(let i=0;i<pts.length-1;i++){if(i==r.cut)continue;const a=pts[i],b=pts[i+1];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;const diff=(d-r.seg)/d;const fa=i==0?0:.5,fb=(i+1==pts.length-1&&r.cut<0)?0:(i==0?1:.5);a.x+=dx*diff*fa;a.y+=dy*diff*fa;b.x-=dx*diff*fb;b.y-=dy*diff*fb}
    if(r.cut<0){const last=pts[pts.length-2];const dx=candy.x-last.x,dy=candy.y-last.y,d=Math.hypot(dx,dy)||1;if(d>r.seg){const diff=(d-r.seg)/d;candy.x-=dx*diff*.85;candy.y-=dy*diff*.85;last.x+=dx*diff*.15;last.y+=dy*diff*.15}}}}}
 for(const r of ropes)if(r.cut>=0)r.fade-=dt*.6;ropes=ropes.filter(r=>r.cut<0||r.fade>0);
 for(const p of pins)if(!p.used&&Math.hypot(candy.x-p.x,candy.y-p.y)<p.r){p.used=true;ropes.push(mkRope(p.x,p.y,candy));A.tone(500,.12,'sine',.08,900)}
 for(const b of bubbles)if(b.on&&!candy.bub&&Math.hypot(candy.x-b.x,candy.y-b.y)<30)candy.bub=b;
 for(const st of stars)if(!st.got&&Math.hypot(candy.x-st.x,candy.y-st.y)<28){st.got=1;got++;A.coin();A.burst(OX+st.x*K,OY+st.y*K,16,['#ffe14d','#fff3a0','#fff'],200,.6,3.5,0)}
 const bd=Math.hypot(candy.x-bear.x,candy.y-(bear.y-10));bear.open+=((bd<130&&!candy.eaten?1:0)-bear.open)*Math.min(1,dt*8);
 if(state=='play'&&bd<38){candy.eaten=1;state='win';stT=0;A.tone(300,.15,'sine',.1,150);setTimeout(()=>A.win(),200);bear.happy=1;prog[LV]=Math.max(prog[LV]||0,got);A.set('prog',prog);A.post(prog.filter(Boolean).length,LEVELS.length);
  setTimeout(()=>A.gameOver({title:'Νιαμ νιαμ! 😋',stars:got,msg:got==3?'Τέλεια! Όλα τα αστεράκια!':'Μπορείς να πάρεις και τα '+3+' αστεράκια;',buttons:[...(LV<LEVELS.length-1?[{label:'➡ Επόμενο',fn:()=>{A.startMode(LV+1)}}]:[]),{label:'↻ Ξανά',c:'c3',fn:()=>A.startMode(LV)},{label:'☰ Επίπεδα',c:'c2',fn:()=>A.toMenu()}]}),900)}
 if(state=='play'&&(candy.y>VH+60||candy.y<-80||candy.x<-60||candy.x>VW+60||spikes.some(s=>candy.x>s.x-candy.r&&candy.x<s.x+s.w+candy.r&&Math.abs(candy.y-s.y)<candy.r+6))){state='lose';bear.sad=1;A.lose();if(spikes.some(s=>Math.abs(candy.y-s.y)<30))A.burst(OX+candy.x*K,OY+candy.y*K,20,['#ff4d6d','#ffd23f','#fff'],220,.7,3.5,300);candy.dead=true;
  setTimeout(()=>A.gameOver({title:'Ωχ! Χάθηκε η καραμέλα',msg:'Το Μελένιο είναι ακόμα πεινασμένο. Ξαναδοκίμασε!',buttons:[{label:'↻ Ξανά',fn:()=>A.startMode(LV)},{label:'☰ Επίπεδα',c:'c3',fn:()=>A.toMenu()}]}),700)}}
function drawBear(t){const X=OX+bear.x*K,Y=OY+bear.y*K,s=K*34;cx.save();cx.translate(X,Y);const bob=Math.sin(t*3)*s*.03;cx.translate(0,bob);
 cx.fillStyle='rgba(0,0,0,.2)';cx.beginPath();cx.ellipse(0,s*.95,s*.9,s*.18,0,0,7);cx.fill();
 cx.fillStyle='#a86a3a';cx.strokeStyle='#4a2810';cx.lineWidth=Math.max(2,s*.07);cx.beginPath();cx.ellipse(0,s*.45,s*.75,s*.55,0,0,7);cx.fill();cx.stroke();cx.fillStyle='#f3d2a8';cx.beginPath();cx.ellipse(0,s*.55,s*.45,s*.35,0,0,7);cx.fill();
 for(const sx of [-1,1]){cx.fillStyle='#a86a3a';cx.beginPath();cx.arc(sx*s*.62,-s*.62,s*.26,0,7);cx.fill();cx.stroke();cx.fillStyle='#f3a6a6';cx.beginPath();cx.arc(sx*s*.62,-s*.62,s*.13,0,7);cx.fill()}
 const g=cx.createRadialGradient(-s*.2,-s*.4,2,0,-s*.1,s);g.addColorStop(0,'#d69a62');g.addColorStop(1,'#9a5a2a');cx.fillStyle=g;cx.beginPath();cx.ellipse(0,-s*.12,s*.78,s*.68,0,0,7);cx.fill();cx.stroke();
 cx.fillStyle='#f3d2a8';cx.beginPath();cx.ellipse(0,s*.12,s*.42,s*.3,0,0,7);cx.fill();
 const look=A.clamp((candy.x-bear.x)/200,-1,1)*s*.06,lookY=A.clamp((candy.y-bear.y)/300,-1,1)*s*.06;
 for(const sx of [-1,1]){if(bear.happy){cx.strokeStyle='#1a1446';cx.lineWidth=s*.08;cx.beginPath();cx.arc(sx*s*.3,-s*.25,s*.12,Math.PI+.3,-.3);cx.stroke()}else{cx.fillStyle='#fff';cx.beginPath();cx.ellipse(sx*s*.3,-s*.25,s*.15,s*.18,0,0,7);cx.fill();cx.fillStyle='#1a1446';cx.beginPath();cx.arc(sx*s*.3+look,-s*.23+lookY,s*.09,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(sx*s*.3+look-s*.03,-s*.27+lookY,s*.03,0,7);cx.fill()}
  if(bear.sad){cx.fillStyle='#7fd3ff';cx.beginPath();cx.ellipse(sx*s*.35,-s*.02+((t*40)%20)*K*.3,s*.05,s*.08,0,0,7);cx.fill()}}
 cx.fillStyle='#3a1d0a';cx.beginPath();cx.ellipse(0,s*.0,s*.12,s*.08,0,0,7);cx.fill();
 const mo=bear.open;cx.fillStyle='#6a1030';cx.beginPath();if(bear.happy){cx.arc(0,s*.15,s*.18,0,Math.PI)}else if(bear.sad){cx.arc(0,s*.3,s*.14,Math.PI,0)}else cx.ellipse(0,s*.2,s*(.12+mo*.12),s*(.04+mo*.18),0,0,7);cx.fill();if(mo>.5&&!bear.happy){cx.fillStyle='#ff7a9a';cx.beginPath();cx.ellipse(0,s*(.24+mo*.08),s*.1,s*.06,0,0,7);cx.fill()}
 cx.fillStyle='rgba(255,120,150,.45)';cx.beginPath();cx.ellipse(-s*.5,s*.05,s*.1,s*.06,0,0,7);cx.ellipse(s*.5,s*.05,s*.1,s*.06,0,0,7);cx.fill();cx.restore()}
function drawCandy(t){if(candy.eaten)return;const X=OX+candy.x*K,Y=OY+candy.y*K,r=candy.r*K;cx.save();cx.translate(X,Y);cx.rotate(t*.5);
 for(const sx of [-1,1]){cx.fillStyle='#ff9ad5';cx.beginPath();cx.moveTo(sx*r*.8,0);cx.lineTo(sx*r*1.7,-r*.6);cx.lineTo(sx*r*1.7,r*.6);cx.closePath();cx.fill();cx.strokeStyle='#a3125a';cx.lineWidth=1.5;cx.stroke()}
 const g=cx.createRadialGradient(-r*.3,-r*.3,1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.3,'#ff5fa2');g.addColorStop(1,'#c2186a');cx.fillStyle=g;cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();cx.strokeStyle='#7a0a40';cx.lineWidth=2;cx.stroke();cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=r*.22;cx.beginPath();cx.arc(0,0,r*.55,.3,2.3);cx.stroke();cx.restore();
 if(candy.bub){const br=34*K;const g2=cx.createRadialGradient(X-br*.3,Y-br*.3,2,X,Y,br);g2.addColorStop(0,'rgba(255,255,255,.6)');g2.addColorStop(.7,'rgba(160,220,255,.25)');g2.addColorStop(1,'rgba(120,200,255,.55)');cx.fillStyle=g2;cx.beginPath();cx.arc(X,Y,br*(1+Math.sin(t*5)*.03),0,7);cx.fill();cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=2;cx.stroke()}}
A.loop((dt,t)=>{update(dt);A.stepFX(dt);const W=A.W,H=A.H;
 const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#ffe8c7');bg.addColorStop(1,'#f6c48f');cx.fillStyle=bg;cx.fillRect(0,0,W,H);
 cx.fillStyle='rgba(180,110,50,.08)';for(let y=0;y<H;y+=40)for(let x=(y/40%2)*20;x<W;x+=40){cx.beginPath();cx.arc(x,y,6,0,7);cx.fill()}
 cx.fillStyle='rgba(255,250,240,.6)';A.rr(cx,OX+4,OY+4,VW*K-8,VH*K-8,24*K);cx.fill();cx.strokeStyle='#e0a86a';cx.lineWidth=4;cx.stroke();
 if(!L)return;
 for(const s of spikes){const x0=OX+s.x*K,y=OY+s.y*K,w=s.w*K,n=Math.max(3,Math.round(s.w/16));cx.fillStyle='#8a8fa8';cx.fillRect(x0,y+2*K,w,8*K);cx.fillStyle='#d8dbe8';cx.strokeStyle='#3d4052';cx.lineWidth=1.5;for(let i=0;i<n;i++){const a=x0+i*w/n;cx.beginPath();cx.moveTo(a,y+3*K);cx.lineTo(a+w/n/2,y-12*K);cx.lineTo(a+w/n,y+3*K);cx.fill();cx.stroke()}}
 for(const p of pins){const X=OX+p.x*K,Y=OY+p.y*K;if(!p.used){cx.setLineDash([6,6]);cx.strokeStyle='rgba(76,125,255,.5)';cx.lineWidth=2;cx.beginPath();cx.arc(X,Y,p.r*K,0,7);cx.stroke();cx.setLineDash([])}cx.fillStyle='#4c7dff';cx.beginPath();cx.arc(X,Y,8*K,0,7);cx.fill();cx.strokeStyle='#1a1446';cx.lineWidth=2;cx.stroke()}
 for(const st of stars){if(st.got)continue;const X=OX+st.x*K,Y=OY+st.y*K,r=16*K*(1+Math.sin(t*4+st.x)*.08);const gg=cx.createRadialGradient(X,Y,0,X,Y,r*2);gg.addColorStop(0,'rgba(255,230,120,.6)');gg.addColorStop(1,'rgba(255,200,0,0)');cx.fillStyle=gg;cx.beginPath();cx.arc(X,Y,r*2,0,7);cx.fill();cx.save();cx.translate(X,Y);cx.rotate(Math.sin(t*2+st.y)*.2);cx.beginPath();for(let k=0;k<10;k++){const a=k/10*6.283-Math.PI/2,rr=k%2?r*.45:r;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}cx.closePath();cx.fillStyle='#ffd23f';cx.fill();cx.strokeStyle='#b37400';cx.lineWidth=2;cx.stroke();cx.restore()}
 drawBear(t);
 for(const b of bubbles)if(b.on&&candy.bub!==b){const X=OX+b.x*K,Y=OY+b.y*K,br=30*K;cx.strokeStyle='rgba(120,200,255,.8)';cx.lineWidth=2;cx.fillStyle='rgba(180,230,255,.3)';cx.beginPath();cx.arc(X,Y,br,0,7);cx.fill();cx.stroke()}
 for(const r of ropes){cx.globalAlpha=r.cut>=0?Math.max(0,r.fade):1;const pts=r.pts;const drawPart=(a,b)=>{if(b-a<1)return;cx.beginPath();cx.moveTo(OX+pts[a].x*K,OY+pts[a].y*K);for(let i=a+1;i<=b;i++)cx.lineTo(OX+pts[i].x*K,OY+pts[i].y*K);cx.strokeStyle='#7a4a1e';cx.lineWidth=5*K;cx.lineCap='round';cx.lineJoin='round';cx.stroke();cx.strokeStyle='#d9a066';cx.lineWidth=2.5*K;cx.setLineDash([5*K,5*K]);cx.stroke();cx.setLineDash([])};
  if(r.cut<0){drawPart(0,pts.length-1)}else{drawPart(0,r.cut);drawPart(r.cut+1,pts.length-1)}cx.globalAlpha=1;
  cx.fillStyle='#8a8fa8';cx.beginPath();cx.arc(OX+r.ax*K,OY+r.ay*K,9*K,0,7);cx.fill();cx.strokeStyle='#3d4052';cx.lineWidth=2;cx.stroke();cx.fillStyle='#d8dbe8';cx.beginPath();cx.arc(OX+r.ax*K,OY+r.ay*K,4*K,0,7);cx.fill()}
 drawCandy(t);
 // blade
 const now=performance.now();blade=blade.filter(p=>now-p.t<160);if(blade.length>1){cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=4;cx.lineCap='round';cx.shadowColor='#fff';cx.shadowBlur=8;cx.beginPath();blade.forEach((p,i)=>i?cx.lineTo(OX+p.x*K,OY+p.y*K):cx.moveTo(OX+p.x*K,OY+p.y*K));cx.stroke();cx.shadowBlur=0}
 // hud stars
 if(A.running||state){cx.font=`800 ${22*K+6}px 'Anek Greek'`;cx.textAlign='left';cx.textBaseline='middle';cx.fillStyle='#7a3d00';cx.fillText('Επίπεδο '+(LV+1)+'   '+'★'.repeat(got)+'☆'.repeat(3-got),OX+18*K,OY+26*K)}
 A.drawFX()});
</script></body></html>
