  CAT.filter(c=>cats.has(c[0])).forEach(([k,e,n],j)=>{const r=document.createElement('div');r.className='fl';r.innerHTML='<span>'+e+' '+n+'</span>';const inp=document.createElement('input');inp.autocomplete='off';inp.placeholder=ltr+'…';inp.dataset.t=t;inp.dataset.k=k;inp.oninput=()=>chk(t);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const all=[...d.querySelectorAll('input')];const i=all.indexOf(inp);(all[i+1]||all[0]).focus()}};r.appendChild(inp);d.appendChild(r)});
  T.appendChild(d);d.querySelector('.stop').onclick=()=>doStop(t)}
 left=secs;$('tm').textContent=left;clearInterval(timer);timer=setInterval(tick,1000);const f=T.querySelector('input');f&&f.focus()}
function chk(t){const ins=[...$('teams').children[t].querySelectorAll('input')];$('sp'+t).disabled=!ins.every(i=>norm(i.value)&&norm(i.value)[0]===norm(ltr))}
function tick(){left--;$('tm').textContent=left;if(left<=5)beep(500,.05);if(left<=0)endRound()}
function doStop(t){if(phase!=='play')return;stopper=t;beep(300,.3,'sawtooth');if(mode==='solo')return endRound();phase='grace';left=Math.min(left,8);$('tm').textContent=left;$('msg').textContent='🛑 '+tname(t)+' είπε ΣΤΟΠ! Έχετε λίγα δευτερόλεπτα ακόμα!'}
function endRound(){if(phase==='rev')return;clearInterval(timer);phase='rev';beep(200,.4,'sawtooth');
 document.querySelectorAll('#teams input').forEach(i=>{const t=+i.dataset.t;ans[t][i.dataset.k]={w:i.value.trim(),s:null}});
 CAT.filter(c=>cats.has(c[0])).forEach(([k])=>ans.forEach(a=>{const o=a[k]||(a[k]={w:'',s:null});const n=norm(o.w);o.s=!n||n[0]!==norm(ltr)?'no':(SET[k].has(n)?'ok':'q')}));
 $('teams').innerHTML='';$('tm').textContent='✔';$('msg').textContent='Έλεγχος απαντήσεων: πάτα το σύμβολο για να αλλάξεις (✅ σωστό · ❓ δεν το ξέρω, μετράει · ❌ λάθος)';review()}
const ok=o=>o.s==='ok'||o.s==='q';
function pts(){const P=Array(TN()).fill(0);const det=[];CAT.filter(c=>cats.has(c[0])).forEach(([k])=>{const cnt={};ans.forEach(a=>{if(ok(a[k])){const n=norm(a[k].w);cnt[n]=(cnt[n]||0)+1}});ans.forEach((a,t)=>{const o=a[k];o.p=ok(o)?(cnt[norm(o.w)]>1?5:10):0;P[t]+=o.p})});
 if(stopper>=0){const a=ans[stopper];if(Object.values(a).every(ok)){P[stopper]+=5;ans[stopper]._b=5}else ans[stopper]._b=0}return P}
function review(){const P=pts();const R=$('rev');R.innerHTML='';ans.forEach((a,t)=>{const d=document.createElement('div');d.className='team';d.style.setProperty('--c',mode==='solo'?'#6366f1':COL[t]);d.innerHTML='<h3><span>'+tname(t)+'</span><span>+'+P[t]+' (σύνολο '+(tot[t]+P[t])+')</span></h3>';
  CAT.filter(c=>cats.has(c[0])).forEach(([k,e,n])=>{const o=a[k];const r=document.createElement('div');r.className='rv';r.innerHTML='<em>'+e+' '+n+'</em><b>'+(o.w||'—')+'</b>';const b=document.createElement('button');b.className='st '+o.s;b.textContent=o.s==='ok'?'✅':o.s==='q'?'❓':'❌';b.onclick=()=>{o.s=o.s==='q'?'no':(o.s==='no'?'ok':'no');beep(500,.05);review()};r.appendChild(b);const u=document.createElement('u');u.textContent='+'+o.p;r.appendChild(u);d.appendChild(r);
   if(!ok(o)){const ex=sh(D[k].filter(w=>norm(w)[0]===norm(ltr))).slice(0,3);if(ex.length){const p=document.createElement('div');p.className='ex';p.textContent='Θα μπορούσε να είναι: '+ex.join(', ');d.appendChild(p)}}});
  if(t===stopper&&a._b){const p=document.createElement('div');p.className='ex';p.textContent='🛑 Μπόνους +5 για το ΣΤΟΠ με όλες σωστές!';d.appendChild(p)}R.appendChild(d)});
 $('nx').style.display='';$('next').textContent=ri+1>=rounds?'🏁 Τελικό αποτέλεσμα':'➡ Επόμενος γύρος';window._P=P}
$('next').onclick=()=>{window._P.forEach((p,t)=>tot[t]+=p);ri++;if(ri>=rounds)return finish();startRound()};
function finish(){$('game').style.display='none';const f=$('fin');f.style.display='';const order=tot.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);const medals=['🥇','🥈','🥉','4️⃣'];
 f.innerHTML='<div class="card" style="text-align:center"><div style="font-size:56px">🏆</div><h2 style="margin:4px 0">'+(mode==='solo'?'Τελικό σκορ: '+tot[0]+' πόντοι':'Τελικό αποτέλεσμα')+'</h2>'+(mode==='team'?order.map((o,k)=>'<div class="rv" style="font-size:22px"><b>'+medals[k]+' '+tname(o[1])+'</b><u style="width:auto">'+o[0]+'</u></div>').join(''):'')+'<div class="row"><button class="btn" id="again">🔄 Παίξε ξανά</button></div></div>';fanfare();$('again').onclick=()=>{f.style.display='none';$('setup').style.display=''}}

</script></body></html>
