<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Οι 12 θεοί του Ολύμπου</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350;--hl:#4a3f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka;border-radius:99px;padding:8px 16px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}.lead{color:var(--mu);margin:0 0 14px}
.btn{border:0;cursor:pointer;font:700 19px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.win{text-align:center;padding:14px}.win .big{font-size:76px}
.opt{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:12px;font:600 20px Fredoka;cursor:pointer}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.stars{font-size:34px;letter-spacing:4px}
.cert{border:6px double var(--amber);border-radius:20px;padding:18px;text-align:center;background:var(--hl);margin-top:14px}
.cert input{font:700 24px Fredoka;text-align:center;border:0;border-bottom:3px solid var(--amber);background:transparent;color:var(--tx);width:90%;outline:0}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.gc{border:3px solid var(--bd);border-radius:18px;background:var(--card);padding:6px;cursor:pointer;text-align:center;font:600 16px Fredoka;color:var(--tx)}
.gc img{width:100%;aspect-ratio:320/452;object-fit:cover;border-radius:12px;display:block}.gc.seen{border-color:var(--green)}.gc.seen::after{content:"✓";color:var(--green)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.75);display:none;place-items:center;padding:12px;z-index:50}.ov.on{display:grid}
.bx{background:var(--card);border-radius:24px;max-width:700px;width:100%;max-height:92vh;overflow:auto;padding:14px;display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:16px;align-items:start}
.bx img{width:100%;border-radius:16px}.bx h3{margin:0 0 6px;font-size:30px}.sy{font-size:40px;margin:8px 0}.x{float:right;border:0;background:var(--red);color:#fff;border-radius:12px;padding:6px 14px;font:700 16px Fredoka;cursor:pointer}
@media(max-width:560px){.bx{grid-template-columns:1fr}}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}.mt .col{display:grid;gap:10px;align-content:start}
.pic{border:3px solid var(--bd);border-radius:14px;background:var(--card);padding:4px;cursor:pointer}.pic img{height:110px;width:auto;max-width:100%;display:block;margin:auto;border-radius:10px}
.pic.sel{border-color:var(--blue);box-shadow:0 0 0 4px #bfdbfe}.pic.done{border-color:var(--green);opacity:.6;pointer-events:none}
.lb{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;font:600 18px Fredoka;cursor:pointer;min-height:60px}.lb.done{background:#bbf7d0;border-color:var(--green);color:#14532d;pointer-events:none}.lb.wrong{background:#fecaca}
.rg{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:18px;align-items:start}
.board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:0;aspect-ratio:3/5.2;border:4px solid var(--tx);border-radius:14px;overflow:hidden;background:var(--soft)}
.cell{border:1px solid var(--bd);position:relative;overflow:hidden;background:var(--card)}.cell img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cell.tg{outline:5px solid var(--amber);outline-offset:-5px;z-index:1}.cell.start{display:grid;place-items:end center;font-size:13px;font-weight:700;color:var(--mu);padding-bottom:4px}
.robot{position:absolute;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .55s ease,top .55s ease;z-index:5;pointer-events:none}
.robot svg{width:100%;height:100%;transition:transform .45s ease;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}.robot.nt svg{transition:none}.robot.bump{animation:bm .4s}
@keyframes bm{25%{margin-left:-8px}75%{margin-left:8px}}
.clue{background:var(--hl);border-radius:18px;padding:12px;font-size:22px;font-weight:600;margin-bottom:10px}
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.cmd button{border:0;border-radius:14px;padding:12px 6px;font:700 17px Fredoka;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}.cmd button:active{transform:translateY(3px);box-shadow:none}.cmd button:disabled{opacity:.5}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;background:var(--soft);border-radius:14px;padding:8px;margin:8px 0;height:auto}.prog span{background:var(--card);border:3px solid var(--bd);border-radius:10px;padding:2px 8px;font-size:22px;height:auto;width:auto;background-image:none}.prog span.on{border-color:var(--amber);background:var(--hl)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;margin:0;padding:12px 8px}
.qe{font-size:70px;text-align:center}.qq{font-size:clamp(21px,4.5vw,27px);font-weight:600;text-align:center;margin:6px 0 12px}.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:620px){.rg{grid-template-columns:1fr}.board{max-width:320px;margin:auto}.mt{gap:10px 12px}.ans{grid-template-columns:1fr}}
.vidw{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:4px solid var(--bd);background:#000}.vidw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.vidh{margin:0 0 14px}.vidh h3{margin:0 0 8px}
.vidh{margin:0 0 14px}.vidh h3{margin:0 0 8px}
.hero{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;background:var(--hl);border-radius:20px;padding:12px;margin-bottom:12px}.he{font-size:52px;text-align:center}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0}.opt.sel{border-color:var(--amber);background:var(--hl)}
.bar{display:grid;grid-template-columns:170px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:16px}.bar i{display:block;height:22px;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;min-width:4px;transition:width .4s}
@media(max-width:560px){.bar{grid-template-columns:100px 1fr 30px}.hero{grid-template-columns:50px 1fr}.he{font-size:36px}}
.cpk{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.cp{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:600 18px Fredoka;border-radius:14px;padding:6px 12px;cursor:pointer}.cp.on{background:var(--hl);border-color:var(--amber)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--bd);cursor:pointer;padding:0}
</style></head><body>

<div style="text-align:center;margin:8px"><button class="btn" id="cmpb">👥 Τάξη / Αγώνας</button></div><div id="tabs"></div><main><div class="card" id="v"></div></main>

 const bfs=(s,t)=>{const q=[[s.r,s.c,s.d,0]],seen=new Set([s.r+','+s.c+','+s.d]);while(q.length){const [r,c,d,k]=q.shift();if(r==t[0]&&c==t[1])return k;for(const m of ['F','B','L','R']){let nr=r,nc=c,nd=d;if(m=='F'){nr+=DR[d];nc+=DC[d]}else if(m=='B'){nr-=DR[d];nc-=DC[d]}else nd=(d+(m=='R'?1:3))%4;if(!ok(nr,nc))continue;const key=nr+','+nc+','+nd;if(!seen.has(key)){seen.add(key);q.push([nr,nc,nd,k+1])}}}return 0};

 const box=el('div','','');v.appendChild(box);

 const start=n=>{let queue=sh(G).slice(0,n),rob={r:4,c:0,d:0,a:0},tot=0,round=0,tg=null,tries=0,prog=[],running=false,rs=null;const N=n;

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const clue=el('div','clue','');const info=el('p','','');const chips=el('div','prog','');const msg=el('p','','');

   opts.forEach(o=>{const b=el('button','opt',`<img src="${IM[o.id]}" style="height:80px;border-radius:8px;display:block;margin:0 auto 4px">${o.n}`);b.onclick=()=>{if(g.dataset.d)return;g.dataset.d=1;const r=o==q[2];CMP.add(9,r?10:-5);if(r)okn++;b.classList.add(r?'right':'wrong');if(!r)[...g.children][opts.indexOf(q[2])].classList.add('right');setTimeout(()=>{i++;draw()},1200)};g.appendChild(b)});box.appendChild(g)};draw()}],
