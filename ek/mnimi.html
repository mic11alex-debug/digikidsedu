<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Παιχνίδι μνήμης</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#8b5cf6;--g2:#ec4899}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
#bd{display:grid;gap:8px;margin:6px auto;max-width:480px;grid-template-columns:repeat(4,1fr)}
.k{aspect-ratio:1;border:0;border-radius:16px;font-size:clamp(30px,9vw,52px);cursor:pointer;perspective:600px;background:none;padding:0}
.k i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:16px;font-style:normal;background:linear-gradient(135deg,#a78bfa,#6366f1);color:#fff;box-shadow:0 4px 0 #4338ca;transition:transform .25s}
.k.f i,.k.m i{background:#fff;color:#000;box-shadow:0 4px 0 var(--bd);border:3px solid var(--bd)}.k.m i{background:#dcfce7;border-color:#22c55e;animation:pp .4s}
@keyframes pp{50%{transform:scale(1.15)}}</style></head><body>
<header><h1>🧠 Παιχνίδι μνήμης</h1><p>Γύρνα τις κάρτες και βρες τα ζευγάρια!</p></header>
<main><div class="row"><div class="lab">Θέμα</div><button class="ch on" data-t="0">🐶 Ζώα</button><button class="ch" data-t="1">🍎 Φρούτα</button><button class="ch" data-t="2">🚗 Οχήματα</button><button class="ch" data-t="3">⚽ Αθλήματα</button></div>
<div class="row"><div class="lab">Μέγεθος</div><button class="ch" data-s="6">Μικρό (6 ζευγάρια)</button><button class="ch on" data-s="8">Μέτριο (8)</button><button class="ch" data-s="12">Μεγάλο (12)</button></div>
<div class="row"><div class="pill"><small>Κινήσεις</small><b id="mv">0</b></div><div class="pill"><small>Ζευγάρια</small><b id="pr">0</b></div><div class="pill"><small>Χρόνος</small><b id="tm">0</b></div></div>
<div id="msg"></div><div id="bd"></div><div class="row"><button class="btn" id="again">🔄 Νέο παιχνίδι</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const TH=[['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐨','🦁','🐸','🐵','🐷'],['🍎','🍌','🍇','🍓','🍒','🍉','🍍','🥝','🍋','🍑','🥕','🌽'],['🚗','🚕','🚌','🚑','🚒','🚓','🚜','🚲','✈️','🚀','🚂','⛵'],['⚽','🏀','🏐','🎾','🏈','🏓','🥊','⛳','🏊','🚴','🎯','♟️']];
let th=0,np=8,cards,open_=[],moves,pairs,lock,t0,tmr;
function newG(){const em=sh(TH[th]).slice(0,np);cards=sh([...em,...em]);open_=[];moves=0;pairs=0;lock=false;t0=0;clearInterval(tmr);$('tm').textContent='0';$('mv').textContent=0;$('pr').textContent='0/'+np;$('msg').textContent='Βρες τα ζευγάρια!';
 const bd=$('bd');bd.style.gridTemplateColumns='repeat('+(np===12?6:4)+',1fr)';bd.innerHTML='';cards.forEach((e,i)=>{const b=document.createElement('button');b.className='k';b.innerHTML='<i>❓</i>';b.onclick=()=>flip(i);bd.appendChild(b)})}
function flip(i){const b=$('bd').children[i];if(lock||b.classList.contains('f')||b.classList.contains('m'))return;if(!t0){t0=Date.now();tmr=setInterval(()=>$('tm').textContent=((Date.now()-t0)/1000|0),500)}
 b.classList.add('f');b.firstChild.textContent=cards[i];beep(600,.07);open_.push(i);
 if(open_.length===2){moves++;$('mv').textContent=moves;const[a,c]=open_;if(cards[a]===cards[c]){const A=$('bd').children[a],C=$('bd').children[c];setTimeout(()=>{A.className='k m';C.className='k m';beep(784,.15);pairs++;$('pr').textContent=pairs+'/'+np;if(pairs===np){clearInterval(tmr);$('msg').textContent='🎉 Μπράβο! '+moves+' κινήσεις σε '+((Date.now()-t0)/1000|0)+' δευτ.';fanfare()}},250);open_=[]}
  else{lock=true;setTimeout(()=>{[a,c].forEach(x=>{const e=$('bd').children[x];e.classList.remove('f');e.firstChild.textContent='❓'});open_=[];lock=false},800)}}}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{th=+b.dataset.t;sel('data-t',th);newG()});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{np=+b.dataset.s;sel('data-s',np);newG()});
$('again').onclick=newG;newG();
</script></body></html>
