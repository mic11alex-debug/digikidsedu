<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Βρες τη λέξη</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#16a34a;--g2:#0ea5e9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
#gr{display:grid;gap:6px;width:min(100%,330px);margin:8px auto}.wr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.wc{aspect-ratio:1;border:3px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 clamp(24px,8vw,38px) Fredoka,system-ui;background:var(--card)}
.wc.g{background:#22c55e;color:#fff;border-color:#16a34a}.wc.y{background:#eab308;color:#fff;border-color:#ca8a04}.wc.x{background:#94a3b8;color:#fff;border-color:#64748b}.wc.f{border-color:var(--tx)}
#kb{display:flex;flex-direction:column;gap:5px;align-items:center}.kr{display:flex;gap:4px}.k{border:0;border-radius:8px;background:#cbd5e1;color:#1e293b;font:700 18px Fredoka,system-ui;min-width:clamp(26px,8vw,38px);height:46px;cursor:pointer;padding:0 4px}.k.g{background:#22c55e;color:#fff}.k.y{background:#eab308;color:#fff}.k.x{background:#64748b;color:#fff}.k.w{min-width:60px;background:#10b981;color:#fff}</style></head><body>
<header><h1>🔤 Βρες τη λέξη</h1><p>Μάντεψε τη λέξη των 5 γραμμάτων – σαν το Wordle, στα ελληνικά!</p></header>
<main><div class="row"><div class="lab">Βρες τη λέξη των 5 γραμμάτων σε 6 προσπάθειες</div></div><div id="msg">Γράψε μια λέξη με 5 γράμματα</div><div id="gr"></div><div id="kb"></div>
<div class="row"><button class="btn" id="again">🔄 Νέα λέξη</button></div>
<div style="text-align:center;color:var(--mu);font-size:15px">🟩 σωστό γράμμα στη σωστή θέση · 🟨 υπάρχει στη λέξη αλλού · ⬜ δεν υπάρχει</div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const WL=['ΑΕΡΑΣ', 'ΑΣΤΡΑ', 'ΒΑΡΚΑ', 'ΒΟΥΝΟ', 'ΒΡΑΔΥ', 'ΒΡΟΧΗ', 'ΖΕΒΡΑ', 'ΗΛΙΟΣ', 'ΚΑΦΕΣ', 'ΚΗΠΟΣ', 'ΚΟΡΔΑ', 'ΚΟΥΤΙ', 'ΛΑΓΟΣ', 'ΛΑΔΙΑ', 'ΛΟΥΛΙ', 'ΛΥΚΟΣ', 'ΜΑΤΙΑ', 'ΜΕΛΙΑ', 'ΜΗΛΟΣ', 'ΜΟΥΣΑ', 'ΜΠΑΛΑ', 'ΝΗΣΙΑ', 'ΟΘΟΝΗ', 'ΠΑΓΟΣ', 'ΠΑΙΔΙ', 'ΠΑΠΑΣ', 'ΠΑΠΙΑ', 'ΠΑΡΚΟ', 'ΠΙΑΝΟ', 'ΠΟΔΙΑ', 'ΠΟΡΤΑ', 'ΣΟΥΠΑ', 'ΣΠΙΤΙ', 'ΣΤΥΛΟ', 'ΣΧΟΛΗ', 'ΤΙΓΡΗ', 'ΤΡΕΝΟ', 'ΦΛΟΓΑ', 'ΦΤΕΡΑ', 'ΧΕΡΙΑ', 'ΧΙΟΝΙ', 'ΧΡΩΜΑ', 'ΨΑΡΙΑ'];
const ROWS=['ΕΡΤΥΘΙΟΠ','ΑΣΔΦΓΗΞΚΛ','ΖΧΨΩΒΝΜ'];const LAT={a:'Α',b:'Β',c:'Ψ',d:'Δ',e:'Ε',f:'Φ',g:'Γ',h:'Η',i:'Ι',j:'Ξ',k:'Κ',l:'Λ',m:'Μ',n:'Ν',o:'Ο',p:'Π',r:'Ρ',s:'Σ',t:'Τ',u:'Θ',v:'Ω',w:'Σ',x:'Χ',y:'Υ',z:'Ζ'};
let ans,row,col,gr,over,ks,rs,vis;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace('Σ','Σ').replace(/ς/g,'Σ');
function newG(){ans=WL[Math.random()*WL.length|0];row=0;col=0;over=false;gr=Array.from({length:6},()=>Array(5).fill(''));ks={};rs=[];vis=0;$('msg').textContent='Γράψε μια λέξη με 5 γράμματα';build()}
function build(){const g=$('gr');g.innerHTML='';gr.forEach((r,i)=>{const d=document.createElement('div');d.className='wr';r.forEach((ch,j)=>{const c=document.createElement('div');c.className='wc'+(i<vis&&rs[i]?' '+rs[i][j]:'');c.textContent=ch;if(ch&&i===row&&i>=vis)c.classList.add('f');d.appendChild(c)});g.appendChild(d)});
 const kb=$('kb');kb.innerHTML='';ROWS.forEach((rw,ri)=>{const d=document.createElement('div');d.className='kr';if(ri===2){const e=document.createElement('button');e.className='k w';e.textContent='ΕΝΤΕΡ';e.onclick=submit;d.appendChild(e)}[...rw].forEach(ch=>{const k=document.createElement('button');k.className='k '+(ks[ch]||'');k.textContent=ch;k.onclick=()=>type(ch);d.appendChild(k)});if(ri===2){const e=document.createElement('button');e.className='k';e.textContent='⌫';e.onclick=back;d.appendChild(e)}kb.appendChild(d)})}
function type(ch){if(over||col>4)return;gr[row][col++]=ch;beep(500,.04);build()}
function back(){if(over||!col)return;gr[row][--col]='';build()}
function submit(){if(over)return;if(col<5){$('msg').textContent='Χρειάζονται 5 γράμματα!';return}const guess=gr[row].join('');const res=Array(5).fill('x'),left=[...ans];
 for(let i=0;i<5;i++)if(guess[i]===ans[i]){res[i]='g';left[i]=null}
 for(let i=0;i<5;i++)if(res[i]!=='g'){const k=left.indexOf(guess[i]);if(k>=0){res[i]='y';left[k]=null}}
 rs[row]=res;const done=row;res.forEach((r,i)=>setTimeout(()=>beep(300+i*80,.08),i*120));
 const rk={x:1,y:2,g:3};for(let i=0;i<5;i++){const ch=guess[i];if(!ks[ch]||rk[res[i]]>rk[ks[ch]])ks[ch]=res[i]}
 if(guess===ans){over=true;setTimeout(()=>{vis=done+1;build();$('msg').textContent='🎉 Μπράβο! Η λέξη ήταν '+ans;fanfare()},700);return}
 row++;col=0;over=row===6;$('msg').textContent=over?'':'Προσπάθεια '+(row+1)+' από 6';setTimeout(()=>{vis=done+1;build();if(over)$('msg').textContent='😅 Η λέξη ήταν: '+ans},700)}
document.addEventListener('keydown',e=>{if(e.key==='Enter')return submit();if(e.key==='Backspace')return back();if(e.ctrlKey||e.metaKey||e.altKey)return;let k=e.key;if(k.length!==1)return;let n=norm(k);if(/[Α-Ω]/.test(n))return type(n);const l=LAT[k.toLowerCase()];if(l)type(l)});
$('again').onclick=newG;newG();
</script></body></html>
