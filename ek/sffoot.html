</style></head><body><div class="w"><div class="top"><h1>👣 Το ψηφιακό μου αποτύπωμα</h1><button class="snd" id="snd" title="Ήχος">🔊</button></div><p id="intro" style="font-weight:700;margin:0 0 6px"></p><div class="pg"><i></i></div><div id="main"></div></div><script>

ονται."}, {"e": "📍", "s": "Μια εφαρμογή ρωτά: «Να μοιράζεσαι την τοποθεσία σου;»", "g": "Την κλείνω, αν δεν χρειάζεται, και ρωτώ έναν γονιό.", "b": ["Πατάω πάντα «Ναι».", "Την αφήνω ανοιχτή για όλους."], "f": "Η τοποθεσία δείχνει πού βρισκόμαστε και πού μένουμε."}, {"e": "🦊", "s": "Διάλεξε όνομα χρήστη για ένα παιχνίδι.", "g": "Ένα ψευδώνυμο χωρίς το πραγματικό μου όνομα ή την ηλικία μου.", "b": ["Το όνομα και το επώνυμό μου.", "Το όνομά μου και το έτος γέννησης."], "f": "Το ψευδώνυμο προστατεύει την ταυτότητά μας."}, {"e": "📣", "s": "Κάποιος γράφει σχόλιο με προσωπικά σου στοιχεία (π.χ. πού μένεις).", "g": "Το αναφέρω στην εφαρμογή και το λέω σε έναν μεγάλο.", "b": ["Απαντώ και του γράφω πού μένω ακριβώς.", "Το αγνοώ."], "f": "Τα προσωπικά στοιχεία δεν πρέπει να μένουν δημόσια."}, {"e": "🍪", "s": "Μια σελίδα ρωτά για «cookies» και δείχνει «Αποδοχή όλων».", "g": "Διαβάζω ή ρωτώ έναν μεγάλο και επιλέγω μόνο τα απαραίτητα.", "b": ["Πατάω αμέσως «Αποδοχή όλων».", "Κλείνω με βιασύνη τα πάντα."], "f": "Τα cookies καταγράφουν τι κάνουμε· μπορούμε να περιορίσουμε όσα μοιραζόμαστε."}, {"e": "🌟", "s": "Πώς αφήνω ένα ΘΕΤΙΚΟ ψηφιακό αποτύπωμα;", "g": "Μοιράζομαι δημιουργίες μου και καλά λόγια με ασφάλεια.", "b": ["Γράφω ό,τι μου έρθει στο μυαλό.", "Ανεβάζω ό,τι κάνω."], "f": "Ένα θετικό αποτύπωμα είναι κάτι που μπορεί να σε κάνει περήφανο και στο μέλλον."}, {"e": "🔍", "s": "Αναζητάς κάτι στο διαδίκτυο. Μένουν ίχνη από την αναζήτηση;", "g": "Ναι, οι αναζητήσεις μπορεί να καταγράφονται.", "b": ["Όχι, είναι εντελώς κρυφές.", "Μόνο όταν γράφω στο chat."], "f": "Γι’ αυτό χρησιμοποιούμε το διαδίκτυο με προσοχή, ακόμη και όταν «απλώς ψάχνουμε»."}, {"e": "📝", "s": "Πριν κάνεις εγγραφή σε μια νέα εφαρμογή, τι κάνεις;", "g": "Ρωτώ τους γονείς μου και διαβάζω ποιες πληροφορίες ζητά.", "b": ["Δίνω όλα τα στοιχεία που ζητά.", "Βάζω ψεύτικη ηλικία."], "f": "Αν η εφαρμογή ζητά πολλά στοιχεία, ρωτώ έναν μεγάλο."}], "fixed": false},M=APP.mode,DOG='',CAT='';
const $=s=>document.querySelector(s);
const SEEN='sf_'+APP.id;let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN)||'[]')}catch(e){}

let snd=true,AC=window.AudioContext||window.webkitAudioContext,ac;
function tone(f,d,t){if(!snd||!AC)return;try{ac=ac||new AC();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const sOK=()=>{tone(660,.15);setTimeout(()=>tone(880,.2),110)},sNO=()=>tone(180,.35,'square'),sUP=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*110));
function burst(x,y,arr,n){for(let k=0;k<(n||14);k++){const s=document.createElement('span');s.className='pt';s.textContent=arr[k%arr.length];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*6.28,d=60+Math.random()*130;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d-40+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
const cen=el=>{const r=(el||document.body).getBoundingClientRect();return[r.left+r.width/2,r.top+Math.min(r.height/2,200)]};

 const P=APP.pool.map((x,k)=>({...x,k}));

 q=fresh.concat(old).slice(0,APP.n);
 try{seen=seen.concat(q.map(x=>x.k));localStorage.setItem(SEEN,JSON.stringify(seen))}catch(e){}
 i=0;sc=0;wr=0;streak=0;best=0;meter=50;pts=0;
 $('#main').innerHTML='<div id="wid"></div><div id="stage"></div>';initW();show()}

 else if(M=='chat')w.innerHTML='<div class="row2"><span id="face" style="font-size:34px">😐</span><span>Διάθεση φίλου</span><div class="bar"><i id="mf" style="width:50%"></i></div></div>';

 else if(M=='xp')w.innerHTML='<div class="row2"><span id="hr">❤️❤️❤️</span><b id="lv">Επίπεδο 1</b><div class="bar"><i id="xi" style="width:0"></i></div></div>';
 else if(M=='swipe')w.innerHTML='<div class="row2"><span>🔥 <b id="cb">0</b></span><span>⭐ <b id="sp">0</b></span><div class="bar"><i id="tmb" style="width:100%;background:#facc15;transition:none"></i></div></div>';

function updW(ok){
