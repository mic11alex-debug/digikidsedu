<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ψηφιακές συσκευές</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350;--hl:#4a3f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka;border-radius:99px;padding:8px 16px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}.lead{color:var(--mu);margin:0 0 14px}
.btn{border:0;cursor:pointer;font:700 19px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.win{text-align:center;padding:14px}.win .big{font-size:76px}
.opt{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:12px;font:600 20px Fredoka;cursor:pointer}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.stars{font-size:34px;letter-spacing:4px}
.cert{border:6px double var(--amber);border-radius:20px;padding:18px;text-align:center;background:var(--hl);margin-top:14px}
.cert input{font:700 24px Fredoka;text-align:center;border:0;border-bottom:3px solid var(--amber);background:transparent;color:var(--tx);width:90%;outline:0}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dv{border:3px solid var(--bd);border-radius:20px;background:var(--card);padding:10px;text-align:center;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;color:var(--tx);font-family:Fredoka}
.dv .pic{height:84px;display:grid;place-items:center;font-size:62px}.pic svg{width:100%;height:84px}.qe svg{width:100%;height:auto}.dv img{max-height:84px;max-width:120px;background:#fff;border-radius:8px}
.dv.on{background:var(--hl);border-color:var(--amber)}.dv small{font-weight:400;color:var(--mu);font-size:15px}
.dv.sel{border-color:var(--blue);box-shadow:0 0 0 4px #bfdbfe}
.dv.circ{border-color:var(--red);box-shadow:0 0 0 4px #fecaca;border-radius:50px}.dv.good{border-color:var(--green);box-shadow:0 0 0 4px #bbf7d0}.dv.miss{border-color:var(--amber);border-style:dashed}.dv.bad{border-color:var(--red);opacity:.55}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px 40px}.mt .dv{min-height:100px}.mt .lb{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:14px;font:700 19px Fredoka;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.mt .lb.sel{border-color:var(--blue);box-shadow:0 0 0 4px #bfdbfe}.mt .done{background:#bbf7d0;border-color:var(--green);color:#14532d;pointer-events:none}
.qe{font-size:80px;text-align:center}.qq{font-size:clamp(21px,4.5vw,28px);font-weight:600;text-align:center;margin:6px 0 12px}.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.ans{grid-template-columns:1fr}.mt{gap:10px 14px}}
</style><style id="dx">.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.dcard{border:3px solid var(--bd);border-radius:18px;padding:12px;text-align:center;background:#fff}.dcard.read{border-color:var(--green);background:#f0fdf4}.dpic svg{width:100%;height:120px}.dcard h3{margin:6px 0}.dcard p{margin:0 0 6px;color:var(--mu);font-size:15px}.dcard ul{list-style:none;margin:6px 0;padding:0;text-align:left;font-size:15px}.dcard li{margin:5px 0}.dcard li span{margin-right:6px}</style><style id="mx">.mtog{display:flex;gap:10px;justify-content:center;margin:10px 0}.mtog .opt{font-size:18px;padding:10px 18px}.mtog .opt.sel{border-color:var(--blue);background:#dbeafe}.mdia svg{width:100%;max-width:560px;display:block;margin:6px auto;background:#f0f9ff;border:3px solid var(--bd);border-radius:18px}.hp{cursor:pointer}.hp:hover *,.hp.on *{stroke:#f59e0b;stroke-width:3}.hp.seen .tag{fill:#10b981}.mchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.mchips button{border:3px solid var(--bd);background:#fff;border-radius:14px;padding:8px 12px;font:600 16px Fredoka;cursor:pointer}.mchips button.on{border-color:var(--amber);background:#fef9c3}.mchips button.seen::after{content:" ✅"}.minfo{border:3px solid var(--amber);background:#fffbeb;border-radius:18px;padding:12px;text-align:center;min-height:90px;margin:8px 0}.minfo .bd{display:inline-block;border-radius:10px;padding:2px 10px;color:#fff;font-weight:700;font-size:14px}.bd.in{background:#2563eb}.bd.out{background:#db2777}.bd.cpu{background:#7c3aed}
.io{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.io{grid-template-columns:1fr}}.io .c{border:3px solid var(--bd);border-radius:18px;padding:12px}.io .c.in{border-color:#2563eb;background:#eff6ff}.io .c.out{border-color:#db2777;background:#fdf2f8}.io h3{margin:0 0 4px}.io ul{list-style:none;padding:0;margin:8px 0}.io li{margin:6px 0;font-size:17px}.flow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0;font:700 17px Fredoka}.flow div{border-radius:14px;padding:10px 14px;color:#fff;text-align:center}
.iog{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.iob{border:3px dashed var(--bd);border-radius:16px;padding:8px;min-height:120px;text-align:center;cursor:pointer}.iob.in{border-color:#2563eb;background:#eff6ff}.iob.out{border-color:#db2777;background:#fdf2f8}.iob .in2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}.iob .in2 span{background:#fff;border-radius:10px;padding:4px 8px;font-size:14px}.ipool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.ipool button{border:3px solid var(--bd);background:#fff;border-radius:14px;padding:8px 12px;font:600 16px Fredoka;cursor:pointer}.ipool button.sel{border-color:var(--amber);background:#fef9c3}.ipool button.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}</style><style>.sd-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.sd-cap{min-height:60px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(16px,3vw,21px);background:linear-gradient(135deg,#fef3c7,#fce7f3);color:#7c2d12;border:3px solid #f59e0b;border-radius:18px;padding:8px 14px;margin-bottom:12px}
.sd-cap.pop{animation:sdpop .35s}@keyframes sdpop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.sd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.sd-dev{border:3px solid var(--bd);border-radius:22px;background:var(--soft);padding:12px 10px 14px;text-align:center;transition:transform .35s,box-shadow .35s,border-color .35s;position:relative}
.sd-dev.hi{border-color:var(--amber);box-shadow:0 0 0 5px #fde68a,0 12px 20px #0003;transform:translateY(-6px) scale(1.03)}
.sd-dev.carry{animation:sdcar 1.1s ease-in-out 2}@keyframes sdcar{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-3deg)}70%{transform:translateY(-8px) rotate(3deg)}}
.sd-dev.no{animation:sdno .5s}@keyframes sdno{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sd-dev.inbag{border-color:var(--green);background:#dcfce7}
.sd-art{height:170px;display:grid;place-items:center;position:relative}
.sd-dev b{display:block;font-size:19px;margin-top:2px}
.sd-chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0 8px}.sd-chips span{font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;background:#fff;border:2px solid var(--bd);color:#334155}
.sd-bag{font:700 15px Fredoka,system-ui;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:6px 12px;cursor:pointer}.sd-dev.inbag .sd-bag{background:#bbf7d0;border-color:var(--green)}
.sd-scr{background:linear-gradient(135deg,#bae6fd,#c4b5fd);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;align-content:center;cursor:pointer}
.sd-ap{font-size:24px;display:grid;place-items:center;background:#ffffffaa;border-radius:10px;aspect-ratio:1;transition:transform .15s}.sd-ap.on{transform:scale(1.25);background:#fde047}
.sd-open{position:absolute;inset:0;background:#fffbeb;display:none;place-items:center;font-size:44px;color:#1e293b}.sd-open.on{display:grid;animation:sdpop .3s}
.sd-rip{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#f59e0b88;border:3px solid #f59e0b;animation:sdrip .6s forwards;pointer-events:none}@keyframes sdrip{to{transform:scale(2.6);opacity:0}}
.sd-ptr{position:absolute;width:18px;height:26px;pointer-events:none;transition:left .7s ease-in-out,top .7s ease-in-out;z-index:3;filter:drop-shadow(0 1px 1px #0006)}
.sd-desk .mon{position:relative;width:150px;height:98px;background:#1e293b;border-radius:10px;padding:6px}.sd-desk .mon .sd-scr{height:100%;border-radius:4px}
.sd-desk .st{width:18px;height:16px;background:#94a3b8;margin:0 auto}.sd-desk .ba{width:60px;height:7px;background:#64748b;border-radius:5px;margin:0 auto}
.sd-desk .kb{width:110px;height:14px;background:#475569;border-radius:4px;margin:8px auto 0;position:relative}.sd-desk .kb i{position:absolute;right:-30px;top:-2px;width:16px;height:22px;border-radius:8px;background:#6366f1}
.sd-lap .lid{width:150px;height:96px;background:#1e293b;border-radius:10px 10px 2px 2px;padding:6px;transform-origin:bottom;transition:transform .9s;margin:0 auto}.sd-lap .lid .sd-scr{height:100%;border-radius:3px}.sd-lap .lid.shut{transform:perspective(300px) rotateX(-88deg)}
.sd-lap .bs{width:178px;height:16px;background:linear-gradient(#cbd5e1,#94a3b8);border-radius:2px 2px 10px 10px;margin:0 auto;position:relative}.sd-lap .bs::after{content:"";position:absolute;left:67px;top:2px;width:44px;height:6px;background:#64748b;border-radius:3px}
.sd-lap .bat{position:absolute;right:6px;top:4px;font-size:13px;font-weight:700;color:#16a34a}
.sd-tab .tb{width:150px;height:112px;background:#1e293b;border-radius:14px;padding:8px}.sd-tab .tb .sd-scr{height:100%;border-radius:5px}
.sd-mob .mb{width:76px;height:150px;background:#1e293b;border-radius:16px;padding:6px 5px}.sd-mob .mb .sd-scr{height:100%;border-radius:10px;grid-template-columns:1fr 1fr;gap:3px;padding:5px}.sd-mob .sd-ap{font-size:15px;border-radius:6px}
.sd-bagbox{margin:14px auto 0;max-width:420px;border:4px dashed #16a34a;border-radius:20px;padding:10px;text-align:center;font-weight:700;background:#f0fdf4;color:#14532d;min-height:62px}.sd-bagbox span{font-size:30px;margin:0 4px}
.sd-ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.sd-mi{border:3px solid var(--bd);border-radius:16px;padding:8px 12px;font-weight:700;font-size:16px;background:var(--soft);display:flex;gap:8px;align-items:center}.sd-mi.ok{background:#bbf7d0;border-color:var(--green);color:#064e3b}.sd-mi b{font-size:22px}
.sd-plug{position:absolute;right:10px;top:8px;font-size:20px;opacity:0;transition:opacity .3s}.sd-dev.hi .sd-plug,.sd-plug.on{opacity:1}

const D=[['🖥️','Η Οθόνη','Στην οθόνη βλέπουμε τις εργασίες μας, τα παιχνίδια μας, τις ταινίες μας κ.ά.','monitor'],['🗄️','Η Κεντρική Μονάδα','Κάνει όλη τη δουλειά. Έχει τον «επεξεργαστή», που είναι ο εγκέφαλος, και τις «μνήμες» όπου αποθηκεύουμε.','tower'],['⌨️','Το Πληκτρολόγιο','Γράφουμε με αυτό. Έχει γράμματα, αριθμούς και σύμβολα όπως ερωτηματικά και θαυμαστικά.','keyboard'],['🖱️','Το Ποντίκι','Το λέμε έτσι γιατί έχει «ουρά» και μοιάζει με ποντικάκι! Κάνουμε αριστερό και δεξί κλικ για να επιλέξουμε κάτι.','mouse'],['🖨️','Ο Εκτυπωτής','Με αυτόν βγάζουμε σε χαρτί αυτό που βλέπουμε στην οθόνη. Μπορεί να είναι έγχρωμος ή ασπρόμαυρος.','b_printer'],['🔊','Τα Ηχεία','Με αυτά ακούμε τους ήχους που βγαίνουν από τον υπολογιστή.',null],['🎧','Τα Ακουστικά','Ακούμε τους ήχους του υπολογιστή, αλλά μόνο εμείς που τα φοράμε!',null],['🎤','Το Μικρόφωνο','Με αυτό «μιλάμε» στον υπολογιστή και ηχογραφούμε τη φωνή μας.','mic'],['🎥','Η Κάμερα (webcam)','Βάζουμε την κάμερα πάνω στην οθόνη. Με αυτήν μας βλέπουν στις βιντεοκλήσεις και μπορούμε να τραβήξουμε βίντεο.','cam'],['📷','Η Φωτογραφική Μηχανή','Με αυτή τραβάμε φωτογραφίες και τις μεταφέρουμε στον υπολογιστή.',null],['📠','Ο Σαρωτής (Σκάνερ)','«Διαβάζει» ένα φύλλο χαρτί και το αποθηκεύει σε ηλεκτρονική μορφή στον υπολογιστή.','b_scanner'],['💿','Οι Μνήμες','Εδώ αποθηκεύουμε τις εργασίες μας! CD, DVD, σκληρός δίσκος και στικάκια USB.','cd'],['🔌','Το USB (στικάκι)','Ένα μικρό στικάκι μνήμης! Το βάζουμε στην υποδοχή USB του υπολογιστή για να αποθηκεύσουμε τις εργασίες μας και να τις πάρουμε μαζί μας.','usb']];

function SIMD(v){
 v.appendChild(el('p','lead','Επιτραπέζιος, φορητός, ταμπλέτα και κινητό: πώς δουλεύει καθένας; Πάτα «Δείξε μου» ή δοκίμασέ τους εσύ!'));

 const APS=['📷','🎨','🎵','🎮'];
 const apps=()=>APS.map(a=>`<div class="sd-ap">${a}</div>`).join('');
 const scr=()=>`<div class="sd-scr">${apps()}<div class="sd-open"></div></div>`;
 const PTR='<svg class="sd-ptr" viewBox="0 0 18 28" style="left:70%;top:80%"><path d="M1,1 L1,22 L7,17 L11,26 L14,24.5 L10,16 L17,16 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';

  ['tab','📱','Ταμπλέτα',['👆 Οθόνη αφής','🎒 Την παίρνω μαζί μου','🔋 Έχει μπαταρία'],`<div class="sd-tab"><div class="tb">${scr()}</div></div>`],
  ['mob','📞','Κινητό τηλέφωνο',['👆 Οθόνη αφής','👖 Χωράει στην τσέπη','📞 Τηλεφωνώ και στέλνω μηνύματα'],`<div class="sd-mob"><div class="mb">${scr()}</div></div>`]];
 const MS=[['desk','🖥️','Χρησιμοποίησε τον επιτραπέζιο'],['lap','💻','Χρησιμοποίησε τον φορητό'],['tab','📱','Χρησιμοποίησε την ταμπλέτα'],['mob','📞','Χρησιμοποίησε το κινητό'],['bag','🎒','Βάλε στο σακίδιο τις 3 φορητές συσκευές']];
 const HOW={desk:'🖥️ Επιτραπέζιος: δουλεύω με ποντίκι και πληκτρολόγιο. Μένει στο γραφείο και θέλει πρίζα.',lap:'💻 Φορητός: ανοίγει σαν βιβλίο. Αντί για ποντίκι έχει touchpad και δουλεύει με μπαταρία!',tab:'📱 Ταμπλέτα: δεν έχει ποντίκι! Αγγίζω την οθόνη με το δάχτυλό μου.',mob:'📞 Κινητό: μικρό και ελαφρύ, μπαίνει στην τσέπη. Αγγίζω την οθόνη και μπορώ να τηλεφωνήσω.'};
