<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ναυμαχία</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#0ea5e9;--g2:#1e3a8a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
.g{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:8px auto;max-width:400px;background:#0369a1;padding:4px;border-radius:12px}.g.sm{max-width:240px}
.q{aspect-ratio:1;border:0;border-radius:6px;background:#38bdf8;font-size:clamp(14px,4vw,22px);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}.q:hover:not(:disabled){background:#7dd3fc}.q:disabled{cursor:default}
.q.h{background:#fca5a5}.q.m{background:#e0f2fe}.q.s{background:#64748b}.q.k{background:#ef4444}.g.sm .q{font-size:13px}</style></head><body>
<header><h1>🚢 Ναυμαχία</h1><p>Βρες και βούλιαξε όλα τα πλοία του αντιπάλου!</p></header>
<main><div class="row"><div class="lab">Δυσκολία υπολογιστή</div><button class="ch" data-l="1">😊 Εύκολος</button><button class="ch on" data-l="2">🙂 Μέτριος</button></div>
<div class="row"><div class="pill"><small>Τα πλοία του αντιπάλου</small><b id="ef">5</b></div><div class="pill"><small>Τα δικά σου πλοία</small><b id="mf">5</b></div></div><div id="msg"></div>
<div class="card"><div style="text-align:center;font-weight:700">🎯 Ο στόλος του αντιπάλου – πάτα για να ρίξεις</div><div class="g" id="eg"></div></div>
<div class="card" style="margin-top:12px"><div style="text-align:center;font-weight:700">⚓ Ο δικός σου στόλος</div><div class="g sm" id="mg"></div></div>
<div class="row"><button class="btn" id="again">🔄 Νέο παιχνίδι</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const S=8,SH=[5,4,3,3,2];let lvl=2,me,en,mS,eS,turn,over,hunt,mt,et;
function place(){const g=Array.from({length:S},()=>Array(S).fill(-1)),ships=[];SH.forEach((L,id)=>{for(;;){const h=Math.random()<.5,r=Math.random()*S|0,c=Math.random()*S|0;const cs=[];for(let k=0;k<L;k++)cs.push(h?[r,c+k]:[r+k,c]);if(cs.every(([a,b])=>a<S&&b<S&&g[a][b]<0)){cs.forEach(([a,b])=>g[a][b]=id);ships.push(cs);break}}});return{g,ships}}
const hits=(sh,sh2)=>sh.map(cs=>cs.every(([a,b])=>sh2[a][b]));
function newG(){const a=place(),b=place();me=a;en=b;mt=Array.from({length:S},()=>Array(S).fill(0));et=Array.from({length:S},()=>Array(S).fill(0));turn=0;over=false;hunt=[];draw();$('msg').textContent='Στόχευσε τον στόλο του αντιπάλου!'}
function cellClass(v,t,show,sunk){let c='q';if(t===1)c+=v>=0?' h':' m';if(sunk)c+=' k';else if(show&&v>=0&&!t)c+=' s';return c}
function draw(){const e=$('eg'),m=$('mg');e.innerHTML='';m.innerHTML='';
 const es=en.ships.map(cs=>cs.every(([a,b])=>et[a][b]===1));
 for(let r=0;r<S;r++)for(let c=0;c<S;c++){const v=en.g[r][c];const b=document.createElement('button');const sunk=v>=0&&es[v];b.className=cellClass(v,et[r][c],false,sunk);b.textContent=et[r][c]?(v>=0?(sunk?'💥':'🔥'):'•'):'';b.disabled=!!et[r][c]||over||turn!==0;b.onclick=()=>fire(r,c);e.appendChild(b)}
 const ms=me.ships.map(cs=>cs.every(([a,b])=>mt[a][b]===1));
 for(let r=0;r<S;r++)for(let c=0;c<S;c++){const v=me.g[r][c];const b=document.createElement('div');const sunk=v>=0&&ms[v];b.className=cellClass(v,mt[r][c],true,sunk);b.textContent=mt[r][c]?(v>=0?'🔥':'•'):(v>=0?'🚢':'');m.appendChild(b)}
 $('ef').textContent=es.filter(x=>!x).length;$('mf').textContent=ms.filter(x=>!x).length}
function fire(r,c){if(over||turn!==0||et[r][c])return;et[r][c]=1;const v=en.g[r][c];beep(v>=0?200:600,.15,v>=0?'sawtooth':'sine');draw();
 if(en.ships.every(cs=>cs.every(([a,b])=>et[a][b]))){over=true;$('msg').textContent='🎉 Βύθισες όλο τον στόλο! Κέρδισες!';fanfare();draw();return}
 const sunk=v>=0&&en.ships[v].every(([a,b])=>et[a][b]);$('msg').textContent=v>=0?(sunk?'💥 Βούλιαξε ένα πλοίο!':'🔥 Βρήκες πλοίο! Ξαναρίξε… όχι, σειρά του αντιπάλου'):'💧 Στον βυθό…';turn=1;draw();setTimeout(cpu,800)}
function cpu(){if(over)return;let r,c,cand=[];
 if(lvl===2&&hunt.length){for(const[a,b]of hunt)for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=a+dr,y=b+dc;if(x>=0&&y>=0&&x<S&&y<S&&!mt[x][y])cand.push([x,y])}}
 if(!cand.length){for(let a=0;a<S;a++)for(let b=0;b<S;b++)if(!mt[a][b]&&(lvl===1||(a+b)%2===0))cand.push([a,b]);if(!cand.length)for(let a=0;a<S;a++)for(let b=0;b<S;b++)if(!mt[a][b])cand.push([a,b])}
 [r,c]=cand[Math.random()*cand.length|0];mt[r][c]=1;const v=me.g[r][c];if(v>=0){hunt.push([r,c]);if(me.ships[v].every(([a,b])=>mt[a][b]))hunt=hunt.filter(([a,b])=>me.g[a][b]!==v)}
 draw();if(me.ships.every(cs=>cs.every(([a,b])=>mt[a][b]))){over=true;$('msg').textContent='😅 Ο αντίπαλος βούλιαξε όλα τα πλοία σου. Ξαναδοκίμασε!';draw();return}
 $('msg').textContent=v>=0?'😬 Ο αντίπαλος βρήκε το πλοίο σου! Σειρά σου.':'Ο αντίπαλος αστόχησε. Σειρά σου!';turn=0;draw()}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lvl=+b.dataset.l;sel('data-l',lvl);newG()});$('again').onclick=newG;newG();
</script></body></html>
