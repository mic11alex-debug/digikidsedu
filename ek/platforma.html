function tile(x,y){if(y<0)return ' ';if(y>=MH)return '#';if(x<0||x>=MW)return '#';return map[y][x]}
function loadLevel(i,keepScore){lvi=i;const L=LVL[i];MH=L.rows.length;MW=Math.max(...L.rows.map(r=>r.length));map=L.rows.map(r=>r.padEnd(MW,' ').split(''));ents=[];coins=[];gotCoins=0;
