<header><h1>🕯️ Ο αγώνας 1955–59</h1><p>Ιστορία ΣΤ΄ – πρόσωπα, τόποι, πηγές και παιχνίδια</p></header>

<script>

try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

const escP=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function prPop(title,inner){const w=window.open('','_blank');if(!w){prMsg('Η εκτύπωση δεν άνοιξε. Δοκίμασε Ctrl+P ή άνοιξε το παιχνίδι σε νέα καρτέλα.');return}
 const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 w.document.write('<!doctype html><html lang="el"><head><meta charset="utf-8"><title>'+escP(title)+'</title><style>'+css+'#prn{display:block!important;max-width:800px;margin:0 auto;padding:12px}</style></head><body class="printing"><div id="prn">'+inner+'</div></body></html>');w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},700)}
function prnOut(title,html,o){o=o||{};
