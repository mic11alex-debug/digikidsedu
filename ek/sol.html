<header><h1>🪐 Το ηλιακό μας σύστημα</h1><p>Πλανήτες, κινήσεις της Γης, ταξίδι στο διάστημα και αστροναύτης</p></header>

<script>

const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>[...a].sort(()=>Math.random()-.5);
let done={};const KEY='iliako_done';
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const mark=i=>{if(!done[i]){done[i]=1;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}tabs();try{parent.postMessage({sgame:KEY,n:Object.keys(done).length,t:T.length},'*')}catch(e){}}};
let cur=0;
function tabs(){const t=$('tabs');t.innerHTML='';T.forEach((x,i)=>{const b=el('button',(i==cur?'on ':'')+(done[i]?'ok':''),x[0]);b.onclick=()=>go(i);t.appendChild(b)})}

function system(v,ix){v.appendChild(el('p','lead','Το <b>ηλιακό σύστημα</b> αποτελείται από τον Ήλιο και από <b>οκτώ πλανήτες</b> που γυρίζουν γύρω του. Πάτα πάνω σε έναν πλανήτη για να τον γνωρίσεις! (Στον χάρτη τα μεγέθη και οι αποστάσεις δεν είναι αληθινά.)'));
 const w=el('div','sysw','');const seen=new Set();const info=el('div','','');const msg=msgEl();
 let h=`<svg viewBox="0 0 600 600" class="sys" role="img" aria-label="Το ηλιακό σύστημα">`;h+=`<rect width="600" height="600" fill="#0b1030"/>`;for(let i=0;i<70;i++)h+=`<circle cx="${(i*83)%600}" cy="${(i*149)%600}" r="${.6+(i%3)*.5}" fill="#fff" opacity=".7"/>`;
 PN.forEach(p=>h+=`<circle cx="300" cy="300" r="${p.r}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="3 5"/>`);
 h+=`<g transform="translate(262 262) scale(.76)">${ART.sun.replace(/<circle/g,'<circle')}</g><text x="300" y="352" text-anchor="middle" fill="#ffd21f" font-size="12" font-weight="800">Ήλιος</text>`;
 PN.forEach(p=>h+=`<g class="pl" data-id="${p.id}" style="cursor:pointer"><g class="pg"><g transform="translate(${-p.sz*1.7} ${-p.sz*1.7}) scale(${p.sz*3.4/100})">${ART[p.id]}</g></g><circle r="${p.sz*1.8}" fill="transparent"/></g>`);h+='</svg>';w.innerHTML=h;
 const gs=[...w.querySelectorAll('.pl')];let t=0,pause=false;const ang=PN.map((p,i)=>i*1.3);
 let raf;const tick=()=>{if(!document.body.contains(w)){cancelAnimationFrame(raf);return}if(!pause){t+=1}gs.forEach((g,i)=>{const p=PN[i];const a=ang[i]+t*p.sp*.02;g.setAttribute('transform',`translate(${300+p.r*Math.cos(a)} ${300+p.r*Math.sin(a)})`)});raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
 gs.forEach((g,i)=>g.onclick=()=>{const p=PN[i];seen.add(p.id);gs.forEach(x=>x.classList.remove('sel'));g.classList.add('sel');info.innerHTML=`<div class="lcard"><div>${pimg(p.id,110)}</div><div><h3 style="margin:0">${i+1}ος: ${p.n}</h3><p style="margin:4px 0">Τύπος: <b>${TYP[p.t]}</b></p><p style="margin:4px 0">${p.tx}</p><p style="margin:4px 0">📏 Διάμετρος: ${p.d.toLocaleString('el-GR')} km · 🌙 Δορυφόροι: ${p.moons}</p></div></div>`;msg.innerHTML=`<span class="ok-t">Γνώρισες ${seen.size} από 8 πλανήτες</span>`;if(seen.size>=8)mark(ix)});
 const pb=el('button','btn g','⏯️ Παύση / Κίνηση');pb.onclick=()=>{pause=!pause};v.append(w,pb,msg,info)}

 const q=el('div','','<h3>Τι είδες;</h3>');v.appendChild(q);qz(q,[['Η Γη γυρίζει γύρω από…',['τον Ήλιο','τη Σελήνη','τον Άρη'],0],['Μια πλήρης περιφορά της Γης γύρω από τον Ήλιο διαρκεί περίπου…',['1 χρόνο (365 ¼ μέρες)','1 ημέρα','1 μήνα'],0],['Η περιστροφή της Γης γύρω από τον άξονά της διαρκεί περίπου…',['24 ώρες','1 χρόνο','1 εβδομάδα'],0],['Η περιφορά της Γης δημιουργεί…',['τις εποχές του χρόνου','τη μέρα και τη νύχτα','τις φάσεις της Σελήνης'],0]],ix)}

 const q=el('div','','<h3>Ποιος πλανήτης είναι;</h3>');v.appendChild(q);const nm=PN.map(p=>p.n);qz(q,sh(PN).slice(0,6).map(p=>[`<div style="display:flex;justify-content:center">${pimg(p.id,130)}</div>Ποιος πλανήτης είναι αυτός;`,[p.n,...sh(nm.filter(n=>n!=p.n)).slice(0,3)],0]),ix)}

 const pre=()=>{box.innerHTML='<h3>Έλεγχος πριν την εκτόξευση</h3>';const g=el('div','zb','');checks.forEach(c=>{const b=el('button','opt',c[0]);b.style.cssText='width:auto;height:auto;font-size:19px';b.onclick=()=>{if(b.classList.contains('right'))return;b.classList.add('right');cn++;if(cn==3)go.disabled=false};g.appendChild(b)});const go=el('button','btn','🚀 Ξεκίνα την αντίστροφη μέτρηση');go.disabled=true;go.onclick=cd;box.append(g,go)};
 const cd=()=>{let n=5;box.innerHTML='<div class="win"><div class="big" id="cdn">5</div><b>Αντίστροφη μέτρηση…</b></div>';const t=setInterval(()=>{n--;const e=document.getElementById('cdn');if(!e||!box.isConnected){clearInterval(t);return}if(n<=0){clearInterval(t);fly()}else e.textContent=n},800)};
 const fly=()=>{box.innerHTML='';const hud=el('div','zb','');hud.style.justifyContent='center';const svg=el('div','','');svg.style.cssText='width:100%;max-width:340px;margin:0 auto;border-radius:18px;overflow:hidden;border:3px solid var(--bd)';const st=el('p','','');st.style.textAlign='center';const msg=el('p','','');msg.style.cssText='text-align:center;min-height:50px';const bt=el('button','btn','');bt.style.cssText='display:block;margin:6px auto';box.append(hud,svg,st,msg,bt);
  let p=0,t0=performance.now(),err=0,T=0,used=false,flash=0;

  const draw=(P,f,alt,sp)=>{const ph=p<1?0:p<2?1:2;const dark=Math.min(1,alt/120);const sky=mix([56,189,248],[8,12,30],dark);
   let s=`<svg viewBox="0 0 300 400" style="display:block;width:100%;background:${sky}">`;

   if(alt>60&&p<7){const ey=p>=5?Math.min(560,380+(1-f)*0)+(p==5?-(120-alt)*0:0):520;s+=`<circle cx="150" cy="${p>=5?Math.max(420,520-(120-alt)*1.2):520}" r="330" fill="#2563eb" opacity=".85"/><circle cx="150" cy="${p>=5?Math.max(420,520-(120-alt)*1.2):520}" r="330" fill="none" stroke="#7dd3fc" stroke-width="8" opacity=".5"/>`}
   let gy=2000;if(p<=1||p>=5){gy=p>=5?(alt<40?330+ alt*7:520):(alt<30?330+alt*30:2000);s+=`<rect x="0" y="${gy}" width="300" height="400" fill="#4ade80"/>`;if(p==6)s+=`<rect x="0" y="${gy}" width="300" height="14" fill="#475569"/><rect x="40" y="${gy+5}" width="40" height="3" fill="#fff"/><rect x="130" y="${gy+5}" width="40" height="3" fill="#fff"/><rect x="220" y="${gy+5}" width="40" height="3" fill="#fff"/>`}

   if(p<=2){const fy=p==2?255:296;const fl=(p<3)?`<polygon points="132,${fy} ${150+(Math.random()*6-3)},${fy+40+Math.random()*30} 168,${fy}" fill="#fb923c"/><polygon points="140,${fy} 150,${fy+22+Math.random()*12} 160,${fy}" fill="#fde047"/>`:'';

   } else if(p<=4){const open=p==3||p==4;s+=`<g transform="translate(150,200) rotate(${p==2?0:-90}) translate(-150,-200)">${stackSVG({ph:2}).replace(/<g[^>]*><rect x="134"[^>]*\/><\/g>/,'')}</g>`;

    if(p==4)s+=`<ellipse cx="150" cy="225" rx="${20+f*20}" ry="14" fill="#f97316" opacity=".6"/>`;
   } else {gy=p==6?330+alt*7:520;const ry=p==6?gy-50:150+f*70;const wh=p==6&&used?'<circle cx="130" cy="20" r="4" fill="#111"/><circle cx="170" cy="20" r="4" fill="#111"/>':'';
    s+=`<g transform="translate(0,${ry-150})"><g transform="translate(150,200) rotate(${p==5?-35:-90}) translate(-150,-200)">${stackSVG({ph:2}).replace(/<g[^>]*><rect x="134"[^>]*\/><\/g>/,'')}</g>${p==5?`<ellipse cx="160" cy="240" rx="40" ry="20" fill="#f97316" opacity="${.3+.3*Math.random()}"/>`:''}${p==6&&PH[6]&&f>.5?'<path d="M205 200 q30 -40 60 0Z" fill="#fbbf24" transform="translate(-60,30)"/>':''}</g>`}
   return s+'</svg>'};
  hud.innerHTML='';

   if(f>=1){if(!used){err++;msg.innerHTML='<span class="bad-t">Ξέχασες το κουμπί! Ο υπολογιστής το έκανε μόνος του.</span>';}if(!next()){return}}
   const P2=PH[p],f2=Math.min(1,(now-t0)/1000/P2.d);const alt=lerp(P2.a0,P2.a1,f2),sp=lerp(P2.s0,P2.s1,f2);

   hs.innerHTML=`<span>⏱ Χ+${Math.round(T)} δλ</span><span>📏 ${alt<10?alt.toFixed(1).replace('.',','):Math.round(alt)} χλμ</span><span>⚡ ${Math.round(sp).toLocaleString('el-GR')} χλμ/ώρα</span><span>❌ ${err}</span>`;
   st.innerHTML='<b>'+P2.n+'</b>';

   if(p==3&&act&&!used){}
   svg.innerHTML=draw(P2,f2,alt,sp);
