<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Μίλης και Νάσα: τρέξε στο σπίτι!</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:linear-gradient(160deg,#fde68a,#fbcfe8);color:#1a1446;padding:12px;overflow-x:hidden}
.w{max-width:780px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
h1{font-size:clamp(20px,4.4vw,30px);margin:0;line-height:1.15}
.snd{font:inherit;font-size:22px;border:4px solid #1a1446;border-radius:99px;background:#fff;cursor:pointer;padding:2px 10px}
.pg{height:14px;border:3px solid #1a1446;border-radius:99px;background:#fff;overflow:hidden;margin:6px 0 12px}.pg i{display:block;height:100%;width:0;background:#35e0a6;transition:width .3s}
.card{background:#fff;border:5px solid #1a1446;border-radius:26px;box-shadow:8px 8px 0 #1a1446;padding:18px;position:relative}
.em{font-size:clamp(54px,14vw,84px);text-align:center;line-height:1.1}
.who{display:inline-block;background:#ffd23f;border:3px solid #1a1446;border-radius:99px;padding:2px 12px;font-weight:800;font-size:14px}
.sit{font-size:clamp(18px,3.6vw,23px);font-weight:700;margin:10px 0 14px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;font-size:clamp(16px,3.2vw,19px);text-align:left;padding:13px 16px;border:4px solid #1a1446;border-radius:18px;background:#f4f1ff;color:#1a1446;cursor:pointer;box-shadow:0 4px 0 #1a1446;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1a1446}
.opt.ok{background:#35e0a6}.opt.no{background:#ff9ec7}.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:16px;border:4px solid #1a1446;font-weight:700;font-size:clamp(15px,3vw,18px);display:none}
.fb.ok{background:#d9fbe9}.fb.no{background:#ffe1ef}
.btn{font:inherit;font-weight:800;font-size:18px;padding:11px 22px;border:4px solid #1a1446;border-radius:99px;background:#ffd23f;color:#1a1446;cursor:pointer;box-shadow:0 5px 0 #1a1446;margin-top:14px}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 #1a1446}
.stars{font-size:46px;text-align:center;letter-spacing:4px}
ul.r{margin:10px 0 0;padding-left:22px;line-height:1.5;font-weight:600}
.c{text-align:center}.sc2{font-size:clamp(20px,4vw,28px);font-weight:800;text-align:center;margin:6px 0}
.pt{position:fixed;font-size:26px;pointer-events:none;z-index:99;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pp .35s}@keyframes pp{50%{transform:scale(1.05)}}
.wid{background:#fff;border:4px solid #1a1446;border-radius:20px;padding:8px 12px;margin-bottom:12px;font-weight:800}
.bar{height:16px;border:3px solid #1a1446;border-radius:99px;background:#eee;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#35e0a6;transition:width .5s}
.row2{display:flex;align-items:center;gap:10px}
.ch{height:38px;width:auto;vertical-align:bottom}.trk{position:relative;height:84px}.lane{position:absolute;left:0;right:0;height:38px;border-bottom:4px dashed #1a1446aa}
.lane:nth-child(2){top:44px}.mv{position:absolute;bottom:0;font-size:30px;transition:left .7s cubic-bezier(.3,1.4,.6,1)}.home{position:absolute;right:0;bottom:0;font-size:32px}
.tr{display:flex;flex-wrap:wrap;gap:4px;min-height:34px}.tr span{border:3px solid #1a1446;border-radius:12px;padding:0 6px;font-size:20px;animation:pp .35s}.tr .g{background:#35e0a6}.tr .b{background:#ff9ec7}
.bt{flex:1;height:26px;border:4px solid #1a1446;border-radius:10px;background:#fff;overflow:hidden}.bt i{display:block;height:100%;transition:width .6s,background .6s}
.msg{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px}.av{font-size:44px}
.bb{background:#e9e4ff;border:4px solid #1a1446;border-radius:6px 22px 22px 22px;padding:10px 14px;font-weight:700;font-size:clamp(17px,3.4vw,21px);line-height:1.35;min-width:70px}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#1a1446;margin:0 3px;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{50%{transform:translateY(-7px)}}
.swc{touch-action:pan-y;cursor:grab;user-select:none;margin:0 auto;max-width:520px;text-align:center}
.lbl{position:absolute;top:12px;font-weight:900;font-size:20px;opacity:0;border:4px solid;border-radius:12px;padding:2px 10px;background:#fff}.lbl.l{left:10px;color:#e11d48}.lbl.r{right:10px;color:#059669}
.sb{display:flex;gap:14px;justify-content:center}.sb .btn{font-size:26px}
.dc{touch-action:none;cursor:grab;user-select:none;max-width:420px;margin:0 auto 14px;text-align:center;z-index:5}
.bks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bk{border:4px dashed #1a1446;border-radius:20px;padding:12px 6px;text-align:center;font-weight:800;font-size:clamp(13px,2.8vw,17px);min-height:92px;cursor:pointer;transition:transform .15s,background .15s}
.bk b{display:block;font-size:30px}.bk.h{transform:scale(1.07);background:#fff!important}

const APP={"mode": "race", "how": "🏠 Βοήθησε τον Μίλη και τη Νάσα να φτάσουν σπίτι! Σωστή απάντηση = προχωράνε. Λάθος = ο χάκερ 🦹 πλησιάζει και χάνεις μία ασπίδα 🛡️. Με 3 σωστά στη σειρά παίρνεις πίσω μια ασπίδα!", "id": "sfmn", "title": "Μίλης και Νάσα: τρέξε στο σπίτι!", "who": "Ο Μίλης και η Νάσα", "intro": "Ο Μίλης και η Νάσα χρειάζονται τη βοήθειά σου! Διάλεξε τι πρέπει να κάνουν σε κάθε περίπτωση.", "n": 10, "rules": ["Δεν δίνω ποτέ τον κωδικό μου, ούτε στους φίλους μου.", "Δεν λέω προσωπικά στοιχεία σε αγνώστους.", "Αν κάτι με κάνει να νιώθω άβολα, το λέω αμέσως σε έναν μεγάλο που εμπιστεύομαι.", "Πριν πιστέψω ή στείλω κάτι παρακάτω, το ελέγχω.", "Κατεβάζω προγράμματα και παιχνίδια μόνο από επίσημα μέρη και με άδεια."], "pool": [{"e": "🕵️", "s": "Ο Μίλης παίζει online. Ένας άγνωστος γράφει: «Γεια! Πώς σε λένε και πού μένεις;»", "g": "Δεν απαντώ και το λέω σε έναν μεγάλο.", "b": ["Του λέω το όνομα και τη διεύθυνσή μου.", "Του λέω μόνο τη γειτονιά μου."], "f": "Σε αγνώστους δεν λέμε ούτε όνομα ούτε πού μένουμε, ούτε λίγο, ούτε πολύ.", "c": "🕵️ Άγνωστοι"}, {"e": "🎁", "s": "Η Νάσα παίρνει μήνυμα: «Κέρδισες ένα κινητό! Πάτα εδώ για να το πάρεις!»", "g": "Δεν πατάω το σύνδεσμο και δείχνω το μήνυμα σε έναν μεγάλο.", "b": ["Πατάω γρήγορα πριν χάσω το δώρο.", "Το στέλνω σε όλους τους φίλους μου."], "f": "Τα «δώρα» που έρχονται από το πουθενά είναι συνήθως απάτη.", "c": "🎣 Απάτες"}, {"e": "🔑", "s": "Ένας «φίλος» από το παιχνίδι λέει στον Μίλη: «Δώσε μου τον κωδικό σου και θα σου χαρίσω νομίσματα!»", "g": "Λέω «όχι»: ο κωδικός μου είναι μυστικό.", "b": ["Του δίνω τον κωδικό, αφού είναι φίλος.", "Του δίνω μόνο τα μισά γράμματα."], "f": "Ο κωδικός είναι μυστικός και δεν τον δίνουμε σε κανέναν, εκτός από τον γονιό μας.", "c": "🔑 Κωδικοί"}, {"e": "📸", "s": "Ο Μίλης θέλει να ανεβάσει μια φωτογραφία με τη σχολική του στολή, όπου φαίνεται το όνομα του σχολείου.", "g": "Ρωτάω πρώτα τους γονείς μου και κρύβω τα στοιχεία.", "b": ["Την ανεβάζω αμέσως για να τη δουν όλοι.", "Την ανεβάζω και γράφω και τη διεύθυνση του σχολείου."], "f": "Μια φωτογραφία μπορεί να δείξει πού μένουμε και πού πηγαίνουμε σχολείο.", "c": "📸 Φωτογραφίες"}, {"e": "📹", "s": "Ένας άγνωστος ζητά από τη Νάσα να ανοίξει την κάμερα για να τα πουν.", "g": "Λέω «όχι», κλείνω τη συζήτηση και το λέω σε έναν μεγάλο.", "b": ["Ανοίγω την κάμερα μόνο για λίγο.", "Ανοίγω την κάμερα, αφού φαίνεται ευγενικός."], "f": "Με αγνώστους δεν ανοίγουμε κάμερα και δεν συναντιόμαστε ποτέ.", "c": "🕵️ Άγνωστοι"}, {"e": "⚠️", "s": "Στον υπολογιστή της Νάσας βγαίνει παράθυρο: «Ο υπολογιστής σου έχει ιό! Κατέβασε αυτό το πρόγραμμα!»", "g": "Κλείνω το παράθυρο και ειδοποιώ τον δάσκαλο ή τον γονιό.", "b": ["Πατάω «Κατέβασμα» για να λυθεί το πρόβλημα.", "Δίνω τα στοιχεία μου στο παράθυρο."], "f": "Τα παράθυρα που τρομάζουν και πιέζουν είναι συνήθως παγίδες.", "c": "🎣 Απάτες"}, {"e": "🔐", "s": "Ο Μίλης φτιάχνει κωδικό για το email του. Ποιος είναι ο καλύτερος;", "g": "Ένας μακρύς κωδικός με γράμματα, αριθμούς και σύμβολα που μπορώ να θυμάμαι.", "b": ["1234", "Μίλης2015 (όνομα και έτος γέννησης)"], "f": "Ο δυνατός κωδικός είναι μακρύς, μπερδεμένος και δεν έχει προσωπικά στοιχεία.", "c": "🔑 Κωδικοί"}, {"e": "😢", "s": "Η Νάσα έλαβε ένα μήνυμα που την έκανε να νιώσει άσχημα και φοβισμένη.", "g": "Το λέω αμέσως σε έναν μεγάλο που εμπιστεύομαι.", "b": ["Το κρατώ μυστικό για να μη με μαλώσουν.", "Απαντώ με άσχημα λόγια."], "f": "Δεν φταίμε εμείς. Όταν μιλάμε σε έναν μεγάλο, βρίσκουμε βοήθεια πιο εύκολα.", "c": "❤️ Συναισθήματα"}, {"e": "💻", "s": "Ο Μίλης τελείωσε στον υπολογιστή του εργαστηρίου, αλλά είναι ακόμη συνδεδεμένος στο email του.", "g": "Κάνω «Αποσύνδεση» πριν φύγω.", "b": ["Αφήνω τον υπολογιστή ανοιχτό, κάποιος θα τον κλείσει.", "Λέω στον διπλανό μου τον κωδικό για να τον κλείσει."], "f": "Στους κοινούς υπολογιστές κάνουμε πάντα αποσύνδεση.", "c": "🛡️ Προστασία"}, {"e": "🔎", "s": "Η Νάσα ψάχνει πληροφορίες για μια εργασία και βρίσκει μια άγνωστη σελίδα.", "g": "Ελέγχω την πληροφορία και σε μια δεύτερη αξιόπιστη πηγή.", "b": ["Αντιγράφω αμέσως ό,τι βρω.", "Πιστεύω την πρώτη σελίδα που βγήκε."], "f": "Για να είμαστε σίγουροι, συγκρίνουμε πάντα περισσότερες από μία πηγές.", "c": "🔎 Αλήθεια"}, {"e": "🎂", "s": "Μια εφαρμογή λέει «Μόνο για 13 ετών και άνω», αλλά ο Μίλης είναι 9.", "g": "Ρωτάω τους γονείς μου και δεν λέω ψέματα για την ηλικία μου.", "b": ["Γράφω ότι είμαι 14 και συνεχίζω.", "Πατάω «Αποδοχή» χωρίς να διαβάσω."], "f": "Οι όροι ηλικίας υπάρχουν για να μας προστατεύουν.", "c": "📜 Κανόνες"}, {"e": "🤝", "s": "Ένα παιδί από την παρέα δείχνει στη Νάσα μια φωτογραφία άλλου παιδιού, για να γελάσουν.", "g": "Δεν τη στέλνω παρακάτω και του λέω να τη σβήσει.", "b": ["Την προωθώ για πλάκα.", "Γελάω και την αποθηκεύω."], "f": "Ό,τι στέλνουμε μπορεί να πληγώσει κάποιον και δεν σβήνεται εύκολα.", "c": "🤝 Σεβασμός"}, {"e": "🎮", "s": "Στο παιχνίδι ο Μίλης βλέπει διαφήμιση: «Αγόρασε νομίσματα με την κάρτα των γονιών σου!»", "g": "Δεν αγοράζω τίποτα χωρίς να ρωτήσω τους γονείς μου.", "b": ["Παίρνω κρυφά την κάρτα και αγοράζω.", "Αγοράζω μόνο λίγα, δεν θα το καταλάβουν."], "f": "Αγορές κάνουμε μόνο με άδεια και παρουσία των γονιών μας.", "c": "🎮 Παιχνίδια"}, {"e": "📧", "s": "Η Νάσα παίρνει email από άγνωστο με συνημμένο αρχείο «φωτογραφίες_διακοπών.exe».", "g": "Δεν το ανοίγω και το δείχνω σε έναν μεγάλο.", "b": ["Το ανοίγω, ίσως είναι αστείο.", "Το στέλνω στους φίλους μου."], "f": "Άγνωστα συνημμένα αρχεία μπορεί να κρύβουν ιούς.", "c": "🎣 Απάτες"}, {"e": "📍", "s": "Μια εφαρμογή ρωτά τον Μίλη: «Να δείχνεις πάντα πού βρίσκεσαι;»", "g": "Πατάω «Όχι» ή ρωτάω τους γονείς μου.", "b": ["Πατάω «Ναι» αμέσως.", "Πατάω «Ναι» για να βλέπουν όλοι πού είμαι."], "f": "Η τοποθεσία μας δείχνει πού βρισκόμαστε, γι’ αυτό δεν τη μοιραζόμαστε με όλους.", "c": "🛡️ Προστασία"}, {"e": "📶", "s": "Η Νάσα είναι σε καφετέρια με ελεύθερο wifi και θέλει να μπει στο email της.", "g": "Περιμένω να γυρίσω σπίτι ή ρωτάω έναν μεγάλο.", "b": ["Μπαίνω κανονικά και γράφω τον κωδικό μου.", "Γράφω τα στοιχεία μου, αφού το wifi είναι δωρεάν."], "f": "Στα ανοιχτά δίκτυα οι κωδικοί μας μπορεί να κλαπούν.", "c": "🛡️ Προστασία"}, {"e": "👥", "s": "Ο Μίλης παίρνει αίτημα φιλίας από κάποιον που δεν γνωρίζει, με φωτογραφία ενός παιδιού.", "g": "Δεν τον δέχομαι, δεν τον ξέρω στην πραγματική ζωή.", "b": ["Τον δέχομαι, φαίνεται συνομήλικός μου.", "Τον δέχομαι, έχει κοινούς φίλους."], "f": "Πίσω από μια ψεύτικη φωτογραφία μπορεί να κρύβεται οποιοσδήποτε.", "c": "🕵️ Άγνωστοι"}, {"e": "💬", "s": "Στην ομαδική συζήτηση της τάξης κάποιοι κοροϊδεύουν ένα παιδί.", "g": "Δεν συμμετέχω, το λέω στον δάσκαλο και στηρίζω το παιδί.", "b": ["Γράφω κι εγώ, όλοι το κάνουν.", "Δεν κάνω τίποτα, δεν με αφορά."], "f": "Ο διαδικτυακός εκφοβισμός πληγώνει. Μιλάμε και βοηθάμε.", "c": "🤝 Σεβασμός"}, {"e": "🔔", "s": "Η Νάσα βλέπει είδηση: «Σκάνδαλο! Τα σχολεία κλείνουν αύριο!» σε μια άγνωστη σελίδα.", "g": "Ελέγχω σε επίσημη σελίδα πριν το πιστέψω ή το στείλω.", "b": ["Το στέλνω στην τάξη αμέσως.", "Το πιστεύω, γράφει «Σκάνδαλο»."], "f": "Τα ψεύτικα νέα διαδίδονται γρήγορα. Πρώτα ελέγχουμε.", "c": "🔎 Αλήθεια"}, {"e": "⏰", "s": "Ο Μίλης παίζει από το απόγευμα και έχει πια νυχτώσει.", "g": "Σταματώ και κάνω κάτι άλλο: διαβάζω, παίζω έξω ή ξεκουράζομαι.", "b": ["Παίζω λίγο ακόμα, μέχρι το πρωί.", "Κρύβομαι και παίζω στο κρεβάτι."], "f": "Ο ύπνος και η κίνηση μάς χρειάζονται. Βάζουμε όριο χρόνου.", "c": "⏰ Χρόνος"}, {"e": "💌", "s": "Μήνυμα: «Είμαστε η τράπεζα των γονιών σου. Στείλε μας τον αριθμό της κάρτας!»", "g": "Δεν απαντώ και το λέω στους γονείς μου.", "b": ["Στέλνω τον αριθμό, φαίνεται επίσημο.", "Ρωτάω τον άγνωστο ποιος είναι."], "f": "Οι τράπεζες δεν ζητούν στοιχεία από παιδιά μέσω μηνυμάτων.", "c": "🎣 Απάτες"}, {"e": "🖼️", "s": "Η Νάσα θέλει να βάλει στο προφίλ της φωτογραφία ολόκληρης της τάξης.", "g": "Ρωτάω πρώτα τα παιδιά και τους γονείς τους.", "b": ["Την ανεβάζω, είναι αστεία.", "Την ανεβάζω και γράφω τα ονόματα όλων."], "f": "Για φωτογραφίες άλλων ζητάμε πάντα άδεια.", "c": "📸 Φωτογραφίες"}, {"e": "🔗", "s": "Ένας άγνωστος στέλνει στον Μίλη σύνδεσμο: «Δες το αστείο βίντεο!»", "g": "Δεν πατάω και το δείχνω σε έναν μεγάλο.", "b": ["Πατάω, θα γελάσω.", "Πατάω και το στέλνω στους φίλους μου."], "f": "Οι άγνωστοι σύνδεσμοι μπορεί να οδηγούν σε επικίνδυνες σελίδες.", "c": "🎣 Απάτες"}, {"e": "🔒", "s": "Η Νάσα έφτιαξε κωδικό και φοβάται ότι θα τον ξεχάσει.", "g": "Τον γράφω σε ασφαλές μέρος που ξέρω μόνο εγώ και ο γονιός μου.", "b": ["Τον κολλάω σε χαρτάκι πάνω στην οθόνη.", "Τον λέω σε όλους, για να τον θυμόμαστε."], "f": "Ο κωδικός δεν πρέπει να φαίνεται σε άλλους.", "c": "🔑 Κωδικοί"}, {"e": "🏆", "s": "Ο Μίλης κέρδισε στο παιχνίδι και ένας παίκτης του γράφει: «Είσαι χάλια!»", "g": "Δεν απαντώ άσχημα· μπλοκάρω και αναφέρω τον παίκτη.", "b": ["Του απαντώ με χειρότερα λόγια.", "Του λέω ότι θα τον βρω."], "f": "Στα παιχνίδια μπλοκάρουμε και αναφέρουμε όσους μάς προσβάλλουν.", "c": "🎮 Παιχνίδια"}, {"e": "🗣️", "s": "Φίλοι λένε στη Νάσα ότι ο αγαπημένος της youtuber τούς έστειλε μήνυμα και ζητά 5 ευρώ.", "g": "Δεν δίνω χρήματα και ρωτάω έναν μεγάλο.", "b": ["Τα δίνω, είναι ο αγαπημένος μου youtuber.", "Δίνω 1 ευρώ να δω αν είναι αληθινός."], "f": "Ψεύτικοι λογαριασμοί προσποιούνται τους διάσημους για να κλέψουν.", "c": "🎣 Απάτες"}, {"e": "📝", "s": "Ο Μίλης γράφει εργασία και βρήκε έτοιμο κείμενο στο διαδίκτυο.", "g": "Το διαβάζω, γράφω με δικά μου λόγια και λέω από πού το πήρα.", "b": ["Το αντιγράφω όπως είναι.", "Αλλάζω μόνο τον τίτλο."], "f": "Δεν αντιγράφουμε. Γράφουμε με δικά μας λόγια και αναφέρουμε την πηγή.", "c": "🔎 Αλήθεια"}, {"e": "🤫", "s": "Ένας «φίλος» στο chat ζητά από τη Νάσα να κρατήσουν μυστικό ότι μιλάνε.", "g": "Δεν κρατώ τέτοιο μυστικό και το λέω σε έναν μεγάλο.", "b": ["Το κρατώ μυστικό, δεν χάλασε κάτι.", "Το κρατώ και του στέλνω μια φωτογραφία."], "f": "Όποιος ζητά να κρύψουμε κάτι από τους γονείς μας, μάς βάζει σε κίνδυνο.", "c": "🕵️ Άγνωστοι"}, {"e": "📱", "s": "Το κινητό του Μίλη ζητά ενημέρωση ασφαλείας.", "g": "Ρωτάω τον γονιό και την κάνω από let snd=true,AC=window.AudioContext||window.webkitAudioContext,ac;

function burst(x,y,arr,n){for(let k=0;k<(n||14);k++){const s=document.createElement('span');s.className='pt';s.textContent=arr[k%arr.length];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*6.28,d=60+Math.random()*130;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d-40+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
const cen=el=>{const r=(el||document.body).getBoundingClientRect();return[r.left+r.width/2,r.top+Math.min(r.height/2,200)]};
let lost=0,missed=[],q=[],i=0,sc=0,wr=0,streak=0,best=0,meter=50,done=false,tm=0,pts=0;

function start(){
 const P=APP.pool.map((x,k)=>({...x,k}));
 let fresh=sh(P.filter(x=>!seen.includes(x.k))),old=sh(P.filter(x=>seen.includes(x.k)));
 if(fresh.length<APP.n){seen=[];fresh=sh(P);old=[]}
 q=fresh.concat(old).slice(0,APP.n);
 try{seen=seen.concat(q.map(x=>x.k));localStorage.setItem(SEEN,JSON.stringify(seen))}catch(e){}

 const w=$('#wid');w.className='wid';
 if(M=='race')w.innerHTML='<div class="row2" style="margin-bottom:4px"><b>Ασπίδες:</b><span class="shd" id="shd">🛡️🛡️🛡️</span><span id="rmsg" style="font-size:14px;font-weight:700"></span></div><div class="trk"><div class="lane"><span class="scn"><i>🌳</i><i>🏫</i><i>⛲</i><i>🏪</i><i>🌳</i></span><span class="mv" id="hero" style="left:12%"><img class="ch" src="'+DOG+'"><img class="ch" src="'+CAT+'"></span><span class="home">🏠</span></div><div class="lane"><span class="mv" id="bad" style="left:0">🦹</span></div></div>';

 else if(M=='battery')w.innerHTML='<div class="row2"><span id="bf" style="font-size:34px">😀</span><span>🔋 Ενέργεια</span><div class="bt"><i id="bi" style="width:50%;background:#facc15"></i></div><b id="bp">50%</b></div>';
 else if(M=='xp')w.innerHTML='<div class="row2"><span id="hr">❤️❤️❤️</span><b id="lv">Επίπεδο 1</b><div class="bar"><i id="xi" style="width:0"></i></div></div>';
 else if(M=='swipe')w.innerHTML='<div class="row2"><span>🔥 <b id="cb">0</b></span><span>⭐ <b id="sp">0</b></span><div class="bar"><i id="tmb" style="width:100%;background:#facc15;transition:none"></i></div></div>';

function updW(ok){
 if(M=='race'){let m='';if(ok){if(streak>0&&streak%3==0&&lost>0){lost--;m='🚀 3 στη σειρά! Πήρες πίσω μια ασπίδα!'}}else lost++;const hl=12+sc/N()*66,gap=(3-Math.min(lost,3))/3*12;$('#hero').style.left=hl+'%';$('#bad').style.left=Math.max(0,hl-gap)+'%';$('#shd').textContent='🛡️'.repeat(Math.max(0,3-lost))+'💔'.repeat(Math.min(3,lost));const rm=$('#rmsg');rm.textContent=lost>=3?'🦹 Ο χάκερ σε πλησίασε πολύ!':m;if(!ok){$('#bad').classList.add('cgt');setTimeout(()=>$('#bad').classList.remove('cgt'),500)}}

 if(M=='xp'){$('#hr').textContent='❤️'.repeat(Math.max(0,3-wr))+'🖤'.repeat(Math.min(3,wr));const lv=1+Math.floor(sc/3);$('#lv').textContent='Επίπεδο '+lv;$('#xi').style.width=((sc%3)/3*100)+'%';if(ok&&sc%3==0&&sc>0){sUP();const[x,y]=cen($('#lv'));burst(x,y,['⭐','🏅','✨'],18);$('#lv').textContent='⬆️ Επίπεδο '+lv+'!'}}
