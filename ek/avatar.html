<style>

<header style="background:linear-gradient(135deg,#f59e0b,#ec4899)"><h1>🧑‍🎨 Φτιάχνω τον ήρωά μου</h1><p>Διάλεξε πρόσωπο, μαλλιά, μάτια και αξεσουάρ και φτιάξε το δικό σου avatar</p></header>
<main><div class="card"><div id="ed"></div>
<div class="row" style="margin-top:12px"><label>Όνομα:</label><input type="text" id="nm" maxlength="16" placeholder="Το όνομά μου"><button class="bt" id="rnd">🎲 Τυχαίο</button></div>
