<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:18px}

<script>

let S,sp=0,sel=null,tab='bg',uid=1,undo=[];

 space:(w,h)=>`<rect width="${w}" height="${h}" fill="#0f172a"/>${stars(w,h,40)}<circle cx="${w*.78}" cy="${h*.3}" r="${h*.14}" fill="#f97316"/><ellipse cx="${w*.78}" cy="${h*.3}" rx="${h*.24}" ry="${h*.04}" fill="none" stroke="#fde68a" stroke-width="4"/><circle cx="${w*.15}" cy="${h*.78}" r="${h*.08}" fill="#a78bfa"/>`,

 city:(w,h)=>{let b='';[[.05,.35,.14,'#64748b'],[.2,.2,.16,'#475569'],[.38,.4,.13,'#94a3b8'],[.53,.15,.15,'#64748b'],[.7,.3,.12,'#475569'],[.84,.45,.12,'#94a3b8']].forEach(([x,y,ww,c])=>{b+=`<rect x="${w*x}" y="${h*y}" width="${w*ww}" height="${h*(.8-y)}" fill="${c}"/>`;for(let j=0;j<6;j++)b+=`<rect x="${w*(x+.02+(j%2)*.055)}" y="${h*(y+.05+Math.floor(j/2)*.1)}" width="${w*.03}" height="${h*.05}" fill="#fde047"/>`});return `<rect width="${w}" height="${h}" fill="#bfdbfe"/>${b}<rect y="${h*.8}" width="${w}" height="${h*.2}" fill="#374151"/><rect x="0" y="${h*.89}" width="${w}" height="5" fill="#fde047" opacity=".8"/>`},
