<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Παιχνίδια για την ασφάλεια στο διαδίκτυο</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:linear-gradient(160deg,#bae6fd,#e9d5ff);color:#1a1446;padding:12px;overflow-x:hidden}
.w{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
h1{font-size:clamp(19px,4.2vw,28px);margin:0;line-height:1.15}h2{margin:0 0 6px;font-size:clamp(18px,3.6vw,24px)}
.b{font:inherit;font-weight:800;font-size:16px;padding:8px 16px;border:4px solid #1a1446;border-radius:99px;background:#ffd23f;color:#1a1446;cursor:pointer;box-shadow:0 4px 0 #1a1446}
.b:hover{transform:translateY(2px);box-shadow:0 2px 0 #1a1446}.b.w2{background:#fff}.b.g{background:#35e0a6}
.card{background:#fff;border:5px solid #1a1446;border-radius:24px;box-shadow:7px 7px 0 #1a1446;padding:16px;position:relative}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.mc{font:inherit;cursor:pointer;border:5px solid #1a1446;border-radius:22px;box-shadow:6px 6px 0 #1a1446;padding:14px 8px;text-align:center;color:#1a1446;font-weight:800;position:relative;transition:transform .15s}
.mc:nth-child(odd){transform:rotate(-1deg)}.mc:nth-child(even){transform:rotate(1deg)}.mc:hover{transform:rotate(0) translateY(-4px)}
.mc b{display:block;font-size:46px;line-height:1.15}.mc .ck{position:absolute;top:6px;right:8px;font-size:24px}
.msg{font-weight:700;margin:6px 0 10px;font-size:clamp(15px,3vw,18px)}
.fb{margin-top:10px;padding:10px 14px;border-radius:14px;border:4px solid #1a1446;font-weight:700;display:none}.fb.ok{background:#d9fbe9;display:block}.fb.no{background:#ffe1ef;display:block}
.pt{position:fixed;font-size:26px;pointer-events:none;z-index:99;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.c{text-align:center}.cr{font-size:12px;text-align:center;margin:14px 0 4px;opacity:.75}
/* maze */
#cv{display:block;margin:0 auto;border:5px solid #1a1446;border-radius:14px;background:#f0fdf4;max-width:100%;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:10px}.dp button{height:54px;font-size:26px}
/* scene */
.sc{position:relative;width:100%;max-width:540px;margin:0 auto;aspect-ratio:5/6;background:linear-gradient(#a5f3fc 0 64%,#fde68a 64%);border:5px solid #1a1446;border-radius:16px;overflow:hidden}
.ht{position:absolute;font:inherit;border:3px dashed transparent;background:none;cursor:pointer;line-height:1;padding:2px;border-radius:12px;transform:translate(-50%,-50%)}
.ht:hover{border-color:#1a1446}.ht.f{border:3px solid #059669;background:#d9fbe9aa}.ht.d{animation:shk .4s}
.pn{background:#fff;border:3px solid #1a1446;border-radius:8px;font-size:clamp(9px,1.9vw,13px);font-weight:700;padding:3px 5px;text-align:left;line-height:1.25}
/* bubbles */
.ar{position:relative;height:380px;border:5px solid #1a1446;border-radius:16px;background:linear-gradient(#e0f2fe,#fff);overflow:hidden}
.bu{position:absolute;bottom:-70px;border:4px solid #1a1446;border-radius:99px;padding:8px 14px;font-weight:800;font-size:clamp(13px,2.8vw,16px);cursor:pointer;animation:rise linear forwards;white-space:nowrap;font-family:inherit;color:#1a1446}
@keyframes rise{to{bottom:450px}}
.cloud{position:absolute;right:8px;top:6px;font-size:54px;opacity:.9;pointer-events:none}
.bar{height:16px;border:3px solid #1a1446;border-radius:99px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;transition:width .3s}
.pwi{width:100%;font:inherit;font-size:22px;padding:10px 14px;border:4px solid #1a1446;border-radius:16px}
.ck2{display:flex;gap:8px;align-items:center;font-weight:700;margin:4px 0}.ck2.y{color:#059669}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.pp{font-size:clamp(20px,5vw,30px);font-weight:800;text-align:center;padding:14px;background:#f4f1ff;border:4px solid #1a1446;border-radius:16px;font-family:'Courier New',monospace;word-break:break-all}
/* feel */
.fe{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.fe button{font:inherit;font-weight:800;border:4px solid #1a1446;border-radius:18px;background:#fff;padding:8px 4px;cursor:pointer;font-size:14px;box-shadow:0 4px 0 #1a1446}
.fe button b{display:block;font-size:40px}.fe button:hover{transform:translateY(2px)}.fe button.ok{background:#35e0a6}.fe button.no{background:#ffe1ef}
/* paint */
#art{width:100%;max-width:560px;display:block;margin:0 auto;border:5px solid #1a1446;border-radius:16px;background:#fff}#art .r{stroke:#1a1446;stroke-width:3;cursor:pointer;stroke-linejoin:round}
.pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.pal i{width:38px;height:38px;border-radius:50%;border:4px solid #1a1446;cursor:pointer;display:block}.pal i.s{outline:4px solid #ffd23f;transform:scale(1.15)}
/* puzzle */
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(92vw,360px);margin:0 auto;background:#1a1446;padding:4px;border-radius:12px}
.pz div{aspect-ratio:1;cursor:pointer;overflow:hidden;border-radius:6px;background:#334155}.pz svg{width:100%;height:100%;display:block}
/* poster */
.cb{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.cb label{border:3px solid #1a1446;border-radius:99px;padding:5px 12px;font-weight:700;cursor:pointer;background:#fff;font-size:14px}.cb input{display:none}.cb label.on{background:#35e0a6}
textarea,.in{width:100%;font:inherit;font-size:17px;padding:8px 12px;border:4px solid #1a1446;border-radius:14px}
#poster{border:6px solid #1a1446;border-radius:22px;padding:20px;background:linear-gradient(160deg,#fde68a,#fbcfe8,#bae6fd);text-align:center}
#poster ul{text-align:left;max-width:520px;margin:10px auto;font-weight:700;line-height:1.6;font-size:18px}
@media print{body{background:#fff;padding:0}.top,.cr,.noprint{display:none!important}.card{box-shadow:none;border:none}}
</style></head><body><div class="w">

 puz._s=x=>{a=x;over=0;mv=0;render()};$('#nw').onclick=shuffle;$('#pv').onclick=()=>{const t=$('#tp');if(t.dataset.p){t.innerHTML='';t.dataset.p=''}else{t.dataset.p=1;t.innerHTML=`<svg viewBox="0 0 300 300" style="width:min(60vw,200px);margin-top:10px;border:4px solid #1a1446;border-radius:10px"><use href="#pic"/></svg>`}};shuffle()}
