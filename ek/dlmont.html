<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Αληθινή ή μοντάζ;</title><style>*{box-sizing:border-box}:root{--ink:#1a1446;--y:#ffd23f;--p:#ff6fae;--g:#35c46a;--b:#4aa8ff;--r:#e8452c}
body{margin:0;font-family:Fredoka,"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#241a66,#4b2f6b 60%,#1b1f6b);background-attachment:fixed}
header{text-align:center;padding:14px 12px 4px}h1{margin:0;font-size:clamp(24px,5vw,38px);text-shadow:0 3px 0 rgba(255,255,255,.7)}header p{margin:4px auto 0;max-width:720px;font-weight:600;font-size:clamp(15px,2.6vw,19px)}
main{max-width:860px;margin:10px auto 30px;padding:0 12px}
.card{background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px;position:relative;overflow:hidden}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,3vw,21px);padding:12px 22px;border-radius:999px;border:4px solid var(--ink);background:var(--y);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.g{background:#7ee8c4}.btn.p{background:#ffb3d9}.btn.b{background:#a5d4ff}.btn.w{background:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;margin-bottom:8px}.hud span{background:#f3efff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px}
.center{text-align:center}.big{font-size:clamp(46px,12vw,90px);line-height:1}.lead{font-size:clamp(16px,2.8vw,20px);font-weight:600;line-height:1.45}
.pop{animation:pop .35s both}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ok{color:#14803a}.no{color:#c2301a}.fb{min-height:48px;text-align:center;font-weight:800;font-size:clamp(16px,3vw,20px);margin:8px 0}

body{color:#fff}header h1{text-shadow:0 3px 0 #000a}.card{background:#1d1745;border-color:#fff;box-shadow:0 8px 0 #000a}.hud span{background:#2c2466;border-color:#fff;color:#fff}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}.tabs button{font:inherit;font-weight:800;width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#2c2466;color:#fff;cursor:pointer}.tabs button.on{background:var(--y);color:var(--ink)}.tabs button.dn{background:#35c46a;color:#fff}
.frame{position:relative;display:block;width:fit-content;margin:0 auto;border:6px solid #f7e7b4;border-radius:6px;box-shadow:0 0 0 3px #7a5c1e,0 12px 30px #000a;max-width:100%;line-height:0;cursor:crosshair;background:#000}.frame img{max-width:100%;max-height:72vh;width:auto;height:auto;display:block;margin:0 auto;-webkit-user-drag:none;user-select:none}
.ring{position:absolute;border-radius:50%;border:4px dashed #ff5a3c;background:rgba(255,90,60,.16);pointer-events:none;animation:pop .35s both}.ring.h{border-color:#6cc4ff;background:rgba(108,196,255,.14);animation:hint 1.5s both}@keyframes hint{0%,100%{opacity:0}30%,70%{opacity:1}}
.cred{font-size:12px;opacity:.7;text-align:center;margin-top:6px}
.found{display:grid;gap:6px;margin:10px 0}.found div{background:#2c2466;border:3px solid #ffd23f;border-radius:12px;padding:8px 12px;font-weight:600;font-size:clamp(14px,2.5vw,17px);animation:pop .3s both;line-height:1.4}.found b{color:#ffd23f}
.fb{color:#fff}.fb .no{color:#ff9d8a}.fb .ok{color:#7ee8a8}.lead{color:#fff}
.q{display:block;width:100%;text-align:left;font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;border:3px solid #fff;background:#2c2466;color:#fff;margin:8px 0;cursor:pointer;font-size:clamp(15px,2.8vw,18px)}.q.ok{background:#1f8f4f}.q.no{background:#a4332a}
</style></head><body><header><h1>🖼️ Αληθινή ή μοντάζ;</h1><p>Επίσκεψη σε γκαλερί με φωτογραφίες-μοντάζ: βρες τα αδύνατα!</p></header><main><div class="card" id="app"><div id="intro" class="center"><div class="big">🖼️</div><p class="lead">Σήμερα επισκεπτόμαστε μια <b>γκαλερί με φωτογραφίες-μοντάζ</b>.<br>Είναι δημιουργίες καλλιτεχνών που ενώνουν εικόνες με πρόγραμμα. Σε κάθε εικόνα βρες τα στοιχεία που είναι <b>αδύνατον</b> να υπάρχουν στην πραγματικότητα.</p><div class="row"><button class="btn" onclick="start()">▶ Μπαίνουμε στην γκαλερί</button></div></div><div id="g" style="display:none"></div></div></main><script>
const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);

const IM=[
{f:'camera',w:752,h:1132,t:'Ο δρόμος και η μηχανή',cr:'Πηγή: διαδίκτυο',hs:[[370,690,85,'Ο δρόμος μέσα στον φακό','Μέσα από τον φακό φαίνεται ο δρόμος να συνεχίζεται σαν «παράθυρο». Ένας φακός δεν δείχνει έτσι!'],[345,620,215,'Γιγάντια φωτογραφική μηχανή','Η μηχανή είναι τεράστια, μεγαλύτερη από τα δέντρα και τον δρόμο. Δεν υπάρχει τέτοια μηχανή στο βουνό!']]},
{f:'earth',w:675,h:900,t:'Ο άνθρωπος-Γη',cr:'Πηγή: διαδίκτυο (τράπεζα εικόνων)',hs:[[310,285,100,'Η Γη στη θέση του κεφαλιού','Ένας άνθρωπος δεν μπορεί να έχει ολόκληρο τον πλανήτη για κεφάλι.'],[395,300,62,'Κομμάτια που σκάνε','Η Γη «θρυμματίζεται» σαν πέτρα. Αυτό φτιάχτηκε με πρόγραμμα για να περάσει ένα μήνυμα για το περιβάλλον.'],[330,460,105,'Υδατογράφημα','Τα γράμματα στη μέση δείχνουν ότι η εικόνα ανήκει σε εταιρεία φωτογραφιών. Δεν επιτρέπεται να την χρησιμοποιούμε ελεύθερα: ένας ακόμα τρόπος να ελέγχουμε την πηγή!']]},
{f:'book',w:886,h:1280,t:'Το μαγικό βιβλίο',cr:'Πηγή: διαδίκτυο',hs:[[300,500,150,'Τοπίο μέσα στη σελίδα','Η σελίδα ανοίγει σαν παράθυρο σε ένα καταπράσινο τοπίο, ενώ γύρω η γη είναι ξερή.'],[560,690,80,'Το παιδί είναι μικροσκοπικό','Το παιδί δείχνει πόσο τεράστιο είναι το βιβλίο. Το μέγεθος μάς ξεγελά!'],[400,1080,230,'Σκιές κλαδιών χωρίς δέντρα','Βλέπουμε σκιές από κλαδιά, αλλά δεν υπάρχει κανένα δέντρο γύρω!'],[620,380,230,'Γιγάντιο βιβλίο','Το βιβλίο είναι μεγαλύτερο από ένα σπίτι. Δεν υπάρχει βιβλίο σε τέτοιο μέγεθος.']]},
{f:'bike',w:602,h:339,t:'Ποδηλάτης στη θάλασσα',cr:'Πηγή: διαδίκτυο',hs:[[300,175,85,'Ποδηλάτης μισός μέσα στη θάλασσα','Το πάνω μέρος είναι μέσα στη θάλασσα και το κάτω στον δρόμο: δύο διαφορετικές φωτογραφίες ενωμένες.'],[440,45,58,'Σελίδες που πετούν','Κομμάτια εφημερίδας αιωρούνται στον αέρα σαν πουλιά.'],[70,168,38,'Μπουκάλια που επιπλέουν','Τα μπουκάλια φαίνονται να επιπλέουν μπροστά από τη θάλασσα, σε λάθος σημείο.']]},
{f:'lake',w:700,h:532,t:'Η λίμνη-καθρέφτης',cr:'Πηγή: συλλογή «Photo Manipulation Ideas» (Erik Johansson)',hs:[[360,430,150,'Η λίμνη έσπασε σαν καθρέφτης','Το νερό είναι σπασμένο σε κομμάτια σαν γυαλί! Το νερό δεν σπάει έτσι.'],[395,335,78,'Καγιάκ στην ξερή γη','Ο άνθρωπος στέκεται σε καγιάκ πάνω σε στεριά, χωρίς νερό.'],[325,100,55,'Ρωγμή στον ουρανό','Μια λεπτή γραμμή «σπάει» τον ουρανό. Ο ουρανός δεν σπάει!']]},
{f:'bubble',w:1600,h:1120,t:'Το σπίτι στη φούσκα',cr:'Πηγή: διαδίκτυο',hs:[[800,800,190,'Νησί στον αέρα','Ένα κομμάτι γης αιωρείται στον ουρανό χωρίς να στηρίζεται πουθενά.'],[790,470,240,'Σπίτι μέσα σε φούσκα','Ολόκληρο σπίτι μέσα σε γυάλινη φούσκα. Αδύνατον να υπάρχει έτσι!'],[320,890,120,'Γιγάντιοι ιοί','Οι ιοί είναι τόσο μικροί που δεν φαίνονται. Εδώ είναι τεράστιοι, για να κάνουν εντύπωση.'],[817,598,30,'Άνθρωπος-μυρμήγκι','Ο άνθρωπος είναι μικροσκοπικός μπροστά στο σπίτι. Παίζει με το μέγεθος!']]},
{f:'beach',w:700,h:697,t:'Η παραλία-γκρεμός',cr:'Πηγή: συλλογή «Photo Manipulation Ideas» (Jati Putra Pratama)',hs:[[300,520,200,'Θάλασσα σαν τοίχος','Η θάλασσα «γέρνει» κάθετα σαν γκρεμός. Η φωτογραφία έχει γυριστεί και ενωθεί με τον ουρανό.'],[420,320,110,'Άνθρωποι που στέκονται στο νερό','Οι άνθρωποι φαίνονται να στέκονται πάνω σε «τοίχο». Η βαρύτητα δεν δουλεύει έτσι!'],[60,400,110,'Ο ουρανός δεν συνεχίζεται','Στα αριστερά ο ουρανός γίνεται μια κάθετη, άδεια λευκή επιφάνεια. Το τοπίο δεν έχει νόημα.']]}
];
const QZ=[['Πότε μια φωτογραφία-μοντάζ είναι τέχνη;',['Όταν ο δημιουργός δείχνει ότι είναι φαντασία','Όταν κανείς δεν την βλέπει','Όταν είναι ασπρόμαυρη']],['Πότε το μοντάζ γίνεται ψέμα;',['Όταν μας λένε ότι είναι αληθινή φωτογραφία, ενώ δεν είναι','Όταν έχει χρώματα','Όταν είναι μεγάλη']],['Τι κάνω πριν πιστέψω μια φωτογραφία σε είδηση;',['Ψάχνω ποιος την έβγαλε και πού δημοσιεύτηκε','Τη μοιράζομαι αμέσως','Μετράω τα like']]];
let si=0,found=[],done=[],miss=0,qi,qs;
function start(){$('intro').style.display='none';$('g').style.display='';go(0)}
function tabs(){return '<div class="tabs">'+IM.map((x,i)=>`<button class="${i==si?'on':done[i]?'dn':''}" onclick="go(${i})">${i+1}</button>`).join('')+`<button class="${si==7?'on':''}" onclick="go(7)">🏁</button></div>`}
function go(i){si=i;found=[];miss=0;if(i==7)return fin();const S=IM[i];$('g').innerHTML=tabs()+'<div class="hud"><span>🖼️ '+S.t+'</span><span id="cnt">Βρέθηκαν 0 / '+S.hs.length+'</span></div><div class="frame" id="fr"><img id="im" src="/montaz/'+S.f+'.jpg" alt="'+S.t+'" draggable="false"></div><div class="cred">'+S.cr+'</div><div class="fb" id="fb">Πάτα πάνω σε ό,τι δεν γίνεται να υπάρχει στην πραγματικότητα!</div><div class="row"><button class="btn b" onclick="hint()">💡 Βοήθεια</button></div><div class="found" id="fd"></div>';$('fr').onclick=clk}
function ring(h,cls){const im=$('im'),r=im.getBoundingClientRect(),fr=$('fr').getBoundingClientRect();const sx=r.width/IM[si].w,sy=r.height/IM[si].h;const d=document.createElement('div');d.className='ring '+(cls||'');d.style.left=(r.left-fr.left+h[0]*sx-6)+'px';d.style.top=(r.top-fr.top+h[1]*sy-6)+'px';d.style.width=d.style.height=(h[2]*2*sx)+'px';d.style.marginLeft=d.style.marginTop=(-h[2]*sx)+'px';$('fr').appendChild(d);return d}
function clk(e){const S=IM[si],im=$('im'),r=im.getBoundingClientRect();const x=(e.clientX-r.left)*S.w/r.width,y=(e.clientY-r.top)*S.h/r.height;if(x<0||y<0||x>S.w||y>S.h)return;let hit=-1,br=1e9;S.hs.forEach((h,i)=>{if(!found.includes(i)&&Math.hypot(h[0]-x,h[1]-y)<=h[2]&&h[2]<br){hit=i;br=h[2]}});
 if(hit<0){miss++;$('fb').innerHTML='<span class="no">Εδώ δεν βλέπω κάτι αδύνατο. Ψάξε αλλού!</span>';return}
 found.push(hit);const h=S.hs[hit];ring(h);$('cnt').textContent='Βρέθηκαν '+found.length+' / '+S.hs.length;$('fb').innerHTML='<span class="ok">✅ Το βρήκες!</span>';const d=document.createElement('div');d.innerHTML='<b>'+h[3]+'.</b> '+h[4];$('fd').appendChild(d);
 if(found.length==S.hs.length){done[si]=1;$('fb').innerHTML='<span class="ok">🎉 Τα βρήκες όλα!</span>';const row=document.createElement('div');row.className='row';row.innerHTML='<button class="btn" onclick="go('+(si+1)+')">'+(si<6?'Επόμενη εικόνα ▶':'🏁 Τελικό κουίζ')+'</button>';$('fd').after(row);row.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function hint(){const S=IM[si],left=S.hs.filter((h,i)=>!found.includes(i));if(!left.length)return;const d=ring([left[0][0],left[0][1],left[0][2]+30],'h');setTimeout(()=>d.remove(),1600)}
function fin(){$('g').innerHTML=tabs()+'<div class="center"><div class="big">🏁</div><h2 style="margin:6px 0">Τελικό κουίζ</h2></div><div id="qz"></div>';qi=0;qs=0;qq()}
function qq(){const z=$('qz');if(qi>=QZ.length){z.innerHTML='<div class="center"><div class="big" style="font-size:60px">'+(qs==3?'🏆':'👍')+'</div><p class="lead">Σωστές: <b>'+qs+' / 3</b><br><br>Το μοντάζ μπορεί να είναι <b>τέχνη</b> όταν ξέρουμε ότι είναι φαντασία, και <b>ψέμα</b> όταν μας κρύβουν ότι έχει αλλαχτεί. Πάντα ελέγχω την πηγή!</p><div class="row"><button class="btn" onclick="go(0)">🔁 Ξανά από την αρχή</button></div></div>';return}const Q=QZ[qi];z.innerHTML='<h3 class="center" style="color:#ffd23f">'+Q[0]+'</h3><div id="op"></div>';sh(Q[1].map((t,k)=>[t,k])).forEach(([t,k])=>{const b=document.createElement('button');b.className='q';b.textContent=t;b.onclick=()=>{[...$('op').children].forEach(x=>x.style.pointerEvents='none');if(k==0){qs++;b.classList.add('ok')}else b.classList.add('no');setTimeout(()=>{qi++;qq()},1100)};$('op').appendChild(b)})}

</script></body></html>
