<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Φιδάκι</title><link href="https://fonts.googleapis.com/css2?family=Anek+Greek:wght@600;800&display=swap" rel="stylesheet"></head><body>
<script src="arc.js"></script>
<script>
const A=ARC,cx=A.cx;let GW=17,GH=15,T,OX,OY,snake,dir,queue,food,gold,score,stepT,stepDur,mode,dead,deadT,grow,eaten,rocks,tongue=0,level=1,EP=6;function spd(){return Math.max(.07,.34-(level-1)*.03-(eaten%EP)*.004)}
A.onResize=()=>{const top=60,bot=A.touch?150:20;GW=A.W>A.H?21:15;GH=A.W>A.H?15:19;T=Math.floor(Math.min((A.W-20)/GW,(A.H-top-bot)/GH));OX=Math.floor((A.W-GW*T)/2);OY=Math.floor(top+(A.H-top-bot-GH*T)/2)};A.onResize();
const D={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]},OPP={L:'R',R:'L',U:'D',D:'U'};
function free(x,y){return !snake.some(s=>s.x==x&&s.y==y)&&!rocks.some(r=>r.x==x&&r.y==y)&&!(food&&food.x==x&&food.y==y)&&!(gold&&gold.x==x&&gold.y==y)}
function spot(){for(let i=0;i<500;i++){const x=A.ri(0,GW-1),y=A.ri(0,GH-1);if(free(x,y))return {x,y}}return {x:0,y:0}}
const FR=['🍎','🍐','🍇','🍓','🍊','🍌','🍉','🥕'];
function start(m){mode=m;A.onResize();const cy=Math.floor(GH/2);snake=[{x:5,y:cy},{x:4,y:cy},{x:3,y:cy},{x:2,y:cy}];snake.forEach(s=>{s.px=s.x;s.py=s.y});dir='R';queue=[];rocks=[];if(m==2){for(let i=0;i<8;i++){const p=spot();if(Math.abs(p.y-cy)>1||p.x>9)rocks.push(p)}}food={...spot(),k:A.pick(FR)};gold=null;score=0;stepT=0;level=1;eaten=0;stepDur=spd();dead=false;grow=0;eaten=0;A.tip('Φάε τα φρουτάκια και μεγάλωσε! Μην χτυπήσεις την ουρά σου 🐍')}
function turn(d){if(dead||!A.running)return;const last=queue.length?queue[queue.length-1]:dir;if(d!=last&&d!=OPP[last]&&queue.length<3){queue.push(d);A.tone(300,.02,'square',.03)}}
A.onKey=k=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',a:'L',d:'R',w:'U',s:'D'}[k];if(m)turn(m)};
A.onPad=(k,on)=>{if(on)turn(k)};A.swipe(d=>{if(d!='tap')turn(d)});
function step(){if(queue.length)dir=queue.shift();const h=snake[0];let nx=h.x+D[dir][0],ny=h.y+D[dir][1];
 if(mode==1){nx=(nx+GW)%GW;ny=(ny+GH)%GH}
 if(nx<0||ny<0||nx>=GW||ny>=GH||snake.slice(0,-1).some(s=>s.x==nx&&s.y==ny)||rocks.some(r=>r.x==nx&&r.y==ny)){die();return}
 for(const s of snake){s.px=s.x;s.py=s.y}
 const tail=snake[snake.length-1];const nt={x:tail.x,y:tail.y,px:tail.x,py:tail.y};for(let i=snake.length-1;i>0;i--){snake[i].x=snake[i-1].x;snake[i].y=snake[i-1].y}h.x=nx;h.y=ny;
 if(grow>0){snake.push(nt);grow--}
 if(food&&nx==food.x&&ny==food.y){score+=10;grow+=1;eaten++;A.tone(500+eaten*10,.08,'square',.07);A.tone(800+eaten*10,.08,'square',.06,0,.06);A.burst(OX+(nx+.5)*T,OY+(ny+.5)*T,14,['#ff4d6d','#ffe14d','#7cff5c','#fff'],200,.6,3.5,0);A.text(OX+(nx+.5)*T,OY+ny*T,'+10','#fff',T*.8);food={...spot(),k:A.pick(FR)};if(eaten%EP==0){level++;A.coin();A.text(OX+GW*T/2,OY+GH*T/2,'🎚️ Επίπεδο '+level+'!','#ffe14d',T*1.3);if(level>=3||mode==2){for(let i=0;i<(mode==2?1:2);i++){const p=spot(),hh=snake[0];if(Math.abs(p.x-hh.x)+Math.abs(p.y-hh.y)>5)rocks.push(p)}}score+=20}stepDur=spd();if(eaten%5==0&&!gold)gold={...spot(),t:7}}
 if(gold&&nx==gold.x&&ny==gold.y){score+=50;grow+=3;A.coin();A.text(OX+(nx+.5)*T,OY+ny*T,'+50 ⭐','#ffe14d',T*.9);A.burst(OX+(nx+.5)*T,OY+(ny+.5)*T,24,['#ffe14d','#fff3a0','#ffb020'],260,.8,4,0);gold=null}}
function die(){dead=true;deadT=0;A.lose();A.noise(.3,800,100,.2);const [b,nb]=A.best('m'+mode,score);A.gameOver({title:'Ουπς! 🐍',score,msg:(nb?'🏆 Νέο ρεκόρ! ':'Ρεκόρ: '+b+' · ')+'Μήκος: '+snake.length,stars:score>=300?3:score>=150?2:score>=50?1:0,delay:1300});A.post(Math.min(30,eaten),30)}
A.setup({id:'snake',title:'Φιδάκι',emoji:'🐍🍎🍇',title2:'linear-gradient(180deg,#7ee04a,#1f8a3a)',cardBg:'#e2ffd8',desc:'Οδήγησε το φιδάκι να φάει τα φρούτα. Ξεκινά αργά· κάθε 6 φρούτα ανεβαίνεις επίπεδο, γίνεται πιο γρήγορο και εμφανίζονται βράχοι. Μην χτυπήσεις τους τοίχους και την ουρά σου!',
 modes:[{label:'🧱 Κλασικό',small:'με τοίχους',fn:()=>start(0)},{label:'🌀 Χωρίς τοίχους',small:'περνάς απέναντι',c:'c2',fn:()=>start(1)},{label:'🪨 Με βράχους',small:'πιο δύσκολο',c:'c3',fn:()=>start(2)}],
 help:'<b>←</b><b>↑</b><b>↓</b><b>→</b> ή <b>W</b><b>A</b><b>S</b><b>D</b> · στην οθόνη αφής: σύρε',bestText:()=>`🏆 Κλασικό: ${A.get('best.m0',0)} · Χωρίς τοίχους: ${A.get('best.m1',0)} · Βράχοι: ${A.get('best.m2',0)}`});
A.pad({right:{dpad:1}});
function lerp(a,b,k){return a+(b-a)*k}
A.loop((dt,t)=>{const W=A.W,H=A.H;
 if(A.running&&!dead&&snake){stepT+=dt;while(stepT>=stepDur){stepT-=stepDur;step();if(dead)break}if(gold){gold.t-=dt;if(gold.t<=0)gold=null}}
 if(dead)deadT+=dt;A.stepFX(dt);
 const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2f7d32');bg.addColorStop(1,'#1d5a24');cx.fillStyle=bg;cx.fillRect(0,0,W,H);
 cx.fillStyle='rgba(0,0,0,.25)';A.rr(cx,OX-10,OY-10,GW*T+20,GH*T+20,18);cx.fill();
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){cx.fillStyle=(x+y)%2?'#9be36a':'#8ad65a';cx.fillRect(OX+x*T,OY+y*T,T,T)}
 cx.strokeStyle=mode==1?'rgba(255,255,255,.35)':'#5a3a1a';cx.lineWidth=mode==1?3:8;if(mode==1)cx.setLineDash([8,8]);A.rr(cx,OX-4,OY-4,GW*T+8,GH*T+8,10);cx.stroke();cx.setLineDash([]);
 if(!snake)return;
 for(const r of rocks){const X=OX+r.x*T,Y=OY+r.y*T;const g=cx.createLinearGradient(X,Y,X+T,Y+T);g.addColorStop(0,'#b9bccb');g.addColorStop(1,'#62657a');cx.fillStyle=g;cx.beginPath();cx.moveTo(X+T*.15,Y+T*.85);cx.lineTo(X+T*.1,Y+T*.45);cx.lineTo(X+T*.35,Y+T*.15);cx.lineTo(X+T*.75,Y+T*.2);cx.lineTo(X+T*.9,Y+T*.6);cx.lineTo(X+T*.8,Y+T*.88);cx.closePath();cx.fill();cx.strokeStyle='#3d4052';cx.lineWidth=2;cx.stroke()}
 const pulse=1+Math.sin(t*6)*.08;
 if(food){cx.font=`${T*.85*pulse}px serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='rgba(0,0,0,.2)';cx.beginPath();cx.ellipse(OX+(food.x+.5)*T,OY+(food.y+.85)*T,T*.3,T*.1,0,0,7);cx.fill();cx.fillText(food.k,OX+(food.x+.5)*T,OY+(food.y+.48)*T)}
 if(gold){const X=OX+(gold.x+.5)*T,Y=OY+(gold.y+.5)*T;const gg=cx.createRadialGradient(X,Y,0,X,Y,T);gg.addColorStop(0,'rgba(255,240,150,.9)');gg.addColorStop(1,'rgba(255,200,0,0)');cx.fillStyle=gg;cx.beginPath();cx.arc(X,Y,T,0,7);cx.fill();cx.font=`${T*.8*pulse}px serif`;cx.textAlign='center';cx.textBaseline='middle';if(gold.t>2||Math.floor(t*8)%2)cx.fillText('⭐',X,Y)}
 // snake body
 const k=dead?1:Math.min(1,stepT/stepDur);const pts=snake.map((s,i)=>{let px=s.px,py=s.py;if(Math.abs(s.x-px)>1)px=s.x;if(Math.abs(s.y-py)>1)py=s.y;return [OX+(lerp(px,s.x,k)+.5)*T,OY+(lerp(py,s.y,k)+.5)*T]});
 const shk=dead&&deadT<.5?A.rnd(-3,3):0;cx.save();cx.translate(shk,0);cx.lineCap='round';cx.lineJoin='round';
 for(const [w,c] of [[T*.86,'#0f5a2a'],[T*.74,'#2fbf5a']]){cx.strokeStyle=c;cx.lineWidth=w;cx.beginPath();pts.forEach((p,i)=>{if(i&&Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1])>T*1.5)cx.moveTo(p[0],p[1]);else i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])});cx.stroke()}
 for(let i=1;i<pts.length;i++){const p=pts[i];cx.fillStyle=i%2?'#5be07f':'#43cc6a';cx.beginPath();cx.arc(p[0],p[1],T*.24*(1-i/pts.length*.4),0,7);cx.fill();cx.fillStyle='rgba(255,255,200,.35)';cx.beginPath();cx.arc(p[0]-T*.08,p[1]-T*.1,T*.08,0,7);cx.fill()}
 // head
 const [hx,hy]=pts[0];const dd=D[dir];const ang=Math.atan2(dd[1],dd[0]);cx.save();cx.translate(hx,hy);cx.rotate(ang);
 tongue+=dt;if(Math.sin(tongue*5)>.6&&!dead){cx.strokeStyle='#ff3d5a';cx.lineWidth=T*.07;cx.beginPath();cx.moveTo(T*.4,0);cx.lineTo(T*.7,0);cx.lineTo(T*.8,-T*.08);cx.moveTo(T*.7,0);cx.lineTo(T*.8,T*.08);cx.stroke()}
 const hg=cx.createRadialGradient(-T*.1,-T*.1,T*.05,0,0,T*.55);hg.addColorStop(0,'#8af0a8');hg.addColorStop(1,'#1f9a45');cx.fillStyle=hg;cx.beginPath();cx.ellipse(T*.05,0,T*.5,T*.44,0,0,7);cx.fill();cx.strokeStyle='#0f5a2a';cx.lineWidth=2;cx.stroke();
 for(const s of [-1,1]){cx.fillStyle='#fff';cx.beginPath();cx.arc(T*.12,s*T*.2,T*.15,0,7);cx.fill();cx.strokeStyle='#0f5a2a';cx.lineWidth=1.5;cx.stroke();if(dead){cx.strokeStyle='#1a1446';cx.lineWidth=2;cx.beginPath();cx.moveTo(T*.05,s*T*.2-T*.07);cx.lineTo(T*.19,s*T*.2+T*.07);cx.moveTo(T*.19,s*T*.2-T*.07);cx.lineTo(T*.05,s*T*.2+T*.07);cx.stroke()}else{cx.fillStyle='#1a1446';cx.beginPath();cx.arc(T*.17,s*T*.2,T*.08,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(T*.15,s*T*.2-T*.04,T*.03,0,7);cx.fill()}}
 cx.fillStyle='rgba(255,120,150,.5)';cx.beginPath();cx.ellipse(T*.3,-T*.3,T*.08,T*.05,0,0,7);cx.ellipse(T*.3,T*.3,T*.08,T*.05,0,0,7);cx.fill();cx.restore();cx.restore();
 A.drawFX();if(A.running||dead)A.hud(['⭐ '+score,'🎚️ '+level,'🐍 '+snake.length])});
</script></body></html>
