 {id:'pro',ic:'👤',n:'Το προφίλ',d:'Πότε φτιάχτηκε και τι έχει;',k:1,h:'Το προφίλ',x:'Ο λογαριασμός φτιάχτηκε πριν από 2 μέρες. Η φωτογραφία του υπάρχει και σε άλλες σελίδες. Δεν μπορείς να ξέρεις ποιος κρύβεται πίσω από τον λογαριασμό.'},
 {id:'fr',ic:'👥',n:'Κοινοί φίλοι',d:'Τον ξέρει κανείς από τους φίλους σου;',k:0,h:'Οι φίλοι',x:'Δεν έχετε κανέναν κοινό φίλο. Κανείς από την τάξη σου δεν τον ξέρει.'},
 {id:'ask',ic:'❓',n:'Τι ζητά;',d:'Ποιες πληροφορίες θέλει.',k:1,h:'Τι ζητά',x:'Ζητά πού μένεις και σε ποιο σχολείο πας. Τέτοιες προσωπικές πληροφορίες δεν τις δίνουμε σε ανθρώπους που δεν γνωρίζουμε πραγματικά.'},
 {id:'sec',ic:'🤫',n:'Το «μυστικό»',d:'Γιατί να μην το πεις;',k:1,h:'Το μυστικό',x:'Οι αληθινοί φίλοι δεν σου ζητούν να κρύψεις κάτι από τους γονείς ή τον δάσκαλό σου. Όταν κάποιος σου λέει «μην το πεις σε κανέναν», πρέπει να το πεις αμέσως σε έναν ενήλικα που εμπιστεύεσαι.'},
 {id:'do',ic:'✅',n:'Τι κάνω;',d:'Το σωστό βήμα.',k:1,h:'Το σωστό βήμα',x:'Δεν απαντάς και δεν δίνεις στοιχεία. Πατάς «Αποκλεισμός/Αναφορά» και το δείχνεις αμέσως σε γονιό ή δάσκαλο, ακόμα κι αν δεν έγινε κάτι κακό.'}],
 truth:'sus',opts:[['trust','🙂','Φίλος που μπορώ να εμπιστευτώ'],['sus','🚫','Ύποπτος: δεν δίνω στοιχεία'],['unk','🤷','Δεν μπορώ να ξέρω']],res:{sus:'Ύποπτος! Σωστά: δεν δίνεις στοιχεία και το λες σε έναν μεγάλο.'},
 why:'Στο διαδίκτυο ο καθένας μπορεί να παραστήσει οποιονδήποτε. Όποιος ζητά προσωπικά στοιχεία και μυστικά είναι ύποπτος.',rule:'Άγνωστος + προσωπικά στοιχεία + μυστικό = Σταμάτα, μπλόκαρε, πες το σε έναν μεγάλο.'}
];
const HAND=[['🖼️','Έλεγχος εικόνας','Μεγέθυνε και ψάξε λάθη ή περίεργες λεπτομέρειες.'],['🔎','Αντίστροφη αναζήτηση','Βρες από πού προέρχεται μια εικόνα ή ένα βίντεο.'],['👤','Ποιος το είπε;','Δες ποιος δημοσίευσε και αν είναι αξιόπιστος.'],['📰','Άλλες πηγές','Αν είναι σημαντικό, θα το γράψουν και άλλοι αξιόπιστοι.'],['📅','Ημερομηνία','Είναι νέο ή παλιό;'],['🔥','Πίεση και φόβος','Σε βιάζουν ή σε τρομάζουν; Σταμάτα και σκέψου.']];
const INTRO=[['Γεια σου, Ντετέκτιβ!','Είμαι ο βοηθός Ντετέκτιβ, ο Ντεξ! Θα είμαι δίπλα σου όσο ερευνάς στοιχεία, ελέγχεις πληροφορίες και λύνεις υποθέσεις.','ΚΑΛΩΣΟΡΙΣΕΣ!'],['Υπάρχουν παντού ειδήσεις','Στα κινητά, στα παιχνίδια και στις ομάδες της τάξης βλέπουμε κάθε μέρα ειδήσεις και μηνύματα. Μερικά είναι αληθινά και άλλα όχι.','ΤΟ ΠΡΟΒΛΗΜΑ'],['Εσύ θα ερευνήσεις','Σε κάθε υπόθεση θα δεις μια ανάρτηση από την Κύπρο και θα ψάξεις στοιχεία με τα εργαλεία του ντετέκτιβ.','Η ΑΠΟΣΤΟΛΗ'],['Βρες όσα περισσότερα στοιχεία μπορείς','Όσα περισσότερα στοιχεία βρεις, τόσο πιο σίγουρος θα είσαι για την απόφασή σου.','ΤΑ ΕΡΓΑΛΕΙΑ'],['Αποφάσισε','Στο τέλος θα πεις: αληθινή, ψεύτικη ή παραπλανητική; Θα πάρεις αστέρια για την έρευνά σου.','Η ΑΠΟΦΑΣΗ'],['Μην ξεχνάς','Οι υποθέσεις είναι φανταστικές και φτιάχτηκαν για να μάθουμε. Στην πραγματική ζωή ρώτα πάντα έναν μεγάλο.','ΣΗΜΑΝΤΙΚΟ']];
let st={tab:'home',ci:null,phase:'intro',opened:{},ans:null},prog=sto.get('stars',{});
const total=()=>Object.values(prog).reduce((a,b)=>a+b,0);
const unlocked=c=>total()>=c.need;
const stars=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function go(o){Object.assign(st,o);R();window.scrollTo(0,0)}
function nextCase(){return CASES.find(c=>unlocked(c)&&!(prog[c.id]>0))||CASES.find(c=>unlocked(c))}
function nav(){return `<nav>${[['home','🏠','Αρχική'],['hand','🧰','Εργαλεία'],['prof','👤','Προφίλ']].map(([k,i,l])=>`<button class="${st.tab==k&&st.ci==null?'on':''}" onclick="go({tab:'${k}',ci:null})"><span>${i}</span>${l}</button>`).join('')}</nav>`}
function R(){const a=$('#app');let h='';
 if(st.ci!=null)h=caseView(CASES[st.ci]);
 else if(st.tab=='hand')h=handView();else if(st.tab=='prof')h=profView();else h=homeView();
 a.innerHTML=`<div class="fade">${h}</div>`+(st.ci==null?nav():'');
}
function homeView(){const t=total(),nc=nextCase();
 return `<div class="hero">${dexSVG().replace('class="dx"','')}<div><h1>Ντετέκτιβ ειδήσεων</h1><p>Έλεγξε αν μια είδηση από την Κύπρο είναι αληθινή.</p><div class="stat"><span>⭐ ${t}</span><span>🕵️ ${Object.values(prog).filter(x=>x>0).length}/${CASES.length}</span></div></div></div>
 <h3 class="sec">ΑΡΧΕΙΟ ΝΤΕΤΕΚΤΙΒ</h3><h2 class="sec">Διάλεξε υπόθεση</h2><div class="grid">${CASES.map((c,i)=>{const u=unlocked(c),s=prog[c.id]||0;
  return u?`<button class="cc" style="background:linear-gradient(150deg,${c.c1},${c.c2})" onclick="openCase(${i})"><small>ΥΠΟΘΕΣΗ ${c.id}</small><b>${c.card}</b>${s?`<span class="stars">${stars(s)}</span>`:''}<span class="em">${c.em}</span><span class="go">➜</span></button>`
  :`<button class="cc lock" onclick="lockMsg(${i})"><small>ΥΠΟΘΕΣΗ ${c.id}</small><b>${c.card}</b><span class="badge">🔒 Κλειδωμένη</span><span class="em">${c.em}</span><span class="need">⭐ ${Math.min(t,c.need)}/${c.need}<div class="bar"><i style="width:${Math.min(100,t/c.need*100)}%"></i></div>Χρειάζεσαι ακόμα ${c.need-t} ⭐</span></button>`}).join('')}</div>
 <button class="cta" onclick="openCase(${CASES.indexOf(nc)})">🔍 Έναρξη αποστολής</button>`}
function lockMsg(i){const c=CASES[i];modal(`<button class="xx" onclick="closeM()">✕</button>${dexSVG('sad')}<h3>Κλειδωμένη υπόθεση</h3><div class="tx">Χρειάζεσαι ${c.need} ⭐ για να ανοίξει. Έχεις ${total()}. Λύσε τις άλλες υποθέσεις και μάζεψε περισσότερα αστέρια!</div><button class="big" style="background:#0ea5b7" onclick="closeM()">Εντάξει</button>`)}
function handView(){return `<div class="top"><div class="ttl"><small>ΕΞΕΡΕΥΝΗΣΗ</small><b>Εργαλεία ντετέκτιβ</b></div></div><p class="sub">Αυτά τα εργαλεία χρησιμοποιούν οι ντετέκτιβ όταν ελέγχουν μια είδηση.</p><div class="panel hand">${HAND.map(([i,n,d])=>`<div class="tl"><div class="ic" style="background:#0ea5b7">${i}</div><b>${n}</b><span class="d">${d}</span></div>`).join('')}</div><div class="panel"><b style="color:#0a2a66">Ο χρυσός κανόνας</b><div class="rule">Πριν πιστέψεις ή κοινοποιήσεις: <b>Ποιος το λέει; Πού το ξέρει; Το λένε κι άλλοι; Πότε έγινε;</b></div></div><button class="big w" onclick="intro(0)">▶ Δες ξανά την εισαγωγή</button>`}
function profView(){const t=total();return `<div class="top"><div class="ttl"><small>ΠΡΟΦΙΛ</small><b>Ο Ντετέκτιβ μου</b></div></div><div class="panel res"><div class="st">${t>=15?'🏆':t>=8?'🥈':'🔰'}</div><h2>${t>=15?'Αρχιντετέκτιβ':t>=8?'Ντετέκτιβ':'Ντετέκτιβ εκπαιδευόμενος'}</h2><p>Αστέρια: <b>${t}</b> από ${CASES.length*3}. Λυμένες υποθέσεις: <b>${Object.values(prog).filter(x=>x>0).length}</b> από ${CASES.length}.</p></div><div class="panel">${CASES.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-weight:700;color:#0f2a52;border-bottom:1px solid #e2e8f0"><span>${c.em} ${c.card}</span><span>${unlocked(c)?stars(prog[c.id]||0):'🔒'}</span></div>`).join('')}</div><button class="big w" onclick="if(confirm('Να σβηστεί η πρόοδος;')){prog={};sto.set('stars',prog);R()}">↺ Μηδενισμός προόδου</button><p class="note">Οι υποθέσεις είναι φανταστικές και φτιάχτηκαν για μάθηση.</p>`}
function openCase(i){go({ci:i,phase:'intro',opened:{},ans:null})}
function caseView(c){const hd=(sub)=>`<div class="top"><button class="rb" onclick="back()" aria-label="Πίσω">←</button><div class="ttl"><small>ΥΠΟΘΕΣΗ ${c.id}</small><b>${c.t}</b></div></div><p class="sub">${sub}</p>`;
 if(st.phase=='intro')return hd('Εισαγωγή')+`<div class="panel" style="padding:12px">${c.post()}<div class="dex">${dexSVG()}<div class="say">${c.intro}</div></div></div><button class="big" style="background:linear-gradient(180deg,${c.c1},${c.c2})" onclick="go({phase:'res'})">🔍 ${c.btn}</button>`;
 if(st.phase=='res'){const n=Object.keys(st.opened).length,ok=n>=3;return hd('Έρευνα')+`<div class="panel" style="padding:12px">${c.post()}</div><div class="cnt" style="background:${c.c1}22;color:${c.c2}"><span>🗂️ Εργαλεία έρευνας</span><span>${n}/${c.tools.length} στοιχεία</span></div><div class="panel"><h3 style="margin:0 0 4px;color:#0a2a66;font-size:22px">Τι θα ελέγξεις;</h3><p style="margin:0 0 10px;color:#64748b;font-weight:600">Διάλεξε εργαλεία για να βρεις στοιχεία:</p><div class="tools">${c.tools.map(t=>`<button class="tl ${st.opened[t.id]?'done':''}" onclick="clue('${t.id}')"><div class="ic" style="background:${c.tool}">${t.ic}</div><b>${t.n}</b><span class="d">${t.d}</span></button>`).join('')}</div></div><button class="big" style="background:linear-gradient(180deg,${c.c1},${c.c2})" ${ok?'':'disabled'} onclick="go({phase:'verdict'})">${ok?'⚖️ Έτοιμος να αποφασίσω':'Άνοιξε τουλάχιστον 3 εργαλεία ('+n+'/3)'}</button>`}
 if(st.phase=='verdict'){return hd('Η απόφαση')+`<div class="panel"><h3 style="margin:0 0 4px;color:#0a2a66;font-size:24px">Τι είναι αυτό;</h3><p style="margin:0 0 6px;color:#64748b;font-weight:600">Με βάση τα στοιχεία που βρήκες, διάλεξε:</p><div class="opts">${c.opts.map(([k,i,l])=>`<button class="op" onclick="decide('${k}')"><span style="font-size:26px">${i}</span>${l}</button>`).join('')}</div></div><button class="big w" onclick="go({phase:'res'})">← Πίσω στα στοιχεία</button>`}
 const ok=st.ans==c.truth,keys=c.tools.filter(t=>t.k),all=keys.every(t=>st.opened[t.id]),s=1+(ok?1:0)+(all?1:0),miss=keys.filter(t=>!st.opened[t.id]);
 const lab=c.opts.find(o=>o[0]==c.truth);
 return hd('Αποτέλεσμα')+`<div class="panel res"><div class="st">${stars(s)}</div><h2>${ok?'Μπράβο, ντετέκτιβ!':'Σχεδόν!'}</h2><p>${ok?c.res[c.truth]:'Η σωστή απάντηση ήταν: <b>'+lab[1]+' '+lab[2]+'</b>. '+c.res[c.truth]}</p><p>${c.why}</p>${miss.length?`<div class="clue n"><h5>Στοιχεία που έχασες</h5>${miss.map(t=>`${t.ic} <b>${t.n}</b>: ${t.x}`).join('<br><br>')}</div>`:'<div class="clue k"><h5>🔍 Βρήκες όλα τα βασικά στοιχεία!</h5></div>'}<div class="rule">💡 ${c.rule}</div></div>`
  +(CASES[st.ci+1]&&unlocked(CASES[st.ci+1])?`<button class="big" style="background:linear-gradient(180deg,${CASES[st.ci+1].c1},${CASES[st.ci+1].c2})" onclick="openCase(${st.ci+1})">Επόμενη υπόθεση ➜</button>`:'')+`<button class="big w" onclick="back()">🏠 Αρχική</button>`}
function back(){go({ci:null,tab:'home'})}
function clue(id){const c=CASES[st.ci],t=c.tools.find(x=>x.id==id);st.opened[id]=1;
 modal(`<button class="xx" onclick="closeM()">✕</button><div style="font-size:48px">${t.ic}</div><h3>${t.n}</h3><div class="clue ${t.k?'k':'n'}" style="text-align:left"><h5>${t.h}</h5>${t.x}</div><button class="big" style="background:linear-gradient(180deg,${c.c1},${c.c2})" onclick="closeM()">Το κατάλαβα</button>`);R()}
function decide(k){const c=CASES[st.ci];st.ans=k;const ok=k==c.truth,keys=c.tools.filter(t=>t.k),all=keys.every(t=>st.opened[t.id]),s=1+(ok?1:0)+(all?1:0);prog[c.id]=Math.max(prog[c.id]||0,s);sto.set('stars',prog);go({phase:'result'})}
function modal(h){$('#mod').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="mc fade">${h}</div></div>`}
function closeM(){$('#mod').innerHTML=''}
function intro(i){const [h,tx,ch]=INTRO[i],last=i==INTRO.length-1;
 modal(`<button class="xx" onclick="closeM()" aria-label="Κλείσιμο">✕</button>${dexSVG()}<div class="chip">✨ ${ch}</div><h3>${h}</h3><div class="tx">${tx}</div><div class="dots">${INTRO.map((_,k)=>`<i class="${k==i?'on':''}"></i>`).join('')}</div><div class="mrow"><button class="big w" onclick="introDone()">Παράλειψη</button><button class="big" style="background:linear-gradient(180deg,#10b981,#059669)" onclick="${last?'introDone()':'intro('+(i+1)+')'}">${last?'Ξεκινάμε!':'Δείξε μου! ➜'}</button></div>`)}
function introDone(){sto.set('seen',1);closeM()}
R();if(!sto.get('seen',0))intro(0);
</script></body></html>
