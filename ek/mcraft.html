<header><h1>⛏️ Χτίστης Κόσμων</h1><p>Σπάσε και χτίσε τον δικό σου κόσμο από τετράγωνα</p></header>

<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));

const E3={
 cam:{x:0,y:0,z:0,yaw:0,pitch:0},
 shade(h,f){const n=parseInt(h.slice(1),16);const c=v=>Math.min(255,v*f)|0;return 'rgb('+c(n>>16&255)+','+c(n>>8&255)+','+c(n&255)+')'},

 proj(p,W,H){const q=E3.tr(p);if(q[2]<.1)return null;const F=H*.95;return [W/2+q[0]/q[2]*F,H/2-q[1]/q[2]*F,q[2]]},
 // faces: {p:[4 pts],n:[nx,ny,nz],col:'#hex' or css,id}
 render(ctx,W,H,faces,noStroke){
  const c=E3.cam,F=H*.95,out=[];
  for(const f of faces){
   const p0=f.p[0];if((c.x-p0[0])*f.n[0]+(c.y-p0[1])*f.n[1]+(c.z-p0[2])*f.n[2]<=0)continue;
   const q=f.p.map(E3.tr),poly=[];
   for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)&3],ia=a[2]>=.1,ib=b[2]>=.1;if(ia)poly.push(a);if(ia!==ib){const t=(.1-a[2])/(b[2]-a[2]);poly.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,.1])}}
   if(poly.length<3)continue;
   let mx=0,my=0,mz=0;for(const v of f.p){mx+=v[0];my+=v[1];mz+=v[2]}mx/=4;my/=4;mz/=4;
   out.push({f,poly,d:(mx-c.x)**2+(my-c.y)**2+(mz-c.z)**2});
  }
  out.sort((a,b)=>b.d-a.d);
  for(const o of out){
   o.pts=o.poly.map(v=>[W/2+v[0]/v[2]*F,H/2-v[1]/v[2]*F]);
   ctx.beginPath();o.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
   ctx.fillStyle=o.f.col;ctx.fill();
   if(!noStroke){ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.stroke()}
  }

 },
 pip(x,y,pts){let r=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])r=!r}return r},
 pick(out,x,y){for(let i=out.length-1;i>=0;i--)if(E3.pip(x,y,out[i].pts))return out[i].f;return null},
 // box faces; top/side hex colours
 box(x0,y0,z0,x1,y1,z1,top,side,id){
  const S=E3.shade,f=[];
  f.push({p:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],n:[0,1,0],col:S(top,1),id});
  f.push({p:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],n:[0,-1,0],col:S(side,.5),id});
  f.push({p:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],n:[1,0,0],col:S(side,.82),id});
  f.push({p:[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]],n:[-1,0,0],col:S(side,.82),id});
  f.push({p:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],n:[0,0,1],col:S(side,.68),id});
  f.push({p:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],n:[0,0,-1],col:S(side,.68),id});
  return f;
 }
};
function keyMap(map,down){
 const h=(e,v)=>{const k=map(e.code);if(k){keys[k]=v;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()}};

}

const T=30,CW=640,CH=420,cv=$('cv'),cx=cv.getContext('2d');cv.width=CW;cv.height=CH;
const ld=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let mode=ld('mc_mode','2d'),tool='break',sel_=8,keys={},dirty=false,cast=ld('mc_cast','dog'),mouse={x:-1,y:-1,in:false},hov=null;
const enc=a=>{let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(48+a[i]);return s},dec=(s,n)=>{if(!s||s.length!==n)return null;const a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=s.charCodeAt(i)-48;return a};
/* ---------- 2D ---------- */
const W2=96,H2=40;let g2,p2={x:48.5,y:10,vx:0,vy:0,face:1};
const ht2=x=>20+Math.round(2.5*Math.sin(x*.17)+1.8*Math.sin(x*.41+1));
function gen2(){g2=new Uint8Array(W2*H2);for(let x=0;x<W2;x++){const h=ht2(x);for(let y=h;y<H2;y++)g2[y*W2+x]=y===h?1:y<h+4?2:3}
 for(let x=4;x<W2-4;x+=5+(Math.random()*5|0)){if(Math.abs(x-48)<4)continue;const y0=ht2(x);for(let k=1;k<=4;k++)g2[(y0-k)*W2+x]=4;for(let dx=-2;dx<=2;dx++)for(let dy=-6;dy<=-4;dy++){if(Math.abs(dx)===2&&dy===-6)continue;const i=(y0+dy)*W2+x+dx;if(!g2[i])g2[i]=5}}
 p2={x:48.5,y:ht2(48),vx:0,vy:0,face:1};dirty=true}
const s2=(x,y)=>x<0||x>=W2||y>=H2?true:y<0?false:g2[y*W2+x]>0;
function hit2(x,y){for(let a=Math.floor(x-.35);a<=Math.floor(x+.35);a++)for(let b=Math.floor(y-1.8);b<=Math.floor(y-.001);b++)if(s2(a,b))return true;return false}
function up2(dt){const ax=(keys.r?1:0)-(keys.l?1:0);p2.vx=ax*5.5;if(ax)p2.face=ax;const on=hit2(p2.x,p2.y+.03);if(keys.j&&on)p2.vy=-12.5;p2.vy=Math.min(p2.vy+34*dt,28);
 const nx=p2.x+p2.vx*dt;if(!hit2(nx,p2.y))p2.x=nx;else if(on&&p2.vx&&!hit2(nx,p2.y-1.02)&&!hit2(p2.x,p2.y-1.02)){p2.x=nx;p2.y-=1.02}
 const ny=p2.y+p2.vy*dt;if(!hit2(p2.x,ny))p2.y=ny;else{if(p2.vy>0)p2.y=Math.floor(ny-.001);p2.vy=0}}
let cam2={x:0,y:0};
function draw2(){const vw=CW/T,vh=CH/T;cam2.x=Math.max(0,Math.min(W2-vw,p2.x-vw/2));cam2.y=Math.max(0,Math.min(H2-vh,p2.y-1-vh/2));
 const g=cx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#38bdf8');g.addColorStop(1,'#bae6fd');cx.fillStyle=g;cx.fillRect(0,0,CW,CH);
 cx.fillStyle='#fde047';cx.beginPath();cx.arc(540,60,30,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,.85)';[[90,70],[300,50],[470,110]].forEach(([x,y])=>{const o=(x-cam2.x*6+2000)%900-100;cx.beginPath();cx.ellipse(o,y,45,16,0,0,7);cx.ellipse(o+25,y-10,28,16,0,0,7);cx.fill()});
 for(let ty=Math.floor(cam2.y);ty<Math.min(H2,cam2.y+vh+1);ty++)for(let tx=Math.floor(cam2.x);tx<Math.min(W2,cam2.x+vw+1);tx++){const id=g2[ty*W2+tx];if(!id)continue;const b=BL[id],X=(tx-cam2.x)*T,Y=(ty-cam2.y)*T;cx.fillStyle=b.s;cx.fillRect(X,Y,T+.5,T+.5);if(id===1||(!s2(tx,ty-1)&&id!==5&&id!==4)){cx.fillStyle=b.t;cx.fillRect(X,Y,T+.5,id===1?8:5)}cx.strokeStyle='rgba(0,0,0,.18)';cx.strokeRect(X+.5,Y+.5,T-1,T-1)}
 const px=(p2.x-cam2.x)*T,py=(p2.y-cam2.y)*T;cx.font=(T*1.6)+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.save();cx.translate(px,py-T*.95);cx.scale(p2.face<0?1:-1,1);cx.fillText(cast==='dog'?'🐶':'🐱',0,0);cx.restore();
 if(mouse.in){const tx=Math.floor(mouse.x/T+cam2.x),ty=Math.floor(mouse.y/T+cam2.y),ok=Math.hypot(tx+.5-p2.x,ty+.5-(p2.y-.9))<6.5;cx.strokeStyle=ok?'#fff':'#ef4444';cx.lineWidth=3;cx.strokeRect((tx-cam2.x)*T+1.5,(ty-cam2.y)*T+1.5,T-3,T-3)}}
function act2(tx,ty,place){if(tx<0||tx>=W2||ty<0||ty>=H2)return;if(Math.hypot(tx+.5-p2.x,ty+.5-(p2.y-.9))>6.5)return;const i=ty*W2+tx;
 if(place){if(g2[i])return;if(tx+1>p2.x-.35&&tx<p2.x+.35&&ty+1>p2.y-1.8&&ty<p2.y)return;g2[i]=sel_;beep(330,.06,'square')}else{if(!g2[i]||ty>=H2-1)return;g2[i]=0;beep(180,.08,'square')}dirty=true}
/* ---------- 3D ---------- */
const N=24,HH=14;let g3,p3={x:12.5,y:6,z:12.5,vy:0,yaw:0,pitch:-.2};
const I3=(x,y,z)=>(y*N+z)*N+x,ht3=(x,z)=>3+Math.round(1.4*Math.sin(x*.45)+1.4*Math.cos(z*.38));
function gen3(){g3=new Uint8Array(N*HH*N);for(let z=0;z<N;z++)for(let x=0;x<N;x++){const h=ht3(x,z);for(let y=0;y<=h;y++)g3[I3(x,y,z)]=y===h?1:y>=h-2?2:3}
 for(let k=0;k<9;k++){const x=2+(Math.random()*(N-4)|0),z=2+(Math.random()*(N-4)|0);if(Math.hypot(x-12,z-12)<3)continue;const y0=ht3(x,z)+1;for(let i=0;i<4;i++)g3[I3(x,y0+i,z)]=4;for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=4;dy++){if(Math.abs(dx)===2&&Math.abs(dz)===2)continue;const i=I3(x+dx,y0+dy,z+dz);if(!g3[i])g3[i]=5}for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){const i=I3(x+dx,y0+5,z+dz);if(!g3[i])g3[i]=5}}
 p3={x:12.5,y:ht3(12,12)+1.01,z:12.5,vy:0,yaw:0,pitch:-.2};dirty=true}
const s3=(x,y,z)=>x<0||x>=N||z<0||z>=N||y<0?true:y>=HH?false:g3[I3(x,y,z)]>0;
function hit3(x,y,z){for(let a=Math.floor(x-.3);a<=Math.floor(x+.3);a++)for(let c=Math.floor(z-.3);c<=Math.floor(z+.3);c++)for(let b=Math.floor(y);b<=Math.floor(y+1.7);b++)if(s3(a,b,c))return true;return false}
function up3(dt){const fw=(keys.fw?1:0)-(keys.bk?1:0),st=(keys.sr?1:0)-(keys.sl?1:0),tn=(keys.tr?1:0)-(keys.tl?1:0);p3.yaw+=tn*1.9*dt;
 const sy=Math.sin(p3.yaw),cy=Math.cos(p3.yaw);let vx=(sy*fw+cy*st),vz=(cy*fw-sy*st);const l=Math.hypot(vx,vz)||1;vx=vx/l*(fw||st?4.6:0);vz=vz/l*(fw||st?4.6:0);
 const nx=p3.x+vx*dt;if(!hit3(nx,p3.y,p3.z))p3.x=nx;const nz=p3.z+vz*dt;if(!hit3(p3.x,p3.y,nz))p3.z=nz;
 const on=hit3(p3.x,p3.y-.03,p3.z);if(keys.j&&on)p3.vy=9;p3.vy=Math.max(p3.vy-28*dt,-25);const ny=p3.y+p3.vy*dt;
 if(!hit3(p3.x,ny,p3.z))p3.y=ny;else{if(p3.vy<0)p3.y=Math.floor(ny)+1;p3.vy=0}}
function faces3(){const F=[],c=E3.cam,S=E3.shade;for(let y=0;y<HH;y++)for(let z=0;z<N;z++)for(let x=0;x<N;x++){const id=g3[I3(x,y,z)];if(!id)continue;if((x+.5-c.x)**2+(z+.5-c.z)**2>380)continue;const b=BL[id],I={x,y,z};
 const ex=(nx,ny,nz)=>{const X=x+nx,Y=y+ny,Z=z+nz;return X<0||X>=N||Z<0||Z>=N||Y<0?false:!s3(X,Y,Z)};
 if(ex(0,1,0))F.push({p:[[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]],n:[0,1,0],col:S(b.t,1),id:{...I,ny:1,nx:0,nz:0}});
 if(ex(0,-1,0))F.push({p:[[x,y,z],[x+1,y,z],[x+1,y,z+1],[x,y,z+1]],n:[0,-1,0],col:S(b.s,.5),id:{...I,ny:-1,nx:0,nz:0}});
 if(ex(1,0,0))F.push({p:[[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1]],n:[1,0,0],col:S(b.s,.82),id:{...I,nx:1,ny:0,nz:0}});
 if(ex(-1,0,0))F.push({p:[[x,y,z],[x,y+1,z],[x,y+1,z+1],[x,y,z+1]],n:[-1,0,0],col:S(b.s,.82),id:{...I,nx:-1,ny:0,nz:0}});
 if(ex(0,0,1))F.push({p:[[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]],n:[0,0,1],col:S(b.s,.68),id:{...I,nz:1,nx:0,ny:0}});
 if(ex(0,0,-1))F.push({p:[[x,y,z],[x+1,y,z],[x+1,y+1,z],[x,y+1,z]],n:[0,0,-1],col:S(b.s,.68),id:{...I,nz:-1,nx:0,ny:0}})}return F}
let last3=[];
function draw3(){const c=E3.cam;c.x=p3.x;c.y=p3.y+1.55;c.z=p3.z;c.yaw=p3.yaw;c.pitch=p3.pitch;
