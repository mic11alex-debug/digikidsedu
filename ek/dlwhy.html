<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Γιατί ψηφιακός γραμματισμός;</title><style>*{box-sizing:border-box}:root{--ink:#1a1446;--y:#ffd23f;--p:#ff6fae;--g:#35c46a;--b:#4aa8ff;--r:#e8452c}
body{margin:0;font-family:Fredoka,"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#fff0c9,#ffd6e8 60%,#cfe8ff);background-attachment:fixed}
header{text-align:center;padding:14px 12px 4px}h1{margin:0;font-size:clamp(24px,5vw,38px);text-shadow:0 3px 0 rgba(255,255,255,.7)}header p{margin:4px auto 0;max-width:720px;font-weight:600;font-size:clamp(15px,2.6vw,19px)}
main{max-width:860px;margin:10px auto 30px;padding:0 12px}
.card{background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px;position:relative;overflow:hidden}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,3vw,21px);padding:12px 22px;border-radius:999px;border:4px solid var(--ink);background:var(--y);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.g{background:#7ee8c4}.btn.p{background:#ffb3d9}.btn.b{background:#a5d4ff}.btn.w{background:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;margin-bottom:8px}.hud span{background:#f3efff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px}
.center{text-align:center}.big{font-size:clamp(46px,12vw,90px);line-height:1}.lead{font-size:clamp(16px,2.8vw,20px);font-weight:600;line-height:1.45}
.pop{animation:pop .35s both}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ok{color:#14803a}.no{color:#c2301a}.fb{min-height:48px;text-align:center;font-weight:800;font-size:clamp(16px,3vw,20px);margin:8px 0}

.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}.tabs button{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:99px;background:#fff;padding:6px 14px;cursor:pointer;font-size:clamp(13px,2.6vw,16px)}.tabs button.on{background:var(--y)}.tabs button.dn::after{content:" ✓";color:#14803a}
.q{display:block;width:100%;text-align:left;font:inherit;font-weight:700;font-size:clamp(15px,2.8vw,19px);padding:11px 14px;margin:8px 0;border-radius:16px;border:4px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink)}.q.sel{background:#fff1a8}.q.ok{background:#bff0cf}.q.no{background:#ffc9c0}
.pic{display:block;margin:8px auto;max-width:min(560px,100%);border:5px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink)}
.rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0}.rc{border:4px solid var(--ink);border-radius:20px;padding:12px;background:#f3efff;cursor:pointer;text-align:center;box-shadow:0 5px 0 var(--ink);min-height:150px}.rc .e{font-size:48px}.rc b{display:block;font-size:clamp(16px,3vw,20px);margin:4px 0}.rc p{display:none;margin:6px 0 0;font-weight:600;line-height:1.4}.rc.open{background:#e4f8ea}.rc.open p{display:block}
.pl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.cert{border:6px double #d98a00;border-radius:20px;background:#fff7d6;padding:16px;text-align:center;margin:12px 0}
</style></head><body><header><h1>🌐 Γιατί ψηφιακός γραμματισμός;</h1><p>Γιατί χρειάζεται να ξέρουμε να κρίνουμε και να προστατευόμαστε online</p></header><main><div class="card" id="app"><div class="tabs" id="tb"></div><div id="v"></div></div></main><script>
const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);

const T=['1 · Τι βλέπουμε','2 · 4 λόγοι','3 · Τι θα κάνεις;','4 · Η υπόσχεσή μου'];let cur=0,dn={};
function tabs(){$('tb').innerHTML=T.map((t,i)=>`<button class="${i==cur?'on':dn[i]?'dn':''}" onclick="go(${i})">${t}</button>`).join('')}
function go(i){cur=i;tabs();[p1,p2,p3,p4][i]();scrollTo(0,0)}
function done(i){dn[i]=1;tabs()}
/* 1 */
function p1(){const O=[['Ζητά likes για να γίνει καλά ένα παιδί: παίζει με τα συναισθήματά μας',1],['Ο τίτλος «Πλησιάζει το τέλος του κόσμου» θέλει να μας τρομάξει για να τον διαβάσουμε',1],['Δεν ξέρουμε ποιος τα έγραψε ούτε αν έχουν αποδείξεις',1],['Αν έχει φωτογραφία, σίγουρα είναι αληθινό',0],['Αν το έχουν μοιραστεί πολλοί, είναι αλήθεια',0]];let sel=new Set();
 $('v').innerHTML='<div class="card"><h2 style="margin:0">🔎 Κοίταξε καλά την εικόνα</h2><p class="lead">Βλέπεις μια ανάρτηση στο Facebook και έναν τίτλο εφημερίδας. <b>Ποια σημάδια δείχνουν ότι πρέπει να προσέξουμε;</b> Διάλεξε όσα νομίζεις.</p><img class="pic" src="/whyimg/hoax.jpg" alt="Ανάρτηση στο Facebook και πρωτοσέλιδο εφημερίδας"><div id="op"></div><div class="fb" id="f"></div><div class="row"><button class="btn g" id="ck">✅ Έλεγχος</button></div></div>';
 O.forEach(([t,r],k)=>{const b=document.createElement('button');b.className='q';b.textContent=t;b.onclick=()=>{if(sel.has(k))sel.delete(k);else sel.add(k);b.classList.toggle('sel')};$('op').appendChild(b)});
 $('ck').onclick=()=>{const all=O.every(([t,r],k)=>!!r==sel.has(k));[...$('op').children].forEach((b,k)=>{b.classList.remove('sel');if(O[k][1]&&sel.has(k))b.classList.add('ok');else if(sel.has(k))b.classList.add('no')});
  if(all){$('f').innerHTML='<span class="ok">✅ Μπράβο!</span> Τέτοιες αναρτήσεις θέλουν να <b>πατήσουμε και να μοιραστούμε χωρίς σκέψη</b>. Ούτε οι φωτογραφίες ούτε τα πολλά like αποδεικνύουν ότι κάτι είναι αλήθεια.<div class="row"><button class="btn" onclick="done(0);go(1)">Επόμενο ▶</button></div>';$('ck').style.display='none'}else{$('f').innerHTML='<span class="no">Όχι ακριβώς. Τα πράσινα είναι σωστά, τα κόκκινα δεν ταιριάζουν. Δοκίμασε ξανά!</span>';sel=new Set([...sel].filter(k=>O[k][1]));setTimeout(()=>{[...$('op').children].forEach((b,k)=>{b.className='q'+(sel.has(k)?' sel':'')})},1600)}}}
/* 2 */
const R=[['🔍','Για να ξεχωρίζω το αληθινό από το ψεύτικο','Στο διαδίκτυο μπορεί να γράψει οποιοσδήποτε οτιδήποτε. Μαθαίνω να ελέγχω ποιος το λέει, πού το λέει και αν το λένε και άλλοι αξιόπιστοι.'],['🛡️','Για να προστατεύω τον εαυτό μου','Δεν δίνω προσωπικά στοιχεία, δεν πατώ περίεργους συνδέσμους, ξέρω ότι ένα «δώρο» ή μια «τυχερή κλήρωση» μπορεί να είναι παγίδα.'],['🛠️','Για να χρησιμοποιώ σωστά τα εργαλεία','Η αναζήτηση, οι εφαρμογές και η τεχνητή νοημοσύνη βοηθούν πολύ, αλλά μπορεί να κάνουν λάθη. Εγώ αποφασίζω και ελέγχω.'],['🤝','Για να φέρομαι υπεύθυνα στους άλλους','Ό,τι ανεβάζω ή μοιράζομαι μένει και φτάνει μακριά. Σκέφτομαι πριν γράψω, πριν στείλω, πριν μοιραστώ.']];let op=new Set();
function p2(){$('v').innerHTML='<div class="card"><h2 style="margin:0">💡 Γιατί χρειάζεται ο ψηφιακός γραμματισμός;</h2><p class="lead">Άνοιξε και τις 4 κάρτες (πάτα πάνω τους).</p><div class="rs" id="rs"></div><div class="fb" id="f"></div></div>';
 R.forEach(([e,t,d],k)=>{const c=document.createElement('div');c.className='rc';c.innerHTML='<div class="e">'+e+'</div><b>'+t+'</b><p>'+d+'</p>';c.onclick=()=>{c.classList.add('open');op.add(k);if(op.size==4){$('f').innerHTML='<span class="ok">🎉 Τις άνοιξες όλες!</span><div class="row"><button class="btn" onclick="done(1);go(2)">Επόμενο ▶</button></div>'}};$('rs').appendChild(c)})}
/* 3 */
const SC=[['Ένα μήνυμα γράφει: «Κέρδισες νέο κινητό! Πάτα εδώ και γράψε τον κωδικό της μαμάς σου».',['Δεν πατώ τίποτα και το δείχνω σε έναν μεγάλο',1],['Πατάω, μπορεί να κερδίζω!',0],['Το στέλνω σε όλους τους φίλους μου',0]],
['Βλέπεις μια εντυπωσιακή είδηση που ζητά «Μοιράσου το αμέσως!».',['Μοιράζομαι πρώτος, για να το μάθουν όλοι',0],['Ψάχνω αν το γράφουν και άλλες αξιόπιστες σελίδες',1],['Το πιστεύω γιατί έχει πολλά like',0]],
['Για την εργασία σου ρωτάς μια εφαρμογή τεχνητής νοημοσύνης και σου δίνει μια απάντηση.',['Την αντιγράφω όπως είναι',0],['Τη διαβάζω, την ελέγχω σε βιβλίο ή αξιόπιστη σελίδα και τη γράφω με δικά μου λόγια',1],['Δεν ξαναδιαβάζω τίποτα, η εφαρμογή ξέρει πάντα',0]],
['Ένας άγνωστος σε παιχνίδι σού ζητά τη διεύθυνση του σπιτιού σου για να σου στείλει δώρο.',['Του τη δίνω, φαίνεται καλός',0],['Δεν δίνω προσωπικά στοιχεία και το λέω σε έναν μεγάλο που εμπιστεύομαι',1],['Του δίνω μόνο το όνομα του σχολείου',0]]];let si,sc;
function p3(){si=0;sc=0;sq()}
function sq(){if(si>=SC.length){$('v').innerHTML='<div class="card center"><div class="big">'+(sc==4?'🏆':'👍')+'</div><p class="lead">Σωστές επιλογές: <b>'+sc+' / 4</b></p><div class="row"><button class="btn" onclick="done(2);go(3)">Επόμενο ▶</button></div></div>';return}
 const Q=SC[si];$('v').innerHTML='<div class="card"><div class="hud"><span>Ερώτηση '+(si+1)+' / 4</span></div><h2 style="margin:6px 0">🤔 Τι θα έκανες;</h2><p class="lead">'+Q[0]+'</p><div id="op"></div><div class="fb" id="f"></div></div>';
 sh(Q.slice(1)).forEach(([t,ok])=>{const b=document.createElement('button');b.className='q';b.textContent=t;b.onclick=()=>{[...$('op').children].forEach(x=>x.style.pointerEvents='none');if(ok){sc++;b.classList.add('ok');$('f').innerHTML='<span class="ok">✅ Σωστά!</span>'}else{b.classList.add('no');[...$('op').children].forEach(x=>{if(SC[si].slice(1).find(a=>a[0]==x.textContent&&a[1]))x.classList.add('ok')});$('f').innerHTML='<span class="no">Όχι ακριβώς. Η σωστή επιλογή είναι η πράσινη.</span>'}setTimeout(()=>{si++;sq()},1700)};$('op').appendChild(b)})}
/* 4 */
const PL=['Πριν μοιραστώ κάτι, ελέγχω την πηγή','Δεν δίνω προσωπικά στοιχεία σε αγνώστους','Ρωτάω έναν μεγάλο όταν δεν είμαι σίγουρος','Δεν πιστεύω κάτι μόνο επειδή έχει πολλά like','Ελέγχω ό,τι μου λέει η τεχνητή νοημοσύνη','Φέρομαι ευγενικά και online'];
function p4(){let sel=new Set();$('v').innerHTML='<div class="card"><h2 style="margin:0">✍️ Η υπόσχεσή μου</h2><p class="lead">Διάλεξε <b>3 κανόνες</b> που θα τηρείς ως ψηφιακός πολίτης.</p><div id="op"></div><div class="fb" id="f"></div><div class="row"><button class="btn g" id="mk">📜 Φτιάξε την υπόσχεσή μου</button></div><div id="ct"></div></div>';
 PL.forEach((t,k)=>{const b=document.createElement('button');b.className='q';b.textContent=t;b.onclick=()=>{if(sel.has(k))sel.delete(k);else if(sel.size<3)sel.add(k);else return;b.classList.toggle('sel')};$('op').appendChild(b)});
 $('mk').onclick=()=>{if(sel.size<3){$('f').innerHTML='<span class="no">Διάλεξε ακριβώς 3 κανόνες.</span>';return}$('f').innerHTML='';done(3);$('ct').innerHTML='<div class="cert pop"><div style="font-size:56px">🌟</div><h2 style="margin:4px 0">Η υπόσχεσή μου ως ψηφιακός πολίτης</h2><ol style="text-align:left;display:inline-block;font-weight:700;font-size:clamp(15px,3vw,20px)">'+[...sel].map(k=>'<li>'+PL[k]+'</li>').join('')+'</ol><p class="lead" style="margin:6px 0 0">Ψηφιακός γραμματισμός = σκέφτομαι πριν πιστέψω, πριν μοιραστώ, πριν πατήσω!</p></div><div class="row"><button class="btn" onclick="go(0)">🔁 Από την αρχή</button></div>'}}
go(0);

</script></body></html>
