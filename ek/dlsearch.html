<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ντετέκτιβ της αναζήτησης</title><style>*{box-sizing:border-box}:root{--ink:#1a1446;--y:#ffd23f;--p:#ff6fae;--g:#35c46a;--b:#4aa8ff;--r:#e8452c}
body{margin:0;font-family:Fredoka,"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#e6f4ff,#f2e8ff 60%,#fff3c9);background-attachment:fixed}
header{text-align:center;padding:14px 12px 4px}h1{margin:0;font-size:clamp(24px,5vw,38px);text-shadow:0 3px 0 rgba(255,255,255,.7)}header p{margin:4px auto 0;max-width:720px;font-weight:600;font-size:clamp(15px,2.6vw,19px)}
main{max-width:860px;margin:10px auto 30px;padding:0 12px}
.card{background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px;position:relative;overflow:hidden}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,3vw,21px);padding:12px 22px;border-radius:999px;border:4px solid var(--ink);background:var(--y);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.g{background:#7ee8c4}.btn.p{background:#ffb3d9}.btn.b{background:#a5d4ff}.btn.w{background:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;margin-bottom:8px}.hud span{background:#f3efff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px}
.center{text-align:center}.big{font-size:clamp(46px,12vw,90px);line-height:1}.lead{font-size:clamp(16px,2.8vw,20px);font-weight:600;line-height:1.45}
.pop{animation:pop .35s both}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ok{color:#14803a}.no{color:#c2301a}.fb{min-height:48px;text-align:center;font-weight:800;font-size:clamp(16px,3vw,20px);margin:8px 0}

.br{border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff}
.br .top{background:#e9e4ff;padding:8px 10px;display:flex;gap:6px;align-items:center;border-bottom:4px solid var(--ink)}.br .top i{width:12px;height:12px;border-radius:50%;display:inline-block}
.bar{flex:1;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:700;min-height:34px;font-size:clamp(14px,2.6vw,18px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pg{padding:12px}.task{background:#fff3c9;border:3px dashed var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;margin-bottom:10px}
.opts{display:grid;gap:8px}.q{font:inherit;text-align:left;font-weight:700;font-size:clamp(15px,2.8vw,18px);padding:10px 14px;border-radius:14px;border:3px solid var(--ink);background:#f6f3ff;cursor:pointer;box-shadow:0 4px 0 var(--ink)}.q:active{transform:translateY(3px);box-shadow:none}
.q.ok{background:#bff0cc}.q.no{background:#ffc9c9}
.res{border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer;transition:.15s}.res:hover{background:#faf7ff}.res b{color:#1a0dab;display:block;font-size:clamp(15px,2.8vw,18px)}.res u{color:#0b7a3b;text-decoration:none;font-size:13px;display:block}.res p{margin:3px 0 0;font-size:clamp(13px,2.4vw,15px)}
.res .ad{display:inline-block;background:#222;color:#fff;font-size:11px;border-radius:5px;padding:1px 6px;margin-right:6px}
.res.ok{background:#bff0cc}.res.no{background:#ffc9c9}
.step{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:2px 12px;font-weight:800;font-size:14px;margin-bottom:6px}
</style></head><body><header><h1>🔎 Ντετέκτιβ της αναζήτησης</h1><p>Διάλεξε τις σωστές λέξεις και βρες την αξιόπιστη πηγή!</p></header><main><div class="card" id="app"><div id="intro" class="center"><div class="big">🔎</div><p class="lead">Είσαι ντετέκτιβ της αναζήτησης! Σε κάθε αποστολή:<br><b>1.</b> διάλεξε τις <b>καλύτερες λέξεις</b> για να ψάξεις<br><b>2.</b> διάλεξε το <b>πιο αξιόπιστο αποτέλεσμα</b></p><div class="row"><button class="btn" onclick="start()">▶ Ξεκινάμε!</button></div></div><div id="g" style="display:none"></div></div></main><script>
const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);

const R=[
{t:'Θέλεις να μάθεις πόσα χρόνια ζει μια χελώνα.',qs:[['χελώνα πόσα χρόνια ζει',1],['χελώνα',0],['πώς να κάνω φίλους',0]],res:[['Διαφήμιση: Αγόρασε χελώνα τώρα!','petshop-deals.example','Φτηνές χελώνες - μόνο σήμερα!',0,1],['Χελώνες: διάρκεια ζωής | Εγκυκλοπαίδεια ζώων','zoa-enkyklopaideia.example','Οι θαλάσσιες χελώνες ζουν συχνά πάνω από 50 χρόνια…',1],['ΣΟΚ! Η χελώνα που έζησε 1000 χρόνια!!!','mega-shok.example','Δεν θα πιστέψεις τι αποκάλυψε…',0]],why:'Αξιόπιστη πηγή: εγκυκλοπαίδεια με στοιχεία. Το «ΣΟΚ» και η διαφήμιση θέλουν κλικ ή πώληση.'},
{t:'Ψάχνεις πού βρίσκονται τα αεροδρόμια της Κύπρου.',qs:[['αεροδρόμια της Κύπρου χάρτης',1],['αεροπλάνα',0],['αεροδρόμιο παιχνίδι',0]],res:[['Αεροδρόμια της Κύπρου - Χάρτης | Υπουργείο Μεταφορών','mcw.gov.cy','Λάρνακα και Πάφος: τα δύο διεθνή αεροδρόμια.',1],['Τα 10 ΠΙΟ ΤΡΕΛΑ αεροδρόμια!','top10-trela.example','Κάνε κλικ να δεις…',0],['Αγόρασε εισιτήρια φθηνά!','cheap-fly.example','Διαφήμιση',0,1]],why:'Η επίσημη υπηρεσία (gov.cy) είναι η πιο αξιόπιστη για τέτοια στοιχεία.'},
{t:'Πρέπει να βρεις πληροφορίες για τον πλανήτη Άρη για μια εργασία.',qs:[['Άρης πλανήτης πληροφορίες για παιδιά',1],['Άρης',0],['πλανήτης φθηνά',0]],res:[['Ο πλανήτης Άρης | NASA για παιδιά','nasa.example.gov','Ο Άρης είναι ο τέταρτος πλανήτης από τον Ήλιο.',1],['Ζουν Αρειανοί στη γειτονιά σου;;','fake-space.example','Φωτογραφία που «το κρύβουν»!',0],['Αγόρασε οικόπεδο στον Άρη!','scam-mars.example','Διαφήμιση',0,1]],why:'Η NASA είναι διαστημική υπηρεσία: ξέρει! Προσοχή σε τίτλους που φωνάζουν.'},
{t:'Θέλεις να μάθεις πώς πλένουμε σωστά τα χέρια μας.',qs:[['πώς πλένουμε σωστά τα χέρια υγιεινή',1],['σαπούνι',0],['χέρια',0]],res:[['Σωστό πλύσιμο χεριών | Παγκόσμιος Οργανισμός Υγείας','who.example','Βήματα: βρέξε, σαπούνισε 20 δευτερόλεπτα, ξέπλυνε.',1],['Το μυστικό που σου κρύβουν οι γιατροί!!!','miracle-health.example','Κάνε κλικ τώρα!',0],['Σαπούνι -70%','soap-shop.example','Διαφήμιση',0,1]],why:'Οργανισμός υγείας = ειδικοί. Το «μυστικό που κρύβουν» είναι κλικ-δόλωμα.'},
{t:'Ψάχνεις ποιος ήταν ο Δαίδαλος στη μυθολογία.',qs:[['Δαίδαλος μυθολογία ποιος ήταν',1],['Δαίδαλος κόλαση',0],['φτερά αγορά',0]],res:[['Δαίδαλος | Ελληνική μυθολογία','mythology-edu.example','Ο Δαίδαλος έφτιαξε τον Λαβύρινθο και φτερά από κερί…',1],['Ο ΔΑΙΔΑΛΟΣ ζει ανάμεσά μας!','conspiracy.example','Τρομερό ντοκουμέντο!',0],['Κοστούμια Δαίδαλου','party-shop.example','Διαφήμιση',0,1]],why:'Εκπαιδευτική πηγή με λεπτομέρειες. Τα άλλα δεν απαντούν στην ερώτηση.'},
{t:'Θέλεις να μάθεις ποιος είναι ο καιρός αύριο στη Λάρνακα.',qs:[['καιρός αύριο Λάρνακα πρόγνωση',1],['βροχή',0],['Λάρνακα ιστορία',0]],res:[['Πρόγνωση καιρού Λάρνακα | Τμήμα Μετεωρολογίας','moi.gov.cy','Αύριο: ηλιοφάνεια, 24°C.',1],['Ο καιρός θα αλλάξει ΓΙΑ ΠΑΝΤΑ!!','weather-panic.example','Δεν θα το πιστέψεις!',0],['Ομπρέλες με έκπτωση','umbrella.example','Διαφήμιση',0,1]],why:'Το Τμήμα Μετεωρολογίας είναι η επίσημη πηγή.'}
];
let i,score;
function start(){$('intro').style.display='none';$('g').style.display='';i=0;score=0;round()}
function head(){return '<div class="hud"><span>🔎 Αποστολή '+(i+1)+' / '+R.length+'</span><span>⭐ '+score+'</span></div>'}
function round(){if(i>=R.length)return fin();const r=R[i];const g=$('g');g.innerHTML=head()+'<div class="task">🕵️ '+r.t+'</div><div class="step">ΒΗΜΑ 1 · Τι θα γράψεις στην αναζήτηση;</div><div class="br"><div class="top"><i style="background:#ff6a6a"></i><i style="background:#ffd23f"></i><i style="background:#35c46a"></i><div class="bar">🔍 <span id="qb">…</span></div></div><div class="pg"><div class="opts" id="o"></div><div class="fb" id="fb"></div></div></div>';
 sh(r.qs).forEach(q=>{const b=document.createElement('button');b.className='q';b.textContent='🔍 '+q[0];b.onclick=()=>{[...$('o').children].forEach(x=>x.style.pointerEvents='none');$('qb').textContent=q[0];if(q[1]){b.classList.add('ok');score+=5;$('fb').innerHTML='<span class="ok">✅ Καλές λέξεις-κλειδιά: ακριβείς και σχετικές!</span>';setTimeout(step2,1100)}else{b.classList.add('no');$('fb').innerHTML='<span class="no">❌ Πολύ γενικές ή άσχετες λέξεις. Οι καλές λέξεις λένε <b>τι</b> ψάχνω ακριβώς.</span>';setTimeout(step2,2300)}};$('o').appendChild(b)})}
function step2(){const r=R[i],g=$('g');g.innerHTML=head()+'<div class="task">🕵️ '+r.t+'</div><div class="step">ΒΗΜΑ 2 · Ποιο αποτέλεσμα είναι το πιο αξιόπιστο;</div><div class="br"><div class="top"><i style="background:#ff6a6a"></i><i style="background:#ffd23f"></i><i style="background:#35c46a"></i><div class="bar">🔍 '+r.qs.find(q=>q[1])[0]+'</div></div><div class="pg" id="rs"></div></div><div class="fb" id="fb"></div>';
 sh(r.res).forEach(x=>{const d=document.createElement('div');d.className='res';d.innerHTML='<u>'+(x[4]?'<span class="ad">Διαφήμιση</span>':'')+x[1]+'</u><b>'+x[0]+'</b><p>'+x[2]+'</p>';d.onclick=()=>{[...$('rs').children].forEach(c=>c.style.pointerEvents='none');if(x[3]){d.classList.add('ok');score+=10;$('fb').innerHTML='<span class="ok">✅ Αξιόπιστο! '+r.why+'</span>'}else{d.classList.add('no');[...$('rs').children].forEach((c,k)=>{});$('fb').innerHTML='<span class="no">❌ Όχι αυτό. '+r.why+'</span>'}$('fb').innerHTML+='<div class="row"><button class="btn" onclick="i++;round()">Επόμενη αποστολή ▶</button></div>'};$('rs').appendChild(d)})}
function fin(){const m=R.length*15,st=score>=m*.85?3:score>=m*.6?2:1;$('g').innerHTML='<div class="center"><div class="big">'+(st==3?'🏆':'🕵️')+'</div><h2>Τέλος αποστολών!</h2><p class="lead">Πόντοι: <b>'+score+' / '+m+'</b> · '+'⭐'.repeat(st)+'☆'.repeat(3-st)+'<br>Συμβουλές ντετέκτιβ: ψάχνω με <b>ακριβείς λέξεις</b>, προτιμώ <b>επίσημες πηγές</b>, και δεν εμπιστεύομαι τίτλους που φωνάζουν ή διαφημίσεις.</p><div class="row"><button class="btn" onclick="start()">🔁 Ξανά</button></div></div>'}

</script></body></html>
