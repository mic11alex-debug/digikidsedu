<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Η φούσκα του φίλτρου</title><style>*{box-sizing:border-box}:root{--ink:#1a1446;--y:#ffd23f;--p:#ff6fae;--g:#35c46a;--b:#4aa8ff;--r:#e8452c}
body{margin:0;font-family:Fredoka,"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#d8e8ff,#efe3ff 60%,#ffe9f4);background-attachment:fixed}
header{text-align:center;padding:14px 12px 4px}h1{margin:0;font-size:clamp(24px,5vw,38px);text-shadow:0 3px 0 rgba(255,255,255,.7)}header p{margin:4px auto 0;max-width:720px;font-weight:600;font-size:clamp(15px,2.6vw,19px)}
main{max-width:860px;margin:10px auto 30px;padding:0 12px}
.card{background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px;position:relative;overflow:hidden}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,3vw,21px);padding:12px 22px;border-radius:999px;border:4px solid var(--ink);background:var(--y);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.g{background:#7ee8c4}.btn.p{background:#ffb3d9}.btn.b{background:#a5d4ff}.btn.w{background:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;margin-bottom:8px}.hud span{background:#f3efff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px}
.center{text-align:center}.big{font-size:clamp(46px,12vw,90px);line-height:1}.lead{font-size:clamp(16px,2.8vw,20px);font-weight:600;line-height:1.45}
.pop{animation:pop .35s both}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ok{color:#14803a}.no{color:#c2301a}.fb{min-height:48px;text-align:center;font-weight:800;font-size:clamp(16px,3vw,20px);margin:8px 0}

.stage{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:640px){.stage{grid-template-columns:1fr}}
.phone{margin:0 auto;width:min(250px,100%);background:#1a1446;border-radius:30px;padding:12px 10px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.phone .nt{width:60px;height:6px;background:#3d3580;border-radius:9px;margin:0 auto 8px}
.feed{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;border:3px solid #fff;cursor:default;animation:pop .35s both}
.tile.clk{cursor:pointer}.tile.clk:hover{transform:scale(1.05)}
.tile b{position:absolute;left:4px;bottom:3px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:1px 6px;font-weight:700}
.bub{position:relative;height:250px;border-radius:50%;margin:0 auto;aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;transition:all .6s;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(170,215,255,.45) 55%,rgba(120,170,255,.55));border:4px solid #7fb4ff;box-shadow:inset 0 0 40px rgba(255,255,255,.7)}
.bub span{position:absolute;font-size:30px;transition:all .8s}
.meter{height:24px;border-radius:99px;background:#eee;border:3px solid var(--ink);overflow:hidden;margin:6px 0 2px}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6a6a,#ffd23f,#35c46a);transition:width .7s}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.chip{font:inherit;font-weight:800;font-size:20px;padding:10px 16px;border-radius:18px;border:4px solid var(--ink);background:#f3efff;cursor:pointer;box-shadow:0 5px 0 var(--ink)}.chip.on{background:var(--y);transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}.chip i{display:block;font-style:normal;font-size:34px}
</style></head><body><header><h1>🫧 Η φούσκα του φίλτρου</h1><p>Δες πώς μια εφαρμογή «μαθαίνει» τι σου αρέσει, και σπάσε τη φούσκα!</p></header><main><div class="card" id="app"><div id="s1"><div class="center"><div class="big">🫧</div><h2 style="margin:6px 0">Διάλεξε 2 θέματα που σου αρέσουν</h2><p class="lead">Ας δούμε τι κάνει μια εφαρμογή βίντεο όταν «μαθαίνει» τι σε ενδιαφέρει.</p></div><div class="chips" id="chips"></div><div class="row"><button class="btn" id="go1" disabled onclick="s2()">Δες το δικό μου feed ▶</button></div></div>
<div id="s2" style="display:none"></div></div></main><script>
const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);

const TOP=[['⚽','Ποδόσφαιρο','#7ee8c4'],['🎮','Παιχνίδια','#a5d4ff'],['🐱','Ζωάκια','#ffd1e8'],['🚀','Διάστημα','#c9b8ff'],['🎨','Ζωγραφική','#ffe08a'],['🎵','Μουσική','#ffb27a'],['🦖','Δεινόσαυροι','#b9f0a0'],['🔬','Πειράματα','#bfe8ff']];
let mine=[],round=0,variety=100,popped=false;
const ch=$('chips');TOP.forEach((t,k)=>{const b=document.createElement('button');b.className='chip';b.innerHTML='<i>'+t[0]+'</i>'+t[1];b.onclick=()=>{const ix=mine.indexOf(k);if(ix>=0)mine.splice(ix,1);else if(mine.length<2)mine.push(k);else{mine.shift();mine.push(k)}[...ch.children].forEach((c,j)=>c.classList.toggle('on',mine.includes(j)));$('go1').disabled=mine.length<2};ch.appendChild(b)});
function tiles(n,bias){let a=[];for(let i=0;i<n;i++){const k=Math.random()<bias?mine[Math.floor(Math.random()*2)]:Math.floor(Math.random()*TOP.length);a.push(k)}return a}
function s2(){$('s1').style.display='none';const e=$('s2');e.style.display='';round=0;variety=100;popped=false;e.innerHTML='<div class="stage"><div class="phone"><div class="nt"></div><div class="feed" id="feed"></div></div><div><div class="bub" id="bub"></div><p class="lead center" id="msg" style="margin:10px 0 4px"></p><div>Ποικιλία θεμάτων στο feed σου:</div><div class="meter"><i id="mt"></i></div><div class="row"><button class="btn" id="rf" onclick="refresh()">🔄 Ανανέωση feed</button></div></div></div><div class="fb" id="fb2"></div>';draw(0.17);msg('Αυτό είναι το πρώτο σου feed. Πάτα «Ανανέωση» και κοίτα τι αλλάζει!')}
function msg(t){$('msg').innerHTML=t}
function draw(bias){const f=$('feed');f.innerHTML='';const arr=tiles(6,bias);arr.forEach(k=>{const t=document.createElement('div');t.className='tile'+(popped?' clk':'');t.style.background=TOP[k][2];t.innerHTML=TOP[k][0]+'<b>'+TOP[k][1]+'</b>';if(popped)t.onclick=()=>{};f.appendChild(t)});
 const bb=$('bub');bb.innerHTML='';const kinds=[...new Set(arr)];const size=40+bias*30;bb.style.transform='scale('+(1.05-(bias*.35))+')';arr.concat(arr).slice(0,10).forEach((k,j)=>{const s=document.createElement('span');const an=j*Math.PI*2/10;s.textContent=TOP[k][0];s.style.left=(50+34*Math.cos(an+.3)-6)+'%';s.style.top=(48+32*Math.sin(an+.3)-6)+'%';bb.appendChild(s)});
 variety=Math.round(100-bias*100*.85);$('mt').style.width=Math.max(8,Math.round(100*(1-bias)))+'%'}
function refresh(){round++;if(round<=5){const bias=.17+round*.15;draw(Math.min(.92,bias));const cm=['Ο αλγόριθμος παρατήρησε τι πατάς…','Βλέπεις όλο και πιο πολλά από τα ίδια!','Η φούσκα στενεύει. Πού πήγαν τα άλλα θέματα;','Σχεδόν τα πάντα στο feed είναι «σαν εσένα».','Μόνο τα ίδια θέματα! Αυτή είναι η «φούσκα φίλτρου».'];msg(cm[round-1]);if(round==5){$('rf').textContent='💥 Σπάσε τη φούσκα!';$('rf').className='btn p'}}else if(round==6){breakIt()}}
function breakIt(){const bb=$('bub');bb.style.transform='scale(1.25)';bb.style.opacity='.3';setTimeout(()=>{bb.style.opacity='1';bb.style.transform='scale(1)'},700);popped=true;$('rf').style.display='none';msg('<b>Πλήρης ποικιλία!</b> Διάλεξε <b>3 νέα θέματα</b> που δεν έχεις ξαναδεί, για να ανοίξεις τον ορίζοντά σου.');const f=$('feed');f.innerHTML='';let got=0,chosen=new Set();TOP.forEach((t,k)=>{if(mine.includes(k))return;const d=document.createElement('div');d.className='tile clk';d.style.background=t[2];d.innerHTML=t[0]+'<b>'+t[1]+'</b>';d.onclick=()=>{if(chosen.has(k)||got>=3)return;chosen.add(k);got++;d.style.outline='5px solid #35c46a';$('mt').style.width=(30+got*23)+'%';const bb2=$('bub');const s=document.createElement('span');s.textContent=t[0];s.style.left=(15+got*22)+'%';s.style.top=(30+(got%2)*30)+'%';bb2.appendChild(s);if(got==3)done()};f.appendChild(d)});$('feed').style.gridTemplateColumns='1fr 1fr';$('mt').style.width='20%'}
function done(){$('bub').style.background='radial-gradient(circle at 32% 28%,#fff,#fff7c9 55%,#ffd23f)';$('bub').style.borderColor='#ffb100';$('fb2').innerHTML='<div class="center" style="margin-top:10px"><div class="big" style="font-size:54px">🎉</div><p class="lead"><b>Μπράβο!</b> Η φούσκα έσπασε. Όταν βλέπουμε μόνο ό,τι μας αρέσει, χάνουμε άλλες ιδέες και άλλες απόψεις. <b>Ψάξε και κάτι διαφορετικό!</b></p><div class="row"><button class="btn" onclick="s2()">🔁 Ξανά με το ίδιο</button><button class="btn g" onclick="quiz()">❓ Μικρό κουίζ</button></div></div>';$('fb2').scrollIntoView({behavior:'smooth'})}
const QZ=[["Γιατί η εφαρμογή σού δείχνει όλο τα ίδια θέματα;",["Γιατί «μαθαίνει» τι πατάς και σου δείχνει περισσότερα από αυτά","Γιατί ο υπολογιστής βαριέται","Γιατί είναι τυχαίο"],0],["Τι μπορώ να κάνω για να σπάσω τη φούσκα;",["Να βλέπω μόνο το αγαπημένο μου θέμα","Να ψάχνω και διαφορετικά θέματα και πηγές","Να κλείσω τα μάτια"],1],["Τι χάνω αν βλέπω πάντα τα ίδια;",["Τίποτα","Νέες ιδέες και διαφορετικές απόψεις","Τον χρόνο μου"],1]];
function quiz(){let q=0,sc=0;const e=$('fb2');const show=()=>{if(q>=QZ.length){e.innerHTML='<div class="center"><div class="big" style="font-size:54px">'+(sc==3?'🏆':'👍')+'</div><p class="lead">Σωστές: <b>'+sc+' / 3</b></p></div>';return}const Z=QZ[q];e.innerHTML='<h3 class="center">'+Z[0]+'</h3><div style="display:grid;gap:10px;max-width:560px;margin:0 auto" id="op"></div>';Z[1].forEach((t,k)=>{const b=document.createElement('button');b.className='btn w';b.style.textAlign='left';b.textContent=t;b.onclick=()=>{if(k==Z[2]){sc++;b.className='btn g'}else b.className='btn p';[...$('op').children].forEach(x=>x.disabled=true);setTimeout(()=>{q++;show()},1000)};$('op').appendChild(b)})};show()}

</script></body></html>
