<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}

const E3={
 cam:{x:0,y:0,z:0,yaw:0,pitch:0},
 shade(h,f){const n=parseInt(h.slice(1),16);const c=v=>Math.min(255,v*f)|0;return 'rgb('+c(n>>16&255)+','+c(n>>8&255)+','+c(n&255)+')'},
 tr(p){const c=E3.cam,dx=p[0]-c.x,dy=p[1]-c.y,dz=p[2]-c.z,cy=Math.cos(c.yaw),sy=Math.sin(c.yaw),cp=Math.cos(c.pitch),sp=Math.sin(c.pitch);const X=dx*cy-dz*sy,Z=dx*sy+dz*cy;return [X,dy*cp-Z*sp,dy*sp+Z*cp]},
 proj(p,W,H){const q=E3.tr(p);if(q[2]<.1)return null;const F=H*.95;return [W/2+q[0]/q[2]*F,H/2-q[1]/q[2]*F,q[2]]},
 // faces: {p:[4 pts],n:[nx,ny,nz],col:'#hex' or css,id}
 render(ctx,W,H,faces,noStroke){
  const c=E3.cam,F=H*.95,out=[];
  for(const f of faces){
   const p0=f.p[0];if((c.x-p0[0])*f.n[0]+(c.y-p0[1])*f.n[1]+(c.z-p0[2])*f.n[2]<=0)continue;
   const q=f.p.map(E3.tr),poly=[];
   for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)&3],ia=a[2]>=.1,ib=b[2]>=.1;if(ia)poly.push(a);if(ia!==ib){const t=(.1-a[2])/(b[2]-a[2]);poly.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,.1])}}
   if(poly.length<3)continue;
   let mx=0,my=0,mz=0;for(const v of f.p){mx+=v[0];my+=v[1];mz+=v[2]}mx/=4;my/=4;mz/=4;
   out.push({f,poly,d:(mx-c.x)**2+(my-c.y)**2+(mz-c.z)**2});
  }
  out.sort((a,b)=>b.d-a.d);
  for(const o of out){
   o.pts=o.poly.map(v=>[W/2+v[0]/v[2]*F,H/2-v[1]/v[2]*F]);
   ctx.beginPath();o.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
   ctx.fillStyle=o.f.col;ctx.fill();
   if(!noStroke){ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.stroke()}
  }
  return out;
 },
 pip(x,y,pts){let r=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])r=!r}return r},
 pick(out,x,y){for(let i=out.length-1;i>=0;i--)if(E3.pip(x,y,out[i].pts))return out[i].f;return null},
 // box faces; top/side hex colours
 box(x0,y0,z0,x1,y1,z1,top,side,id){
  const S=E3.shade,f=[];
  f.push({p:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],n:[0,1,0],col:S(top,1),id});
  f.push({p:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],n:[0,-1,0],col:S(side,.5),id});
  f.push({p:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],n:[1,0,0],col:S(side,.82),id});
  f.push({p:[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]],n:[-1,0,0],col:S(side,.82),id});
  f.push({p:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],n:[0,0,1],col:S(side,.68),id});
  f.push({p:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],n:[0,0,-1],col:S(side,.68),id});
  return f;
 }
};
function keyMap(map,down){
 const h=(e,v)=>{const k=map(e.code);if(k){keys[k]=v;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()}};
 addEventListener('keydown',e=>h(e,1));addEventListener('keyup',e=>h(e,0));
 document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{keys[k]=1;e.preventDefault()},off=()=>{keys[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
}

const CW=640,CH=420,cv=$('cv'),cx=cv.getContext('2d');cv.width=CW;cv.height=CH;
const ld=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let Lz=[],qd=[],Q=[],qsig='',QT=0,QF=0,QK=0,QNC=0,pts=0,C=[],cps={},mode=ld('ob_mode','2d'),lvl=+ld('ob_lvl','0')||0,cast=ld('ob_cast','dog'),keys={},t=0,deaths=0,won=false,started=false,pl,cp,P=[],H=[];
const LV=[{n:16,g:[1.4,2.2],w:[4,5],dy:1,mv:0,sp:0},{n:24,g:[1.8,2.8],w:[3,4],dy:1.2,mv:.3,sp:.25},{n:32,g:[2.2,3.0],w:[2.4,3.2],dy:1.4,mv:.4,sp:.35},{n:40,g:[2.3,3.0],w:[2.2,3.0],dy:1.5,mv:.5,sp:.4},{n:50,g:[2.4,3.1],w:[2.0,2.8],dy:1.6,mv:.55,sp:.45}];
const LZP=[0,.12,.2,.25,.3],CRP=[.05,.1,.15,.2,.2];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rr=(R,a,b)=>a+R()*(b-a);
/* Κοινή γεννήτρια: 2D χρησιμοποιεί x/y, 3D x/y/z */
function build(){const L=LV[lvl],R=rng(1000+lvl*77+(mode==='3d'?5:0));P=[];H=[];const is3=mode==='3d';
 let x=0,y=is3?0:10,z=0,dir=0,seg=0;
 const first=is3?{x:-2.5,z:-2.5,w:5,d:5,y:0,t:'start'}:{x:0,w:8,y:10,t:'start'};P.push({...first,h:.6,mv:0,ph:0});
 for(let i=1;i<=L.n;i++){const pr=P[P.length-1],last=i===L.n,cpt=i%6===0&&!last;
  if(is3&&seg++>=4){seg=0;dir=dir===0?(R()<.5?1:2):0}
  const w=last?5:cpt?Math.max(4,rr(R,...L.w)):rr(R,...L.w);
  const mv=(!last&&!cpt&&R()<L.mv&&(!is3||(dir===0&&seg<4)))?1:0;
  const gap=pr.mv&&!is3?rr(R,1.4,1.8):mv&&!is3?rr(R,.5,.9):rr(R,...L.g);
  const dyv=Math.round(rr(R,-L.dy,Math.min(L.dy,is3?.5:1))*2)/2;
  let ny=pr.y+(is3?dyv:-dyv);if(!is3)ny=Math.max(5,Math.min(15,ny));
  if(!is3){const nx=pr.x+pr.w+gap+(mv?1:0);P.push({x:nx,w,y:ny,h:.6,mv,ph:R()*6,t:last?'end':cpt?'cp':mv?'mv':'n'})}
  else{const sx=(dir===1?1:dir===2?-1:0),sz=dir===0?1:0,cxp=pr.x+pr.w/2,czp=pr.z+pr.d/2,off=pr.w/2+w/2+gap;
   const ncx=cxp+sx*off+(sz?rr(R,-.8,.8):0),ncz=czp+sz*off+(sx?rr(R,-.8,.8):0);
   P.push({x:ncx-w/2,z:ncz-w/2,w,d:w,y:Math.max(-2,Math.min(8,ny)),h:.6,mv,ph:R()*6,t:last?'end':cpt?'cp':mv?'mv':'n'})}
 }
 P.forEach((p,i)=>{p.i=i;p.ox=p.x;p.oz=p.z;p.dx=0;if(!p.t)p.t='n';if(p.t==='n'&&!p.mv&&p.w>=3.6&&i>1&&R()<L.sp)H.push({p:i,o:(R()-.5)*.6})});
 C=[];P.forEach((p,i)=>{if(i>0&&p.t!=='end'&&R()<.6)C.push({p:i,o:(R()-.5)*Math.min(1.5,p.w*.5),got:0})});P.forEach(p=>{p.ct=-1;p.gone=0;p.cr=0});Lz=[];const hs=new Set(H.map(h=>h.p));
 P.forEach((p,i)=>{if(p.t!=='n'||p.mv||hs.has(i)||i<3)return;const r=R();if(p.w>=2.4&&r<LZP[lvl]){Lz.push({p:i,ph:R()*3,o:(R()-.5)*.8});hs.add(i)}else if(r<LZP[lvl]+CRP[lvl]){p.cr=1;hs.add(i)}});
 {let k=Math.floor(L.n*(.55+R()*.35));while(k>1&&(P[k].t!=='n'||P[k].cr))k--;C.push({p:k,o:0,got:0,s:1})}
 const nc=C.filter(c=>!c.s).length;qd=[0,0,0,0,0,0];qsig='';Q=[{t:'Μάζεψε '+Math.ceil(nc*.5)+' νομίσματα'},{t:'Μάζεψε ΟΛΑ τα νομίσματα ('+nc+')'},{t:'Άγγιξε όλες τις σημαίες'},{t:'Βρες το κρυφό αστέρι ⭐'},{t:'Τερμάτισε σε λιγότερο από '+Math.round(L.n*1.7+14)+' δλ'},{t:'Τερμάτισε με το πολύ '+[8,6,5,4,3][lvl]+' πτώσεις'}];QT=Math.round(L.n*1.7+14);QF=[8,6,5,4,3][lvl];QK=Math.ceil(nc*.5);QNC=nc;
 cps={};cp=0;spawn();qRender()}
const PAL=[['#4ade80','#15803d'],['#60a5fa','#1d4ed8'],['#f472b6','#be185d'],['#fbbf24','#b45309'],['#a78bfa','#6d28d9'],['#2dd4bf','#0f766e']];
function addP(n){pts+=n;$('pt').textContent=pts;$('pt').style.color=n<0?'#dc2626':'#16a34a';setTimeout(()=>{$('pt').style.color=''},350)}
function spawn(){const p=P[cp];if(mode==='2d'){pl={x:p.x+p.w/2,y:p.y,vx:0,vy:0,face:1}}else{pl={x:p.x+p.w/2,y:p.y+p.h+.01,z:p.z+p.d/2,vy:0,yaw:0,pitch:-.35,onp:null}}}
function platPos(p){if(p.mv){const o=Math.sin(t*1.3+p.ph)*1;const nx=(p.ox+o);p.dx=nx-p.x;p.x=nx}else p.dx=0}
function die(){addP(-5);deaths++;$('dc').textContent=deaths;beep(150,.3,'sawtooth');spawn()}
const qkey=(l,m)=>'ob_q'+l+(m||mode);
function qLabels(){document.querySelectorAll('[data-l]').forEach(b=>{if(!b.dataset.b)b.dataset.b=b.textContent;const s=ld(qkey(+b.dataset.l),'000000').split('').filter(x=>x==='1').length;b.textContent=b.dataset.b+(s?' · ★'+s+'/6':'')})}
function qToast(m){const e=$('qt');e.textContent=m;clearTimeout(qToast.h);qToast.h=setTimeout(()=>{e.textContent=''},3200)}
function qDone(i){if(qd[i])return;qd[i]=1;addP(15);qToast('✅ Αποστολή: '+Q[i].t+' (+15)');[659,880].forEach((f,k)=>setTimeout(()=>beep(f,.12),k*100));const s=ld(qkey(lvl),'000000').split('');s[i]='1';sv(qkey(lvl),s.join(''));qLabels()}
function qStat(){const got=C.filter(c=>c.got&&!c.s).length,star=C.some(c=>c.got&&c.s),ncp=P.filter(p=>p.t==='cp').length;return{got,star,fl:Object.keys(cps).length,ncp}}
function qTick(){if(won||!Q.length)return;const s=qStat();if(s.got>=QK)qDone(0);if(s.got>=QNC)qDone(1);if(s.fl>=s.ncp)qDone(2);if(s.star)qDone(3);
 const sig=qd.join('')+s.got+'|'+s.fl+'|'+(s.star?1:0)+'|'+(t>QT?1:0)+'|'+(deaths>QF?1:0)+'|'+(t|0);if(sig!==qsig){qsig=sig;qRender()}}

 $('hint').innerHTML=m==='2d'?'Κίνηση: <b>← →</b> ή <b>A D</b> · Άλμα: <b>Διάστημα</b> ή <b>↑</b> · Πήδα από πλατφόρμα σε πλατφόρμα, απόφυγε τη λάβα και τα αγκάθια. Οι σημαίες σώζουν τη θέση σου. Φτάσε στη χρυσή πλατφόρμα! · ⚡ Τα λέιζερ αναβοσβήνουν: πέρασε όταν σβήνουν ή πήδα τα · 🟫 Οι αμμώδεις πλατφόρμες γκρεμίζονται · ⭐ Βρες το κρυφό αστέρι · 🎯 Ολοκλήρωσε τις αποστολές!':'Κίνηση: <b>W</b>/<b>S</b> ή <b>↑ ↓</b> · Στροφή: <b>← →</b> ή <b>A D</b> · Άλμα: <b>Διάστημα</b> · Πήδα στις πλατφόρμες, απόφυγε τα κόκκινα κουτιά και τη λάβα. Οι σημαίες σώζουν τη θέση σου! · ⚡ Πήδα πάνω από τα λέιζερ ή πέρασε όταν σβήνουν · 🟫 Οι αμμώδεις πλατφόρμες γκρεμίζονται · ⭐ Βρες το αστέρι · 🎯 Ολοκλήρωσε τις αποστολές!';reset()}
function setLvl(l){lvl=l;sv('ob_lvl',l);sel('data-l',l);reset()}
function setCast(c){cast=c;sv('ob_cast',c);sel('data-c',c)}
function reset(){qLabels();started=false;pts=0;$('pt').textContent=0;keys={};t=0;deaths=0;won=false;$('dc').textContent=0;$('win').style.display='none';build()}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLvl(+b.dataset.l));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>setCast(b.dataset.c));
$('rp').onclick=reset;$('nx').onclick=()=>setLvl(lvl+1);
keyMap(code=>{if(mode==='2d')return{ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'}[code];return{ArrowUp:'fw',KeyW:'fw',ArrowDown:'bk',KeyS:'bk',ArrowLeft:'tl',KeyA:'tl',ArrowRight:'tr',KeyD:'tr',Space:'j'}[code]});
let lt=performance.now();
function loop(n){const dt=Math.min(.04,(n-lt)/1000);lt=n;if(keys.l||keys.r||keys.j||keys.fw||keys.bk||keys.tl||keys.tr)started=true;if(!won){if(started||rmRound)t+=dt;$('tm').textContent=t.toFixed(1);crUpd(dt);qTick();mode==='2d'?up2(dt):up3(dt)}mode==='2d'?draw2():GLok?gl3():draw3();requestAnimationFrame(loop)}

/* ---------- Αγώνας τάξης ---------- */
const HEROES=['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🐯','🐰','🐧','🐙','🦄'];let RM=null,rmS=null,rmI=0,rmOff=0,rmDone=0,rmRound=0,rmHero=ld('ob_hero','🐶'),rmErr='';
try{RM=JSON.parse(localStorage.getItem('sea.room')||'null')}catch(e){}
const rsave=()=>{try{RM?localStorage.setItem('sea.room',JSON.stringify(RM)):localStorage.removeItem('sea.room')}catch(e){}};
const rapi=(op,b)=>fetch('/api/room/'+op,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({error:'Δεν υπάρχει σύνδεση στο διαδίκτυο.'}));
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gname=g=>{const m=/^obby-(\d)-(2d|3d)$/.exec(g||'');return m?'Παρκούρ · επίπεδο '+(+m[1]+1)+' · '+m[2].toUpperCase():''};
function rmBoardH(st,me){const P=st.players.slice().sort((a,b)=>(b.d-a.d)||(a.d?(((b.p||0)-(a.p||0))||(a.t-b.t)):a.n.localeCompare(b.n)));
 return '<ol class="rl">'+(P.map(x=>'<li class="'+(x.n===me?'me':'')+'"><b>'+x.h+'</b> '+esc(x.n)+'<span>'+(x.d?x.p+' πόντοι · '+x.t.toFixed(1)+' δλ':(st.phase==='run'?'παίζει…':''))+'</span></li>').join('')||'<li>Δεν έχει μπει κανείς ακόμα.</li>')+'</ol>'}
function rmOpen(on){$('rmo').classList.toggle('on',on);if(on)rmView()}
function rmView(){const o=$('rmb2'),st=rmS||{phase:'lobby',players:[]};let h='';
 if(!RM){h='<h2>👥 Αγώνας τάξης</h2><p>Ο δάσκαλος δίνει έναν κωδικό.</p><input id="rc" maxlength="4" placeholder="ΚΩΔΙΚΟΣ"><input id="rn" maxlength="14" placeholder="Το όνομά σου" value="'+esc(ld('ob_name',''))+'"><div class="rh">'+HEROES.map(x=>'<button data-h="'+x+'" class="'+(x===rmHero?'on':'')+'">'+x+'</button>').join('')+'</div><p><button class="btn" id="rj">Μπαίνω! 🚀</button></p><p style="color:#b91c1c;font-weight:800">'+rmErr+'</p><hr><p>Δάσκαλος/α;</p><button class="btn g" id="rt">👩‍🏫 Φτιάξε τάξη</button><p><button class="btn g" id="rcl">Κλείσιμο</button></p>';rmErr=''}
 else if(RM.teacher){h='<p>Κωδικός τάξης:</p><div class="rcode">'+RM.code+'</div>'+(st.phase==='lobby'?'<p><select id="rl">'+[0,1,2,3,4].map(i=>'<option value="'+i+'">Επίπεδο '+(i+1)+'</option>').join('')+'</select><select id="rm">'+'<option value="2d">2D (πλάι)</option><option value="3d">3D</option></select></p><button class="btn" id="rs">▶️ Ξεκινάμε όλοι μαζί</button>':'<p><b>'+gname(st.game)+'</b></p><button class="btn" id="rr">🔄 Νέος γύρος</button>')+'<h3>Στην τάξη ('+st.players.length+')</h3><div id="rml">'+rmBoardH(st,'')+'</div><p><button class="btn g" id="rx">Κλείσε την τάξη</button> <button class="btn g" id="rcl">Κρύψε</button></p>'}
 else{h='<h2>'+RM.hero+' '+esc(RM.name)+'</h2><p>Τάξη <b>'+RM.code+'</b></p><p style="font-weight:700">'+(st.phase==='run'?(won?'Τελείωσες! Δες τη θέση σου 👇':'Παίζεις: '+gname(st.game)):'Περιμένουμε τον δάσκαλο… ⏳')+'</p><div id="rml">'+rmBoardH(st,RM.name)+'</div><p><button class="btn g" id="rx">Βγαίνω από την τάξη</button> <button class="btn g" id="rcl">Κλείσε τον πίνακα</button></p>'}
 o.innerHTML=h;const g=id=>$(id);
 if(g('rcl'))g('rcl').onclick=()=>rmOpen(false);
 o.querySelectorAll('.rh button').forEach(b=>b.onclick=()=>{rmHero=b.dataset.h;sv('ob_hero',rmHero);o.querySelectorAll('.rh button').forEach(x=>x.classList.toggle('on',x===b))});
 if(g('rj'))g('rj').onclick=async()=>{const code=g('rc').value.trim().toUpperCase(),n=g('rn').value.trim();sv('ob_name',n);const r=await rapi('join',{code,n,h:rmHero});if(!r.ok){rmErr=r.error||'Κάτι πήγε στραβά.';rmView();return}RM={code,pid:r.pid,name:n,hero:rmHero};rsave();rmS=r;rmStart();rmView()};
 if(g('rt'))g('rt').onclick=async()=>{const r=await rapi('create',{});if(!r.ok){rmErr=r.error||'Κάτι πήγε στραβά.';rmView();return}RM={code:r.code,key:r.key,teacher:1};rsave();rmStart();rmView()};
 if(g('rx'))g('rx').onclick=()=>{clearInterval(rmI);rmI=0;RM=null;rmS=null;rsave();rmView()};
 if(g('rs'))g('rs').onclick=async()=>{const r=await rapi('start',{code:RM.code,key:RM.key,game:'obby-'+g('rl').value+'-'+g('rm').value});if(r.ok){rmS=r;rmView()}else{rmErr=r.error||'';}};
 if(g('rr'))g('rr').onclick=async()=>{const r=await rapi('reset',{code:RM.code,key:RM.key});if(r.ok){rmS=r;rmView()}}}
function rmStart(){if(!rmI){rmI=setInterval(rmPoll,1000);rmPoll()}}
async function rmPoll(){if(!RM)return;try{const r=await fetch('/api/room/state?code='+RM.code,{cache:'no-store'});if(r.status===404){clearInterval(rmI);rmI=0;RM=null;rsave();rmErr='Η τάξη έληξε.';rmView();return}
 const st=await r.json();if(!st.ok)return;const ch=!rmS||rmS.phase!==st.phase||rmS.startAt!==st.startAt;rmOff=st.now-Date.now();rmS=st;
 if(!RM.teacher&&st.phase==='run'&&rmDone!==st.startAt&&/^obby-/.test(st.game)){rmDone=st.startAt;rmCount(st);return}
 if(!RM.teacher&&st.phase==='lobby')rmRound=0;
 if($('rmo').classList.contains('on')){if(ch)rmView();else if($('rml'))$('rml').innerHTML=rmBoardH(st,RM.teacher?'':RM.name)}}catch(e){}}
function rmCount(st){rmOpen(false);const m=/^obby-(\d)-(2d|3d)$/.exec(st.game);if(!m)return;const o=$('rcd');o.style.display='flex';
 const iv=setInterval(()=>{const left=st.startAt-(Date.now()+rmOff),n=Math.ceil(left/1000);
  if(left<=0){clearInterval(iv);o.style.display='none';mode=m[2];sv('ob_mode',mode);sel('data-m',mode);$('pad2').style.display=mode==='2d'?'':'none';$('pad3').style.display=mode==='3d'?'':'none';lvl=+m[1];sv('ob_lvl',lvl);sel('data-l',lvl);reset();rmRound=st.startAt;return}
  o.textContent=n;if(o.dataset.n!=n){o.dataset.n=n;beep(n===1?880:520,.12)}},60)}
function rmReport(){if(RM&&!RM.teacher&&rmRound){const st=deaths===0?3:deaths<=2?2:1;rapi('score',{code:RM.code,pid:RM.pid,s:st,p:pts,d:1}).then(r=>{if(r&&r.ok){rmS=r}rmOpen(true)});rmRound=0}}
$('rmb').onclick=()=>{rmOpen(true);if(RM)rmStart()};if(RM)rmStart();
addEventListener('pointerdown',()=>window.focus());window.focus();GLok=gInit();setCast(cast);sel('data-l',lvl);setMode(mode);requestAnimationFrame(loop);

</script></body></html>
