<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Γνωρίζω τον Εξερευνητή αρχείων</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#fffbeb;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3;--fold:#fbbf24}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a0e;--card:#2a2614;--tx:#f8fafc;--mu:#cbd5e1;--bd:#4a4220;--soft:#3a3418;--hl:#4a3f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(22px,5vw,32px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font-family:Fredoka,sans-serif;font-weight:700;font-size:15px;border-radius:99px;padding:7px 14px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:980px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}.lead{color:var(--mu);margin:0 0 12px}
.btn{border:0;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:700;font-size:18px;color:#fff;background:var(--teal);padding:10px 22px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn.o{background:var(--amber);box-shadow:0 5px 0 #d97706}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.fdbk{min-height:30px;font-weight:600;margin:8px 0;font-size:17px}
.stl{margin:0 0 10px;padding-left:0;list-style:none;display:grid;gap:6px;counter-reset:s}
.stl li{counter-increment:s;border:3px solid var(--bd);border-radius:14px;padding:7px 12px 7px 46px;position:relative;font-size:17px;background:var(--soft);opacity:.55}
.stl li::before{content:counter(s);position:absolute;left:10px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:700;font-size:15px}
.stl li.c{opacity:1;border-color:var(--amber);background:var(--hl)}.stl li.c::before{background:var(--amber);color:#fff}
.stl li.d{opacity:1;border-color:var(--green);background:#dcfce7;color:#14532d}.stl li.d::before{content:"✓";background:var(--green);color:#fff}
.win{text-align:center;padding:12px}.win .big{font-size:64px}
/* explorer */
.ex{border:3px solid #94a3b8;border-radius:14px;background:#fff;color:#1e293b;overflow:hidden;position:relative;outline:0;font-size:16px;user-select:none}
.ex-tb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#f1f5f9;border-bottom:2px solid #cbd5e1}
.ex-tb button{border:2px solid #cbd5e1;background:#fff;color:#1e293b;border-radius:10px;padding:5px 9px;font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.ex-tb button:disabled{opacity:.4;cursor:default}.ex-tb button:not(:disabled):hover{background:#fef3c7;border-color:#f59e0b}
.ex-pa{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 8px;background:#e2e8f0;border-bottom:2px solid #cbd5e1;font-size:15px}
.ex-pa .cr{border:0;background:transparent;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;color:#1e293b;padding:3px 7px;border-radius:8px;cursor:pointer}.ex-pa .cr:hover{background:#fff}
.ex-pa .sp{color:#64748b}.ex-pa .pc{color:#64748b;padding:3px 4px}
.ex-bd{display:grid;grid-template-columns:150px 1fr;min-height:230px}
.ex-sd{background:#f8fafc;border-right:2px solid #e2e8f0;padding:8px 6px;display:flex;flex-direction:column;gap:3px}
.ex-sd .h{font-size:12px;color:#64748b;font-weight:700;margin:0 4px 2px}
.ex-sd button{text-align:left;border:0;background:transparent;font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;color:#1e293b;padding:6px 8px;border-radius:8px;cursor:pointer}
.ex-sd button.on{background:#fde68a}.ex-sd button:hover{background:#fef3c7}
.ex-ls{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;align-content:start}
.it{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px;border:2px solid transparent;border-radius:10px;cursor:pointer;min-height:84px}
.it .ic{font-size:38px;line-height:1.1}.it .nm{font-size:14px;font-weight:600;word-break:break-word;margin-top:2px}
.it.sel{background:#dbeafe;border-color:#3b82f6}.it.cut{opacity:.45}.it.dim{opacity:.5}
.it input.rn{width:100%;font-family:Fredoka,sans-serif;font-size:14px;border:2px solid #3b82f6;border-radius:6px;padding:2px 4px;text-align:center;color:#1e293b;background:#fff;user-select:text}
.dz{outline:3px dashed #f59e0b;background:#fef3c7!important}
.ex-em{grid-column:1/-1;text-align:center;color:#94a3b8;padding:24px 0;font-size:16px}
.ctx{position:absolute;z-index:20;background:#fff;color:#1e293b;border:2px solid #94a3b8;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.25);padding:4px;min-width:180px}
.ctx button{display:block;width:100%;text-align:left;border:0;background:transparent;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;padding:7px 10px;border-radius:7px;cursor:pointer;color:#1e293b}.ctx button:hover{background:#fef3c7}.ctx button:disabled{opacity:.4}
@media(max-width:560px){.ex-bd{grid-template-columns:1fr}.ex-sd{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid #e2e8f0}.ex-sd .h{display:none}.ex-tb button .l{display:none}.ex-tb button{font-size:18px}}
/* save mission */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;font-family:Fredoka,sans-serif;font-weight:700;font-size:15px;padding:6px 12px;cursor:pointer}.chip.on{border-color:var(--amber);background:var(--hl)}.chip.ok{border-color:var(--green);background:#dcfce7;color:#14532d}
.task{background:var(--hl);border:3px solid var(--amber);border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:18px}
.app{border:4px solid #334155;border-radius:14px;overflow:hidden;background:#fff;color:#1e293b;position:relative;max-width:640px;margin:0 auto 8px}
.app .tt{padding:7px 12px;color:#fff;font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.app .mb{display:flex;gap:4px;background:#f1f5f9;border-bottom:2px solid #cbd5e1;padding:4px 6px;position:relative}
.app .mb button{border:0;background:transparent;font-family:Fredoka,sans-serif;font-weight:700;font-size:15px;padding:5px 12px;border-radius:8px;cursor:pointer;color:#1e293b}.app .mb button.on,.app .mb button:hover{background:#fff}
.app .dd{position:absolute;left:6px;top:36px;background:#fff;border:2px solid #94a3b8;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.25);padding:4px;z-index:5;min-width:200px}
.app .dd button{display:block;width:100%;text-align:left;border:0;background:transparent;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;padding:7px 10px;border-radius:7px;cursor:pointer;color:#1e293b}.app .dd button:hover{background:#fef3c7}
.app .bd{padding:14px;min-height:170px;font-size:16px}
.urlb{background:#e2e8f0;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:500;color:#334155;flex:1;margin-left:10px}
.pic{width:min(240px,70%);aspect-ratio:4/3;margin:0 auto;border-radius:14px;background:linear-gradient(135deg,#bae6fd,#fde68a);display:grid;place-items:center;font-size:84px;cursor:context-menu;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tbl{border-collapse:collapse;margin:auto}.tbl td,.tbl th{border:1px solid #94a3b8;padding:5px 14px;font-size:15px}.tbl th{background:#e2e8f0}
.sld{aspect-ratio:16/9;max-width:300px;margin:auto;background:#fff7ed;border:3px solid #fdba74;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:20px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;display:grid;place-items:center;padding:10px;overflow:auto}
.dlg{background:var(--card);color:var(--tx);border:4px solid #334155;border-radius:16px;width:min(720px,100%);padding:12px;max-height:96vh;overflow:auto}
.dlg .dh{font-weight:700;font-size:20px;margin-bottom:8px}.dlg .df{display:grid;gap:6px;margin:10px 0}.dlg input{font-family:Fredoka,sans-serif;font-size:18px;padding:6px 10px;border:3px solid var(--bd);border-radius:10px;width:100%;background:var(--card);color:var(--tx)}
.dlg .ft{font-size:15px;color:var(--mu)}.dnote{min-height:26px;font-weight:600;font-size:16px}.da{text-align:right}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:11px 14px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;cursor:pointer;margin:8px 0}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 12px}.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.cert{border:6px double var(--amber);border-radius:20px;padding:18px;text-align:center;background:var(--hl);margin-top:14px}
.cert input{font-family:Fredoka,sans-serif;font-weight:700;font-size:24px;text-align:center;border:0;border-bottom:3px solid var(--amber);background:transparent;color:var(--tx);width:90%;outline:0}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%}.cert .btn{display:none}}
</style></head><body>
<header><h1>📂 Γνωρίζω τον Εξερευνητή αρχείων</h1><p>Φτιάχνω, μετονομάζω, μετακινώ, σβήνω και αποθηκεύω σε φακέλους</p></header>
<div id="tabs"></div><main><div class="card" id="v"></div></main>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();
const sh=a=>[...a].sort(()=>Math.random()-.5);
let done={},cur=0;const KEY='files.done';
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const mark=i=>{if(!done[i]){done[i]=1;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}tabs()}};
function tabs(){const t=$('tabs');t.innerHTML='';T.forEach((x,i)=>{const b=el('button',(i==cur?'on ':'')+(done[i]?'ok':''),x[0]);b.onclick=()=>go(i);t.appendChild(b)})}
function go(i){cur=i;tabs();const v=$('v');v.innerHTML='';v.appendChild(el('h2','',T[i][1]));T[i][2](v,i);scrollTo(0,0)}

/* ---------- αρχεία ---------- */
let UID=1;
const ICO={txt:'📝',docx:'📘',xlsx:'📗',pptx:'📙',jpg:'🖼️',png:'🖼️'};
const R=(id,name,ico)=>({id,name,kind:'dir',parent:'pc',ico});
const baseFS=()=>({desk:R('desk','Επιφάνεια εργασίας','🖥️'),docs:R('docs','Έγγραφα','📄'),pics:R('pics','Εικόνες','🖼️'),bin:R('bin','Κάδος ανακύκλωσης','🗑️')});
function A(fs,parent,name,kind,ext){const id='n'+(UID++);fs[id]={id,name,kind,ext:ext||'',parent,ico:kind=='dir'?'📁':(ICO[ext]||'📄')};return id}
const find=(fs,name,parent)=>Object.values(fs).find(n=>norm(n.name)==norm(name)&&(parent==null||n.parent==parent));
const findAll=(fs,name)=>Object.values(fs).filter(n=>norm(n.name)==norm(name));
const inside=(fs,id,anc)=>{let n=fs[id];while(n){if(n.id==anc)return true;n=fs[n.parent]}return false};

function ask(msg,yes){const ov=el('div','ov',`<div class="dlg" style="max-width:420px;text-align:center"><div class="dh">${msg}</div><div class="da" style="text-align:center"><button class="btn o" id="y">Ναι</button><button class="btn g" id="n">Όχι</button></div></div>`);document.body.appendChild(ov);ov.querySelector('#y').onclick=()=>{ov.remove();yes()};ov.querySelector('#n').onclick=()=>ov.remove()}

function Explorer(host,S,o){
 o=o||{};const fs=S.fs;S.hist=S.hist||[];
 const emit=(t,d)=>{try{o.onEvt&&o.onEvt(t,d)}catch(e){console.error(e)}};
 const note=(m,b)=>{o.note&&o.note(m,b)};
 const full=n=>n.name+(n.kind=='file'&&n.ext?'.'+n.ext:'');
 const kids=id=>Object.values(fs).filter(n=>n.parent==id).sort((a,b)=>(a.kind==b.kind?0:a.kind=='dir'?-1:1)||a.name.localeCompare(b.name,'el'));
 const chain=id=>{const a=[];let n=fs[id];while(n){a.unshift(n);n=fs[n.parent]}return a};
 const inBin=()=>inside(fs,S.cwd,'bin');
 const exists=(p,nm,ex,skip)=>Object.values(fs).some(n=>n.parent==p&&n.id!=skip&&norm(n.name)==norm(nm)&&(n.ext||'')==(ex||''));
 const uniq=(p,nm,ex)=>{let c=nm,i=2;while(exists(p,c,ex))c=nm+' ('+(i++)+')';return c};
 let w,list,lastT=0,lastId=null;
 function nav(id,noHist){lastId=null;if(!fs[id]||fs[id].kind!='dir')return;if(!noHist&&S.cwd!=id)S.hist.push(S.cwd);S.cwd=id;S.sel=null;render();emit('nav',id)}
 function up(){const n=fs[S.cwd];if(n&&fs[n.parent])nav(n.parent)}
 function back(){if(S.hist.length)nav(S.hist.pop(),1)}
 function open(id){const n=fs[id];if(!n)return;if(n.kind=='dir')nav(id);else note('Αυτό είναι αρχείο. Τα αρχεία ανοίγουν με το πρόγραμμά τους (π.χ. Word, Excel).')}
 function newF(){if(inBin()){note('Στον κάδο δεν φτιάχνουμε φακέλους.',1);return}const id=A(fs,S.cwd,uniq(S.cwd,'Νέος φάκελος'),'dir');S.sel=id;render();emit('new',id);rename(id)}
 function rename(id){const n=fs[id];if(!n)return;if(inBin()){note('Πρώτα επαναφέρουμε από τον κάδο και μετά αλλάζουμε όνομα.',1);return}
  const nm=list.querySelector('.it[data-id="'+id+'"] .nm');if(!nm)return;emit('renstart',id);
  const inp=document.createElement('input');inp.className='rn';inp.value=n.name;nm.replaceChildren(inp);inp.focus();inp.select();let fin=false;
  const commit=()=>{if(fin)return;const v=inp.value.trim();if(!v){fin=true;render();return}
   if(/[\\\/:*?"<>|]/.test(v)){note('Αυτά τα σύμβολα δεν επιτρέπονται στο όνομα:  \\ / : * ? " < > |',1);inp.focus();return}
   if(exists(n.parent,v,n.ext,id)){note('Υπάρχει ήδη κάτι με αυτό το όνομα εδώ. Διάλεξε άλλο όνομα.',1);inp.focus();return}
   fin=true;n.name=v;render();emit('renamed',id)};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')commit();else if(e.key=='Escape'){fin=true;render()}};
  inp.onblur=()=>setTimeout(commit,0);inp.onclick=e=>e.stopPropagation()}
 function del(id){const n=fs[id];if(!n)return;if(inBin()){note('Αυτό βρίσκεται ήδη στον κάδο.',1);return}n.from=n.parent;n.parent='bin';if(S.sel==id)S.sel=null;if(S.clip&&S.clip.id==id)S.clip=null;render();emit('del',id);note('Πήγε στον Κάδο ανακύκλωσης. Μπορείς να το φέρεις πίσω από εκεί.')}
 function rest(id){const n=fs[id];if(!n||n.parent!='bin')return;const to=fs[n.from]&&!inside(fs,n.from,'bin')?n.from:'docs';n.name=uniq(to,n.name,n.ext);n.parent=to;S.sel=null;render();emit('rest',id);note('Επαναφέρθηκε στη θέση του!')}
 function empty(){ask('Να αδειάσει ο κάδος; Ό,τι έχει μέσα θα χαθεί για πάντα!',()=>{Object.values(fs).filter(n=>n.parent=='bin').forEach(n=>rm(n.id));S.sel=null;render();emit('empty');note('Ο κάδος άδειασε. Τα αρχεία έφυγαν οριστικά.')})}
 function rm(id){Object.values(fs).filter(n=>n.parent==id).forEach(c=>rm(c.id));delete fs[id]}
 function clone(id,to,nm){const n=fs[id];const nid=A(fs,to,nm||n.name,n.kind,n.ext);fs[nid].ico=n.ico;Object.values(fs).filter(c=>c.parent==id&&c.id!=nid).forEach(c=>clone(c.id,nid));return nid}
 function move(id,to){const n=fs[id],d=fs[to];if(!n||!d||d.kind!='dir')return;if(to=='bin'){del(id);return}
  if(inside(fs,to,id)){note('Δεν γίνεται! Ένας φάκελος δεν μπαίνει μέσα στον εαυτό του.',1);return}if(n.parent==to)return;
  n.name=uniq(to,n.name,n.ext);n.parent=to;render();emit('move',{id,to});note('Μετακινήθηκε στον φάκελο «'+d.name+'».')}
 function paste(){const c=S.clip;if(!c||!fs[c.id])return;if(inBin()){note('Στον κάδο δεν επικολλούμε.',1);return}
  if(c.mode=='cut'){move(c.id,S.cwd);S.clip=null;emit('paste',c);return}
  if(inside(fs,S.cwd,c.id)){note('Δεν γίνεται! Ένας φάκελος δεν αντιγράφεται μέσα στον εαυτό του.',1);return}
  const nid=clone(c.id,S.cwd,uniq(S.cwd,fs[c.id].name,fs[c.id].ext));S.sel=nid;render();emit('paste',c);note('Επικολλήθηκε αντίγραφο.')}
 const sel=()=>S.sel&&fs[S.sel];
 const ACT={back,up,open:()=>sel()&&open(S.sel),new:newF,ren:()=>sel()&&rename(S.sel),cut:()=>{if(sel()){S.clip={id:S.sel,mode:'cut'};render();note('✂️ Κόψαμε «'+full(sel())+'». Τώρα άνοιξε τον φάκελο προορισμού και πάτα Επικόλληση.');emit('cut',S.sel)}},copy:()=>{if(sel()){S.clip={id:S.sel,mode:'copy'};render();note('📋 Αντιγράψαμε «'+full(sel())+'». Άνοιξε το φάκελο που θέλεις και πάτα Επικόλληση.');emit('copy',S.sel)}},paste,del:()=>sel()&&del(S.sel),rest:()=>sel()&&rest(S.sel),empty};
 const BTN={back:['◀','Πίσω'],up:['⬆️','Πάνω'],open:['📂','Άνοιγμα'],new:['📁＋','Νέος φάκελος'],ren:['✏️','Μετονομασία'],cut:['✂️','Κόψιμο'],copy:['📋','Αντιγραφή'],paste:['📥','Επικόλληση'],del:['🗑️','Διαγραφή'],rest:['♻️','Επαναφορά'],empty:['🧹','Άδειασμα κάδου']};
 function act(a){if(o.readonly&&a!='back'&&a!='up'&&a!='open')return;ACT[a]&&ACT[a]()}
 function tbUpd(){const bin=inBin(),n=sel();w.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;let d=false;
  if(a=='back')d=!S.hist.length;else if(a=='up')d=!fs[(fs[S.cwd]||{}).parent];else if(a=='open')d=!n||n.kind!='dir';else if(a=='new')d=bin;else if(a=='paste')d=!S.clip||bin;else if(a=='rest')d=!n||!bin;else if(a=='empty')d=!Object.values(fs).some(x=>x.parent=='bin');else d=!n||bin;b.disabled=d})}
 function ctx(e,id){e.preventDefault();e.stopPropagation();closeCtx();if(o.readonly)return;const n=id&&fs[id];if(id){S.sel=id;lsUpd()}
  const m=el('div','ctx');const add=(l,a,dis)=>{const b=el('button','',l);b.disabled=!!dis;b.onclick=ev=>{ev.stopPropagation();closeCtx();act(a)};m.appendChild(b)};
  const bin=inBin();

   const pic=ap.querySelector('#pic');const show=e=>{e.preventDefault();ap.querySelectorAll('.ctx').forEach(x=>x.remove());const m=el('div','ctx');const app=ap.querySelector('.app');app.style.position='relative';
    [['Άνοιγμα εικόνας σε νέα καρτέλα',0],['Αποθήκευση εικόνας ως…',1],['Αντιγραφή εικόνας',0],['Αντιγραφή διεύθυνσης εικόνας',0]].forEach(([l,g])=>{const b=el('button','',l);b.onclick=ev=>{ev.stopPropagation();m.remove();if(g)dlg(t);else say('Αυτό δεν αποθηκεύει την εικόνα στον υπολογιστή. Ψάξε τη λέξη «Αποθήκευση».',1)};m.appendChild(b)});
    const r=app.getBoundingClientRect();m.style.left=Math.max(4,Math.min(e.clientX-r.left,r.width-200))+'px';m.style.top=Math.max(4,e.clientY-r.top)+'px';app.appendChild(m);setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)};
   pic.oncontextmenu=show;pic.onclick=show;
  }else{
   const fm=ap.querySelector('#fm');const mb=fm.parentNode;const key=e=>{if(e.ctrlKey&&(e.key=='s'||e.key=='S')){e.preventDefault();document.removeEventListener('keydown',key);dlg(t)}};document.addEventListener('keydown',key);
   fm.onclick=e=>{e.stopPropagation();fm.classList.add('on');const dd=el('div','dd');[['Νέο',0],['Άνοιγμα',0],['Αποθήκευση',1],['Αποθήκευση ως…',1],['Εκτύπωση',0],['Κλείσιμο',0]].forEach(([l,g])=>{const b=el('button','',l);b.onclick=ev=>{ev.stopPropagation();dd.remove();fm.classList.remove('on');if(g){document.removeEventListener('keydown',key);dlg(t)}else say('Αυτή η εντολή δεν αποθηκεύει το αρχείο. Ψάξε το «Αποθήκευση ως…».',1)};dd.appendChild(b)});mb.appendChild(dd);setTimeout(()=>document.addEventListener('click',()=>{dd.remove();fm.classList.remove('on')},{once:true}),0)};
   fb.innerHTML='<span style="color:var(--mu)">Πάτα <b>Αρχείο</b> → <b>Αποθήκευση ως…</b> (ή πάτα Ctrl+S).</span>';
  }
  if(t.k=='browser')fb.innerHTML='<span style="color:var(--mu)">Μενού φωτογραφίας → <b>Αποθήκευση εικόνας ως…</b></span>';
 }
 function dlg(t){
  const S2={fs,cwd:'docs',sel:null,hist:[]};
  const ov=el('div','ov');const bx=el('div','dlg','<div class="dh">💾 Αποθήκευση ως</div><div id="dx"></div><div class="df"><label>Όνομα αρχείου:<input id="fn" maxlength="40"></label><div class="ft">Τύπος: '+t.type+'</div></div><div class="dnote" id="dn"></div><div class="da"><button class="btn" id="dsv">💾 Αποθήκευση</button><button class="btn g" id="dcx">Άκυρο</button></div>');
  ov.appendChild(bx);document.body.appendChild(ov);const dn=bx.querySelector('#dn'),fn=bx.querySelector('#fn');fn.value=t.def;
  Explorer(bx.querySelector('#dx'),S2,{tools:['new'],dialog:true,noBin:true,note:(m,b)=>{dn.innerHTML='<span class="'+(b?'bad-t':'ok-t')+'">'+m+'</span>'}});
  bx.querySelector('#dcx').onclick=()=>{ov.remove();msg='';draw()};
  bx.querySelector('#dsv').onclick=()=>{const nm=fn.value.trim();const ok1=S2.cwd==t.dest,ok2=norm(nm)==norm(t.name);
   if(!ok1){dn.innerHTML='<span class="bad-t">Ο φάκελος δεν είναι ο σωστός! Τώρα είσαι στον «'+esc(fs[S2.cwd].name)+'». Κοίτα τη διαδρομή πάνω και πήγαινε: '+t.path+'.</span>';return}
   if(!ok2){dn.innerHTML='<span class="bad-t">Το όνομα πρέπει να είναι «'+esc(t.name)+'».</span>';return}
   A(fs,t.dest,nm,'file',t.ext);t.done=true;ov.remove();msg='<span class="ok-t">🎉 Αποθηκεύτηκε! Το αρχείο «'+esc(nm)+'.'+t.ext+'» βρίσκεται στο '+t.path+'.</span>';
   const all=TK.every(x=>x.done);if(all){mark(idx);msg+='<br><span class="ok-t">⭐ Τα κατάφερες και στις 4 περιπτώσεις!</span>'}draw();
   if(all&&idx+1<T.length){const b=el('button','btn o','Επόμενη αποστολή ➜');b.onclick=()=>go(idx+1);box.appendChild(b)}}}
 draw()}

/* ---------- Κουίζ ---------- */
function quiz(v,idx){
 const Q=[['Πώς λέγεται το «συρτάρι» στο οποίο βάζουμε αρχεία;',['Φάκελος','Πρόγραμμα','Οθόνη'],'Στον φάκελο 📁 βάζουμε αρχεία και άλλους φακέλους.'],
 ['Πώς φτιάχνουμε νέο φάκελο;',['Κουμπί «Νέος φάκελος» ή δεξί κλικ → Νέος φάκελος','Πατάμε το πλήκτρο Ctrl μία φορά','Κλείνουμε τον υπολογιστή'],'Μετά γράφουμε το όνομα και πατάμε Enter.'],
 ['Τι κάνει το «Κόψιμο» και μετά «Επικόλληση»;',['Μετακινεί το αρχείο ή φάκελο','Φτιάχνει δεύτερο αντίγραφο','Σβήνει το αρχείο για πάντα'],'Το Κόψιμο + Επικόλληση το μεταφέρει. Για αντίγραφο χρησιμοποιούμε Αντιγραφή.'],
 ['Πού πηγαίνουν τα πράγματα που σβήνουμε;',['Στον Κάδο ανακύκλωσης','Στο διαδίκτυο','Εξαφανίζονται αμέσως'],'Από τον κάδο μπορούμε να τα επαναφέρουμε, αν δεν τον έχουμε αδειάσει.'],
 ['Τι προσέχω όταν αποθηκεύω ένα αρχείο;',['Το όνομα και τον φάκελο που το βάζω','Μόνο το χρώμα του προγράμματος','Τίποτα, βρίσκεται μόνο του'],'Αν δεν θυμάμαι πού το έβαλα, δεν θα το βρω εύκολα.'],
 ['Ποια εντολή του μενού Αρχείο μας αφήνει να διαλέξουμε φάκελο και όνομα;',['Αποθήκευση ως…','Εκτύπωση','Κλείσιμο'],'Η «Αποθήκευση ως…» ανοίγει το παράθυρο με τους φακέλους.'],
 ['Τι δείχνει η γραμμή διαδρομής;',['Σε ποιον φάκελο βρίσκομαι','Την ώρα','Πόσο μνήμη έχει ο υπολογιστής'],'Π.χ. Υπολογιστής › Έγγραφα › Σχολείο.']];
 let i=0,sc=0;
 function show(){v.innerHTML='';v.appendChild(el('h2','',T[idx][1]));if(i>=Q.length)return end();const q=Q[i];
  v.appendChild(el('div','prog','<i style="width:'+(i/Q.length*100)+'%"></i>'));v.appendChild(el('p','lead','Ερώτηση '+(i+1)+' από '+Q.length));v.appendChild(el('h3','',q[0]));
  const fb=el('div','fdbk','');let lock=false;
  sh(q[1].map((t,j)=>[t,j])).forEach(([t,j])=>{const b=el('button','opt',esc(t));b.onclick=()=>{if(lock)return;lock=true;if(j==0){sc++;b.classList.add('right');fb.innerHTML='<span class="ok-t">✅ Σωστά! '+q[2]+'</span>'}else{b.classList.add('wrong');v.querySelectorAll('.opt').forEach(x=>{if(x.textContent==q[1][0])x.classList.add('right')});fb.innerHTML='<span class="bad-t">Όχι ακριβώς. '+q[2]+'</span>'}
   const n=el('button','btn o',i<Q.length-1?'Επόμενη ➜':'Τέλος');n.onclick=()=>{i++;show()};fb.appendChild(el('div','',''));fb.lastChild.appendChild(n)};v.appendChild(b)});v.appendChild(fb)}
 function end(){const good=sc>=5;v.appendChild(el('div','win','<div class="big">'+(good?'🏆':'💪')+'</div><h3>'+sc+' / '+Q.length+' σωστά</h3><p>'+(good?'Μπράβο! Ξέρεις να οργανώνεις τα αρχεία σου!':'Ξαναδοκίμασε για να πάρεις το δίπλωμα (χρειάζονται τουλάχιστον 5 σωστά).')+'</p>'));
  const r=el('button','btn g','↺ Ξανά');r.onclick=()=>{i=0;sc=0;show()};v.appendChild(r);
  if(good){mark(idx);const c=el('div','cert','<div style="font-size:54px">🏅</div><h3 style="margin:4px 0">Δίπλωμα Εξερευνητή αρχείων</h3><p>Το παιδί που ονομάζεται</p><input id="cn" maxlength="30" placeholder="γράψε το όνομά σου"><p>έμαθε να φτιάχνει, να μετονομάζει, να μετακινεί, να σβήνει και να αποθηκεύει σε φακέλους!</p>');const p=el('button','btn','🖨️ Εκτύπωση');p.onclick=()=>window.print();c.appendChild(p);v.appendChild(c)}}
 show()}

const T=[['🔎 Γνωρίζω','1. Γνωρίζω τον Εξερευνητή',(v,i)=>runMission(v,M1,i)],['📁 Νέος φάκελος','2. Φτιάχνω φάκελο',(v,i)=>runMission(v,M2,i)],['✏️ Μετονομασία','3. Μετονομάζω φάκελο',(v,i)=>runMission(v,M3,i)],['🚚 Μετακίνηση','4. Μετακινώ και αντιγράφω',(v,i)=>runMission(v,M4,i)],['🗑️ Διαγραφή','5. Σβήνω και επαναφέρω',(v,i)=>runMission(v,M5,i)],['💾 Αποθήκευση','6. Αποθηκεύω σε φάκελο',saveMission],['🏆 Κουίζ','7. Κουίζ και δίπλωμα',quiz]];
tabs();go(0);
