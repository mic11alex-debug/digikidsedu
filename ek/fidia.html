<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Φίδια και σκάλες</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#10b981;--g2:#0ea5e9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
#bw{position:relative;width:min(100%,520px);margin:6px auto;aspect-ratio:1}#bd{display:grid;grid-template-columns:repeat(10,1fr);width:100%;height:100%;border-radius:12px;overflow:hidden;border:4px solid #0f766e}
#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.t{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f3d3a;position:relative;line-height:1}
.t:nth-child(odd){}.tk{position:absolute;font-size:clamp(14px,4.6vw,26px);transition:left .25s,top .25s;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}</style></head><body>
<header><h1>🐍 Φίδια και σκάλες 🪜</h1><p>Ρίξε το ζάρι και φτάσε πρώτος στο 100!</p></header>
<main><div class="row"><div class="lab">Παίκτες</div><button class="ch on" data-n="1">🤖 Εγώ + υπολογιστής</button><button class="ch" data-n="2">👫 2</button><button class="ch" data-n="3">3</button><button class="ch" data-n="4">4</button></div>
<div id="msg"></div><div id="bw"><div id="bd"></div><svg id="sv" viewBox="0 0 100 100"></svg></div>
<div class="row"><div id="dice" style="font-size:54px">🎲</div><button class="btn" id="roll">🎲 Ρίξε το ζάρι</button><button class="btn g" id="again">🔄 Νέο</button></div><div class="row" id="pl"></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const LAD={4:14,9:31,20:38,28:84,40:59,51:67,63:81,71:91},SN={17:7,54:34,62:19,64:60,87:24,93:73,95:75,99:78};
const EM=['🐶','🐱','🐰','🦊'];let N=1,pos,turn,over,busy;
function xy(n){const r=Math.floor((n-1)/10),c=(n-1)%10;return[r%2?9-c:c,9-r]}
function build(){const bd=$('bd');bd.innerHTML='';for(let y=0;y<10;y++)for(let x=0;x<10;x++){const row=9-y;const n=row*10+(row%2?10-x:x+1);const d=document.createElement('div');d.className='t';d.style.background=(x+y)%2?'#bbf7d0':'#fef9c3';d.textContent=n;bd.appendChild(d)}
 let s='';const cen=n=>{const[x,y]=xy(n);return[x*10+5,y*10+5]};
 for(const a in LAD){const[x1,y1]=cen(+a),[x2,y2]=cen(LAD[a]);const dx=y2-y1,dy=x1-x2,L=Math.hypot(dx,dy)||1,ox=dx/L*1.6,oy=dy/L*1.6;s+=`<g stroke="#a16207" stroke-width=".9" stroke-linecap="round"><line x1="${x1+ox}" y1="${y1+oy}" x2="${x2+ox}" y2="${y2+oy}"/><line x1="${x1-ox}" y1="${y1-oy}" x2="${x2-ox}" y2="${y2-oy}"/>`;const k=Math.round(L/4);for(let i=1;i<k;i++){const t=i/k;s+=`<line x1="${x1+ox+(x2-x1)*t}" y1="${y1+oy+(y2-y1)*t}" x2="${x1-ox+(x2-x1)*t}" y2="${y1-oy+(y2-y1)*t}"/>`}s+='</g>'}
 for(const a in SN){const[x1,y1]=cen(+a),[x2,y2]=cen(SN[a]);const mx=(x1+x2)/2+(y2-y1)*.18,my=(y1+y2)/2-(x2-x1)*.18;s+=`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" opacity=".85"/><circle cx="${x1}" cy="${y1}" r="2.2" fill="#dc2626"/><text x="${x1-1.8}" y="${y1+1.2}" font-size="3.6">🐍</text>`}
 $('sv').innerHTML=s}
function tok(){document.querySelectorAll('.tk').forEach(e=>e.remove());pos.forEach((p,i)=>{const[x,y]=xy(Math.max(p,1));const t=document.createElement('div');t.className='tk';t.id='tk'+i;const off=[[0,0],[.45,0],[0,.45],[.45,.45]][i];t.style.left=(x*10+off[0]*10+.5)+'%';t.style.top=(y*10+off[1]*10+.5)+'%';t.textContent=EM[i];if(p<1)t.style.display='none';$('bw').appendChild(t)});
 $('pl').innerHTML=pos.map((p,i)=>`<div class="pill" style="${i===turn&&!over?'border-color:#f59e0b':''}"><small>${EM[i]} ${N===1&&i===1?'Υπολογιστής':'Παίκτης '+(i+1)}</small><b>${p}</b></div>`).join('')}
function newG(){const m=N===1?2:N;pos=Array(m).fill(0);turn=0;over=false;busy=false;$('dice').textContent='🎲';build();tok();say()}
function say(){if(over)return;$('msg').textContent=(N===1?(turn===0?'Η σειρά σου!':'Παίζει ο υπολογιστής…'):'Σειρά του παίκτη '+(turn+1)+' '+EM[turn])}
function roll(){if(busy||over)return;if(N===1&&turn!==0)return;go()}
function go(){busy=true;const d=1+Math.random()*6|0;let k=0;const an=setInterval(()=>{$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.random()*6|0];beep(300+k*40,.05);if(++k>7){clearInterval(an);$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][d-1];mv(d)}},70)}
function mv(d){let p=pos[turn],tgt=p+d;if(tgt>100){busy=false;$('msg').textContent='Χρειάζεσαι ακριβώς '+(100-p)+'…';return next()}
 const step=()=>{if(p<tgt){p++;pos[turn]=p;tok();beep(500,.05);setTimeout(step,170)}else land()};
 const land=()=>{let q=pos[turn];if(LAD[q]){$('msg').textContent='🪜 Σκάλα! Ανεβαίνεις!';pos[turn]=LAD[q];beep(900,.3);}else if(SN[q]){$('msg').textContent='🐍 Φίδι! Γλιστράς κάτω!';pos[turn]=SN[q];beep(150,.4,'sawtooth')}tok();
  if(pos[turn]===100){over=true;$('msg').textContent='🎉 Κέρδισε ο '+(N===1&&turn===1?'υπολογιστής':'παίκτης '+(turn+1))+' '+EM[turn]+'!';fanfare();tok();return}
  if(d===6&&false){busy=false;return}setTimeout(next,700)};step()}
function next(){busy=false;turn=(turn+1)%pos.length;tok();say();if(N===1&&turn===1&&!over){busy=true;setTimeout(()=>{busy=false;go()},700)}}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{N=+b.dataset.n;sel('data-n',N);newG()});$('roll').onclick=roll;$('again').onclick=newG;newG();
</script></body></html>
