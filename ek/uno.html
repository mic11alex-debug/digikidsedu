<style>

.hud{display:flex;justify-content:space-between;font-weight:700;margin:6px 0;flex-wrap:wrap;gap:8px}

<header><h1>🃏 UNO</h1><p>Το κλασικό παιχνίδι με κάρτες</p></header><main style="max-width:900px"><div class="card" id="v"></div></main>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const COL={R:['Κόκκινο','#ef4444','●'],Y:['Κίτρινο','#facc15','■'],G:['Πράσινο','#22c55e','▲'],B:['Μπλε','#3b82f6','★']};
const CN=['R','Y','G','B'];
const SYM={S:'⊘',V:'⇄',D:'+2',W:'🌈',F:'+4'};
let G=null,timer=null;
function mkDeck(){const d=[];CN.forEach(c=>{d.push({c,v:'0'});for(let n=1;n<=9;n++){d.push({c,v:''+n});d.push({c,v:''+n})}['S','V','D'].forEach(a=>{d.push({c,v:a});d.push({c,v:a})})});for(let i=0;i<4;i++){d.push({c:'W',v:'W'});d.push({c:'W',v:'F'})}return sh(d)}
function cardEl(c,o={}){const b=el(o.btn?'button':'div','uc'+(o.small?' sm':'')+(o.pl?' pl':'')+(o.dim?' dim':''),'');const bg=c.c=='W'?'conic-gradient(#ef4444 0 25%,#facc15 0 50%,#22c55e 0 75%,#3b82f6 0)':COL[c.c][1];
 b.style.setProperty('--cc',c.c=='W'&&o.col?COL[o.col][1]:bg);const t=SYM[c.v]||c.v;
 b.innerHTML='<i class="cn">'+t+'</i><span class="ce"><b>'+t+'</b></span><i class="cn bt">'+t+'</i>'+(c.c!='W'?'<em>'+COL[c.c][2]+'</em>':'');
 if(c.c=='W'){b.classList.add('wild');if(o.col)b.style.setProperty('--cc',COL[o.col][1])}
 b.setAttribute('aria-label',(c.c=='W'?'Άσπρο':COL[c.c][0])+' '+t);return b}
function back(small){const b=el('div','uc back'+(small?' sm':''),'<span class="ce"><b>UNO</b></span>');return b}
const playable=(c,top,col)=>c.c=='W'||c.c==col||c.v==top.v;
const canF=(h,col)=>!h.some(x=>x.c==col);
function setup(){clearInterval(timer);const v=$('v');v.innerHTML='<h2>Με πόσους θα παίξεις;</h2><p class="lead">Παίζεις εσύ και ο υπολογιστής. Ο πρώτος που θα μείνει χωρίς κάρτες κερδίζει! Μην ξεχάσεις να φωνάξεις <b>ΟΥΝΟ</b> όταν σου μείνει μία κάρτα!</p>';
 const w=el('div','','');w.style.textAlign='center';[[1,'👤 Εσύ + 1 αντίπαλος'],[2,'👥 Εσύ + 2 αντίπαλοι'],[3,'👪 Εσύ + 3 αντίπαλοι']].forEach(([n,l])=>{const b=el('button','btn'+(n>1?' b':''),l);b.style.margin='6px';b.onclick=()=>start(n+1);w.appendChild(b)});v.appendChild(w);
 const r=el('div','sit','<b>Κανόνες:</b> Ρίξε κάρτα με το ίδιο χρώμα ή τον ίδιο αριθμό/σύμβολο. ⊘ = ο επόμενος χάνει σειρά · ⇄ = αλλάζει η φορά · +2 = ο επόμενος τραβά 2 κάρτες · 🌈 = διαλέγεις χρώμα · +4 = διαλέγεις χρώμα και ο επόμενος τραβά 4 (μόνο αν δεν έχεις κάρτα στο τρέχον χρώμα). Αν δεν έχεις κάρτα που να ταιριάζει, τράβα από την τράπουλα.');r.style.fontSize='17px';r.style.textAlign='left';v.appendChild(r)}
function start(n){const deck=mkDeck();const names=['Εσύ','Αλέξης','Μαρία','Νίκος'].slice(0,n);G={n,names,hands:names.map(()=>deck.splice(0,7)),deck,disc:[],cur:0,dir:1,col:'R',top:null,drawn:false,over:false,busy:false,uno:false};
 let c;do{c=G.deck.shift();if(c.c=='W'||isNaN(+c.v))G.deck.push(c);else break}while(1);G.disc.push(c);G.top=c;G.col=c.c;render();say('Ξεκινάς εσύ! Ρίξε μια κάρτα που ταιριάζει.')}
function draw1(p){if(!G.deck.length){const t=G.disc.pop();G.deck=sh(G.disc);G.disc=[t]}const c=G.deck.shift();if(c)G.hands[p].push(c);return c}
function say(t){$('msg').innerHTML=t}
function nextP(from,steps=1){return((from+G.dir*steps)%G.n+G.n)%G.n}
function render(){const v=$('v');v.innerHTML='';
 const top=el('div','opp','');G.names.forEach((nm,i)=>{if(i==0)return;const d=el('div','op'+(G.cur==i&&!G.over?' on':''),'<b>'+nm+'</b><div class="bk"></div><span>'+G.hands[i].length+' κάρτες'+(G.hands[i].length==1?' · ΟΥΝΟ!':'')+'</span>');const bk=d.querySelector('.bk');for(let k=0;k<Math.min(G.hands[i].length,8);k++)bk.appendChild(back(1));top.appendChild(d)});v.appendChild(top);
 const mid=el('div','mid','');const dp=el('button','dpile','');dp.appendChild(back());dp.insertAdjacentHTML('beforeend','<small>Τράπουλα ('+G.deck.length+')</small>');dp.onclick=humanDraw;
 const tp=el('div','tpile','');tp.appendChild(cardEl(G.top,{col:G.col}));tp.insertAdjacentHTML('beforeend','<small>Χρώμα: <b style="color:'+COL[G.col][1]+'">'+COL[G.col][2]+' '+COL[G.col][0]+'</b> '+(G.dir==1?'↻':'↺')+'</small>');
 mid.append(dp,tp);v.appendChild(mid);
 const m=el('div','sit','');m.id='msg';m.style.minHeight='3em';v.appendChild(m);
 const act=el('div','','');act.style.textAlign='center';act.id='act';v.appendChild(act);
 const me=el('div','hand','');const h=G.hands[0];const myTurn=G.cur==0&&!G.over&&!G.busy;
 h.slice().sort((a,b)=>(CN.indexOf(a.c)<0?9:CN.indexOf(a.c))-(CN.indexOf(b.c)<0?9:CN.indexOf(b.c))||a.v.localeCompare(b.v)).forEach(c=>{const ok=myTurn&&playable(c,G.top,G.col)&&(c.v!='F'||canF(h,G.col)||h.every(x=>x.v=='F'||x.c=='W'))&&(!G.drawn||G.lastDrawn===c);const b=cardEl(c,{btn:1,pl:ok,dim:myTurn&&!ok});b.onclick=()=>humanPlay(c);me.appendChild(b)});
 v.appendChild(el('div','lead','<b>Τα χαρτιά σου ('+h.length+')</b>'));v.appendChild(me);
 if(G.over)return;if(G.cur==0&&G.drawn){const p=el('button','btn g','⏭ Πάσο');p.onclick=()=>{G.drawn=false;G.lastDrawn=null;pass(0)};act.appendChild(p)}}
function humanPlay(c){if(G.cur!=0||G.over||G.busy)return;const h=G.hands[0];if(!playable(c,G.top,G.col)){say('❌ Αυτή η κάρτα δεν ταιριάζει.');return}if(c.v=='F'&&!canF(h,G.col)&&h.some(x=>x.c!='W')){say('❌ Το +4 παίζεται μόνο όταν δεν έχεις κάρτα στο τρέχον χρώμα.');return}
 if(G.drawn&&G.lastDrawn!==c)return;
 if(c.c=='W'){chooseCol(col=>apply(0,c,col))}else apply(0,c,c.c)}
function chooseCol(cb){const d=el('div','dg2','');const b=el('div','','<h3 style="margin-top:0">Διάλεξε χρώμα</h3>');const g=el('div','','');g.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px';CN.forEach(c=>{const x=el('button','btn',COL[c][2]+' '+COL[c][0]);x.style.cssText='background:'+COL[c][1]+';box-shadow:0 5px 0 rgba(0,0,0,.25);color:#111;margin:0';x.onclick=()=>{d.remove();cb(c)};g.appendChild(x)});b.appendChild(g);d.appendChild(b);document.body.appendChild(d)}
function apply(p,c,col){const h=G.hands[p];h.splice(h.indexOf(c),1);G.disc.push(c);G.top=c;G.col=col;G.drawn=false;G.lastDrawn=null;let msg=G.names[p]+' ρίχνει '+(c.c=='W'?'άσπρη':COL[c.c][0])+' '+(SYM[c.v]||c.v)+(c.c=='W'?' και διαλέγει '+COL[col][0]:'')+'.';
 if(h.length==0){G.over=true;render();win(p);return}
 let skip=0,nx;
 if(c.v=='V'){G.dir*=-1;if(G.n==2)skip=1;msg+=' Αλλαγή φοράς!'}
 if(c.v=='S'){skip=1;msg+=' Ο επόμενος χάνει σειρά!'}
 nx=nextP(p,1);
 if(c.v=='D'){draw1(nx);draw1(nx);skip=1;msg+=' '+G.names[nx]+' τραβά 2 κάρτες.'}
 if(c.v=='F'){for(let i=0;i<4;i++)draw1(nx);skip=1;msg+=' '+G.names[nx]+' τραβά 4 κάρτες.'}
 if(c.v=='V'&&G.n>2)skip=0;
 // UNO check
 if(h.length==1){if(p==0){G.uno=true;G.unoP=p;const a=$('act');}else msg+=' <b>'+G.names[p]+': ΟΥΝΟ!</b>'}
 G.cur=nextP(p,1+skip);if(c.v=='V'&&G.n==2)G.cur=p;
 render();say(msg);
 if(p==0&&h.length==1){unoBtn()}else after()}
function unoBtn(){G.busy=true;render();const a=$('act');a.innerHTML='';const b=el('button','btn','🗣️ ΟΥΝΟ!');b.style.cssText='background:#ef4444;box-shadow:0 5px 0 #b91c1c;font-size:30px;padding:16px 36px';let done=0;const fin=ok=>{if(done)return;done=1;clearTimeout(tm);G.busy=false;if(!ok){draw1(0);draw1(0);say('😬 Ξέχασες να φωνάξεις ΟΥΝΟ! Τραβάς 2 κάρτες.')}else say('🗣️ ΟΥΝΟ! Έχεις μία κάρτα!');render();if(!ok)say('😬 Ξέχασες να φωνάξεις ΟΥΝΟ! Τραβάς 2 κάρτες.');after()};b.onclick=()=>fin(1);a.appendChild(b);const tm=setTimeout(()=>fin(0),3500)}
function humanDraw(){if(G.cur!=0||G.over||G.busy||G.drawn)return;const h=G.hands[0];if(h.some(c=>playable(c,G.top,G.col)&&(c.v!='F'||canF(h,G.col))))say('Έχεις κάρτα που ταιριάζει! Ρίξε μία.');const c=draw1(0);if(!c)return;G.drawn=true;G.lastDrawn=c;
 if(playable(c,G.top,G.col)&&(c.v!='F'||canF(G.hands[0].filter(x=>x!==c),G.col))){render();say('Τράβηξες μια κάρτα που ταιριάζει! Ρίξε την ή πάτα «Πάσο».')}else{G.drawn=false;G.lastDrawn=null;render();say('Τράβηξες μια κάρτα που δεν ταιριάζει. Παίζει ο επόμενος.');pass(0)}}
function pass(p){G.cur=nextP(p,1);render();after()}
function after(){if(G.over)return;if(G.cur!=0){G.busy=true;render();setTimeout(cpu,1000)}}
function cpu(){if(G.over)return;const p=G.cur,h=G.hands[p];
 const ok=h.filter(c=>playable(c,G.top,G.col)&&(c.v!='F'||canF(h,G.col)||h.every(x=>x.c=='W')));
 G.busy=false;
 if(!ok.length){const c=draw1(p);if(c&&playable(c,G.top,G.col)&&(c.v!='F'||canF(h.filter(x=>x!==c),G.col))){say(G.names[p]+' τράβηξε κάρτα και τη ρίχνει.');setTimeout(()=>cpuPlay(p,c),700);return}render();say(G.names[p]+' δεν είχε κάρτα και τράβηξε μία από την τράπουλα.');G.cur=nextP(p,1);setTimeout(()=>{render();after()},500);return}
 const nonW=ok.filter(c=>c.c!='W');let c;
 const nxt=G.hands[nextP(p,1)].length;
 if(nonW.length){const act=nonW.filter(x=>isNaN(+x.v));c=(nxt<=2&&act.length)?act[0]:nonW.filter(x=>x.c==G.col&&!isNaN(+x.v))[0]||nonW[Math.floor(Math.random()*nonW.length)]}else c=ok.find(x=>x.v=='W')||ok[0];
 cpuPlay(p,c)}
function cpuPlay(p,c){const h=G.hands[p];let col=c.c;if(c.c=='W'){const cnt={R:0,Y:0,G:0,B:0};h.forEach(x=>{if(cnt[x.c]!=null)cnt[x.c]++});col=CN.sort((a,b)=>cnt[b]-cnt[a])[0]}G.busy=false;apply(p,c,col)}
function win(p){const me=p==0;$('v').insertAdjacentHTML('beforeend','<div class="win"><div class="big">'+(me?'🏆':'🎉')+'</div><h3>'+(me?'Νίκησες! Μπράβο!':'Κέρδισε ο/η '+G.names[p]+'!')+'</h3></div>');const b=el('button','btn','↺ Παίζω ξανά');b.onclick=setup;$('v').appendChild(b);const h=el('button','btn g','📖 Αλλαγή αντιπάλων');h.onclick=setup;if(me)try{parent.postMessage({sgame:'uno_done',n:1,t:1},'*')}catch(e){}}
setup();

</script></body></html>
