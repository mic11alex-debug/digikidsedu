  if(g('cr'))g('cr').onclick=async()=>{const r=await api('reset',{code:RM.code,key:RM.key});if(r.ok){S=r;view()}}}
 function start(){if(!I){I=setInterval(poll,1000);poll()}}
 async function poll(){if(!RM)return;try{const r=await fetch('/api/room/state?code='+RM.code,{cache:'no-store'});if(r.status===404){clearInterval(I);I=0;RM=null;sv();err='Η τάξη έληξε.';view();return}
  const st=await r.json();if(!st.ok)return;const ch=!S||S.phase!==st.phase||S.startAt!==st.startAt;off=st.now-Date.now();S=st;
  if(!RM.teacher&&st.phase==='run'&&seen!==st.startAt&&ACT[st.game]){seen=st.startAt;count(st);return}
  if(!RM.teacher&&st.phase==='lobby'){round=0;showHud()}
  if(o.classList.contains('on')){if(ch)view();else if(document.getElementById('cml'))document.getElementById('cml').innerHTML=boardH(st,RM.teacher?'':RM.name)}}catch(e){}}
 function count(st){open(false);cd.style.display='flex';
  const iv=setInterval(()=>{const left=st.startAt-(Date.now()+off),n=Math.ceil(left/1000);
   if(left<=0){clearInterval(iv);cd.style.display='none';gid=st.game;round=st.startAt;pts=0;neg=0;last=0;showHud();const k=ACT[gid][0];k==='intro'?intro():k==='river'?river():play(+k.slice(1));return}
   cd.textContent=n},60)}
 const add=(tab,n)=>{if(round&&gid==='m-'+tab){pts+=n;if(n<0)neg++;showHud()}};
  const done=(tab,p)=>{if(!round||gid!=='m-'+tab||!RM||RM.teacher)return;if(p!=null)pts=p;const st=neg===0?3:neg<=3?2:1;round=0;showHud();api('score',{code:RM.code,pid:RM.pid,s:st,p:pts,d:1}).then(r=>{if(r&&r.ok)S=r;open(true)})};
 const cb=document.createElement('button');cb.id='cmpb';cb.className='btn';cb.textContent='👥 Τάξη';cb.style.cssText='display:block;margin:10px auto';const cw=document.createElement('div');cw.style.cssText='text-align:center;position:relative;z-index:5';cw.appendChild(cb);app.parentNode.insertBefore(cw,app);cb.onclick=()=>{open(true);if(RM)start()};if(RM)start();
 return{add,done}})();

menu();
</script>
