<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Απόδραση από το εργαστήριο</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:linear-gradient(160deg,#c7d2fe,#fbcfe8 60%,#fde68a);color:#1a1446;padding:12px;overflow-x:hidden}
.w{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:clamp(19px,4.2vw,28px);margin:0;line-height:1.15}
.hud{display:flex;gap:8px;align-items:center;font-weight:800}
.hud span,.hud button{background:#fff;border:3px solid #1a1446;border-radius:99px;padding:3px 12px;font:inherit;font-weight:800;font-size:16px}
.hud button{cursor:pointer;font-size:20px;padding:1px 10px}
.prog{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.prog i{font-style:normal;width:46px;height:46px;border-radius:50%;border:4px solid #1a1446;background:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;opacity:.75}
.prog i.on{background:#ffd23f;opacity:1;transform:scale(1.1)}.prog i.ok{background:#35e0a6;opacity:1}
.say{display:flex;gap:10px;align-items:flex-end;margin:0 0 10px}
.say img{height:84px;width:auto;flex:none;filter:drop-shadow(0 3px 0 #1a144633)}
.bub{position:relative;background:#fff;border:4px solid #1a1446;border-radius:20px;padding:10px 14px;font-weight:700;font-size:clamp(15px,2.9vw,18px);line-height:1.35;flex:1;box-shadow:0 4px 0 #1a1446}
.bub:before{content:"";position:absolute;left:-14px;bottom:18px;border:8px solid transparent;border-right:14px solid #1a1446}
.card{background:#fff;border:5px solid #1a1446;border-radius:26px;box-shadow:8px 8px 0 #1a1446;padding:16px;position:relative;margin-bottom:16px}
.room h2{margin:0 0 6px;font-size:clamp(18px,3.6vw,24px)}
.task{background:#fffbe6;border:3px dashed #1a1446;border-radius:16px;padding:10px 14px;font-weight:700;font-size:clamp(16px,3.2vw,20px);margin:8px 0 12px;line-height:1.35}
.objs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:640px){.objs{grid-template-columns:repeat(3,1fr)}.objs.k4{grid-template-columns:repeat(4,1fr)}}
.ob{font:inherit;cursor:pointer;border:4px solid #1a1446;border-radius:18px;background:#fff;color:#1a1446;padding:10px 6px 8px;text-align:center;box-shadow:0 5px 0 #1a1446;transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;justify-content:center}
.ob:hover:not(:disabled){transform:translateY(2px);box-shadow:0 3px 0 #1a1446}
.ob .e{font-size:clamp(38px,9vw,56px);line-height:1}.ob .l{font-weight:800;font-size:clamp(12px,2.6vw,16px);line-height:1.2}
.ob.sc .l{font-weight:700;font-size:clamp(12px,2.5vw,15px)}
.ob.key{background:#e5e7eb;border-radius:12px;min-height:76px}.ob.key .e{font-size:clamp(22px,5vw,32px);font-weight:900}
.ob.done{background:#d9fbe9;opacity:.85}.ob.safe{background:#e0f2fe;opacity:.7}
.ob:disabled{cursor:default}
.ob .tick{font-size:14px;font-weight:800;color:#047857}
.hl{animation:hl .5s ease 4}@keyframes hl{50%{transform:scale(1.08);box-shadow:0 0 0 6px #ffd23f}}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ord{display:grid;gap:10px}
.ord .ob{flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;padding:12px 14px;min-height:0}
.ord .ob .n{font-size:26px;font-weight:900;background:#ffd23f;border:3px solid #1a1446;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none}
.ord .ob .l{font-size:clamp(15px,3.2vw,19px)}
.notes{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.nt{width:84px;background:#fff59d;border:3px solid #1a1446;border-radius:6px 6px 14px 6px;padding:6px 4px;text-align:center;transform:rotate(-2deg);box-shadow:3px 4px 0 #1a144655}
.nt:nth-child(even){transform:rotate(2deg)}.nt small{display:block;font-weight:800;font-size:12px}.nt b{font-size:32px;line-height:1.1}
.lock{text-align:center;background:linear-gradient(160deg,#fef3c7,#fde68a)}
.lock h3{margin:0 0 8px;font-size:clamp(17px,3.4vw,21px)}
.wh{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.dg{display:flex;flex-direction:column;align-items:center;gap:4px}
.dg button{font:inherit;font-weight:900;font-size:18px;width:54px;height:34px;border:3px solid #1a1446;border-radius:10px;background:#fff;cursor:pointer;box-shadow:0 3px 0 #1a1446;padding:0}
.dg button:active{transform:translateY(3px);box-shadow:none}
.dg div{width:58px;height:70px;border:4px solid #1a1446;border-radius:12px;background:#1a1446;color:#ffd23f;font-size:44px;font-weight:900;display:grid;place-items:center}
.btn{font:inherit;font-weight:800;font-size:18px;padding:11px 22px;border:4px solid #1a1446;border-radius:99px;background:#ffd23f;color:#1a1446;cursor:pointer;box-shadow:0 5px 0 #1a1446;margin:12px 6px 0}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 #1a1446}.btn.g{background:#35e0a6}.btn.w{background:#fff}
.hint{display:block;margin:0 auto 14px}
.c{text-align:center}.big{font-size:clamp(54px,14vw,90px);line-height:1.1}
.faces{display:flex;justify-content:center;gap:6px;align-items:flex-end}.faces img{height:clamp(90px,24vw,140px);width:auto}
.stars{font-size:46px;letter-spacing:4px}
ul.r{margin:10px auto;padding-left:22px;line-height:1.55;font-weight:600;max-width:560px;text-align:left}
.fb{font-weight:800}.tin{font:inherit;font-weight:700;font-size:18px;padding:10px 12px;border:4px solid #1a1446;border-radius:14px;background:#fff;color:#1a1446;min-width:0}.ob.bad{background:#ffe1ef;opacity:.7;text-decoration:line-through}
.bd label{display:block;font-weight:800;margin:10px 0 3px}.bd input[type=text],.bd textarea,.bd select{width:100%;font:inherit;font-weight:600;font-size:16px;padding:8px 10px;border:3px solid #1a1446;border-radius:12px;background:#fff;color:#1a1446}.bd textarea{min-height:64px;resize:vertical}
.bq{border:3px solid #1a1446;border-radius:16px;background:#fff;padding:10px 12px;margin:10px 0}.bq .rw{display:flex;gap:8px;align-items:center;margin:6px 0}.bq .rw input[type=radio]{width:22px;height:22px;flex:none}.bq .rw input[type=text]{flex:1}
.sm{font:inherit;font-weight:800;font-size:15px;padding:6px 12px;border:3px solid #1a1446;border-radius:99px;background:#fff;color:#1a1446;cursor:pointer;box-shadow:0 3px 0 #1a1446;margin:4px 4px 0 0}.sm.on{background:#ffd23f}.sm.r{background:#ffd1e6}
.bmsg{font-weight:800;margin:10px 0;padding:10px 14px;border:3px solid #1a1446;border-radius:14px;background:#fff}
.codeb{font-size:46px;font-weight:900;letter-spacing:8px;background:#1a1446;color:#ffd23f;border-radius:14px;padding:6px 18px;display:inline-block}
@media(prefers-reduced-motion:reduce){.hl,.shake{animation:none}}
</style></head><body><div class="w" id="app"></div>

function renderBuild(){const A=$('#app');const L=mineList();
 const q=(r,i,q,j)=>`<div class="bq"><div><b>Ερώτηση ${j+1}</b> <button class="sm ${q.k==='mc'?'on':''}" onclick="bk(${i},${j},'mc')">Επιλογές</button><button class="sm ${q.k==='tx'?'on':''}" onclick="bk(${i},${j},'tx')">Γράφω απάντηση</button>${r.qs.length>1?`<button class="sm r" onclick="bdq(${i},${j})">🗑️</button>`:''}</div>
  <textarea data-p="rooms.${i}.qs.${j}.t" placeholder="Γράψε την ερώτηση ή το αίνιγμα…">${esc(q.t)}</textarea>
  ${q.k==='tx'?`<label>Σωστές απαντήσεις (χώρισέ τες με κόμμα)</label><input type="text" data-p="rooms.${i}.qs.${j}.an" value="${esc(q.an)}" placeholder="π.χ. 2, δύο"><small>Δεν μετράνε οι τόνοι και τα κεφαλαία.</small>`:`<label>Επιλογές (πάτα το κουμπάκι της σωστής)</label>${q.o.map((o,k)=>`<div class="rw"><input type="radio" name="r${i}_${j}" ${q.a===k?'checked':''} onchange="B.rooms[${i}].qs[${j}].a=${k}"><input type="text" data-p="rooms.${i}.qs.${j}.o.${k}" value="${esc(o)}" placeholder="Επιλογή ${'ΑΒΓΔ'[k]}${k>1?' (προαιρετική)':''}"></div>`).join('')}`}
  <label>Βοήθεια (προαιρετικό)</label><input type="text" data-p="rooms.${i}.qs.${j}.h" value="${esc(q.h)}" placeholder="Μια υπόδειξη για τα παιδιά"></div>`;
 A.innerHTML=`<div class="top"><h1>🧑‍🏫 Φτιάξε το δικό σου Escape Room</h1><button class="btn w" style="margin:0" onclick="goStart()">← Πίσω</button></div>
 <div class="card bd" style="background:#ede9fe"><p style="margin:0;font-weight:700">Φτιάξε δωμάτια με ερωτήσεις. Κάθε σωστή απάντηση δίνει στα παιδιά ένα ψηφίο και με τα ψηφία ανοίγουν την πόρτα. Μετά πάτα «Κωδικός για τα παιδιά».</p>
 <label>Τίτλος</label><input type="text" data-p="t" value="${esc(B.t)}" maxlength="80" placeholder="π.χ. Το μυστικό του εργαστηρίου">
 <label>Ιστορία (προαιρετικό)</label><textarea data-p="story" maxlength="500" placeholder="π.χ. Ο ιός Βάιρους κλείδωσε την τάξη μας!">${esc(B.story)}</textarea>
 <div style="margin-top:8px"><button class="sm" onclick="bsample()">📋 Φόρτωσε ένα παράδειγμα</button><button class="sm" onclick="bnew()">🆕 Νέο</button><button class="sm" onclick="document.getElementById('imp').click()">📥 Άνοιγμα αρχείου</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="bimport(this)"></div>
 ${L.length?`<div style="margin-top:8px"><b>📂 Τα Escape Room μου:</b> ${L.map(x=>`<span style="display:inline-block;margin:3px 4px 0 0"><button class="sm ${x.id===B.id?'on':''}" onclick="bload(${x.id})">${esc(x.t||'(χωρίς τίτλο)')}${x.code?' · '+esc(x.code):''}</button><button class="sm r" onclick="bdel(${x.id})" aria-label="Διαγραφή">✖</button></span>`).join('')}</div>`:''}</div>
 ${B.rooms.map((r,i)=>`<div class="card bd" style="background:${BGS[i%BGS.length]}"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Δωμάτιο ${i+1}</h2>${B.rooms.length>1?`<button class="sm r" onclick="bdr(${i})">🗑️ Διαγραφή δωματίου</button>`:''}</div>
  <label>Όνομα δωματίου</label><input type="text" data-p="rooms.${i}.n" value="${esc(r.n)}" maxlength="60" placeholder="π.χ. Το δωμάτιο των υπολογιστών">
  <label>Εικονίδιο</label><div>${EMO.map(e=>`<button class="sm ${r.ic===e?'on':''}" onclick="B.rooms[${i}].ic='${e}';renderBuild()">${e}</button>`).join('')}</div>
  ${r.qs.map((x,j)=>q(r,i,x,j)).join('')}
  ${r.qs.length<5?`<button class="sm" onclick="baq(${i},'mc')">➕ Ερώτηση με επιλογές</button><button class="sm" onclick="baq(${i},'tx')">➕ Ερώτηση με γραπτή απάντηση</button>`:'<small>Έως 5 ερωτήσεις ανά δωμάτιο.</small>'}</div>`).join('')}
 ${B.rooms.length<6?`<div class="c"><button class="btn" onclick="bar()">➕ Νέο δωμάτιο</button></div>`:''}
 <div class="card c"><h3 style="margin:0 0 4px">Τι θες να κάνεις;</h3>
 ${bmsg?`<div class="bmsg">${bmsg}</div>`:''}
 ${bshare?`<div style="margin:8px 0">Κωδικός για τα παιδιά:<br><span class="codeb">${esc(bshare)}</span><p style="margin:8px 0 0;font-weight:700">Τα παιδιά ανοίγουν το παιχνίδι, γράφουν τον κωδικό στο «Έχεις κωδικό από τον δάσκαλο;» ή ανοίγουν τον σύνδεσμο:<br><b>digikidsedu.com/apodrasi.html?c=${esc(bshare)}</b></p></div>`:''}
 <button class="btn g" onclick="btest()">▶ Δοκιμή</button><button class="btn" onclick="bsave()">💾 Αποθήκευση</button><button class="btn" style="background:#c4b5fd" onclick="bshareGo()">🔗 Κωδικός για τα παιδιά</button><button class="btn w" onclick="bexport()">📤 Λήψη αρχείου</button>
 <p style="font-size:14px;margin:10px 0 0">Η αποθήκευση γίνεται σε αυτή τη συσκευή. Ο κωδικός τάξης κρατά την τελευταία έκδοση: αν αλλάξεις κάτι, ξαναπάτα «Κωδικός για τα παιδιά» για να ενημερωθεί (ο κωδικός μένει ο ίδιος). Οι ερωτήσεις με τις απαντήσεις αποθηκεύονται στον διακομιστή, γι’ αυτό μην γράφεις προσωπικά στοιχεία.</p></div>`}
const bk=(i,j,k)=>{B.rooms[i].qs[j].k=k;renderBuild()};
const bdq=(i,j)=>{B.rooms[i].qs.splice(j,1);renderBuild()};
const baq=(i,k)=>{B.rooms[i].qs.push(blankQ(k));renderBuild()};
const bdr=i=>{if(confirm('Να διαγραφεί το δωμάτιο '+(i+1)+';')){B.rooms.splice(i,1);renderBuild()}};
const bar=()=>{B.rooms.push({n:'',ic:EMO[B.rooms.length%EMO.length],qs:[blankQ(),blankQ(),blankQ()]});renderBuild()};
const bnew=()=>{if(confirm('Να ξεκινήσεις ένα καινούργιο; (Το τωρινό μένει αν το έχεις αποθηκεύσει.)')){B=blankB();bmsg='';bshare='';renderBuild()}};
const bsample=()=>{if(confirm('Να φορτωθεί το παράδειγμα στη θέση του τωρινού;')){B=sampleB();bmsg='';bshare='';renderBuild()}};
const bload=id=>{const x=mineList().find(y=>y.id===id);if(x){B=x;bmsg='';bshare=x.code||'';renderBuild()}};
const bdel=id=>{if(!confirm('Να διαγραφεί από αυτή τη συσκευή;'))return;try{localStorage.setItem('escMine',JSON.stringify(mineList().filter(x=>x.id!==id)))}catch(e){}if(B.id===id)B=blankB();renderBuild()};
function bsave(){const e=validate();if(e){bmsg='⚠️ '+e;renderBuild();return}bmsg=minePush()?'✅ Αποθηκεύτηκε σε αυτή τη συσκευή.':'⚠️ Δεν μπόρεσε να αποθηκευτεί σε αυτόν τον browser.';renderBuild()}
function btest(){const p=payload();if(typeof p==='string'){bmsg='⚠️ '+p;renderBuild();return}playCustom(p,true)}
async function bshareGo(){const p=payload();if(typeof p==='string'){bmsg='⚠️ '+p;renderBuild();return}bmsg='⏳ Δημιουργία κωδικού…';renderBuild();
 try{if(B.code&&B.key){await capi('save',{code:B.code,key:B.key,data:p});bmsg='✅ Ο κωδικός '+B.code+' ενημερώθηκε.'}else{const r=await capi('create',{data:p});B.code=r.code;B.key=r.key;bmsg='✅ Ο κωδικός δημιουργήθηκε.'}bshare=B.code;minePush()}catch(e){bmsg='⚠️ '+e.message}renderBuild()}
function bexport(){const p=payload();if(typeof p==='string'){bmsg='⚠️ '+p;renderBuild();return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(B)],{type:'application/json'}));a.download='escape-room.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function bimport(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.rooms)||!o.rooms.length)throw 0;o.id=Date.now();o.code='';o.key='';o.rooms=o.rooms.slice(0,6).map(x=>({n:String(x.n||''),ic:String(x.ic||'🚪'),qs:(x.qs||[]).slice(0,5).map(q=>({k:q.k==='tx'?'tx':'mc',t:String(q.t||''),o:(Array.isArray(q.o)?q.o:[]).concat(['','','','']).slice(0,4).map(String),a:Number.isInteger(q.a)&&q.a>=0&&q.a<4?q.a:0,an:String(q.an||''),h:String(q.h||'')}))}));o.t=String(o.t||'');o.story=String(o.story||'');B=o;bmsg='✅ Το αρχείο άνοιξε.'}catch(e){bmsg='⚠️ Το αρχείο δεν είναι έγκυρο Escape Room.'}renderBuild()};r.readAsText(f)}
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p&&B)setP(B,p,e.target.value)});
addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='tx'){e.preventDefault();ansTx()}});
try{const c=(new URLSearchParams(location.search).get('c')||'').toUpperCase();if(/^[A-Z2-9]{4}$/.test(c)){S.jmsg='⏳ Φορτώνω το Escape Room…';setTimeout(()=>{const i=$('#jc');if(i)i.value=c;joinCode()},50)}}catch(e){}

window.__G={S,get ROOMS(){return ROOMS},get B(){return B}};
render();
</script></body></html>
