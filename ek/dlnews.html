<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ρεπόρτερ της τάξης</title><style>*{box-sizing:border-box}:root{--ink:#1a1446;--y:#ffd23f;--p:#ff6fae;--g:#35c46a;--b:#4aa8ff;--r:#e8452c}
body{margin:0;font-family:Fredoka,"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#f7f0dc,#e8e1ff 60%,#ffe9f4);background-attachment:fixed}
header{text-align:center;padding:14px 12px 4px}h1{margin:0;font-size:clamp(24px,5vw,38px);text-shadow:0 3px 0 rgba(255,255,255,.7)}header p{margin:4px auto 0;max-width:720px;font-weight:600;font-size:clamp(15px,2.6vw,19px)}
main{max-width:860px;margin:10px auto 30px;padding:0 12px}
.card{background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px;position:relative;overflow:hidden}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,3vw,21px);padding:12px 22px;border-radius:999px;border:4px solid var(--ink);background:var(--y);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.g{background:#7ee8c4}.btn.p{background:#ffb3d9}.btn.b{background:#a5d4ff}.btn.w{background:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;margin-bottom:8px}.hud span{background:#f3efff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px}
.center{text-align:center}.big{font-size:clamp(46px,12vw,90px);line-height:1}.lead{font-size:clamp(16px,2.8vw,20px);font-weight:600;line-height:1.45}
.pop{animation:pop .35s both}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ok{color:#14803a}.no{color:#c2301a}.fb{min-height:48px;text-align:center;font-weight:800;font-size:clamp(16px,3vw,20px);margin:8px 0}

.notes{background:#fff9d6;border:4px solid var(--ink);border-radius:8px 18px 18px 18px;padding:12px 16px;transform:rotate(-.6deg);box-shadow:4px 5px 0 rgba(0,0,0,.2);margin-bottom:12px}.notes h3{margin:0 0 6px}.notes li{margin:3px 0;font-weight:600}
.slot{border:3px solid var(--ink);border-radius:16px;padding:8px 10px;margin:8px 0;background:#f6f3ff}.slot b.k{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:2px 12px;margin-bottom:6px}
.op{display:flex;gap:6px;flex-wrap:wrap}.op button{font:inherit;font-weight:700;font-size:clamp(14px,2.6vw,17px);padding:6px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer}.op button.sel{background:var(--y)}.op button.ok{background:#bff0cc}.op button.no{background:#ffc9c9}
.paper{background:#f7f0dc;border:4px solid var(--ink);border-radius:6px;padding:14px;font-family:Georgia,"Times New Roman",serif;box-shadow:6px 6px 0 rgba(0,0,0,.25);animation:pop .5s both}
.paper .mast{text-align:center;border-bottom:4px double #222;padding-bottom:6px;margin-bottom:8px}.paper .mast h2{margin:0;font-size:clamp(20px,5vw,34px);letter-spacing:2px;font-family:"Georgia",serif}.paper .mast small{font-size:12px;letter-spacing:1px}
.paper .ph{float:right;width:34%;margin:0 0 6px 12px;border:3px solid #222;background:linear-gradient(#bfe8ff,#d9f7c4);text-align:center;font-size:clamp(40px,10vw,70px);padding:6px 0}.paper .ph small{display:block;font-size:11px;font-style:italic;background:#fff8}
.paper h3{font-size:clamp(18px,4vw,28px);margin:6px 0;line-height:1.15}.paper p{margin:0;line-height:1.55;font-size:clamp(14px,2.6vw,17px)}
.hl{display:grid;gap:8px;margin:10px 0}
</style></head><body><header><h1>📰 Ρεπόρτερ της τάξης</h1><p>Γράψε σωστά την είδηση με τα «5 Π» και φτιάξε την πρώτη σελίδα!</p></header><main><div class="card" id="app"><div id="intro" class="center"><div class="big">📰</div><p class="lead">Είσαι ρεπόρτερ! Οι καλές ειδήσεις απαντούν στις <b>5 ερωτήσεις</b>:<br><b>Ποιος; Τι; Πού; Πότε; Γιατί;</b><br>Διάβασε τις σημειώσεις σου και γράψε σωστά την είδηση.</p><div class="row"><button class="btn" onclick="start(0)">▶ Ξεκινάμε!</button></div></div><div id="g" style="display:none"></div></div></main><script>
const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);

const SC=[
{e:'🌳',t:'Δέντρα στο σχολείο',notes:['Η Γ΄ τάξη φύτεψε 30 δέντρα.','Έγινε στην αυλή του σχολείου.','Την περασμένη Παρασκευή το πρωί.','Ήθελαν σκιά και καθαρό αέρα.'],
 s:[['Ποιος;',['Οι μαθητές της Γ΄ τάξης','Οι γονείς','Ο δήμαρχος'],0],['Τι;',['φύτεψαν 30 δέντρα','έφτιαξαν γήπεδο','έκαναν γιορτή'],0],['Πού;',['στην αυλή του σχολείου','στο πάρκο της πόλης','στη θάλασσα'],0],['Πότε;',['την Παρασκευή το πρωί','το Σάββατο το βράδυ','πέρσι το καλοκαίρι'],0],['Γιατί;',['για σκιά και καθαρό αέρα','για να πουλήσουν ξύλα','επειδή βαρέθηκαν'],0]],
 h:['Η Γ΄ τάξη φύτεψε 30 δέντρα στην αυλή του σχολείου','ΔΕΝ θα πιστέψεις τι έκαναν τα παιδιά στο σχολείο!!!','Τα δέντρα είναι το καλύτερο πράγμα του κόσμου'],cap:'Οι μαθητές στην αυλή'},
{e:'🌊',t:'Καθαρή παραλία',notes:['Η Β΄ τάξη μάζεψε 120 μπουκάλια.','Στην παραλία της Λάρνακας.','Το Σάββατο το πρωί.','Για να μείνει η θάλασσα καθαρή.'],
 s:[['Ποιος;',['Οι μαθητές της Β΄ τάξης','Οι ψαράδες','Οι τουρίστες'],0],['Τι;',['μάζεψαν 120 μπουκάλια','έχτισαν κάστρο στην άμμο','ψάρεψαν ψάρια'],0],['Πού;',['στην παραλία της Λάρνακας','στο βουνό','στην πλατεία'],0],['Πότε;',['το Σάββατο το πρωί','τα Χριστούγεννα','τη νύχτα'],0],['Γιατί;',['για να μείνει η θάλασσα καθαρή','για να κερδίσουν χρήματα','για παιχνίδι'],0]],
 h:['Η Β΄ τάξη μάζεψε 120 μπουκάλια από την παραλία','ΣΟΚ! Τι βρήκαν τα παιδιά στη θάλασσα;!','Οι παραλίες είναι πιο όμορφες από τα βουνά'],cap:'Καθαρισμός της παραλίας'},
{e:'📚',t:'Νέα βιβλιοθήκη',notes:['Η Δ΄ τάξη άνοιξε νέα βιβλιοθήκη.','Στον πρώτο όροφο του σχολείου.','Τη Δευτέρα στο πρώτο διάλειμμα.','Για να διαβάζουν περισσότερα βιβλία.'],
 s:[['Ποιος;',['Η Δ΄ τάξη','Οι δάσκαλοι της γυμναστικής','Μια εταιρεία'],0],['Τι;',['άνοιξε νέα βιβλιοθήκη','έφτιαξε εστιατόριο','έκανε αγώνα'],0],['Πού;',['στον πρώτο όροφο του σχολείου','στο γήπεδο','στο λιμάνι'],0],['Πότε;',['τη Δευτέρα στο πρώτο διάλειμμα','τον Αύγουστο','τα μεσάνυχτα'],0],['Γιατί;',['για να διαβάζουν περισσότερα βιβλία','για να παίζουν μπάλα','για να κοιμούνται'],0]],
 h:['Η Δ΄ τάξη άνοιξε νέα βιβλιοθήκη στο σχολείο','Το μυστικό της βιβλιοθήκης που κανείς δεν σου λέει!','Η βιβλιοθήκη είναι το πιο βαρετό μέρος'],cap:'Η νέα βιβλιοθήκη'}
];
let si=0,ans;
const clean=s=>s;
function start(k){si=k;$('intro').style.display='none';$('g').style.display='';ans=[];draw()}
function draw(){const S=SC[si];$('g').innerHTML='<div class="hud"><span>📰 Είδηση '+(si+1)+' / 3</span><span>'+S.e+' '+S.t+'</span></div><div class="notes"><h3>📝 Οι σημειώσεις του ρεπόρτερ</h3><ul>'+S.notes.map(n=>'<li>'+n+'</li>').join('')+'</ul></div><div id="sl"></div><div class="row"><button class="btn g" id="chk" disabled onclick="check()">✅ Έλεγχος</button></div><div class="fb" id="fb"></div><div id="out"></div>';
 const o=$('sl');ans=Array(5).fill(-1);S.s.forEach((q,qi)=>{const d=document.createElement('div');d.className='slot';d.innerHTML='<b class="k">'+q[0]+'</b>';const op=document.createElement('div');op.className='op';sh(q[1].map((t,k)=>[t,k])).forEach(([t,k])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{ans[qi]=k;[...op.children].forEach(c=>c.className='');b.className='sel';$('chk').disabled=ans.includes(-1)};op.appendChild(b)});d.appendChild(op);o.appendChild(d)})}
function check(){const S=SC[si];let bad=0;[...$('sl').children].forEach((d,qi)=>{[...d.querySelector('.op').children].forEach(b=>{if(b.className!='sel')return;if(ans[qi]==S.s[qi][2])b.className='ok';else{b.className='no';bad++}})});
 if(bad){$('fb').innerHTML='<span class="no">❌ '+bad+' απάντηση/-εις δεν ταιριάζουν με τις σημειώσεις. Ξαναδιάβασε και άλλαξέ τες!</span>';$('chk').disabled=true;[...$('sl').querySelectorAll('.no')].forEach(b=>setTimeout(()=>{b.className=''},1200));ans=ans.map((a,qi)=>a==S.s[qi][2]?a:-1);return}
 $('fb').innerHTML='<span class="ok">✅ Όλα σωστά! Τώρα διάλεξε τον <b>τίμιο τίτλο</b> για την πρώτη σελίδα.</span>';$('chk').style.display='none';[...$('sl').querySelectorAll('button')].forEach(b=>b.disabled=true);
 const hs=sh(S.h.map((t,k)=>[t,k]));$('out').innerHTML='<div class="hl" id="hl"></div>';hs.forEach(([t,k])=>{const b=document.createElement('button');b.className='btn w';b.style.textAlign='left';b.textContent=t;b.onclick=()=>{if(k==0){paper()}else{b.className='btn p';$('fb').innerHTML='<span class="no">❌ Αυτός ο τίτλος είναι '+(k==1?'κλικ-δόλωμα: υπόσχεται «σοκ» αλλά δεν λέει τι έγινε.':'γνώμη, όχι είδηση.')+' Ο τίτλος πρέπει να λέει τα γεγονότα.</span>'}};$('hl').appendChild(b)})}
function paper(){const S=SC[si];const a=S.s.map(x=>x[1][0]);$('out').innerHTML='<div class="paper"><div class="mast"><h2>Η ΕΦΗΜΕΡΙΔΑ ΤΗΣ ΤΑΞΗΣ</h2><small>ΕΛΕΥΘΕΡΗ ΕΝΗΜΕΡΩΣΗ · ΑΞΙΟΠΙΣΤΗ ΠΗΓΗ · ΤΑΞΗ '+['Γ΄','Β΄','Δ΄'][si]+'</small></div><div class="ph">'+S.e+'<small>'+S.cap+'</small></div><h3>'+S.h[0]+'</h3><p><b>'+a[0]+'</b> '+a[1]+' <b>'+a[2]+'</b>, <b>'+a[3]+'</b>, '+a[4]+'. Τα στοιχεία της είδησης επιβεβαιώθηκαν από τον δάσκαλο της τάξης.</p></div><div class="row">'+(si<2?'<button class="btn" onclick="start('+(si+1)+')">Επόμενη είδηση ▶</button>':'<button class="btn" onclick="start(0)">🔁 Ξανά</button>')+'</div><p class="lead center">'+(si<2?'🎉 Μπράβο, ρεπόρτερ!':'🏆 <b>Συγχαρητήρια!</b> Έγραψες 3 ειδήσεις με τα «5 Π», και όχι με κλικ-δόλωμα.')+'</p>';$('fb').innerHTML='';$('out').scrollIntoView({behavior:'smooth'})}

</script></body></html>
