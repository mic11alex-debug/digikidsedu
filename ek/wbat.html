function typeCh(ch){if(over||sel==null)return;const w=words[sel];if(w.done)return;const L=w.cells.length;
 let i=curPos;while(i<L&&cells[w.cells[i]].lock){const same=cells[w.cells[i]].ans==ch;i++;if(same){curPos=Math.min(i,L-1);while(curPos<L-1&&cells[w.cells[curPos]].lock&&false)curPos++;if(i>=L)curPos=L-1;draw();return}}
 if(i>=L)return;const k=w.cells[i];cells[k].v=ch;cells[k].bad=false;curPos=Math.min(i+1,L-1);
 if(mode==1)autoCheck(w);draw()}
function back(){if(over||sel==null)return;const w=words[sel];let i=curPos;if(!cells[w.cells[i]].v||cells[w.cells[i]].lock){i--;while(i>=0&&cells[w.cells[i]].lock)i--}if(i<0)return;if(!cells[w.cells[i]].lock){cells[w.cells[i]].v='';cells[w.cells[i]].bad=false}curPos=i;draw()}
function wordStr(w){return w.cells.map(k=>cells[k].v||'').join('')}
function autoCheck(w){if(wordStr(w)==w.t)lockW(w)}
function lockW(w){w.done=true;w.cells.forEach(k=>{cells[k].v=cells[k].ans;cells[k].lock=true;cells[k].bad=false});clues();if(words.every(x=>x.done||x.cells.every(k=>cells[k].lock))){words.forEach(x=>x.done=true);finish(true)}}
function check(){if(over)return;let bad=0;Object.values(cells).forEach(C=>{C.bad=!!C.v&&!C.lock&&C.v!=C.ans;if(C.bad)bad++});wrongs+=bad;draw();msg(bad?'🔴 '+bad+' λάθος γράμματα (κόκκινα). Διόρθωσέ τα!':'✅ Όσα έγραψες είναι σωστά!')}
function hint(){if(over||sel==null){msg('Διάλεξε πρώτα μια λέξη.');return}const w=words[sel];const k=w.cells.find(k=>!cells[k].lock&&cells[k].v!=cells[k].ans);if(!k)return;cells[k].v=cells[k].ans;cells[k].lock=true;hints++;tleft=Math.max(0,tleft-10);draw();hud();if(w.cells.every(k=>cells[k].lock))lockW(w)}
function submit(){if(over||sel==null)return;const w=words[sel];const s=wordStr(w);if(s.length<w.t.length||w.cells.some(k=>!cells[k].v)){msg('Συμπλήρωσε όλα τα γράμματα της λέξης.');return}
 if(s==w.t){const pts=w.t.length;sc[team]+=pts;lockW(w);if(over)return;toast('✅ Σωστά! +'+pts+' βαθμοί για την '+tn(team));sel=null;tleft=TURN;team=1-team;draw();hud();cur();clues()}
 else{wrongTurn('❌ Όχι, δεν είναι αυτή η λέξη!')}}
function wrongTurn(t){if(over)return;if(sel!=null){words[sel].cells.forEach(k=>{if(!cells[k].lock)cells[k].v=''})}sel=null;team=1-team;tleft=TURN;toast(t+' Σειρά της '+tn(team));draw();hud();cur();clues()}
function toast(t){msg(t)}
function finish(win){over=true;clearInterval(tid);const e=$('hud');
 if(mode==1){const sc1=win?Math.max(0,Object.keys(cells).length*10+tleft*2-hints*20-wrongs*3):0;e.innerHTML=win?'🏆 <b>Μπράβο!</b> Τελείωσες με '+Math.floor(tleft/60)+':'+String(tleft%60).padStart(2,'0')+' να περισσεύουν! Βαθμοί: <b>'+sc1+'</b> '+(hints?'(βοήθειες: '+hints+')':'')+' '+(hints==0&&wrongs==0?'🌟 Χωρίς λάθη!':''):'⏰ <b>Τελείωσε ο χρόνος!</b> Βρήκες '+words.filter(w=>w.done).length+'/'+words.length+' λέξεις.';
  if(!win){Object.values(cells).forEach(C=>{if(!C.lock){C.v=C.ans;C.lock=true;C.bad=true}});draw()}}
 else{const w=sc[0]==sc[1]?'🤝 Ισοπαλία!':'🏆 Νικήτρια: <b>'+esc(tn(sc[0]>sc[1]?0:1))+'</b>!';e.innerHTML=w+' Βαθμοί: '+esc(tn(0))+' <b>'+sc[0]+'</b> – <b>'+sc[1]+'</b> '+esc(tn(1))}
 msg(win?'🎉 Το σταυρόλεξο λύθηκε!':'Ώρα για νέο σταυρόλεξο!')}
function ctl(){const c=$('ctl');c.innerHTML='';if(mode==1){[['🔎 Έλεγχος',check],['💡 Βοήθεια (−10″)',hint],['↩️ Σβήσε',back]].forEach(([t,f])=>{const b=el('button','bt',t);b.onclick=f;c.appendChild(b)})}
 else{[['✔ Απάντηση',submit],['↩️ Σβήσε',back],['🚫 Άλλη λέξη',()=>{if(sel!=null){words[sel].cells.forEach(k=>{if(!cells[k].lock)cells[k].v=''});sel=null;draw();cur();clues()}}],['⏭️ Πάσο',()=>wrongTurn('⏭️ Πάσο!')]].forEach(([t,f],i)=>{const b=el('button',i==0?'btn':'bt',t);b.onclick=f;c.appendChild(b)})}}
function kb(){const k=$('kb');k.innerHTML='';GR.split('').forEach(ch=>{const b=el('button','key',ch);b.onclick=()=>typeCh(ch);k.appendChild(b)})}
addEventListener('keydown',e=>{if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key=='Backspace'){e.preventDefault();back();return}if(e.key=='Enter'){e.preventDefault();if(mode==2)submit();return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;let ch=null;if(e.key.length==1){const s=strip(e.key);if(GR.includes(s))ch=s;else if(LAT[s])ch=LAT[s]}if(ch){e.preventDefault();typeCh(ch)}});
$('m1').onclick=()=>{mode=1;$('m1').classList.add('on');$('m2').classList.remove('on');$('tn').style.display='none';ctl();newG()};
$('m2').onclick=()=>{mode=2;$('m2').classList.add('on');$('m1').classList.remove('on');$('tn').style.display='inline';ctl();newG()};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)b.blur()});$('new').onclick=newG;kb();ctl();newG();

</script><script id="prjs">
const escP=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prBtn(fn,t,cls){const b=document.createElement('button');b.className=cls||'btn g';b.type='button';b.textContent=t||'🖨️ Εκτύπωση';b.onclick=fn;return b}
function prMsg(t){let m=document.getElementById('prn-toast');if(m)m.remove();m=document.createElement('div');m.id='prn-toast';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),6000)}
function prPop(title,inner){const w=window.open('','_blank');if(!w){prMsg('Η εκτύπωση δεν άνοιξε. Δοκίμασε Ctrl+P ή άνοιξε το παιχνίδι σε νέα καρτέλα.');return}
 const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 w.document.write('<!doctype html><html lang="el"><head><meta charset="utf-8"><title>'+escP(title)+'</title><style>'+css+'#prn{display:block!important;max-width:800px;margin:0 auto;padding:12px}</style></head><body class="printing"><div id="prn">'+inner+'</div></body></html>');w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},700)}
function prnOut(title,html,o){o=o||{};
 const old=document.getElementById('prn');if(old)old.remove();
 const p=document.createElement('div');p.id='prn';
 html=String(html).replace(/\sid="([^"]*)"/g,' id="p_$1"').replace(/url\(#([^)]+)\)/g,'url(#p_$1)');
 p.innerHTML='<h1 class="ph">'+escP(title)+'</h1>'+(o.noName?'':'<div class="pn">Όνομα: <i></i> Τάξη: <i></i></div>')+html+'<p class="pf">DigiKidsEdu</p>';
 document.body.appendChild(p);
 let st=document.getElementById('prs');if(!st){st=document.createElement('style');st.id='prs';document.head.appendChild(st)}
 st.textContent='@page{size:A4 '+(o.land?'landscape':'portrait')+';margin:10mm}';
 document.body.classList.add('printing');
 let started=false,ended=false;
 const end=()=>{if(ended)return;ended=true;document.body.classList.remove('printing');const q=document.getElementById('prn');if(q)q.remove();removeEventListener('afterprint',end)};
 addEventListener('beforeprint',()=>{started=true},{once:true});addEventListener('afterprint',end);
 setTimeout(()=>{try{window.print()}catch(e){}
  setTimeout(()=>{if(!started){const inner=p.innerHTML;end();prPop(title,inner)}else if(!ended){addEventListener('pointerdown',end,{once:true,capture:true});setTimeout(end,120000)}},500)},60)}

function prDip(what,name){return '<div class="dip"><div style="font-size:60pt">🎓</div><div class="dt">Δίπλωμα</div><div class="dx">Απονέμεται στον/στην</div><div class="dn">'+(name?escP(name):'&nbsp;'.repeat(24))+'</div><div class="dx">'+escP(what)+'</div></div>'}
</script></body></html>
