<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Κινούμενη εικόνα</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350;--hl:#4a3f10}}
*{box-sizing:border-box}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:18px}
header{background:linear-gradient(135deg,var(--teal),var(--blue),var(--purple));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.9;font-size:15px}
#dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 8px 0}
#dots button{border:3px solid var(--bd);background:var(--card);color:var(--tx);width:44px;height:44px;border-radius:50%;font:700 18px Fredoka;cursor:pointer;position:relative}
#dots button.on{background:var(--amber);border-color:#d97706;color:#fff}
#dots button.ok::after{content:"✓";position:absolute;right:-4px;top:-6px;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:12px 14px 90px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}.lead{color:var(--mu);margin:0 0 14px}
.btn{border:0;cursor:pointer;font:700 18px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}
nav.n{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:3px solid var(--bd);display:flex;justify-content:space-between;padding:10px 14px;gap:10px;z-index:9}
.step{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.step b.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:20px}
.url{display:flex;align-items:center;gap:8px;background:var(--soft);border:3px solid var(--bd);border-radius:99px;padding:6px 14px}
.url input,.f input,.f textarea{font:600 20px Fredoka;border:0;background:transparent;color:var(--tx);outline:0;flex:1;min-width:0;width:100%}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.grid21{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:10px 0}
.grid21 button{font:700 20px Fredoka;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:8px 0;cursor:pointer}
.grid21 button.on{background:var(--blue);color:#fff;border-color:#1d4ed8}
.addr{font:700 clamp(20px,5vw,32px) Fredoka;text-align:center;padding:12px;background:var(--hl);border-radius:18px;margin:10px 0;word-break:break-all}
.addr .n1{color:var(--red)}.addr .n2{color:var(--blue)}.addr .n3{color:var(--purple)}.addr .n4{color:var(--green)}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:15px;margin-bottom:8px}.legend span{padding:2px 10px;border-radius:99px;background:var(--soft)}
.secret{background:#fee2e2;border:3px dashed var(--red);border-radius:18px;padding:12px;margin:12px 0;color:#7f1d1d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .secret{background:#450a0a;color:#fecaca}}
.mock{border:3px solid var(--bd);border-radius:18px;overflow:hidden;background:var(--card)}
.mock .bar{background:var(--soft);padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:15px;flex-wrap:wrap}
.mock .body{display:grid;grid-template-columns:150px 1fr}
.side{background:var(--soft);padding:8px;display:flex;flex-direction:column;gap:6px}
.hot{border:3px dashed transparent;border-radius:12px;padding:6px 8px;cursor:pointer;background:transparent;font:600 16px Fredoka;color:var(--tx);text-align:left}
.hot:hover{border-color:var(--amber)}.hot.done{background:#bbf7d0;color:#14532d;border-style:solid;border-color:var(--green)}
.mails{padding:8px;display:flex;flex-direction:column;gap:6px}.mails div{padding:8px 10px;border-radius:10px;background:var(--soft);font-size:15px}
#info{margin-top:12px;min-height:58px;padding:12px;border-radius:16px;background:var(--hl)}
.mc{display:grid;gap:8px}.opt{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:12px;font:600 19px Fredoka;cursor:pointer;text-align:left}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.email{border:3px solid var(--bd);border-radius:18px;overflow:hidden;background:var(--card)}
.email .hd{background:var(--blue);color:#fff;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between}
.f{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--bd);padding:8px 14px;min-height:52px}
.f label{flex:none;width:76px;font-weight:700;color:var(--purple)}
.f.area{align-items:flex-start;border-bottom:0}.f textarea{height:130px;resize:none}
.reg{cursor:pointer}.reg.sel{outline:4px solid var(--amber);outline-offset:-4px}
.tbar{display:flex;gap:10px;padding:10px 14px;align-items:center;background:var(--soft);flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;background:#dbeafe;color:#1e3a8a;border-radius:99px;padding:4px 12px;font-size:16px}
.chk{list-style:none;padding:0;margin:12px 0}.chk li{padding:4px 0}.chk li::before{content:"⬜ "}.chk li.y::before{content:"✅ "}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.7);display:none;place-items:center;z-index:50;padding:14px}.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:22px;padding:18px;max-width:420px;width:100%}
.file{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;border:3px solid var(--bd);margin:8px 0;cursor:pointer;font-weight:600}.file:hover{border-color:var(--amber)}
.win{text-align:center;padding:10px}.win .big{font-size:70px}
.cert{border:6px double var(--amber);border-radius:20px;padding:18px;text-align:center;background:var(--hl);margin-top:12px}
.cert input{font:700 24px Fredoka;text-align:center;border:0;border-bottom:3px solid var(--amber);background:transparent;color:var(--tx);width:90%;outline:0}
@media(max-width:560px){.mock .body{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.f label{width:60px}}
</style><style id="prcss">

#prn .pslide .pe{font-size:54pt;line-height:1.1}#prn .pslide .pt{font-size:28pt;font-weight:700}#prn .pslide .px{font-size:16pt;margin-top:2mm}#prn .pslide .pn2{position:absolute;right:8px;bottom:5px;font-size:10pt;color:#64748b}
#prn .hero{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;border:1.5px solid #cbd5e1;border-radius:12px;padding:8px;margin-bottom:8px;break-inside:avoid}
#prn .prpg{position:relative;width:680px;height:382px;overflow:hidden;margin:0 auto 8mm;border:2px solid #94a3b8;break-inside:avoid}#prn .prpg>div{transform:scale(.85);transform-origin:0 0}
#prn .pimg{display:block;width:100%;height:auto;border:2px solid #94a3b8;margin:0 auto}
#prn .dip{border:8px double #d97706;border-radius:18px;padding:16mm 10mm;text-align:center;margin:20mm auto 0;break-inside:avoid}#prn .dip .dt{font-size:34pt;font-weight:700;margin:4mm 0}#prn .dip .dn{font-size:30pt;font-weight:700;margin:8mm 0;border-bottom:2px solid #d97706;display:inline-block;min-width:60%}#prn .dip .dx{font-size:18pt}
#prn-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:14px;font:600 16px system-ui,sans-serif;z-index:99999;max-width:90vw;text-align:center}
@media print{
 body.printing>*:not(#prn){display:none!important}
 body.printing{background:#fff!important;color:#111!important;margin:0!important;--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#cbd5e1;--soft:#f1f5f9;--hl:#fef9c3}
 body.printing #prn{display:block!important;font-family:Fredoka,system-ui,sans-serif;color:#111;font-size:14pt}
 #prn,#prn *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style><style>
main{max-width:1150px!important}
.panel{border:3px solid var(--bd);border-radius:18px;padding:10px 14px;margin:10px 0;background:var(--card)}
.panel h4{margin:0 0 8px;font-size:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row label{font-weight:600;font-size:16px}
.bt{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:600 16px Fredoka;border-radius:12px;padding:6px 12px;cursor:pointer}.bt:hover{border-color:var(--amber)}.bt.on{background:var(--amber);color:#fff;border-color:#d97706}.bt:disabled{opacity:.4;cursor:default}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);cursor:pointer;padding:0}.sw.on{outline:4px solid var(--blue);outline-offset:1px}
select,input[type=text],textarea{font:600 17px Fredoka;border:3px solid var(--bd);border-radius:12px;padding:6px 10px;background:var(--card);color:var(--tx);max-width:100%}
textarea{width:100%;resize:vertical}
canvas.cnv{width:100%;height:auto;display:block;border:4px solid var(--bd);border-radius:14px;background:#fff;touch-action:none}
.hint2{color:var(--mu);font-size:15px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}@media(max-width:880px){.grid2{grid-template-columns:1fr}}
.stk{display:flex;flex-wrap:wrap;gap:4px}.stk button{font-size:28px;border:2px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;padding:2px 6px}.stk button:hover{border-color:var(--amber)}
#msg{min-height:1.6em;font-weight:700;color:var(--purple);text-align:center}
input[type=range]{vertical-align:middle;max-width:160px}
</style></head><body>
<header style="background:linear-gradient(135deg,#f43f5e,#f59e0b)"><h1>🎞️ Φτιάχνω κινούμενη εικόνα (GIF)</h1><p>Ζωγράφισε καρέ-καρέ και δες το σχέδιό σου να κινείται</p></header>
<main><div class="card"><div class="grid2"><div><canvas id="cv" class="cnv" width="480" height="360" style="cursor:crosshair"></canvas>
<div class="row" id="frs" style="margin-top:8px"></div>
<div class="row" style="justify-content:center"><button class="bt" id="pl">▶️ Παίξε</button><label>Ταχύτητα: <input type="range" id="fps" min="1" max="12" value="5"></label><span id="fl"></span></div></div><div>
<div class="panel"><h4>🖊️ Εργαλεία</h4><div class="row" id="tl"></div><div class="row" id="cols"></div><div class="row"><label>Πάχος:</label><input type="range" id="sz" min="2" max="30" value="6"></div><div class="row" id="stp" style="display:none"></div><label><input type="checkbox" id="on" checked> 👻 Δες την προηγούμενη εικόνα αχνά</label></div>
<div class="panel"><h4>🎞️ Εικόνες (καρέ)</h4><div class="row"><button class="bt" id="add">➕ Νέο καρέ</button><button class="bt" id="dup">⧉ Αντίγραφο</button><button class="bt" id="del">🗑️ Σβήσε</button></div><div class="row"><button class="bt" id="clr">🧹 Καθάρισε το καρέ</button></div><div class="row"><label>Μετακίνηση σχεδίου:</label><button class="bt" data-n="-20,0">⬅️</button><button class="bt" data-n="0,-20">⬆️</button><button class="bt" data-n="0,20">⬇️</button><button class="bt" data-n="20,0">➡️</button></div></div>
<div class="row" style="justify-content:center"><button class="btn" id="gif">💾 Σώσε GIF</button><button class="btn g" id="prn">🖨️ Εκτύπωση</button></div>
</div></div><p class="hint2">👆 Ζωγράφισε το πρώτο καρέ, πάτησε «Νέο καρέ» (ή «Αντίγραφο») και άλλαξε λίγο το σχέδιο. Με το «Παίξε» βλέπεις την κίνηση! Μέχρι 16 καρέ.</p><div id="msg"></div></div></main>
<script>

const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function msg(t){const m=$('msg');if(!m)return;m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent='',4500)}
async function saveFile(name,blob){let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(dl&&dl.save){try{const buf=new Uint8Array(await blob.arrayBuffer());await dl.save({filename:name,data:buf,mimeType:blob.type});return true}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
function dlCanvas(cv,name){cv.toBlob(async b=>{if(await saveFile(name,b))msg('💾 Σώθηκε ως εικόνα!')},'image/png')}
function prCanvas(cv,title,land){prnOut(title,'<img class="pimg" src="'+cv.toDataURL('image/jpeg',.92)+'" alt="">',{noName:1,land:!!land})}
const rngS=s=>()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};

const cv=$('cv'),cx=cv.getContext('2d'),W=480,H=360,MAX=16;
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
let F=[mk()],cur=0,tool='pen',col='#111827',stamp='⭐',down=false,last=null,timer=null;
const COLS=['#111827','#ef4444','#f59e0b','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#92400e'];
[['pen','✏️ Μολύβι'],['er','🧽 Γόμα'],['st','😀 Σφραγίδα']].forEach(([k,l])=>{const b=el('button','bt'+(k==tool?' on':''),l);b.onclick=()=>{tool=k;[...$('tl').children].forEach(x=>x.classList.toggle('on',x===b));$('stp').style.display=k=='st'?'flex':'none'};$('tl').appendChild(b)});
COLS.forEach((c,i)=>{const b=el('button','sw'+(i==0?' on':''),'');b.style.background=c;b.onclick=()=>{col=c;[...$('cols').children].forEach(x=>x.classList.toggle('on',x===b))};$('cols').appendChild(b)});
['⭐','⚽','🐟','🦋','🚗','🌞','❤️','🐦','🎈','🏃'].forEach(e=>{const b=el('button','bt',e);b.style.fontSize='24px';b.onclick=()=>{stamp=e;[...$('stp').children].forEach(x=>x.classList.toggle('on',x===b))};$('stp').appendChild(b)});
const C=()=>F[cur].getContext('2d');
function render(){cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
 if($('on').checked&&cur>0&&!timer){cx.globalAlpha=.25;cx.drawImage(F[cur-1],0,0);cx.globalAlpha=1}
 cx.drawImage(F[cur],0,0);
 const f=$('frs');f.innerHTML='';F.forEach((c,i)=>{const b=el('button','bt'+(i==cur?' on':''),i+1);b.onclick=()=>{stop();cur=i;render()};f.appendChild(b)});$('fl').textContent='Καρέ '+(cur+1)+'/'+F.length;
 $('add').disabled=$('dup').disabled=F.length>=MAX;$('del').disabled=F.length<=1}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function line(a,b){const c=C();c.lineCap=c.lineJoin='round';c.lineWidth=+$('sz').value*(tool=='er'?2.5:1);
 if(tool=='er'){c.globalCompositeOperation='destination-out';c.strokeStyle='#000'}else{c.globalCompositeOperation='source-over';c.strokeStyle=col}
 c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();c.globalCompositeOperation='source-over'}
cv.onpointerdown=e=>{if(timer)return;cv.setPointerCapture(e.pointerId);const p=pos(e);
 if(tool=='st'){const c=C();c.font=(+$('sz').value*4+30)+'px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(stamp,p[0],p[1]);render();return}
 down=true;last=p;line(p,p);render()};
cv.onpointermove=e=>{if(!down)return;const p=pos(e);line(last,p);last=p;render()};
cv.onpointerup=cv.onpointercancel=()=>{down=false};
function ins(copy){if(F.length>=MAX)return;stop();const n=mk();if(copy)n.getContext('2d').drawImage(F[cur],0,0);F.splice(cur+1,0,n);cur++;render()}
$('add').onclick=()=>ins(0);$('dup').onclick=()=>ins(1);
$('del').onclick=()=>{if(F.length<2)return;stop();F.splice(cur,1);cur=Math.min(cur,F.length-1);render()};
$('clr').onclick=()=>{C().clearRect(0,0,W,H);render()};
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.n.split(',').map(Number),t=mk();t.getContext('2d').drawImage(F[cur],0,0);C().clearRect(0,0,W,H);C().drawImage(t,dx,dy);render()});
function stop(){if(timer){clearInterval(timer);timer=null;$('pl').textContent='▶️ Παίξε';render()}}
$('pl').onclick=()=>{if(timer)return stop();if(F.length<2){msg('Φτιάξε τουλάχιστον 2 καρέ!');return}$('pl').textContent='⏹️ Στοπ';let i=0;timer=setInterval(()=>{cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.drawImage(F[i],0,0);$('fl').textContent='Καρέ '+(i+1)+'/'+F.length;i=(i+1)%F.length},1000/+$('fps').value)};
$('fps').oninput=()=>{if(timer){stop();$('pl').click()}};
$('on').onchange=render;
/* GIF encoder */
function lzw(idx){const out=[],MIN=8,CL=256,EOI=257;let bits=0,nb=0;const buf=[];
 const wr=(c,s)=>{bits|=c<<nb;nb+=s;while(nb>=8){buf.push(bits&255);bits>>=8;nb-=8}};
 let dict=new Map(),next=258,sz=9;wr(CL,sz);let pre=idx[0];
 for(let i=1;i<idx.length;i++){const c=idx[i],k=pre*256+c;if(dict.has(k))pre=dict.get(k);else{wr(pre,sz);if(next<4096){dict.set(k,next++);if(next>(1<<sz)&&sz<12)sz++}else{wr(CL,sz);dict=new Map();next=258;sz=9}pre=c}}
 wr(pre,sz);wr(EOI,sz);if(nb>0)buf.push(bits&255);return buf}
function gif(frames,delay){const o=[];const w2=n=>o.push(n&255,n>>8&255);
 o.push(...[71,73,70,56,57,97]);w2(W);w2(H);o.push(0xF7,0,0);
 for(let i=0;i<256;i++){if(i<216){o.push(Math.floor(i/36)*51,Math.floor(i/6)%6*51,i%6*51)}else o.push(255,255,255)}
 o.push(0x21,0xFF,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
 frames.forEach(fc=>{const t=mk(),c=t.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);c.drawImage(fc,0,0);const d=c.getImageData(0,0,W,H).data,ix=new Uint8Array(W*H);
  for(let i=0;i<ix.length;i++){ix[i]=Math.round(d[i*4]/51)*36+Math.round(d[i*4+1]/51)*6+Math.round(d[i*4+2]/51)}
  o.push(0x21,0xF9,4,0,...[delay&255,delay>>8&255],0,0);o.push(0x2C);w2(0);w2(0);w2(W);w2(H);o.push(0,8);
  const b=lzw(ix);for(let i=0;i<b.length;i+=255){const ch=b.slice(i,i+255);o.push(ch.length,...ch)}o.push(0)});
 o.push(0x3B);return new Uint8Array(o)}

</script><script id="prjs">
const escP=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prBtn(fn,t,cls){const b=document.createElement('button');b.className=cls||'btn g';b.type='button';b.textContent=t||'🖨️ Εκτύπωση';b.onclick=fn;return b}
function prMsg(t){let m=document.getElementById('prn-toast');if(m)m.remove();m=document.createElement('div');m.id='prn-toast';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),6000)}
function prPop(title,inner){const w=window.open('','_blank');if(!w){prMsg('Η εκτύπωση δεν άνοιξε. Δοκίμασε Ctrl+P ή άνοιξε το παιχνίδι σε νέα καρτέλα.');return}
 const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 w.document.write('<!doctype html><html lang="el"><head><meta charset="utf-8"><title>'+escP(title)+'</title><style>'+css+'#prn{display:block!important;max-width:800px;margin:0 auto;padding:12px}</style></head><body class="printing"><div id="prn">'+inner+'</div></body></html>');w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},700)}
function prnOut(title,html,o){o=o||{};
 const old=document.getElementById('prn');if(old)old.remove();
 const p=document.createElement('div');p.id='prn';
 html=String(html).replace(/\sid="([^"]*)"/g,' id="p_$1"').replace(/url\(#([^)]+)\)/g,'url(#p_$1)');
 p.innerHTML='<h1 class="ph">'+escP(title)+'</h1>'+(o.noName?'':'<div class="pn">Όνομα: <i></i> Τάξη: <i></i></div>')+html+'<p class="pf">DigiKidsEdu</p>';
 document.body.appendChild(p);
 let st=document.getElementById('prs');if(!st){st=document.createElement('style');st.id='prs';document.head.appendChild(st)}
 st.textContent='@page{size:A4 '+(o.land?'landscape':'portrait')+';margin:10mm}';
 document.body.classList.add('printing');
 let started=false,ended=false;
 const end=()=>{if(ended)return;ended=true;document.body.classList.remove('printing');const q=document.getElementById('prn');if(q)q.remove();removeEventListener('afterprint',end)};
 addEventListener('beforeprint',()=>{started=true},{once:true});addEventListener('afterprint',end);
 setTimeout(()=>{try{window.print()}catch(e){}
  setTimeout(()=>{if(!started){const inner=p.innerHTML;end();prPop(title,inner)}else if(!ended){addEventListener('pointerdown',end,{once:true,capture:true});setTimeout(end,120000)}},500)},60)}

function prDip(what,name){return '<div class="dip"><div style="font-size:60pt">🎓</div><div class="dt">Δίπλωμα</div><div class="dx">Απονέμεται στον/στην</div><div class="dn">'+(name?escP(name):'&nbsp;'.repeat(24))+'</div><div class="dx">'+escP(what)+'</div></div>'}
