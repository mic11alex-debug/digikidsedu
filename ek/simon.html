<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ο Σάιμον λέει</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#22c55e;--g2:#3b82f6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
#pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(88%,380px);margin:10px auto}.p{aspect-ratio:1;border:0;border-radius:24px;cursor:pointer;opacity:.55;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:.1s}.p.on{opacity:1;transform:scale(1.04);filter:brightness(1.3)}.p:disabled{cursor:default}</style></head><body>
<header><h1>🎵 Ο Σάιμον λέει</h1><p>Θυμήσου τη σειρά των χρωμάτων και επανέλαβέ την!</p></header>
<main><div class="row"><div class="pill"><small>Γύρος</small><b id="rd">0</b></div><div class="pill"><small>Ρεκόρ</small><b id="bs">0</b></div></div><div id="msg">Πάτησε «Έναρξη»</div>
<div id="pads"><button class="p" data-i="0" style="background:#22c55e"></button><button class="p" data-i="1" style="background:#ef4444"></button><button class="p" data-i="2" style="background:#facc15"></button><button class="p" data-i="3" style="background:#3b82f6"></button></div>
<div class="row"><button class="btn" id="go">▶ Έναρξη</button></div><div class="row"><div class="lab">Ταχύτητα</div><button class="ch on" data-v="650">🐢 Αργά</button><button class="ch" data-v="450">🐇 Κανονικά</button><button class="ch" data-v="280">⚡ Γρήγορα</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const F=[330,262,392,523];let seq=[],pos=0,acc=false,spd=650,best=+(localStorage.sbest||0);$('bs').textContent=best;
const P=document.querySelectorAll('.p');function lit(i,d=300){P[i].classList.add('on');beep(F[i],d/1000,'triangle',.12);setTimeout(()=>P[i].classList.remove('on'),d)}
function show(){acc=false;$('msg').textContent='Πρόσεξε… 👀';seq.forEach((s,k)=>setTimeout(()=>lit(s,spd*.6),600+k*spd));setTimeout(()=>{acc=true;pos=0;$('msg').textContent='Τώρα εσύ! 👆'},600+seq.length*spd)}
function next(){seq.push(Math.random()*4|0);$('rd').textContent=seq.length-1;show()}
P.forEach(p=>p.onclick=()=>{if(!acc)return;const i=+p.dataset.i;lit(i,200);if(i!==seq[pos]){acc=false;beep(120,.5,'sawtooth');const sc=seq.length-1;$('msg').textContent='Ωχ! Έφτασες στον γύρο '+sc+'. Ξαναδοκίμασε!';if(sc>best){best=sc;try{localStorage.sbest=sc}catch(e){}$('bs').textContent=sc;$('msg').textContent='🏆 Νέο ρεκόρ: '+sc+'!'}seq=[];return}
 pos++;if(pos===seq.length){acc=false;$('rd').textContent=seq.length;$('msg').textContent='Μπράβο! ✅';setTimeout(next,900)}});
$('go').onclick=()=>{seq=[];next()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{spd=+b.dataset.v;sel('data-v',spd)});
</script></body></html>
