<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Μάζεψε τα κόκαλα</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#16a34a;--g2:#0ea5e9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
#bd{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,450px);margin:6px auto;border:4px solid #166534;border-radius:12px;overflow:hidden;background:#86efac}.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6.5vw,34px)}.c:nth-child(odd){background:#bbf7d0}
#dp{display:grid;grid-template-areas:". u ." "l . r" ". d .";grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:8px auto}#dp button{height:56px;font-size:26px;border:3px solid var(--bd);border-radius:14px;background:var(--card);cursor:pointer}</style></head><body>
<header><h1>🦴 Μάζεψε τα κόκαλα</h1><p>Ο Μίλης μαζεύει κόκαλα και κρύβεται από τη Νάσα!</p></header>
<main><div class="row"><div class="lab">Δυσκολία</div><button class="ch on" data-l="900">😊 Εύκολο</button><button class="ch" data-l="650">🙂 Μέτριο</button><button class="ch" data-l="450">😎 Δύσκολο</button></div>
<div class="row"><div class="pill"><small>Κόκαλα</small><b id="sc">0/10</b></div><div class="pill"><small>Ζωές</small><b id="lv">❤️❤️❤️</b></div></div><div id="msg">Μάζεψε 10 κόκαλα και απόφυγε τη Νάσα! Χρησιμοποίησε τα βελάκια.</div>
<div id="bd"></div><div id="dp"><button data-d="-1,0" style="grid-area:u">⬆️</button><button data-d="0,-1" style="grid-area:l">⬅️</button><button data-d="0,1" style="grid-area:r">➡️</button><button data-d="1,0" style="grid-area:d">⬇️</button></div><div class="row"><button class="btn" id="go">▶ Νέο παιχνίδι</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const S=9;let me,cat,bones,got,lives,run,spd=900,tm;
function put(){const bd=$('bd');bd.innerHTML='';for(let r=0;r<S;r++)for(let c=0;c<S;c++){const d=document.createElement('div');d.className='c';let t='';if(bones.some(b=>b[0]===r&&b[1]===c))t='🦴';if(r===me[0]&&c===me[1])t='🐶';if(r===cat[0]&&c===cat[1])t=(r===me[0]&&c===me[1])?'💥':'🐱';d.textContent=t;bd.appendChild(d)}}
function rnd(ex){let p;do p=[Math.random()*S|0,Math.random()*S|0];while(ex.some(e=>e[0]===p[0]&&e[1]===p[1]));return p}
function start(){clearInterval(tm);me=[4,4];cat=[0,0];bones=[];for(let i=0;i<4;i++)bones.push(rnd([me,cat,...bones]));got=0;lives=3;run=true;$('sc').textContent='0/10';$('lv').textContent='❤️❤️❤️';$('msg').textContent='Μάζεψε 10 κόκαλα! 🦴';put();tm=setInterval(chase,spd)}
function hit(){if(me[0]===cat[0]&&me[1]===cat[1]){lives--;beep(150,.4,'sawtooth');$('lv').textContent=lives>0?'❤️'.repeat(lives):'💔';cat=[Math.random()<.5?0:S-1,Math.random()<.5?0:S-1];if(me[0]===cat[0]&&me[1]===cat[1])cat=[0,0];if(lives<=0){run=false;clearInterval(tm);$('msg').textContent='😿 Σε έπιασε η Νάσα! Ξαναδοκίμασε.'}else $('msg').textContent='Ωχ! Η Νάσα σε πρόλαβε!'}}
function chase(){if(!run)return;const dr=me[0]-cat[0],dc=me[1]-cat[1];if(Math.abs(dr)>Math.abs(dc)||(Math.abs(dr)===Math.abs(dc)&&Math.random()<.5))cat[0]+=Math.sign(dr);else cat[1]+=Math.sign(dc);if(Math.random()<.12){cat[0]=Math.max(0,Math.min(S-1,cat[0]+(Math.random()<.5?1:-1)))}hit();put()}
function mv(dr,dc){if(!run)return;const r=me[0]+dr,c=me[1]+dc;if(r<0||c<0||r>=S||c>=S)return;me=[r,c];beep(450,.04);const k=bones.findIndex(b=>b[0]===r&&b[1]===c);if(k>=0){bones.splice(k,1);got++;beep(880,.1);$('sc').textContent=got+'/10';if(got>=10){run=false;clearInterval(tm);put();$('msg').textContent='🎉 Μπράβο! Μάζεψες όλα τα κόκαλα!';fanfare();return}bones.push(rnd([me,cat,...bones]))}hit();put()}
addEventListener('keydown',e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]}[e.key];if(m){e.preventDefault();mv(...m)}});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>mv(...b.dataset.d.split(',').map(Number)));document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{spd=+b.dataset.l;sel('data-l',spd);start()});$('go').onclick=start;start();
</script></body></html>
