<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Κουίζ δύο ομάδων</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--soft:#f1f5f9;--g1:#f59e0b;--g2:#ef4444}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(26px,5vw,36px)}header p{margin:2px 0 0;opacity:.95;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.row .lab{width:100%;text-align:center;color:var(--mu);font-size:15px;font-weight:600;margin-bottom:-2px}
.ch{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka,system-ui;border-radius:99px;padding:8px 16px;cursor:pointer}
.ch.on{background:#f59e0b;border-color:#d97706;color:#fff}
.btn{border:0;background:#10b981;color:#fff;font:700 19px Fredoka,system-ui;border-radius:99px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #059669}
.btn.g{background:#64748b;box-shadow:0 4px 0 #475569}.btn:active{transform:translateY(3px);box-shadow:none}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:18px;text-align:center;padding:6px 14px;min-width:90px}
.pill b{display:block;font-size:26px;line-height:1.1}.pill small{color:var(--mu);font-size:14px;font-weight:600}
#msg{text-align:center;font-weight:700;font-size:22px;min-height:34px;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px}
.o{display:block;width:100%;margin:6px 0;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:11px;font:700 19px Fredoka,system-ui;cursor:pointer}.o:hover:not(:disabled){background:var(--soft)}.o.ok{background:#bbf7d0;border-color:#22c55e}.o.no{background:#fecaca;border-color:#ef4444}.pill.act{border-color:#f59e0b;transform:scale(1.06)}</style></head><body>
<header><h1>🏆 Κουίζ δύο ομάδων</h1><p>Δύο ομάδες απαντούν εναλλάξ – ποια θα κερδίσει;</p></header>
<main><div class="row"><div class="lab">Θέμα</div><div id="th"></div></div>
<div class="row"><div class="lab">Ερωτήσεις ανά ομάδα</div><button class="ch" data-q="3">3</button><button class="ch on" data-q="5">5</button><button class="ch" data-q="8">8</button></div>
<div class="row"><div class="pill" id="pa"><small>🔴 Ομάδα Α</small><b id="sa">0</b></div><div class="pill" id="pb"><small>🔵 Ομάδα Β</small><b id="sb">0</b></div></div>
<div class="card" id="qc" style="min-height:230px"><div id="qt" style="font-weight:700;font-size:22px;text-align:center;margin-bottom:10px">Διάλεξε θέμα και πάτα «Έναρξη»</div><div id="op"></div></div><div id="msg"></div><div class="row"><button class="btn" id="go">▶ Έναρξη</button></div></main>
<script>
const $=id=>document.getElementById(id);const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function beep(f,d=.12,t='sine',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*130));
function sel(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===String(val)))}
const Q={"🇨🇾 Κύπρος": [["Ποια είναι η πρωτεύουσα της Κύπρου;", "Λευκωσία", "Λάρνακα", "Λεμεσός", "Πάφος"], ["Ποιο είναι το ψηλότερο βουνό της Κύπρου;", "Όλυμπος", "Πεντάδακτυλος", "Μαχαιράς", "Κιόνια"], ["Σε ποια θάλασσα βρίσκεται η Κύπρος;", "Μεσόγειο", "Αιγαίο", "Μαύρη θάλασσα", "Ερυθρά θάλασσα"], ["Ποιο είναι το νόμισμα της Κύπρου;", "Ευρώ", "Δολάριο", "Λίρα Στερλίνα", "Δραχμή"], ["Ποιο τυρί είναι παραδοσιακό της Κύπρου;", "Χαλλούμι", "Φέτα", "Παρμεζάνα", "Μοτσαρέλα"], ["Ποιο άγριο ζώο ζει στο δάσος της Πάφου;", "Μουφλόν", "Λύκος", "Αρκούδα", "Τίγρης"], ["Ποια κλαδιά υπάρχουν στη σημαία της Κύπρου;", "Ελιάς", "Δάφνης", "Πεύκου", "Αμπελιού"], ["Ο Άγιος Λάζαρος βρίσκεται στην πόλη:", "Λάρνακα", "Λεμεσό", "Πάφο", "Αμμόχωστο"], ["Ποια πόλη είναι χωρισμένη στα δύο;", "Λευκωσία", "Λεμεσός", "Πάφος", "Λάρνακα"]], "💻 Υπολογιστής": [["Ποιο μέρος του υπολογιστή χρησιμοποιούμε για να γράφουμε;", "Πληκτρολόγιο", "Ποντίκι", "Οθόνη", "Ηχείο"], ["Ποια συσκευή τυπώνει σε χαρτί;", "Εκτυπωτής", "Σαρωτής", "Οθόνη", "Μικρόφωνο"], ["Ποιος είναι ο «εγκέφαλος» του υπολογιστή;", "Επεξεργαστής", "Οθόνη", "Ποντίκι", "Καλώδιο"], ["Ποιο πλήκτρο σβήνει το γράμμα που γράψαμε;", "Backspace", "Enter", "Shift", "Tab"], ["Με ποια πλήκτρα αντιγράφουμε;", "Ctrl + C", "Ctrl + V", "Ctrl + Z", "Alt + F4"], ["Ποιο από αυτά ΔΕΝ πρέπει να το πεις σε αγνώστους στο διαδίκτυο;", "Τον κωδικό σου", "Το αγαπημένο σου χρώμα", "Ένα αστείο", "Το αγαπημένο σου ζώο"], ["Το Google είναι…", "Μηχανή αναζήτησης", "Παιχνίδι", "Εκτυπωτής", "Πληκτρολόγιο"], ["Σε ποιο πρόγραμμα ζωγραφίζουμε;", "Paint", "Word", "Excel", "Outlook"], ["Σε ποιο πρόγραμμα γράφουμε κείμενα;", "Word", "Paint", "Calculator", "Camera"], ["Για να κλείσουμε ένα παράθυρο πατάμε το…", "Χ", "+", "?", "↑"]], "🐶 Ζώα": [["Ποιο είναι το ψηλότερο ζώο;", "Καμηλοπάρδαλη", "Ελέφαντας", "Άλογο", "Καμήλα"], ["Ποιο ζώο είναι θηλαστικό;", "Δελφίνι", "Σολομός", "Καρχαρίας", "Χταπόδι"], ["Πόσα πόδια έχει η αράχνη;", "8", "6", "4", "10"], ["Ποιο πουλί δεν πετάει;", "Πιγκουίνος", "Σπουργίτι", "Αετός", "Περιστέρι"], ["Τι γίνεται η κάμπια;", "Πεταλούδα", "Μέλισσα", "Σκαθάρι", "Μύγα"], ["Ποιο είναι το μεγαλύτερο ζώο της Γης;", "Μπλε φάλαινα", "Ελέφαντας", "Καρχαρίας", "Καμηλοπάρδαλη"], ["Τι τρώει η αγελάδα;", "Χόρτο", "Κρέας", "Ψάρια", "Σοκολάτα"], ["Ποιο ζώο έχει προβοσκίδα;", "Ελέφαντας", "Λιοντάρι", "Ζέβρα", "Κροκόδειλος"], ["Από τι φτιάχνει το μέλι η μέλισσα;", "Από νέκταρ λουλουδιών", "Από ζάχαρη", "Από γάλα", "Από νερό"]], "🔢 Μαθηματικά": [["Πόσο κάνει 7 × 8;", "56", "54", "48", "63"], ["Πόσο κάνει 100 − 37;", "63", "73", "67", "53"], ["Πόσο κάνει 12 + 19;", "31", "21", "29", "32"], ["Πόσες πλευρές έχει το εξάγωνο;", "6", "5", "8", "7"], ["Ποιο είναι το διπλάσιο του 35;", "70", "65", "75", "60"], ["Πόσα λεπτά έχει μία ώρα;", "60", "100", "30", "24"], ["Πόσα εκατοστά έχει ένα μέτρο;", "100", "10", "1000", "50"], ["Το μισό του 18 είναι…", "9", "8", "6", "10"], ["Πόσο κάνει 9 × 6;", "54", "56", "45", "63"], ["Ποιος αριθμός είναι ζυγός;", "14", "15", "7", "9"]]};let ths=new Set(Object.keys(Q)),per=5,list=[],i=0,sc=[0,0],team=0,lock;
const tb=$('th');tb.className='row';Object.keys(Q).forEach(k=>{const b=document.createElement('button');b.className='ch on';b.textContent=k;b.onclick=()=>{if(ths.has(k)){if(ths.size>1)ths.delete(k)}else ths.add(k);b.classList.toggle('on',ths.has(k))};tb.appendChild(b)});
function start(){const pool=sh([].concat(...[...ths].map(k=>Q[k])));list=pool.slice(0,per*2);sc=[0,0];i=0;team=0;show()}
function show(){$('sa').textContent=sc[0];$('sb').textContent=sc[1];$('pa').classList.toggle('act',team===0);$('pb').classList.toggle('act',team===1);
 if(i>=list.length){const w=sc[0]===sc[1]?'🤝 Ισοπαλία!':(sc[0]>sc[1]?'🏆 Κέρδισε η Ομάδα Α 🔴!':'🏆 Κέρδισε η Ομάδα Β 🔵!');$('qt').textContent=w;$('op').innerHTML='';$('msg').textContent='Τελικό σκορ: '+sc[0]+' - '+sc[1];fanfare();return}
 const q=list[i];$('qt').textContent=(team===0?'🔴 Ομάδα Α':'🔵 Ομάδα Β')+': '+q[0];$('msg').textContent='Ερώτηση '+(i+1)+' από '+list.length;lock=false;
 const op=$('op');op.innerHTML='';sh(q.slice(1)).forEach(a=>{const b=document.createElement('button');b.className='o';b.textContent=a;b.onclick=()=>ans(b,a===q[1],q);op.appendChild(b)})}
function ans(b,ok,q){if(lock)return;lock=true;[...$('op').children].forEach(x=>{if(x.textContent===q[1])x.classList.add('ok')});if(ok){sc[team]++;beep(784,.2);$('msg').textContent='✅ Σωστά! +1 πόντος'}else{b.classList.add('no');beep(160,.3,'sawtooth');$('msg').textContent='❌ Η σωστή απάντηση: '+q[1]}
 setTimeout(()=>{i++;team=1-team;show()},1700)}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{per=+b.dataset.q;sel('data-q',per)});$('go').onclick=start;
</script></body></html>
