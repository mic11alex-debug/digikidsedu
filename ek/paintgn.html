<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Γνωρίζω το Paint</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350;--hl:#4a3f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka;border-radius:99px;padding:8px 16px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}.lead{color:var(--mu);margin:0 0 14px}
.btn{border:0;cursor:pointer;font:700 19px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.win{text-align:center;padding:14px}.win .big{font-size:76px}
.opt{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:12px;font:600 20px Fredoka;cursor:pointer}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.stars{font-size:34px;letter-spacing:4px}
.cert{border:6px double var(--amber);border-radius:20px;padding:18px;text-align:center;background:var(--hl);margin-top:14px}
.cert input{font:700 24px Fredoka;text-align:center;border:0;border-bottom:3px solid var(--amber);background:transparent;color:var(--tx);width:90%;outline:0}
.rc{text-align:center;padding:10px}.rc .em{font-size:96px;line-height:1.1}.rc p{font-size:clamp(22px,4.5vw,30px);font-weight:600;margin:10px 0}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}.dots i{width:14px;height:14px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--amber)}.dots i.d{background:var(--green)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.big2 .opt{font-size:26px;padding:18px}
.sit{font-size:clamp(22px,4.5vw,30px);font-weight:600;text-align:center;padding:16px;background:var(--hl);border-radius:20px;margin:12px 0}.sit .em{display:block;font-size:80px}
.pr-stw{position:relative;border-radius:24px;overflow:hidden;border:4px solid #1e293b;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.pr-st{position:relative;aspect-ratio:16/9;overflow:hidden;container-type:inline-size;user-select:none}
.pr-i{position:absolute;line-height:1;transform:translate(-50%,-50%);white-space:nowrap}
.pr-i>span{display:block;filter:drop-shadow(0 .6cqw .5cqw rgba(0,0,0,.25))}
.pr-ti{position:absolute;left:3.5cqw;top:3cqw;font-weight:800;font-size:4.4cqw;color:#fff;text-shadow:0 .4cqw 0 rgba(0,0,0,.25);animation:prslide .6s both;z-index:4;max-width:70cqw;line-height:1.15}
.pr-ti.c{left:50%;top:34%;text-align:center;font-size:6.2cqw;max-width:86cqw;transform:translate(-50%,-50%);animation:prpopc .8s both}
.pr-ti.c small{display:block;font-size:2.6cqw;font-weight:700;margin-top:1.4cqw;opacity:.95}
.pr-bar{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(255,255,255,.35);z-index:6}.pr-bar i{display:block;height:100%;width:0;background:#fff;border-radius:0 6px 6px 0}.pr-bar i.go{animation:prbar var(--d,5s) linear forwards}
.pr-cnt{position:absolute;right:2.5cqw;top:2.5cqw;font-weight:800;font-size:2.2cqw;color:#fff;background:rgba(0,0,0,.3);border-radius:99px;padding:.3cqw 1.8cqw;z-index:6}
.pr-cap{margin:14px 0 8px;min-height:84px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--soft);border:3px solid var(--bd);border-radius:18px;padding:12px 16px;font-weight:700;font-size:clamp(17px,2.8vw,23px);line-height:1.45;animation:prfade .5s both}
.pr-ct{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pr-ct button{font:800 20px Fredoka,system-ui,sans-serif;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;width:58px;height:50px;cursor:pointer;box-shadow:0 4px 0 var(--bd)}.pr-ct button.big{width:auto;padding:0 22px;background:var(--teal);color:#fff;border-color:#0d9488;box-shadow:0 4px 0 #0d9488}
.pr-ct button:active{transform:translateY(3px);box-shadow:none}
.pr-dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}.pr-dots b{width:14px;height:14px;border-radius:50%;background:var(--bd);cursor:pointer;transition:.2s}.pr-dots b.on{background:var(--teal);transform:scale(1.35)}.pr-dots b.dn{background:#99f6e4}
.pr.paused .pr-st *,.pr.paused .pr-bar i{animation-play-state:paused!important}
.pr-bub{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#1e293b;font-weight:800;font-size:2.8cqw;border-radius:2.4cqw;padding:1cqw 2.2cqw;box-shadow:0 .5cqw 0 rgba(0,0,0,.2);border:.4cqw solid #1e293b;animation:prpopc .5s both;z-index:3;white-space:nowrap}
.pr-lb{position:absolute;left:64cqw;font-weight:800;font-size:2.7cqw;color:#064e3b;background:#fff;border:.4cqw solid #047857;border-radius:2cqw;padding:.8cqw 1.8cqw;animation:prslide .5s both;box-shadow:0 .5cqw 0 rgba(0,0,0,.18);white-space:nowrap}
.pr-pz{position:absolute;left:22cqw;top:12cqw;width:38cqw;background:#fff;border-radius:3cqw;padding:1.5cqw;border:.5cqw solid #064e3b;box-shadow:0 1cqw 0 rgba(0,0,0,.2)}.pr-pz svg{width:100%;height:auto;display:block}
.pr-pz .bad,.pr-pz .good{position:absolute;inset:1.5cqw}.pr-pz .bad{animation:prout .6s 1.8s both}.pr-pz .good{opacity:0;animation:prin .6s 2s both}
.pr-pz .tg{position:absolute;left:50%;top:-2.6cqw;transform:translateX(-50%);font-weight:800;font-size:2.6cqw;border-radius:99px;padding:.3cqw 2cqw;color:#fff;background:#dc2626;white-space:nowrap}.pr-pz .tg.g{background:#16a34a;opacity:0;animation:prin .5s 2s both}.pr-pz .tg.r{animation:prout .5s 1.8s both}
.pr-go{font:800 clamp(16px,2.6vw,21px) Fredoka,system-ui,sans-serif;border:3px solid #0d9488;background:var(--teal);color:#fff;border-radius:16px;padding:8px 20px;cursor:pointer;box-shadow:0 4px 0 #0d9488;margin-left:12px}
.a-bob{animation:prbob 2.2s ease-in-out infinite}.a-wob{animation:prwob 1.6s ease-in-out infinite}.a-up{animation:prup 4s ease-in infinite}.a-pop{animation:prpop .6s both}.a-stamp{animation:prstamp .5s both}.a-blink{animation:prblink 1.2s infinite}.a-shake{animation:prshake .6s infinite}.a-spin{animation:prspin 6s linear infinite}.a-pulse{animation:prpulse 1.4s ease-in-out infinite}.a-raise{animation:prraise 2.4s ease-in-out infinite}.a-sway{animation:prsway 2s ease-in-out infinite}
.a-walk{animation:prwalk 4.6s ease-in-out both}.a-swap{animation:prswap 3.2s ease-in-out infinite}.a-toss{animation:prtoss 2.4s ease-in both infinite}.a-slidein{animation:prslidein 2s 1.5s ease-out both}.a-sweep{animation:prsweep 1s ease-in-out infinite}.a-germ{animation:prgerm 3.6s ease-in-out infinite}.a-grow{animation:prgrow 1s 2s both}.a-reach{animation:prreach 3.4s ease-in-out both}
@keyframes prbar{to{width:100%}}@keyframes prfade{from{opacity:0;transform:translateY(8px)}}@keyframes prslide{from{opacity:0;transform:translateX(-30px)}}
@keyframes prbob{50%{transform:translateY(-6%)}}@keyframes prwob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes prup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-34cqw) scale(1.1);opacity:0}}
@keyframes prpop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes prpopc{0%{transform:translate(-50%,-50%) scale(0);opacity:0}70%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes prstamp{0%{transform:scale(4) rotate(-20deg);opacity:0}60%{transform:scale(.9) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes prblink{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes prshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5%)}75%{transform:translateX(5%)}}
@keyframes prspin{to{transform:rotate(360deg)}}@keyframes prpulse{50%{transform:scale(1.18)}}
@keyframes prraise{0%,100%{transform:translateY(8%) rotate(-4deg)}50%{transform:translateY(-10%) rotate(4deg)}}
@keyframes prsway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes prwalk{from{left:8%}to{left:72%}}
@keyframes prswap{0%,100%{transform:translateX(-120%)}50%{transform:translateX(120%)}}
@keyframes prtoss{0%{transform:translate(0,0) scale(1);opacity:1}45%{transform:translate(calc(var(--dx)*.5),-14cqw) rotate(180deg)}85%{transform:translate(var(--dx),var(--dy)) scale(.5) rotate(360deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes prslidein{from{transform:translateX(40cqw)}to{transform:translateX(0)}}
@keyframes prsweep{0%,100%{transform:rotate(-25deg) translateX(-30%)}50%{transform:rotate(25deg) translateX(30%)}}
@keyframes prgerm{0%{transform:translate(0,0) scale(1);opacity:1}55%{transform:translate(var(--gx),var(--gy)) scale(1.15);opacity:1}75%{transform:translate(calc(var(--gx)*1.05),var(--gy)) scale(.5) rotate(60deg);opacity:0}100%{opacity:0}}
@keyframes prgrow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes prreach{0%{transform:translateY(-60%)}40%{transform:translateY(40%)}100%{transform:translateY(40%)}}
@keyframes prout{to{opacity:0}}@keyframes prin{to{opacity:1}}
@keyframes prfall{from{transform:translateY(-12cqw) rotate(0)}to{transform:translateY(70cqw) rotate(540deg)}}
.pr-cf{position:absolute;top:0;animation:prfall linear infinite;line-height:1}
@media(prefers-reduced-motion:reduce){.pr-st *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.og{display:grid;gap:10px}.opt.s{font-size:18px;text-align:left}.og .opt{text-align:left;font-size:19px}
.pr-ph{position:absolute;left:50%;top:3cqw;transform:translateX(-50%);width:32cqw;height:50cqw;background:#0f172a;border-radius:3cqw;border:.6cqw solid #94a3b8;padding:2cqw;overflow:hidden;box-shadow:0 1cqw 0 rgba(0,0,0,.3)}
.pr-ph h6{margin:0 0 1cqw;color:#94a3b8;font-size:1.9cqw;text-align:center}
.pr-cb{max-width:84%;padding:1cqw 1.6cqw;border-radius:1.8cqw;font-weight:700;font-size:2cqw;margin:1.3cqw 0;opacity:0;animation:prcb .45s both;line-height:1.3}.pr-cb.s{background:#475569;color:#fff;border-bottom-left-radius:.4cqw}.pr-cb.m{background:#22c55e;color:#052e16;margin-left:auto;border-bottom-right-radius:.4cqw}
@keyframes prcb{from{opacity:0;transform:translateY(2cqw) scale(.9)}to{opacity:1;transform:none}}
.pr-pw{position:absolute;top:14cqw;width:41cqw;background:#fff;border-radius:2.4cqw;padding:2cqw;border:.5cqw solid #1e293b;box-shadow:0 .8cqw 0 rgba(0,0,0,.25);color:#1e293b;text-align:center;font-weight:800;font-size:2.4cqw;animation:prpop .6s both}
.pr-pw .ty{font-family:ui-monospace,Menlo,monospace;font-size:3.6cqw;margin:1.4cqw 0;overflow:hidden;white-space:nowrap;display:inline-block;width:0;animation:prtype 1.6s steps(12) var(--td,.6s) forwards;vertical-align:bottom}
.pr-m{height:2.2cqw;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:1.2cqw}.pr-m i{display:block;height:100%;width:0;animation:prmeter 1.6s var(--md,1s) ease-out forwards}
@keyframes prtype{to{width:var(--ch)}}@keyframes prmeter{to{width:var(--w)}}
.a-vault{animation:prvault 2.6s ease-in infinite}@keyframes prvault{0%{transform:translate(0,0) scale(1);opacity:1}70%{transform:translate(var(--dx),var(--dy)) scale(.35);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.pr-mail{background:#fff;color:#1e293b;border:.5cqw solid #1e293b;border-radius:2cqw;padding:1.6cqw 2.4cqw;font-weight:800;font-size:2.4cqw;text-align:center;box-shadow:0 .7cqw 0 rgba(0,0,0,.25);white-space:normal;width:38cqw}
.pr-mail b{display:inline-block;margin-top:1cqw;background:#ef4444;color:#fff;border-radius:99px;padding:.6cqw 2cqw;animation:prpulse 1s infinite}
.a-hook{animation:prhook 3.4s ease-in-out both}@keyframes prhook{0%{transform:translateY(-70%)}45%{transform:translateY(25%)}100%{transform:translateY(25%)}}
.a-foot{animation:prin .01s both;opacity:0}
.pr-big{position:absolute;left:50%;transform:translateX(-50%);font-weight:800;color:#fff;text-shadow:0 .4cqw 0 rgba(0,0,0,.3);text-align:center;animation:prfade .6s both;white-space:nowrap}
.fdbk{min-height:56px;text-align:center;font-weight:700;margin:10px 0}
.post{border:3px solid var(--bd);border-radius:20px;padding:14px 16px;background:var(--card);line-height:1.8;font-size:19px;max-width:640px;margin:0 auto}
.post .hd{font-weight:700;margin-bottom:6px}.post .cl{cursor:pointer;border-bottom:3px dotted var(--amber);border-radius:4px;transition:.2s}.post .cl:hover{background:var(--hl)}.post .cl.f{background:#bbf7d0;border-bottom:3px solid var(--green)}
.clist{display:grid;gap:8px;margin:12px auto;max-width:640px}.clist div{border:3px solid var(--bd);border-radius:14px;padding:8px 12px;font-size:17px;background:var(--soft)}.clist div.f{background:#bbf7d0;border-color:var(--green);color:#14532d}
.stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}.stp .opt{font-size:18px;text-align:left}.stp .opt.used{opacity:.4}
.ord{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.ord span{background:#bbf7d0;border:3px solid var(--green);border-radius:14px;padding:6px 12px;font-weight:700;font-size:16px;color:#14532d}
.sl{width:100%;max-width:640px;display:block;margin:10px auto;accent-color:var(--amber);height:34px}.phv{border:4px solid var(--tx);border-radius:14px;overflow:hidden;max-width:640px;margin:0 auto;background:#fff}.phv svg{display:block;width:100%;height:auto}.cap0{text-align:center;font-weight:800;margin:6px 0}
.flt{transition:filter .5s}.flt.on{filter:saturate(2.6) contrast(1.25) brightness(1.1) hue-rotate(-12deg)}
</style></head><body>
<header><h1>🎨 Γνωρίζω το Paint</h1><p>Μαθαίνω τα εργαλεία και ζωγραφίζω</p></header>
<div id="tabs"></div><main><div class="card" id="v"></div></main>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>[...a].sort(()=>Math.random()-.5);
let done={},cur=0;const KEY='paint2.done';
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const mark=i=>{if(!done[i]){done[i]=1;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}tabs()}};
function tabs(){const t=$('tabs');t.innerHTML='';T.forEach((x,i)=>{const b=el('button',(i==cur?'on ':'')+(done[i]?'ok':''),x[0]);b.onclick=()=>go(i);t.appendChild(b)})}
function go(i){cur=i;tabs();const v=$('v');v.innerHTML='';v.appendChild(el('h2','',T[i][1]));T[i][2](v);scrollTo(0,0)}
function stars(n,m){return '⭐'.repeat(n)+'☆'.repeat(m-n)}
const PI=(e,x,y,sz,cls,dl,ex)=>`<span class="pr-i" style="left:${x}%;top:${y}%;font-size:${sz}cqw;${ex||''}"><span class="${cls||''}" style="animation-delay:${dl||0}s">${e}</span></span>`;
const PBUB=(t,x,y,dl)=>`<div class="pr-bub" style="left:${x}%;top:${y}%;animation-delay:${dl}s">${t}</div>`;
const prep=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
function SLIDES(v,ix,SC,after){
 const N=SC.length;let idx=0,paused=false,t=0,t0=0,rem=0;
 try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)paused=true}catch(e){}
 v.appendChild(el('p','lead','Μια σύντομη παρουσίαση. Μπορείς να την παύσεις και να πας μπροστά ή πίσω!'));
 const root=el('div','pr'+(paused?' paused':''),`<div class="pr-stw"><div class="pr-st" id="prSt"></div><div class="pr-cnt" id="prCnt"></div><div class="pr-bar"><i id="prBar"></i></div></div><div class="pr-cap" id="prCap"></div><div class="pr-ct"><button type="button" id="prP" aria-label="Προηγούμενο">⏮</button><button type="button" class="big" id="prPl">${paused?'▶ Παίξε':'⏸ Παύση'}</button><button type="button" id="prN" aria-label="Επόμενο">⏭</button></div><div class="pr-dots" id="prDt"></div>`);v.appendChild(root);
 const q=s=>root.querySelector(s);
 const dots=q('#prDt');SC.forEach((_,i)=>{const b=document.createElement('b');b.onclick=()=>show(i);dots.appendChild(b)});
 const arm=ms=>{clearTimeout(t);if(paused||SC[idx].fin)return;t0=Date.now();rem=ms;t=setTimeout(()=>show(idx+1),ms)};
 function show(i){if(!root.isConnected)return;idx=Math.max(0,Math.min(N-1,i));const s=SC[idx];const st=q('#prSt');st.style.background=s.bg;st.innerHTML=s.art();
  const cap=q('#prCap');cap.innerHTML=s.cap;cap.style.animation='none';void cap.offsetWidth;cap.style.animation='';
  if(s.fin){const b=el('button','pr-go',after[0]);b.onclick=after[1];cap.appendChild(b);mark(ix)}
  q('#prCnt').textContent=(idx+1)+' / '+N;[...dots.children].forEach((d,k)=>d.className=k==idx?'on':k<idx?'dn':'');
  const bar=q('#prBar');bar.classList.remove('go');void bar.offsetWidth;bar.style.setProperty('--d',(s.d/1000)+'s');bar.style.width=s.d?'':'100%';if(s.d)bar.classList.add('go');
  arm(s.d)}
 q('#prN').onclick=()=>show(idx+1);q('#prP').onclick=()=>show(idx-1);
 const tog=()=>{paused=!paused;root.classList.toggle('paused',paused);q('#prPl').textContent=paused?'▶ Παίξε':'⏸ Παύση';if(paused){clearTimeout(t);rem=Math.max(300,rem-(Date.now()-t0))}else if(!SC[idx].fin){t0=Date.now();t=setTimeout(()=>show(idx+1),rem)}};
 q('#prPl').onclick=tog;
 const kd=e=>{if(!root.isConnected){removeEventListener('keydown',kd);clearTimeout(t);return}if(e.target.tagName==='BUTTON'&&e.key===' ')return;if(e.key==='ArrowRight'){show(idx+1)}else if(e.key==='ArrowLeft'){show(idx-1)}else if(e.key===' '){e.preventDefault();tog()}};addEventListener('keydown',kd);
 show(0);
}

  [['Γραμμή (ορίζοντας)',L=>L.sh.some(s=>s.k=='line')||L.str.length>0],['Γέμισμα ουρανού με γαλάζιο',L=>L.fl.some(c=>fam(c)=='blue')],['Γέμισμα γης με πράσινο',L=>L.fl.some(c=>fam(c)=='green')],['Κύκλος για τον ήλιο',L=>L.sh.some(s=>s.k=='ellipse')],['Κίτρινο γέμισμα',L=>L.fl.some(c=>fam(c)=='yellow')||L.sh.some(s=>s.f&&fam(s.f)=='yellow')]]],
['❤️','Η καρδιά',['Με πινέλο φτιάξε μια καρδιά','Γέμισέ την με κόκκινο'],0,'Καρδιά',
  [['Χρησιμοποίησες πινέλο',L=>L.str.some(s=>s.t=='brush')],['Κόκκινο χρώμα',L=>L.str.some(s=>fam(s.c)=='red')||L.fl.some(c=>fam(c)=='red')]]],
['🏠','Σπίτι και δέντρα',['Σπίτι από ορθογώνιο και τρίγωνο','Δέντρα με ορθογώνιο και κύκλο','Ήλιος και χρώματα'],0,'Σπιτάκι',
  [['Ορθογώνιο',L=>L.sh.some(s=>s.k=='rect')],['Τρίγωνο (στέγη)',L=>L.sh.some(s=>s.k=='triangle')],['Κύκλος ή έλλειψη (δέντρο, ήλιος)',L=>L.sh.some(s=>s.k=='ellipse')],['Τουλάχιστον 3 γεμίσματα',L=>L.fl.length+L.sh.filter(s=>s.f).length>=3]]],
['🤡','Ο κλόουν',['Με γραμμές, ορθογώνιο, έλλειψη και άλλα σχήματα φτιάξε έναν κλόουν'],0,'Κλόουν',
  [['Γραμμή',L=>L.sh.some(s=>s.k=='line')],['Ορθογώνιο',L=>L.sh.some(s=>s.k=='rect')],['Έλλειψη',L=>L.sh.some(s=>s.k=='ellipse')],['Τουλάχιστον 4 χρώματα',L=>L.cols.size>=4]]]
];
function PAINT(v,mis){
 const root=el('div','pn','');v.appendChild(root);
 const cv=el('canvas','','');cv.width=W;cv.height=H;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 let tool='pencil',c1='#000000',c2='#ffffff',act=1,size=3,fillSh=0,txt=null;
 let L={tools:new Set(),str:[],sh:[],fl:[],cols:new Set()};const undo=[];
 const tb=el('div','tb','');root.appendChild(tb);
 const TL=[['pencil','✏️','Μολύβι'],['brush','🖌️','Πινέλο'],['eraser','🧽','Γόμα'],['fill','🪣','Γέμισμα'],['text','🅰️','Κείμενο'],['picker','💉','Επιλογή χρώματος'],['line','╲','Γραμμή'],['ellipse','◯','Έλλειψη'],['rect','▭','Ορθογώνιο'],['triangle','△','Τρίγωνο'],['diamond','◇','Ρόμβος'],['star','☆','Αστέρι'],['heart','♡','Καρδιά']];
 const tbs={};
 TL.forEach(([k,e,t])=>{const b=el('button',k==tool?'on':'',e);b.title=t;b.setAttribute('aria-label',t);b.onclick=()=>{tool=k;[...Object.values(tbs)].forEach(x=>x.classList.remove('on'));b.classList.add('on');if(txt)txt.remove()};tbs[k]=b;tb.append(b)});
 tb.append(el('span','sep',''));
 const sz=el('button','','●');sz.title='Μέγεθος';const szl=[2,4,8,14];let si=1;size=szl[si];sz.textContent='● '+size;sz.onclick=()=>{si=(si+1)%szl.length;size=szl[si];sz.textContent='● '+size};tb.append(sz);
 const fb=el('button','','▭ χωρίς γέμισμα');fb.title='Γέμισμα σχήματος με Χρώμα 2';fb.onclick=()=>{fillSh=!fillSh;fb.textContent=fillSh?'▰ γέμισμα με Χρώμα 2':'▭ χωρίς γέμισμα'};tb.append(fb);
 tb.append(el('span','sep',''));
 const b1=el('button','cc on','Χρώμα 1');const b2=el('button','cc','Χρώμα 2');b1.style.background=c1;b1.style.color='#fff';b2.style.background=c2;
 const setc=(c)=>{if(act==1){c1=c;b1.style.background=c;b1.style.color=hsl(c)[2]<.5?'#fff':'#000'}else{c2=c;b2.style.background=c;b2.style.color=hsl(c)[2]<.5?'#fff':'#000'}};
 b1.onclick=()=>{act=1;b1.classList.add('on');b2.classList.remove('on')};b2.onclick=()=>{act=2;b2.classList.add('on');b1.classList.remove('on')};tb.append(b1,b2);
 const sw=el('div','sw2','');PAL.forEach(c=>{const b=el('button','','');b.style.background=c;b.setAttribute('aria-label',c);b.onclick=()=>setc(c);sw.append(b)});tb.append(sw);
 const mc=el('input','','');mc.type='color';mc.title='Περισσότερα χρώματα';mc.style.cssText='width:44px;height:44px;border:3px solid #64748b;border-radius:8px;padding:0;background:#fff';mc.oninput=()=>setc(mc.value);tb.append(mc);
 tb.append(el('span','sep',''));
 const ub=el('button','','↶');ub.title='Αναίρεση';tb.append(ub);const nb=el('button','','🗑️');nb.title='Νέο χαρτί';tb.append(nb);
 const wrap=el('div','cvw','');wrap.append(cv);root.appendChild(wrap);
 const snap=()=>{undo.push(ctx.getImageData(0,0,W,H));if(undo.length>25)undo.shift()};
 ub.onclick=()=>{if(undo.length)ctx.putImageData(undo.pop(),0,0)};
 const clearAll=()=>{snap();ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);L={tools:new Set(),str:[],sh:[],fl:[],cols:new Set()};upd()};nb.onclick=clearAll;
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
 function flood(x,y,col){x=Math.floor(x);y=Math.floor(y);const id=ctx.getImageData(0,0,W,H),d=id.data;const i0=(y*W+x)*4;const tr=d[i0],tg=d[i0+1],tbb=d[i0+2];const n=parseInt(col.slice(1),16),fr=n>>16,fg=(n>>8)&255,fbv=n&255;if(Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tbb-fbv)<6)return false;
  const m=(i)=>Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tbb)<90;const st=[[x,y]];
  while(st.length){let [px,py]=st.pop();let xx=px;while(xx>=0&&m((py*W+xx)*4))xx--;xx++;let up=false,dn=false;
   while(xx<W&&m((py*W+xx)*4)){const i=(py*W+xx)*4;d[i]=fr;d[i+1]=fg;d[i+2]=fbv;d[i+3]=255;
    if(py>0){const u=m(((py-1)*W+xx)*4);if(u&&!up){st.push([xx,py-1]);up=true}else if(!u)up=false}
    if(py<H-1){const q=m(((py+1)*W+xx)*4);if(q&&!dn){st.push([xx,py+1]);dn=true}else if(!q)dn=false}xx++}}
  ctx.putImageData(id,0,0);return true}
 const path=(k,x0,y0,x1,y1)=>{ctx.beginPath();const w=x1-x0,h=y1-y0;
  if(k=='line'){ctx.moveTo(x0,y0);ctx.lineTo(x1,y1)}
  else if(k=='rect')ctx.rect(x0,y0,w,h);
  else if(k=='ellipse')ctx.ellipse(x0+w/2,y0+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);
  else if(k=='triangle'){ctx.moveTo(x0+w/2,y0);ctx.lineTo(x1,y1);ctx.lineTo(x0,y1);ctx.closePath()}
  else if(k=='diamond'){ctx.moveTo(x0+w/2,y0);ctx.lineTo(x1,y0+h/2);ctx.lineTo(x0+w/2,y1);ctx.lineTo(x0,y0+h/2);ctx.closePath()}
  else if(k=='star'){const cx=x0+w/2,cy=y0+h/2;for(let i=0;i<10;i++){const r=i%2?.45:1,a=-Math.PI/2+i*Math.PI/5;const px=cx+Math.cos(a)*r*w/2,py=cy+Math.sin(a)*r*h/2;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
  else if(k=='heart'){const cx=x0+w/2;ctx.moveTo(cx,y0+h*.9);ctx.bezierCurveTo(x0-w*.1,y0+h*.45,x0+w*.1,y0-h*.1,cx,y0+h*.28);ctx.bezierCurveTo(x1-w*.1,y0-h*.1,x1+w*.1,y0+h*.45,cx,y0+h*.9);ctx.closePath()}};
 let dr=null,base=null;
 cv.onpointerdown=e=>{if(txt)txt.remove();e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}const [x,y]=pos(e);
  if(tool=='fill'){snap();if(flood(x,y,c1)){L.fl.push(c1);L.cols.add(c1);L.tools.add('fill')}upd();return}
  if(tool=='picker'){const p=ctx.getImageData(Math.floor(x),Math.floor(y),1,1).data;const h='#'+[p[0],p[1],p[2]].map(n=>n.toString(16).padStart(2,'0')).join('');setc(h);L.tools.add('picker');upd();return}
  if(tool=='text'){const t=el('input','ti2','');t.style.left=(x*cv.getBoundingClientRect().width/W)+'px';t.style.top=(y*cv.getBoundingClientRect().height/H)+'px';wrap.append(t);txt=t;setTimeout(()=>t.focus(),0);t.onkeydown=k=>{if(k.key=='Enter'){snap();ctx.fillStyle=c1;ctx.font='600 26px Fredoka,Arial,sans-serif';ctx.textBaseline='top';ctx.fillText(t.value,x,y);L.tools.add('text');L.cols.add(c1);t.remove();txt=null;upd()}else if(k.key=='Escape'){t.remove();txt=null}};return}
  snap();dr={x,y,lx:x,ly:y};
  if(['pencil','brush','eraser'].includes(tool)){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=tool=='eraser'?c2:c1;ctx.lineWidth=tool=='pencil'?Math.max(1,size/2.5):tool=='brush'?size*1.6:size*3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.01,y+.01);ctx.stroke();dr.moved=1}
  else base=ctx.getImageData(0,0,W,H)};
 cv.onpointermove=e=>{if(!dr)return;const [x,y]=pos(e);
  if(['pencil','brush','eraser'].includes(tool)){ctx.beginPath();ctx.moveTo(dr.lx,dr.ly);ctx.lineTo(x,y);ctx.stroke();dr.lx=x;dr.ly=y}
  else{ctx.putImageData(base,0,0);ctx.lineWidth=Math.max(1,size/1.5);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=c1;path(tool,dr.x,dr.y,x,y);if(fillSh&&tool!='line'){ctx.fillStyle=c2;ctx.fill()}ctx.stroke();dr.lx=x;dr.ly=y}};
 const end=e=>{if(!dr)return;const t=tool;
  if(['pencil','brush','eraser'].includes(t)){L.tools.add(t);if(t!='eraser'){L.str.push({t,c:c1});L.cols.add(c1)}}
  else if(Math.abs(dr.lx-dr.x)>3||Math.abs(dr.ly-dr.y)>3){L.sh.push({k:t,f:fillSh&&t!='line'?c2:0});L.tools.add(t);L.cols.add(c1);if(fillSh&&t!='line')L.cols.add(c2)}
  dr=null;base=null;upd()};
 cv.onpointerup=end;cv.onpointercancel=end;
 // ---- save
 const bar=el('div','act','');const nm=el('input','','');nm.placeholder='Όνομα ζωγραφιάς';nm.maxLength=30;const sv=el('button','btn','💾 Αποθήκευση');const tt=el('div','fdbk','');
 sv.onclick=()=>{const n=(nm.value.trim()||'Ζωγραφιά').replace(/[\\/:*?"<>|]/g,'_');cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);tt.innerHTML='<span class="ok-t">💾 Αποθηκεύτηκε με όνομα «'+n+'»</span>';if(!mis)mark(4)})};
 bar.append(nm,sv);root.append(bar,tt);
 let mi=0,fin={};const ml=el('div','ms','');
 function upd(){if(!mis)return;ml.innerHTML='';MS.forEach((m,i)=>{const ch=m[5].map(c=>[c[0],c[1](L)]);const all=ch.every(c=>c[1]);if(i==mi&&all&&!fin[i]){fin[i]=1;mark(3)}
  const d=el('div','mi '+(fin[i]?'fin':i==mi?'cur':''),`<b>${m[0]} ${i+1}. ${m[1]}</b>`);
  if(i==mi||fin[i]){const ul=el('ul','ck','');ul.innerHTML=m[3]?'':'';m[2].forEach(s=>ul.append(el('li','',s)));d.append(el('div','',m[2].join(' · ')));const ck=el('ul','ck','');ch.forEach(c=>ck.append(el('li',c[1]?'d':'',c[0])));d.append(ck);
   if(i==mi){if(all){d.append(el('div','ok-t','🎉 Τέλειο! Αποθήκευσε με το όνομα «'+m[4]+'»'));const nx=el('button','btn','Επόμενη αποστολή ➜');nx.onclick=()=>{if(mi<MS.length-1)mi++;clearAll();nm.value=MS[mi][4]};d.append(nx)}
    else{const sk=el('button','btn g','✓ Το έκανα (παράκαμψη ελέγχου)');sk.onclick=()=>{fin[i]=1;mark(3);if(mi<MS.length-1)mi++;clearAll();nm.value=MS[mi][4]};d.append(sk)}}}
  else if(i<mi)d.classList.add('fin');ml.append(d)})}
 if(mis){nm.value=MS[0][4];root.append(el('h3','','🎯 Αποστολές'),ml);upd()}
 else root.append(el('p','lead','Ζωγράφισε ελεύθερα! Δοκίμασε όλα τα εργαλεία.'));
}
return [['🎯 Αποστολές','Αποστολές στο Paint',v=>{v.appendChild(el('p','lead','Ακολούθησε τις οδηγίες. Το πρόγραμμα ελέγχει πότε τελείωσες κάθε αποστολή!'));PAINT(v,1)}],['🖌️ Ελεύθερα','Ελεύθερη ζωγραφική',v=>PAINT(v,0)]];

})();
