<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Γνωρίζω το PowerPoint</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f9ff;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--teal:#14b8a6;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--soft:#f1f5f9;--hl:#fef9c3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1b2e;--card:#16253d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2c4466;--soft:#1e3350;--hl:#4a3f10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:19px}
header{background:linear-gradient(135deg,#c43e1c,#f59e0b);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:2px 0 0;opacity:.92;font-size:15px}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 10px 0}
#tabs button{border:3px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Fredoka;border-radius:99px;padding:8px 16px;cursor:pointer;position:relative}
#tabs button.on{background:var(--amber);border-color:#d97706;color:#fff}
#tabs button.ok::after{content:"✓";position:absolute;right:-4px;top:-8px;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,30px)}.lead{color:var(--mu);margin:0 0 14px}
.btn{border:0;cursor:pointer;font:700 19px Fredoka;color:#fff;background:var(--teal);padding:12px 24px;border-radius:16px;box-shadow:0 5px 0 #0d9488;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d9488}.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d4ed8}.btn.g{background:var(--soft);color:var(--tx);box-shadow:0 5px 0 var(--bd)}.btn:disabled{opacity:.45}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.win{text-align:center;padding:14px}.win .big{font-size:76px}
.opt{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:12px;font:600 20px Fredoka;cursor:pointer}
.opt.right{background:#bbf7d0;border-color:var(--green);color:#14532d}.opt.wrong{background:#fecaca;border-color:var(--red);color:#7f1d1d}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.stars{font-size:34px;letter-spacing:4px}
.cert{border:6px double var(--amber);border-radius:20px;padding:18px;text-align:center;background:var(--hl);margin-top:14px}
.cert input{font:700 24px Fredoka;text-align:center;border:0;border-bottom:3px solid var(--amber);background:transparent;color:var(--tx);width:90%;outline:0}

.hero{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;background:var(--hl);border-radius:20px;padding:12px;margin-bottom:12px}.he{font-size:52px;text-align:center}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:8px 0}.opt.sel{border-color:var(--amber);background:var(--hl)}
.bar{display:grid;grid-template-columns:170px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:16px}.bar i{display:block;height:22px;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;min-width:4px;transition:width .4s}
.mp{width:100%;height:auto;display:block;border-radius:18px;background:#bfe6ff;border:4px solid var(--bd);touch-action:none;user-select:none;-webkit-user-select:none}.isl{fill:#f6e7b0;stroke:#6b5a1a;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}.pin circle{fill:#94a3b8;stroke:#fff;stroke-width:4}.pin text{font:700 24px Fredoka,sans-serif;fill:#1e293b;paint-order:stroke;stroke:#fff;stroke-width:6px;display:none}.pin.f text{display:block}.pin.f circle{fill:#10b981}.pin.f.o circle{fill:#ef4444}
.zb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.zb button{font:700 24px Fredoka;border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;width:52px;height:48px;cursor:pointer}.zb button.btn{width:auto;padding:0 16px;font-size:16px;white-space:nowrap}
.sit{font-size:clamp(19px,4vw,25px);font-weight:600;text-align:center;padding:12px;background:var(--hl);border-radius:20px;margin:10px 0}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:10px 0}.cd2{border:4px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);cursor:pointer;overflow:hidden;text-align:left;font:600 16px Fredoka;padding:0}.cd2 img{width:100%;height:130px;object-fit:cover;display:block}.cd2 .em{font-size:56px;text-align:center;padding:14px;background:var(--soft)}.cd2 b{display:block;padding:8px 10px 2px;font-size:18px}.cd2 span{display:none;padding:0 10px 10px;font-weight:400;font-size:15px;line-height:1.35}.cd2.open{border-color:var(--green)}.cd2.open span{display:block}
.qe{font-size:clamp(20px,4.2vw,26px);font-weight:600;text-align:center;margin:8px 0 12px}.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;padding:10px;background:var(--soft);border-radius:16px;min-height:70px}.chip{border:3px solid var(--bd);border-radius:14px;padding:8px 12px;background:var(--card);color:var(--tx);font:600 16px Fredoka;cursor:grab}.chip.sel{border-color:var(--amber);background:var(--hl);transform:scale(1.05)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.bin{border:3px dashed var(--bd);border-radius:16px;padding:8px;text-align:center;background:var(--soft);min-height:120px;cursor:pointer}.bin.hot{border-color:var(--amber);background:var(--hl)}.bin b{display:block;font-size:17px}.bin .ic{font-size:36px}.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;font-size:13px}.bin .in span{background:var(--card);border-radius:8px;padding:2px 6px}
.ol{list-style:none;padding:0;margin:8px 0}.ol li{padding:8px 12px;border-radius:12px;margin:5px 0;background:var(--soft)}.ol li.y{background:#bbf7d0;color:#14532d;font-weight:600}
.slide{aspect-ratio:16/9;background:#fff;color:#1e293b;border:4px solid var(--bd);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:8px;padding:10px;max-width:640px;margin:10px auto}.slide .ti{grid-column:1/3;font:700 clamp(16px,3.4vw,26px) Fredoka;text-align:center;background:#dbeafe;border-radius:8px;padding:4px;min-height:1.6em}.slide .bx{border:2px dashed #cbd5e1;border-radius:8px;display:grid;place-items:center;font-size:14px;color:#94a3b8;overflow:hidden;text-align:center;padding:4px}.slide .bx.f{border:0;color:#1e293b}.slide .bx img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}.opts .opt img{width:100%;height:90px;object-fit:cover;border-radius:10px;display:block}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:10px 0}.mt button{border:3px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px;font:600 17px Fredoka;cursor:pointer}.mt button.sel{border-color:var(--amber);background:var(--hl)}.mt button.done{background:#bbf7d0;border-color:var(--green);color:#14532d;cursor:default}
.rib{display:flex;gap:6px;flex-wrap:wrap;background:#2563eb;padding:8px;border-radius:12px 12px 0 0}.rib button{font:700 16px Fredoka;border:0;border-radius:8px;padding:6px 14px;background:#dbeafe;color:#1e3a8a;cursor:pointer}.rib button:disabled{opacity:.4;cursor:default}.rib button.hl2{background:#fde047;animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.07)}}
.pp{background:#fff;color:#1e293b;border:3px solid #cbd5e1;border-radius:0 0 12px 12px;padding:16px 22px;min-height:230px}.pp h3{margin:0 0 8px;font-size:26px}.pp li{font-size:21px;margin:6px 0;list-style:none}.pp .w{cursor:pointer;padding:2px 6px;border-radius:6px}.pp .w.sel{background:#bfdbfe}.pp .w.ln{color:#1d4ed8;text-decoration:underline}
.dg2{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:12px}.dg2>div{background:var(--card);border-radius:18px;padding:16px;max-width:380px;width:100%}
.tbl{border-collapse:collapse;width:100%;margin:10px 0;font-size:16px}.tbl th{background:#16a34a;color:#fff;padding:8px}.tbl td{border:2px solid var(--bd);padding:6px}.tbl select{font:600 15px Fredoka;width:100%;padding:6px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}.tbl select.g{background:#bbf7d0}.tbl select.r{background:#fecaca}
.xl{display:grid;grid-template-columns:1fr;gap:12px}.xt{border-collapse:collapse}.xt th,.xt td{border:1px solid #94a3b8;padding:4px 10px;background:#fff;color:#1e293b}.xt th{background:#e2e8f0}.xt button{border:0;background:#dbeafe;border-radius:6px;width:26px;height:26px;font-weight:700;cursor:pointer}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--bd);cursor:pointer;padding:0}.sw.on{box-shadow:0 0 0 4px var(--amber)}
.ds{aspect-ratio:16/9;max-width:620px;margin:10px auto;border-radius:14px;border:4px solid var(--bd);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px;text-align:center;position:relative;overflow:hidden}.ds .t1{font-size:clamp(20px,5vw,34px);font-weight:700}.ds .t2{font-size:clamp(14px,3vw,20px);margin-top:6px}.ds .ft2{position:absolute;bottom:6px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:13px}
@keyframes a1{from{opacity:0}to{opacity:1}}@keyframes a2{from{transform:translateX(-120%)}to{transform:none}}@keyframes a3{from{transform:rotate(-360deg) scale(0)}to{transform:none}}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.tools label{font-weight:600;font-size:16px}.tools select,.tools input[type=text]{font:600 16px Fredoka;border:3px solid var(--bd);border-radius:10px;padding:6px;background:var(--card);color:var(--tx)}

.pwi{width:100%;font:700 24px Fredoka,monospace;text-align:center;border:4px solid var(--bd);border-radius:16px;padding:12px;background:var(--card);color:var(--tx);letter-spacing:2px}.pwm{height:18px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0}.pwm i{display:block;height:100%;width:0;background:var(--red);transition:width .3s,background .3s}
.spm{border:3px solid var(--bd);border-radius:16px;background:#fff;color:#1e293b;overflow:hidden;margin:10px 0}.spm .h{background:#e2e8f0;padding:8px 12px;font-size:15px}.spm .b2{padding:12px;font-size:19px;line-height:1.9}.spm .sg{cursor:pointer;border-radius:6px;padding:1px 3px}.spm .sg:hover{background:#fef9c3}.spm .sg.fl{background:#fecaca;outline:2px solid #ef4444}.spm .sg.nf{background:#e2e8f0;text-decoration:line-through}.spm .sg.ms{background:#fde68a;outline:2px dashed #f59e0b}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}.mc{aspect-ratio:1/1.1;border:4px solid var(--bd);border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font:700 40px Fredoka;cursor:pointer;display:grid;place-items:center;padding:6px;text-align:center}.mc.up{background:var(--card);color:var(--tx);font-size:15px;font-weight:600;line-height:1.2}.mc.up.big{font-size:42px}.mc.ok{background:#bbf7d0;border-color:var(--green);color:#14532d}
.arena{position:relative;height:340px;border:4px solid var(--bd);border-radius:18px;overflow:hidden;background:linear-gradient(#bfdbfe,#e0f2fe);touch-action:manipulation;user-select:none}.fall{position:absolute;border:3px solid #fff;border-radius:14px;background:#fff;color:#1e293b;padding:4px 8px;font:700 15px Fredoka;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.2);white-space:nowrap}.fall b{font-size:26px;display:block;text-align:center;line-height:1.1}
.hud{display:flex;justify-content:space-between;font-weight:700;margin:6px 0;flex-wrap:wrap;gap:8px}
@media(max-width:560px){.ans,.mt{grid-template-columns:1fr}.hero{grid-template-columns:50px 1fr}.he{font-size:36px}.bar{grid-template-columns:100px 1fr 30px}}
.mk{border:3px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff;color:#1e293b;font-size:clamp(11px,2.2vw,15px);user-select:none;font-family:Segoe UI,Fredoka,sans-serif}.hp{cursor:pointer;outline-offset:-3px}.hp:hover{outline:3px solid #f59e0b}.hp.seen{box-shadow:inset 0 0 0 3px #10b981}.hp.okq{box-shadow:inset 0 0 0 4px #10b981;background-color:#bbf7d0!important}.hp.badq{box-shadow:inset 0 0 0 4px #ef4444}
.wtb{display:flex;gap:6px;flex-wrap:wrap;background:#2b579a;padding:8px;border-radius:12px 12px 0 0;align-items:center}.wtb button,.wtb select{font:700 17px Fredoka;border:0;border-radius:8px;padding:6px 12px;background:#e0e7ff;color:#1e293b;cursor:pointer}.wtb .wsw{width:28px;height:28px;padding:0;border:3px solid #fff;border-radius:50%}.wtb .sp{width:2px;height:28px;background:#93c5fd}
.wpg{background:#fff;color:#111;min-height:200px;border:3px solid #2b579a;border-top:0;padding:16px 22px;font:20px 'Times New Roman',Georgia,serif;outline:none;border-radius:0 0 12px 12px;line-height:1.5;user-select:text;-webkit-user-select:text}
.wml{background:var(--soft);border-radius:14px;padding:10px 14px;margin:10px 0}.wml div{margin:3px 0}.wst{font-size:13px;color:var(--mu);margin:4px 2px}
.dkw{display:grid;grid-template-columns:150px 1fr;gap:12px}.dks{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto}.dkt{border:3px solid var(--bd);border-radius:10px;padding:2px;background:var(--card);cursor:pointer;text-align:left;color:var(--tx);font:600 12px Fredoka}.dkt.on{border-color:#c43e1c;box-shadow:0 0 0 3px #fdba74}.dk{aspect-ratio:16/9;border:3px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;color:#1e293b;overflow:hidden}.dt{font-weight:700}.dkm label{font-weight:700;display:block;margin:8px 0 2px}.dkm input[type=text],.dkm textarea{width:100%;font:600 18px Fredoka;border:3px solid var(--bd);border-radius:10px;padding:8px;background:var(--card);color:var(--tx)}.dkm .pr button{font-size:28px;width:46px;height:46px;border:2px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer}.dkm .pr{display:flex;gap:6px;flex-wrap:wrap}.dkm .sws button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--bd);cursor:pointer;margin-right:6px}
.shw{position:fixed;inset:0;background:#0f172a;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}.shw .dk{width:min(95vw,160vh*0.9);border:0;border-radius:6px}.shw .ctl{margin-top:14px;display:flex;gap:10px}.shw .ctl button{font:700 20px Fredoka;border:0;border-radius:12px;padding:10px 20px;cursor:pointer}
@media(max-width:620px){.dkw{grid-template-columns:1fr}.dks{flex-direction:row;max-height:none;overflow-x:auto}.dkt{min-width:110px}}
.xg{border-collapse:collapse;margin:10px auto;font-family:Segoe UI,Fredoka,sans-serif}.xg th{background:#e2e8f0;color:#1e293b;border:1px solid #94a3b8;padding:4px 10px;min-width:34px}.xg td{background:#fff;color:#1e293b;border:1px solid #cbd5e1;height:34px;min-width:44px;text-align:center;font-size:24px}.xg td[data-c]{cursor:pointer}.xg td[data-c]:hover{background:#dcfce7}.xg td.hl{background:#bbf7d0;outline:3px solid #16a34a;outline-offset:-3px}
.xs{border-collapse:collapse;margin:8px auto;font-family:Segoe UI,Fredoka,sans-serif}.xs th{background:#e2e8f0;color:#1e293b;border:1px solid #94a3b8;padding:3px 10px}.xs td{border:1px solid #cbd5e1;padding:0;background:#fff}.xs input{width:130px;border:0;padding:7px 8px;font:17px Segoe UI,Fredoka,sans-serif;background:transparent;color:#1e293b;outline:none}.xs input.n{text-align:right}.xs input.hd{font-weight:700;background:#dcfce7}.xs td:focus-within{outline:3px solid #16a34a;outline-offset:-2px}.fxb{display:flex;gap:8px;align-items:center;background:#e2e8f0;color:#1e293b;border:1px solid #94a3b8;padding:4px 8px;margin:8px auto 0;max-width:620px;font-family:Segoe UI,sans-serif}.fxb b{background:#fff;border:1px solid #94a3b8;padding:2px 12px}.fxb span.fx{font-style:italic;color:#16a34a;font-weight:700}.fxb i{flex:1;background:#fff;border:1px solid #94a3b8;padding:2px 8px;min-height:24px;font-style:normal}
.rbn{border:3px solid var(--bd);border-radius:12px;background:#fff;color:#1e293b;font-family:Segoe UI,Fredoka,sans-serif;position:relative;margin:8px 0}
.rbt{background:var(--ac);color:#fff;padding:6px 12px;font-weight:600;border-radius:9px 9px 0 0}
.rtabs{background:var(--ac);display:flex;flex-wrap:wrap;padding:0 8px}.rtabs button{border:0;background:transparent;color:#fff;font:600 15px Segoe UI,Fredoka,sans-serif;padding:5px 12px;cursor:pointer;border-radius:6px 6px 0 0}.rtabs button.on{background:#f3f4f6;color:var(--ac)}
.rg{display:flex;flex-wrap:wrap;gap:6px;background:#f3f4f6;padding:6px 8px;border-bottom:1px solid #d1d5db;min-height:70px}
.grp{display:flex;flex-direction:column;align-items:center;padding-right:8px;border-right:1px solid #d1d5db}.grp .gb{display:flex;gap:2px;flex-wrap:wrap;align-items:center;justify-content:center;flex:1}.grp .gl{font-size:11px;color:#6b7280;margin-top:2px}
.rb{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 7px;font:600 14px Segoe UI,Fredoka,sans-serif;cursor:pointer;color:#1e293b;display:flex;flex-direction:column;align-items:center;min-width:32px}.rb:hover{background:#dbeafe;border-color:#93c5fd}.rb.on{background:#bfdbfe;border-color:#3b82f6}.rb .ic{font-size:20px;line-height:1.1}.rb small{font-size:11px;max-width:80px;text-align:center}
.rbn select{font:600 14px Segoe UI,Fredoka,sans-serif;border:1px solid #9ca3af;border-radius:4px;padding:3px;background:#fff;color:#1e293b}
.rpop{background:#fffbeb;border-top:2px solid var(--ac);padding:8px 30px 8px 8px;position:relative}.rpop .x{position:absolute;right:6px;top:4px;border:0;background:transparent;font-size:18px;cursor:pointer;color:#475569}
.gal{display:grid;gap:6px}.gi{border:2px solid #cbd5e1;border-radius:8px;background:#fff;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px Segoe UI,Fredoka,sans-serif;color:#1e293b}.gi:hover{border-color:var(--ac);background:#f1f5f9}.gi span{text-align:center}.gi .th{width:100%;aspect-ratio:16/9;position:relative;background:#fff;border:1px solid #94a3b8}.gi .em{font-size:30px}
.palr{display:flex;gap:6px;flex-wrap:wrap}.sw2{width:30px;height:30px;border-radius:6px;border:2px solid #94a3b8;cursor:pointer;padding:0}
.wdesk{background:#d1d5db;padding:14px;border-radius:0}.wsheet{background:#fff;max-width:640px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.35);transform-origin:top center}

.wsb{background:var(--ac);color:#fff;padding:3px 12px;font-size:13px;display:flex;gap:14px;align-items:center;border-radius:0 0 9px 9px;flex-wrap:wrap}.wsb button{border:0;background:#ffffff33;color:#fff;border-radius:4px;width:24px;font-size:16px;cursor:pointer}

.sl .pb{position:absolute;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:2.6cqw;overflow:hidden;padding:.4cqw;outline:0;line-height:1.25}
